name: Firebase 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 설정 확인
        id: check
        run: |
          if grep -q YOUR_PROJECT_ID .firebaserc; then
            echo "아직 .firebaserc에 Firebase 프로젝트 ID가 없어서 배포를 건너뛰어요. README의 설정을 먼저 해 주세요."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - name: 서비스 계정 키 준비
        if: steps.check.outputs.skip != '1'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "FIREBASE_SERVICE_ACCOUNT 시크릿이 없어요. README의 배포 설정을 확인해 주세요."; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: 버전 기록 (접속 중인 학생 화면이 새 버전을 알아채요)
        if: steps.check.outputs.skip != '1'
        run: |
          echo "{\"v\":\"${GITHUB_SHA}\"}" > public/version.json
          sed -i "s/__BUILD__/${GITHUB_SHA}/" public/index.html
      - name: DB 규칙 배포 (호스팅이 막혀도 규칙은 먼저 올라가요)
        if: steps.check.outputs.skip != '1'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx -y firebase-tools@13 deploy --only database --non-interactive
      - name: 호스팅 배포
        if: steps.check.outputs.skip != '1'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx -y firebase-tools@13 deploy --only hosting --non-interactive
      - name: 이벤트 서버 함수 배포 (실패해도 사이트 배포는 이미 끝났어요)
        if: steps.check.outputs.skip != '1'
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx -y firebase-tools@13 deploy --only functions --non-interactive
