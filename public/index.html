  evOff = F.onValue(F.ref(db, `events/${ev.id}/${ev.key}`), s => { evData = s.val() || {}; if (sub === 'event') paintEvent(); });
}
const soloSaveEv = () => { if (solo) try { localStorage.setItem('magion-ev-' + evKey, JSON.stringify(evData)); } catch(e){} };
function renderEvent(){
  const ev = eventAt();
  if (!ev){ toast('지금은 열린 행사가 없어요.'); return leaveEvent(); }
  watchEvent(ev);
  const overlay = `<div style="position:absolute;inset:0;background:rgba(20,10,50,.45);pointer-events:none"></div>
    <div class="cr dragon" style="position:absolute;left:50%;top:52%;background-position:-1320px 0"></div><div id="dragonFx" style="position:absolute;inset:0;z-index:1;pointer-events:none"></div>`;
  frame('island', ev.E.name, `<span id="evClock"></span>`, `
    <section class="sec">
      <div class="hint">${ev.E.blurb}</div>
      <div id="evBody" class="sec"></div>
    </section>
    <button class="btn ghost" id="back" style="align-self:center">닫기</button>`, { overlay });
  $('#back').onclick = leaveEvent;
  paintEvent();
  clearInterval(evTimer); evTimer = setInterval(() => { if (sub !== 'event') return stopEvent(); tickEvent(); }, 250);
}
function tickEvent(){
  const ev = eventAt(); if (!ev) return leaveEvent();
  const now = Date.now(), live = now < ev.end;
  const c = $('#evClock'); if (c) c.textContent = live ? `${Math.floor((ev.end - now) / 60000)}:${String(Math.floor((ev.end - now) / 1000) % 60).padStart(2, '0')} 남음` : '행사가 끝났어요';
  if (!live && $('#evBody')?.dataset.live === '1') paintEvent();
}
function paintEvent(){
  const ev = eventAt(), body = $('#evBody'); if (!ev || !body) return;
  const live = Date.now() < ev.end;
  const st = app.querySelectorAll('.stat'); if (st.length === 2){ st[0].innerHTML = ic('coin') + me.coin.toLocaleString(); st[1].innerHTML = ic('mana') + me.mana; }
  body.dataset.live = live ? '1' : '0';
  const me_ = solo ? 'me' : uid;
  const houseOf = id => id === me_ ? me.house : playersList[id]?.house;
  const nickOf = id => id === me_ ? me.nick : playersList[id]?.nick || '친구';
  const lookOf = id => id === me_ ? me : playersList[id];
  {
    const total = Object.values(evData).reduce((t, v) => t + (+v || 0), 0), goal = dragonGoal(), done = total >= goal;
    const mine = +evData[me_] || 0;
    me.evClaimed = me.evClaimed || {};
    const claimed = me.evClaimed[ev.key];
    const offer = POTIONS.filter(p => me.inv[p] > 0);
    const fx = $('#dragonFx'); if (fx) fx.innerHTML = done ? '<div class="calm">♥</div>' : '';
    const dr = app.querySelector('.dragon'); if (dr) dr.classList.toggle('calm-d', done);
    body.innerHTML = `
      <div class="box px" style="padding:10px 12px;display:flex;flex-direction:column;gap:8px">
        <div class="sec-h"><h3>${done ? '드래곤이 진정했어요!' : '드래곤의 기분'}</h3><span class="meta">${total} / ${goal}</span></div>
        <div style="height:14px;background:var(--ink);padding:2px"><div style="width:${Math.min(100, total / goal * 100)}%;height:100%;background:${done ? 'var(--mint)' : 'linear-gradient(90deg,#FF7A5A,#FFC24A)'}"></div></div>
        <span class="s sub">비싼 물약일수록 점수가 높아요 (1~6점) · 시간대 물약 3점 · 반짝 4점 · 용기의 물약 6점</span>
      </div>
      ${hint(evMsg, done ? '' : live ? '가방의 물약을 눌러 드래곤에게 바쳐요' : '시간 안에 달래지 못했어요. 다음 주말에 다시 와요.')}
      ${done ? (mine ? `<button class="btn go px" id="claim" ${claimed ? 'disabled' : ''}>${claimed ? '보상을 받았어요' : '보상 받기 · 용 알 껍질 ×2 + 150G'}</button>` : '<div class="hint">물약을 바친 학생만 보상을 받아요</div>')
        : live ? `<div class="pal">${offer.map(p => `<button class="cell" style="width:58px;min-height:58px" data-offer="${p}">${ic(p)}<span class="s">+${DRAGON_PTS(p)}</span><span class="n">${me.inv[p]}</span></button>`).join('') || '<span class="s sub">가방에 물약이 없어요. 연구실에서 끓여 오세요!</span>'}</div>` : ''}
      ${Object.keys(evData).length ? `<div class="box px">${Object.entries(evData).sort((a, b) => b[1] - a[1]).map(([u, n]) => `<div class="li">${face(lookOf(u), 30)}<div class="main"><span class="t">${esc(nickOf(u))}</span><span class="d">${HOUSES[houseOf(u)]?.name || ''}</span></div><span class="b">${n}점</span></div>`).join('')}</div>` : ''}`;
    body.querySelectorAll('[data-offer]').forEach(b => b.onclick = async () => {
      const p = b.dataset.offer; if (me.inv[p] < 1 || Date.now() >= ev.end) return;
      me.inv[p]--; save();
      const nv = (+evData[me_] || 0) + DRAGON_PTS(p);
      evMsg = `${withJosa(ITEM[p], '을', '를')} 바쳤어요. +${DRAGON_PTS(p)}점`;
      if (solo){ evData[me_] = nv; soloSaveEv(); paintEvent(); }
      else await F.set(F.ref(db, `events/dragon/${ev.key}/${uid}`), nv).catch(e => toast('바치지 못했어요: ' + (e.code || e.message)));
    });
    const cl = $('#claim'); if (cl) cl.onclick = () => {
      if (me.evClaimed[ev.key]) return;
      me.evClaimed[ev.key] = 1; me.inv.egg += 2; me.coin += 150; save();
      toast('드래곤이 고맙다며 알 껍질을 두고 갔어요! +150G'); evMsg = ''; paintEvent();
    };
  }
}

// ===== 시장 (온라인 전용) =====
let sellPick = null;

  const sellable = [...POTIONS, ...MATS, ...CATCH, ...DISHES].filter(k => me.inv[k] > 0);
  const sold = mine.filter(([, l]) => l.buyer).length;
  const tabs = [['shop', `친구 가게${others.length ? ' ' + others.length : ''}`], ['mine', `내 가판대 ${mine.length}/4${sold ? ' ●' : ''}`], ['coop', '반 공동 의뢰']];

  if (marketTab === 'shop'){
    marketPage = clampP(marketPage, others.length, 5);
    body = `<section class="sec">
      ${secH('친구들이 올린 물건', others.length + '개')}
      ${others.length ? `<div class="box px">${pageOf(others, marketPage, 5).map(([id, l]) => `<div class="li">${ic(l.item)}
        <div class="main"><span class="t">${ITEM[l.item]}${l.qty > 1 ? ' ×' + l.qty : ''}${l.moon ? ' <span class="tag" style="background:var(--purple);color:#2A1506">달빛</span>' : ''}</span><button class="btn ghost" data-visit="${l.uid}" style="justify-content:flex-start;padding:0;min-height:44px;margin:-10px 0;text-decoration:underline">${esc(l.nick)}의 가게 · 방 구경</button></div>
        <button class="btn sm go" data-buy="${id}" ${me.coin >= l.price ? '' : 'disabled'}>${ic('coin', 'transform:scale(.7);margin:0 -6px')}${l.price}</button></div>`).join('')}</div>${pager('mpg', marketPage, others.length, 5)}` : '<div class="hint">지금은 올라온 물건이 없어요</div>'}
    </section>`;
  } else if (marketTab === 'mine'){
    body = `<section class="sec">
      ${secH('내 가판대', `${mine.length} / 4`)}
      ${mine.length ? `<div class="box px">${mine.map(([id, l]) => `<div class="li">${ic(l.item)}<div class="main"><span class="t">${ITEM[l.item]} · ${l.price}G</span><span class="d">${l.buyer ? esc(l.buyerNick || '친구') + '님이 샀어요!' : '판매 중'}</span></div>
        ${l.buyer ? `<button class="btn sm go" data-collect="${id}">받기</button>` : `<button class="btn sm" data-cancel="${id}">내리기</button>`}</div>`).join('')}</div>` : '<div class="hint">아직 올린 물건이 없어요</div>'}
      ${mine.length < 4 ? `<div class="box px" style="padding:10px;display:flex;flex-direction:column;gap:8px">

        <div class="pal">${sellable.map(k => `<button class="cell ${sellPick === k ? 'sel' : ''}" style="width:48px;min-height:48px;padding:0" data-pick="${k}">${ic(k)}<span class="n">${me.inv[k]}</span></button>`).join('') || '<span class="s sub">팔 수 있는 물건이 없어요</span>'}</div>
        ${sellPick ? `<div style="display:flex;gap:6px;align-items:center"><span class="s" style="flex:1">${ITEM[sellPick]} 1개</span><input id="price" type="number" min="1" max="9999" value="${PAY[sellPick] || CATCH_INFO[sellPick]?.pay || DISH_INFO[sellPick]?.pay || 20}" class="mkin"><span class="s">G</span><button class="btn sm go" id="list">올리기</button></div>` : ''}
      </div>` : '<div class="hint">가판대가 꽉 찼어요 (4칸)</div>'}
    </section>`;
  } else {
    body = `<section class="sec">
      <div class="box px" style="padding:12px;display:flex;flex-direction:column;gap:10px">
        <div class="sec-h"><h3 style="color:var(--gold)">반 공동 의뢰</h3><span class="meta">반짝 물약 50병</span></div>
        <div class="pbar" style="height:12px"><i style="width:${Math.min(100, coopTotal * 2)}%;background:var(--gold)"></i></div>
        <div class="s sub num" style="display:flex;justify-content:space-between"><span>${coopTotal} / 50 · ${Object.keys(week).length}명 참여</span><span>내가 낸 것 ${week[uid] || 0}</span></div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px">${HOUSE_KEYS.map(k => { const n = Object.entries(week).filter(([id]) => playersList[id]?.house === k).reduce((t, [, v]) => t + (+v || 0), 0); return `<div style="background:var(--panel);border-radius:8px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;border-top:3px solid ${HOUSES[k].col}"><span class="s" style="color:${HOUSES[k].col}">${HOUSES[k].name}</span><span class="s" style="color:var(--gold);letter-spacing:-1px">${'★'.repeat(Math.min(5, Math.floor(n / 2))) || '·'}</span><span class="s sub num">${n}병</span></div>`; }).join('')}</div>
        <span class="s sub">2병마다 기숙사 별자리에 별이 하나씩 떠요</span>
        <button class="btn go" id="donate" ${me.inv.p_purple > 0 ? '' : 'disabled'}>반짝 물약 1병 내기 (가진 것 ${me.inv.p_purple || 0})</button>
      </div>
    </section>`;
  }
  frame(null, '등불 시장', `친구 가게 ${new Set(others.map(([, l]) => l.uid)).size}곳 영업 중`, segRow('mtab', marketTab, tabs) + body);

  on('[data-pick]', b => { sellPick = b.dataset.pick; renderMarket(); });
  on('[data-visit]', b => openVisit(b.dataset.visit));
  const lb = $('#list');
  if (lb) lb.onclick = async () => {
    const price = Math.max(1, Math.min(9999, Math.floor(+$('#price').value || 0)));
    if (me.inv[sellPick] < 1) return;
    me.inv[sellPick]--; save();
    await F.push(F.ref(db, 'market'), { uid, nick: me.nick, look: me.look, item: sellPick, qty: 1, price, at: Date.now(), ...(me.house === 'moon' && myTime() ? { moon: true } : {}) });

  };
  on('[data-cancel]', async b => {
    const l = marketList[b.dataset.cancel]; if (!l || l.buyer) return;

  });
  on('[data-collect]', async b => {
    const l = marketList[b.dataset.collect]; if (!l || !l.buyer) return;
    await F.remove(F.ref(db, 'market/' + b.dataset.collect));
    me.coin += l.price; save(); toast(`판매 대금 ${l.price}G를 받았어요.`);
  });
  on('[data-buy]', async b => {
    const id = b.dataset.buy, l = marketList[id];
    if (!l || me.coin < l.price) return;
    const res = await F.runTransaction(F.ref(db, 'market/' + id), cur => {
      if (!cur || cur.buyer) return;
      return { ...cur, buyer: uid, buyerNick: me.nick };
    });
    if (!res.committed) return toast('한발 늦었어요. 다른 친구가 먼저 샀어요.');
    me.coin -= l.price; me.inv[l.item] += l.qty; save();
    toast(`${withJosa(ITEM[l.item], '을', '를')} 샀어요! -${l.price}G`);
  });
  const dn = $('#donate'); if (dn) dn.onclick = async () => {
    if (me.inv.p_purple < 1) return;
    me.inv.p_purple--; save();
    await F.set(F.ref(db, `coop/${coopWeek()}/${uid}`), (week[uid] || 0) + 1);
    toast('반짝 물약을 냈어요. 고마워요!');
  };
}

  'auth/invalid-credential': '아이디 또는 비밀번호가 맞지 않아요.', 'auth/wrong-password': '비밀번호가 맞지 않아요.', 'auth/user-not-found': '없는 아이디예요.',

function showLogin(mode = 'login'){
  const signup = mode === 'signup';

  cover(`<div class="card px">
    ${configured ? `<div style="display:flex;gap:6px"><button class="btn sm" style="flex:1;${signup ? '' : 'background:var(--gold)'}" id="mLogin">로그인</button><button class="btn sm" style="flex:1;${signup ? 'background:var(--gold)' : ''}" id="mSignup">가입하기</button></div>
    <form id="lf" style="display:flex;flex-direction:column;gap:10px">

      <label class="field"><span class="s">비밀번호</span><input id="lpw" type="password" autocomplete="${signup ? 'new-password' : 'current-password'}" maxlength="40" placeholder="5 자 이상"></label>
      ${signup ? '<label class="field"><span class="s">비밀번호 확인</span><input id="lpw2" type="password" autocomplete="new-password" maxlength="40"></label>' : ''}
      <p class="err" id="err"></p>
      <button class="btn go" type="submit" id="lgo">${signup ? '가입하고 입학하기' : '등교하기'}</button>
    </form>` : `<span class="s">아직 Firebase가 연결되지 않았어요. public/firebase-config.js에 설정을 넣으면 친구들과 함께할 수 있어요.</span>`}
    <button class="btn" id="soloGo" type="button">혼자 해 보기 (이 기기에만 저장)</button>

  </div>`);
  $('#soloGo').onclick = startSolo;

  if (!configured) return;
  $('#mLogin').onclick = () => showLogin('login');
  $('#mSignup').onclick = () => showLogin('signup');
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const id = $('#lid').value.trim(), pw = $('#lpw').value, err = $('#err');
    if (!ID_RE.test(id)) return err.textContent = '아이디는 영어로 시작하고, 영어·숫자·_ 3~16 자여야 해요.';
    if (id.toLowerCase() === ADMIN_ID) return err.textContent = '쓸 수 없는 아이디예요.';
    if (pw.length < 5) return err.textContent = '비밀번호는 5 자 이상이어야 해요.';

      else await F.signInWithEmailAndPassword(auth, idEmail(id), pwPad(pw));
      try { localStorage.setItem('magion-id', id); } catch(e){}
    } catch(ex){
      $('#lgo').disabled = false;
      err.textContent = AUTH_MSG[ex.code] || `실패했어요. (${ex.code || ex.message})`;
    }

}

    on('[data-mqo]', b => { const i = +b.dataset.mqo; if (i === ans[mqPzPick.length]){ mqPzPick.push(i); sfx('pop'); if (mqPzPick.length >= items.length){ s.prog['puzzle:' + mqPz] = 1; save(); sfx('magic'); toast(o.doneText || '순서를 맞췄어요!'); mqPzPick = []; mqCheck(); jnTab = 'story'; return openSheet('home', 'journal'); } } else { mqPzPick = []; sfx('gulp'); toast('순서가 달라요. 처음부터!'); } render(); });
    $('#mqpzreset').onclick = () => { mqPzPick = []; render(); };
  }
}
// ---- 지키기: 등불을 향해 오는 바람·그림자를 눌러 흩어요. 제한 시간을 버티면 성공 ----
function mqDefend(i){
  const o = mqObjs()[i]; if (!o || o.type !== 'defend') return; const s = mqState();
  if (o.place){ const p = NL.places[o.place]; const m = World.myPos && World.myPos(); if (p && (World.where() !== p.map || Math.hypot(m.x - p.x, m.y - p.y) > (p.r || 2) + 3)) return toast(`${fillVars(p.name)}에서 시작해요`); }
  const sec = o.sec || 30, ov = document.createElement('div'); ov.id = 'mqdef'; ov.className = 'px';
  ov.innerHTML = `<div class="mqdhud"><b>${esc(o.text || '등불 지키기')}</b><span class="num" id="mqdt">${sec}</span></div><div class="mqdmeter"><i id="mqdf" style="width:100%"></i></div><div class="mqdstage" id="mqds"><div class="mqlamp" id="mqlamp">🏮</div></div><div class="s mqdhint">${esc(o.hintText || '등불 쪽으로 오는 바람을 눌러서 흩어요')}</div>`;
  $('#stage').appendChild(ov); sfx('wind');
  let flame = 100, t0 = performance.now(), last = t0, spawnAt = 0, gusts = [], over = false;
  const stg = ov.querySelector('#mqds'), lamp = ov.querySelector('#mqlamp');
  const end = ok => { if (over) return; over = true; gusts.forEach(g => g.el.remove()); ov.remove(); if (ok){ s.prog['defend:' + i] = 1; save(); sfx('magic'); toast(o.doneText || '등불을 지켰어요!'); mqCheck(); } else { sfx('thunder'); toast('등불이 꺼졌어요…… 다시 해 봐요'); } };
  const tick = now => { if (over) return; const dt = (now - last) / 1000; last = now; const el = (now - t0) / 1000, left = Math.max(0, sec - el); ov.querySelector('#mqdt').textContent = Math.ceil(left);
    if (now > spawnAt){ spawnAt = now + Math.max(500, 1500 - el * 25); const g = document.createElement('button'); g.className = 'mqgust'; g.textContent = ['🌬️', '🌫️', '👻', '🍂'][Math.floor(Math.random() * 4)]; const ang = Math.random() * Math.PI * 2; const r = 1.1; g.ax = .5 + Math.cos(ang) * r; g.ay = .5 + Math.sin(ang) * r; g.sp = (.12 + Math.random() * .08) * (1 + el / sec); stg.appendChild(g); const G = { el: g, x: g.ax, y: g.ay }; gusts.push(G); g.onclick = e => { e.stopPropagation(); G.dead = true; g.remove(); sfx('pop'); }; g.onpointerdown = g.onclick; }
    gusts.forEach(G => { if (G.dead) return; const dx = .5 - G.x, dy = .5 - G.y, d = Math.hypot(dx, dy) || 1; G.x += dx / d * G.sp * dt; G.y += dy / d * G.sp * dt; G.el.style.left = G.x * 100 + '%'; G.el.style.top = G.y * 100 + '%'; if (d < .06){ G.dead = true; G.el.remove(); flame -= o.hitDamage || 18; lamp.classList.add('hit'); setTimeout(() => lamp.classList.remove('hit'), 300); sfx('gulp'); } });
    gusts = gusts.filter(G => !G.dead); ov.querySelector('#mqdf').style.width = Math.max(0, flame) + '%';
    if (flame <= 0) return end(false); if (left <= 0) return end(true); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
// ---- 상황 버튼: 솥·오븐 옆에서 「의뢰 제조」 ----
function mqCtxExtra(t){ const s = mqState(); if (!s.q || s.ph !== 'go' || !t || t.kind !== 'act') return ''; const nm = t.o && t.o.name; const pl = nm === 'cauldron' ? 'lab' : (nm === 'oven' || nm === 'stove') ? 'candy' : null; if (!pl) return ''; mqCraftPlace = pl; return mqRecipes().length ? `<button data-ctx="mqcraft">⚗️ 의뢰 제조</button>` : ''; }
// ---- 가방 「중요」 탭 항목 ----
function mqBagKeys(){ return Object.keys(MQ.items).filter(k => MQ.items[k].key && me.inv[k] > 0).map(k => ({ id: k, kind: 'inv', n: me.inv[k], name: ITEM[k], ico: mqIc(k) })); }
const mqIc = k => { const it = MQ.items[k]; return it && it.emoji ? `<i class="ic mqic">${it.emoji}</i>` : ic(k); };
// ---- 시험용 손잡이 ----
window.__mq = { state: () => mqState(), set: (q, st, ph) => { const s = mqState(); s.q = q; s.st = st || 1; s.ph = ph || 'pre'; s.prog = {}; save(); syncNpcs(); mqMarks(); }, done: q => { const s = mqState(); s.done[q] = me.day; save(); mqSky(); }, play: (q, n, k) => mqPlay(MQ.q[q], n, k), tick: () => mqTick(), check: () => mqCheck(), moon: m => { if (m) localStorage.setItem('magion-moon', m); else localStorage.removeItem('magion-moon'); }, MQ };
// ----- /메인 의뢰 -----
