<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3A2860">
<title>별빛 아카데미</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
@font-face{font-family:'G11B';src:url(fonts/Galmuri11-Bold.woff2) format('woff2');font-display:swap}
@font-face{font-family:'G9';src:url(fonts/Galmuri9.woff2) format('woff2');font-display:swap}
@font-face{font-family:'G7';src:url(fonts/Galmuri7.woff2) format('woff2');font-display:swap}
:root{--ink:#3A2860;--ink2:#22183F;--paper:#FAF1E2;--card:#FFFCF6;--sub:#9480B4;--line:#E8DCF0;--soft:#F3EAFB;--gold:#FFD866;--gold2:#D9A020;--mint:#8CE6B0;--mint2:#3FAF74;--pink:#FF8FAF;--bad:#C2385E}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1A1234;-webkit-font-smoothing:none;-webkit-tap-highlight-color:transparent}
body{font-family:'G9',monospace;font-size:16px;line-height:20px;color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;margin:0}
button:disabled{opacity:.4;cursor:default}
input{font-family:'G9',monospace;font-size:16px;color:var(--ink)}
#app{position:relative;max-width:430px;height:100dvh;margin:0 auto;background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
.px{clip-path:polygon(0 3px,3px 3px,3px 0,calc(100% - 3px) 0,calc(100% - 3px) 3px,100% 3px,100% calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,3px calc(100% - 3px),0 calc(100% - 3px))}
.ic{display:inline-block;width:32px;height:32px;flex-shrink:0;background:url(art/icons.png) no-repeat;image-rendering:pixelated;vertical-align:middle}
.fc{width:60px;height:66px;flex-shrink:0;background:url(art/faces.png) no-repeat;image-rendering:pixelated}
.cr{width:120px;height:102px;background:url(art/creatures.png) no-repeat;image-rendering:pixelated}
.b{font-family:'G11B',monospace}.s{font-family:'G7',monospace;font-size:14px;line-height:18px}.sub{color:var(--sub)}

/* 장면과 상단 바 */
.scene{position:relative;flex-shrink:0;width:100%;aspect-ratio:390/330;overflow:hidden;background:#3A2E78}
.scene.flat{aspect-ratio:auto;height:96px;background:url(art/tile.png) repeat;background-size:64px 64px;image-rendering:pixelated}
.scene img{position:absolute;left:0;bottom:0;width:100%;image-rendering:pixelated}
.top{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;z-index:2}
.title{background:rgba(34,24,63,.88);color:#fff;padding:7px 10px 6px;display:flex;flex-direction:column;gap:3px;min-width:0;max-width:62%}
.title .b{font-size:16px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title .s{color:var(--gold);line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.stat{background:rgba(34,24,63,.88);color:#fff;height:30px;padding:0 10px 0 0;display:flex;align-items:center;font-family:'G11B',monospace;font-size:14px;min-width:84px;justify-content:space-between}
.stat .ic{transform:scale(.85)}
.ribbon{position:absolute;left:10px;bottom:10px;z-index:2;display:flex;align-items:center;gap:4px;padding:0 10px 0 2px;height:34px;color:#fff;font-family:'G7',monospace;font-size:14px}
.ribbon .ic{transform:scale(.8)}

/* 본문 */
.panel{flex:1;overflow-y:auto;border-top:4px solid var(--ink2);padding:16px 16px 24px;display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:24px}
.sec-h h3{margin:0;font-family:'G11B',monospace;font-size:16px;line-height:18px;font-weight:normal}
.sec-h .meta{font-family:'G7',monospace;font-size:14px;color:var(--sub)}
.box{background:var(--card);border:3px solid var(--ink)}
.li{display:flex;align-items:center;gap:10px;padding:8px 10px;min-height:52px}
.li + .li{border-top:2px dashed var(--line)}
.li .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .d{font-family:'G7',monospace;font-size:14px;line-height:16px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li.done{opacity:.5}
.hint{font-family:'G7',monospace;font-size:14px;line-height:18px;color:var(--sub);text-align:center;padding:0 8px;min-height:18px}
.hint.on{color:var(--ink);background:var(--soft);padding:8px 10px;text-align:left}
.tag{font-family:'G7',monospace;font-size:14px;line-height:14px;padding:3px 6px;background:var(--soft);color:var(--ink);white-space:nowrap}

/* 버튼 */
.btn{min-height:46px;border:3px solid var(--ink);background:#fff;box-shadow:inset 0 -4px 0 var(--line);font-family:'G11B',monospace;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;white-space:nowrap}
.btn:active:not(:disabled){box-shadow:none;transform:translateY(2px)}
.btn.go{background:var(--mint);box-shadow:inset 0 -4px 0 var(--mint2);color:#1E3A2A}
.btn.gold{background:var(--gold);box-shadow:inset 0 -4px 0 var(--gold2)}
.btn.dark{background:var(--ink);color:var(--gold);border-color:var(--ink2);box-shadow:inset 0 -4px 0 var(--ink2)}
.btn.sm{min-height:34px;border-width:2px;font-size:14px;box-shadow:inset 0 -3px 0 var(--line);padding:0 10px}
.btn.sm.go{box-shadow:inset 0 -3px 0 var(--mint2)}
.btn.ghost{min-height:30px;border:0;box-shadow:none;background:transparent;color:var(--sub);font-family:'G7',monospace;font-size:14px;padding:0 4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--card);border:3px solid var(--ink);box-shadow:inset 0 -4px 0 var(--line);text-align:left;min-height:60px}
.tile .main{display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .main .b{font-size:15px;line-height:16px}
.seg{display:grid;gap:0;border:3px solid var(--ink);background:var(--ink)}
.seg button{border:0;background:var(--card);min-height:38px;font-family:'G11B',monospace;font-size:14px;color:var(--sub)}
.seg button + button{border-left:3px solid var(--ink)}
.seg button.on{background:var(--gold);color:var(--ink)}

/* 칸 */
.grid{display:grid;gap:6px}
.cell{border:2px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;position:relative;min-height:64px}
button.cell:not(:disabled){border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--line)}
.cell.sel{border:3px solid #6A4AC8;background:#fff;box-shadow:none}
.cell .n{position:absolute;right:4px;top:2px;font-family:'G11B',monospace;font-size:13px;line-height:13px;color:#6A4AC8}
.cell .s{white-space:nowrap}
.slot{border:3px dashed #CDBDE8;background:var(--soft);min-height:76px}
.slot.on{border-style:solid;border-color:#6A4AC8;background:#fff}
.bar{display:grid;gap:2px;background:var(--ink);padding:2px;flex:1}
.bar i{display:block;height:8px;background:#fff}
.meter{display:flex;align-items:center;gap:8px}
.meter .s{width:44px;flex-shrink:0}
.face{overflow:hidden;background:#E8DDF8;display:flex;justify-content:center;flex-shrink:0;position:relative}
.dot{position:absolute;right:1px;bottom:1px;width:8px;height:8px;border:2px solid #fff}
.pal{display:flex;gap:6px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:6px;height:34px;padding:0 8px 0 0;border:2px solid var(--line);background:#fff;font-family:'G7',monospace;font-size:14px}
button.who:not(:disabled){border-color:var(--ink)}

/* 탭 */
.tabs{flex-shrink:0;height:70px;background:var(--ink2);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-family:'G7',monospace;font-size:14px;color:#9C8CC8;position:relative}
.tabs button .ic{opacity:.55}
.tabs button.on{color:var(--gold)}
.tabs button.on .ic{opacity:1}
.tabs button.on::before{content:'';position:absolute;top:0;left:22%;right:22%;height:4px;background:var(--gold)}

/* 로그인·시작 */
.cover{flex:1;overflow-y:auto;background:url(art/tile.png) repeat;background-size:64px 64px;image-rendering:pixelated;padding:28px 18px;display:flex;flex-direction:column;gap:14px;color:#fff}
.card{background:var(--paper);color:var(--ink);border:4px solid var(--ink2);padding:16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field input{height:44px;border:3px solid var(--ink);background:#fff;padding:0 10px}
.err{color:var(--bad);font-family:'G7',monospace;font-size:14px;min-height:18px;margin:0}
.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink2);color:#fff;padding:9px 14px;font-family:'G7',monospace;font-size:14px;z-index:9;max-width:90%;text-align:center;box-shadow:0 0 0 3px var(--gold)}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { firebaseConfig } from './firebase-config.js';
const FB = 'https://www.gstatic.com/firebasejs/10.12.2/';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app');

// ===== 데이터 =====
const ICONS = ['coin','mana','p_red','p_blue','p_green','p_purple','herb','mush','wool','uhair','scale','egg','heart','book','cauldron','clock','bag','owl','star','drop','seed','sprout','can','candle','bed','rune'];
const ic = (k, extra='') => `<i class="ic" style="background-position:${-32 * ICONS.indexOf(k)}px 0;${extra}"></i>`;
const ITEM = {
  herb:'약초', drop:'달빛 이슬', mush:'보라 버섯', mana:'마력석', wool:'구름양 털', scale:'불도마뱀 비늘', uhair:'유니콘 갈기', egg:'용 알 껍질',
  p_red:'치유 물약', p_green:'화염 저항 물약', p_blue:'잠꾸러기 물약', p_purple:'반짝 물약',
};
const MATS = ['herb','drop','mush','mana','wool','scale','uhair','egg'];
const POTIONS = ['p_red','p_green','p_blue','p_purple'];
const RECIPES = { 'drop,herb,herb':'p_red', 'drop,mush,scale':'p_green', 'drop,mana,wool':'p_blue', 'drop,herb,uhair':'p_purple' };
const HINTS = {
  p_red: '치유 물약 = 약초 두 줌 + 달빛 이슬',
  p_green: '화염 저항 물약 = 보라 버섯 + 불도마뱀 비늘 + 달빛 이슬',
  p_blue: '잠꾸러기 물약 = 구름양 털 + 마력석 + 달빛 이슬',
  p_purple: '반짝 물약 = 약초 + 달빛 이슬 + 반짝이는 갈기',
};
const SEEDS = { herb:'약초', drop:'월광초', mush:'보라 버섯' };
const CREATURES = [
  { name:'뭉게', kind:'구름양', food:'약초 주기', mat:'wool' },
  { name:'별사탕', kind:'아기 유니콘', food:'각설탕 주기', mat:'uhair' },
  { name:'불씨', kind:'불도마뱀', food:'숯 주기', mat:'scale' },
  { name:'초롱', kind:'아기 용', food:'고기 주기', mat:'egg' },
];
const FURN = [
  { id:'candle', name:'촛대', icon:'candle', pts:1, price:0 },
  { id:'bed', name:'퀼트 이불', icon:'bed', pts:2, price:0 },
  { id:'owl', name:'부엉이 횃대', icon:'owl', pts:1, price:0 },
  { id:'plant', name:'화분', icon:'sprout', pts:1, price:80 },
  { id:'shelf', name:'마법서 선반', icon:'book', pts:2, price:150 },
  { id:'rug', name:'별자리 러그', icon:'rune', pts:3, price:300 },
];
// 기숙사: 하루 중 깨어 있는 시간대로 나눠요. 기숙사마다 3명까지.
const HOUSES = {
  dew:   { name:'Dewmorn',    ko:'듀모른',     from:5,  to:10, col:'#5CCB8E', bg:'#E2F8EA', icon:'sprout', where:'온실 위 유리 다락', who:'부지런한 정원사들',
           perk:'물 주기에 마력이 안 들어요', timePerk:'새벽에 수확하면 약초 +1' },
  ember: { name:'Emberkiln',  ko:'엠버킬른',   from:10, to:16, col:'#F08A3C', bg:'#FFEBDC', icon:'cauldron', where:'지하 솥가마 옆', who:'시끌벅적한 실험광들',
           perk:'물약 끓이기 마력 5 → 4', timePerk:'낮에 실패하면 재료 1개를 돌려받아요' },
  dusk:  { name:'Duskfold',   ko:'더스크폴드', from:16, to:21, col:'#E8709A', bg:'#FFE6EE', icon:'wool', where:'숲가 헛간 2층', who:'다정한 돌봄이들',
           perk:'쓰다듬으면 애정 +1 더', timePerk:'저녁에 먹이를 주면 배부름 +1 더' },
  moon:  { name:'Moonhollow', ko:'문할로우',   from:21, to:5,  col:'#7A66E0', bg:'#E8E2FF', icon:'owl', where:'시계탑 꼭대기', who:'소문 많은 밤의 장사꾼들',
           perk:'주문 납품 보상 +10%', timePerk:'밤에 올린 시장 물건에 달빛 표시' },
};
const HOUSE_KEYS = Object.keys(HOUSES);
const HOUSE_CAP = 3;
const houseNow = () => { const h = new Date().getHours(); return HOUSE_KEYS.find(k => { const H = HOUSES[k]; return H.from < H.to ? h >= H.from && h < H.to : h >= H.from || h < H.to; }); };
const myTime = () => !!me.house && houseNow() === me.house;
const hoursText = H => `${H.from}~${H.to}시`;
const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
const roomNo = (house, key) => (HOUSE_KEYS.indexOf(house) + 1) * 100 + [...String(key)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 997, 7) % 12 + 1;
const brewCost = () => me.house === 'ember' ? 4 : 5;
const waterCost = () => me.house === 'dew' ? 0 : 1;
const payOf = o => me.house === 'moon' ? Math.round(o.pay * 1.1) : o.pay;

const ORDER_FROM =['양호 선생님', '교장실', '같은 반 친구', '사육장 관리인', '도서관 사서', '천문탑'];
const PAY = { p_red:60, p_green:90, p_blue:70, p_purple:280 };

function freshPlayer(nick, look, house){
  return {
    nick, look, house, coin:300, mana:40, day:1,
    inv:{ herb:6, drop:4, mush:2, mana:3, wool:1, scale:1, uhair:0, egg:0, p_red:0, p_green:0, p_blue:0, p_purple:0 },
    found:[], hints:['p_red'],
    plots:[{k:'herb',st:2,w:false},{k:'drop',st:1,w:false},{k:null,st:0,w:false},{k:null,st:0,w:false},{k:null,st:0,w:false},{k:null,st:0,w:false}],
    cr:[{full:3,love:3},{full:2,love:2},{full:3,love:2},{full:2,love:1}],
    furn:{ candle:{own:1,on:1}, bed:{own:1,on:1}, owl:{own:1,on:1} },
    orders:makeOrders(1), classDay:0,
  };
}
function makeOrders(day){
  const out = [];
  for (let i = 0; i < 3; i++){
    const p = POTIONS[(day * 7 + i * 3) % (day < 4 ? 3 : 4)];
    out.push({ p, n: 1 + ((day + i) % 2), pay: PAY[p], from: ORDER_FROM[(day + i * 2) % ORDER_FROM.length], done:false });
  }
  return out;
}
const cozyOf = me => FURN.reduce((a, f) => a + (me.furn[f.id]?.on ? f.pts : 0), 0);

// ===== 저장: 온라인이면 Firebase, 혼자 모드면 이 기기 =====
let F = null, auth = null, db = null, uid = null, solo = false, me = null, saveTimer = 0;
let onlineList = {}, marketList = {}, coop = {}, playersList = {}, myGuest = {};
const coopWeek = () => 'w' + Math.floor(Date.now() / 604800000);
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (solo) { try { localStorage.setItem('magion-solo', JSON.stringify(me)); } catch(e){} return; }
    F.set(F.ref(db, 'players/' + uid), me).catch(e => toast('저장에 실패했어요: ' + (e.code || e.message)));
  }, 300);
}
let toastTimer = 0;
function toast(t){
  document.querySelector('.toast')?.remove();
  app.insertAdjacentHTML('beforeend', `<div class="toast">${esc(t)}</div>`);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => document.querySelector('.toast')?.remove(), 2400);
}

// ===== 화면 틀 =====
let tab = 'home', sub = null;
const TABS = [['home','홈','star'],['lab','연구실','cauldron'],['green','온실','sprout'],['ranch','사육장','egg'],['market','시장','bag']];
// opt: { tint: 장면 색, ribbon: 장면 아래쪽 띠 HTML }
function frame(scene, title, subtitle, body, opt = {}){
  app.innerHTML = `
    <div class="scene ${scene ? '' : 'flat'}">${scene ? `<img src="art/${scene}.png" alt="">` : ''}${opt.tint ? `<div style="position:absolute;inset:0;background:${opt.tint};mix-blend-mode:color;opacity:.4;pointer-events:none"></div>` : ''}
      <div class="top">
        <div class="title px"><span class="b">${title}</span><span class="s">${subtitle}</span></div>
        <div class="stats">
          <div class="stat px">${ic('coin')}${me.coin.toLocaleString()}</div>
          <div class="stat px">${ic('mana')}${me.mana}</div>
        </div>
      </div>
      ${opt.ribbon || ''}
    </div>
    <div class="panel">${body}</div>
    <nav class="tabs">${TABS.map(([k, l, i]) => `<button data-tab="${k}" class="${tab === k && !sub ? 'on' : ''}">${ic(i)}${l}</button>`).join('')}</nav>`;
  app.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; sub = null; render(); });
}
const segs = (n, max, col) => `<div class="bar" style="grid-template-columns:repeat(${max},1fr)">${Array.from({length:max}, (_, i) => `<i style="${i < n ? 'background:' + col : ''}"></i>`).join('')}</div>`;
const dayLabel = () => `봄 학기 ${me.day}일`;
const secH = (title, meta = '') => `<div class="sec-h"><h3>${title}</h3>${meta ? `<span class="meta">${meta}</span>` : ''}</div>`;
const hint = (msg, fallback) => `<div class="hint ${msg ? 'on px' : ''}">${msg || fallback}</div>`;
const backBtn = '<button class="btn ghost" id="back">‹ 홈으로</button>';
const face = (look, size = 32, online) => `<div class="face" style="width:${size}px;height:${size}px"><div class="fc" style="background-position:${-60 * (look || 0)}px 0;transform:scale(${(size / 54).toFixed(2)});transform-origin:top center;margin-top:-1px"></div>${online === undefined ? '' : `<span class="dot" style="background:${online ? '#3CCB6E' : '#C8B8E8'}"></span>`}</div>`;
const houseTag = k => HOUSES[k] ? `<span class="tag" style="background:${HOUSES[k].bg};color:${HOUSES[k].col}">${HOUSES[k].name}</span>` : '';
function on(sel, fn){ app.querySelectorAll(sel).forEach(el => el.onclick = () => fn(el)); }

function render(){
  if (sub === 'class') return renderClass();
  if (sub === 'dorm') return renderDorm();
  if (sub === 'visit') return renderVisit();
  ({ home:renderHome, lab:renderLab, green:renderGreen, ranch:renderRanch, market:renderMarket })[tab]();
}

// ===== 홈 =====
function renderHome(){
  const left = me.orders.filter(o => !o.done).length;
  const H = HOUSES[me.house], nowK = houseNow(), N = HOUSES[nowK], mine = nowK === me.house;
  const onlineN = Object.keys(onlineList).length;
  const roster = HOUSE_KEYS.map(k => [k, Object.entries(playersList).filter(([, p]) => p && p.house === k)]);
  const classDone = me.classDay === me.day;
  frame('island', dayLabel(), `1학년 · ${H.name}`, `
    <section class="sec">
      ${secH('오늘의 주문', `${left} / ${me.orders.length} 남음`)}
      <div class="box px">${me.orders.map((o, i) => {
        const have = me.inv[o.p] >= o.n;
        return `<div class="li ${o.done ? 'done' : ''}">${ic(o.p)}
          <div class="main"><span class="t">${ITEM[o.p]} ×${o.n}</span><span class="d">${o.from} · 가진 것 ${me.inv[o.p]}</span></div>
          ${o.done ? '<span class="tag">완료</span>' : `<button class="btn sm ${have ? 'go' : ''}" data-deliver="${i}" ${have ? '' : 'disabled'}>${ic('coin', 'transform:scale(.7);margin:0 -6px')}${payOf(o)}</button>`}</div>`;
      }).join('')}</div>
    </section>
    <div class="tiles">
      <button class="tile px" id="goClass">${ic('book')}<span class="main"><span class="b">${classDone ? '수업 끝' : '수업 듣기'}</span><span class="s sub">${classDone ? '내일 또 와요' : '레시피 힌트 얻기'}</span></span></button>
      <button class="tile px" id="goDorm">${ic('bed')}<span class="main"><span class="b">내 방</span><span class="s sub">${H.name} ${roomNo(me.house, uid || me.nick)}호</span></span></button>
    </div>
    ${solo ? `<div class="hint">혼자 해 보기 모드예요. 로그인하면 친구들 방에 놀러 갈 수 있어요.</div>` : `
    <section class="sec">
      ${secH('학생 명부', `지금 ${onlineN}명 접속`)}
      <div class="box px">${roster.map(([k, list]) => `<div class="li" style="align-items:flex-start">
        <div style="width:92px;flex-shrink:0;display:flex;flex-direction:column;gap:2px;padding-top:2px"><span class="b" style="font-size:14px;color:${HOUSES[k].col}">${HOUSES[k].name}</span><span class="s sub">${list.length} / ${HOUSE_CAP}명</span></div>
        <div class="pal" style="flex:1">${list.map(([id, p]) => `<button class="who" data-visit="${id}" ${id === uid ? 'disabled' : ''}>${face(p.look, 30, !!onlineList[id])}${esc(p.nick)}</button>`).join('') || '<span class="s sub" style="padding-top:8px">빈 방이에요</span>'}</div>
      </div>`).join('')}</div>
      <div class="hint">이름을 누르면 그 친구 방에 놀러 가요</div>
    </section>`}`, {
    ribbon: `<div class="ribbon px" style="background:${mine ? N.col : 'rgba(34,24,63,.88)'}">${ic(N.icon)}${N.name}의 시간 · ${mine ? '내 보너스 중!' : hoursText(N)}</div>`,
  });
  on('[data-deliver]', b => {
    const o = me.orders[+b.dataset.deliver];
    if (me.inv[o.p] < o.n) return;
    const pay = payOf(o);
    me.inv[o.p] -= o.n; me.coin += pay; o.done = true; save();
    toast(`${o.from}에게 ${ITEM[o.p]}을(를) 전했어요. +${pay}G`); render();
  });
  on('[data-visit]', b => openVisit(b.dataset.visit));
  $('#goClass').onclick = () => { sub = 'class'; render(); };
  $('#goDorm').onclick = () => { sub = 'dorm'; render(); };
}

// ===== 수업: 문양 따라 그리기 =====
let classInput = [];
function renderClass(){
  const done = me.classDay === me.day;
  const pool = ['star','drop','herb','scale'];
  const seq = [0, 1, 2, 3].map(i => pool[(me.day * 5 + i * 3 + (i * i)) % 4]);
  const wrong = classInput.some((v, i) => v !== seq[i]);
  const ok = !wrong && classInput.length === seq.length;
  const next = POTIONS.find(p => !me.hints.includes(p));
  frame('class', '3교시 · 문양학', done && !ok ? '오늘 수업은 끝났어요' : '칠판을 보고 따라 그려요', `
    <section class="sec">
      <div class="sec-h"><h3>칠판의 문양을 순서대로</h3>${backBtn}</div>
      <div class="px" style="background:#2E4A44;border:3px solid var(--ink2);padding:12px;display:flex;justify-content:center;gap:8px">
        ${seq.map((k, i) => `<div style="width:54px;height:54px;display:flex;align-items:center;justify-content:center;background:${i < classInput.length && !wrong ? '#8CE6B0' : '#3E625A'};border:2px solid ${i < classInput.length && !wrong ? '#fff' : '#5E8A80'}">${ic(k)}</div>`).join('')}
      </div>
    </section>
    <div class="grid" style="grid-template-columns:repeat(4,1fr)">
      ${pool.map(k => `<button class="cell" data-rune="${k}" ${done || wrong || ok ? 'disabled' : ''}>${ic(k)}<span class="s">${({star:'별',drop:'물',herb:'잎',scale:'불'})[k]}</span></button>`).join('')}
    </div>
    ${hint(wrong ? '앗, 문양이 흐트러졌어요. 다시 해 볼까요?' : ok ? '성공! 연구실 레시피 노트에 새 힌트가 적혔어요.' : done ? '오늘 수업은 이미 들었어요. 내일 또 와요.' : '', `수업을 잘 들으면 물약 레시피 힌트를 얻어요 · ${classInput.length} / 4`)}
    ${wrong ? '<button class="btn" id="retry">다시 하기</button>' : ''}`);
  on('[data-rune]', b => {
    classInput.push(b.dataset.rune);
    const w = classInput.some((v, i) => v !== seq[i]);
    if (!w && classInput.length === seq.length){
      me.classDay = me.day;
      if (next){ me.hints.push(next); toast('레시피 힌트를 얻었어요: ' + HINTS[next]); }
      else { me.coin += 30; toast('모든 힌트를 알고 있어요. 장학금 +30G'); }
      save();
    }
    renderClass();
  });
  $('#back').onclick = () => { classInput = []; sub = null; tab = 'home'; render(); };
  const r = $('#retry'); if (r) r.onclick = () => { classInput = []; renderClass(); };
}

// ===== 연구실 =====
let slots = [], brewMsg = null;
const shortName = k => ITEM[k].replace('불도마뱀 ', '').replace('유니콘 ', '').replace('구름양 ', '').replace('용 알 ', '알 ').replace(' 물약', '');
function renderLab(){
  frame('lab', '물약 연구실', `도감 ${me.found.length} / ${POTIONS.length}`, `
    <section class="sec">
      ${secH('솥', `재료 3개 · 마력 ${brewCost()}`)}
      <div class="grid" style="grid-template-columns:repeat(3,1fr)">
        ${[0, 1, 2].map(i => slots[i] ? `<button class="cell slot on" data-take="${i}">${ic(slots[i])}<span class="s">${shortName(slots[i])}</span></button>` : `<div class="cell slot"><span class="s sub">빈 칸</span></div>`).join('')}
      </div>
      <button class="btn go px" id="brew" ${slots.length === 3 && me.mana >= brewCost() ? '' : 'disabled'}>${ic('cauldron')}끓이기</button>
      ${hint(brewMsg, '아래 재료를 눌러 솥에 넣어요. 넣은 재료를 누르면 다시 빼요.')}
    </section>
    <section class="sec">
      ${secH('재료함')}
      <div class="grid" style="grid-template-columns:repeat(4,1fr)">
        ${MATS.map(k => { const left = me.inv[k] - slots.filter(s => s === k).length; return `<button class="cell" data-add="${k}" ${left > 0 && slots.length < 3 ? '' : 'disabled'}>${ic(k)}<span class="s">${shortName(k)}</span><span class="n">${left}</span></button>`; }).join('')}
      </div>
    </section>
    <section class="sec">
      ${secH('레시피 노트', `${me.hints.length}개 알아냄`)}
      <div class="box px">${me.hints.map(h => `<div class="li">${ic(h)}<div class="main"><span class="t">${ITEM[h]}${me.found.includes(h) ? '' : ' <span class="tag">아직 못 만듦</span>'}</span><span class="d">${HINTS[h].split('= ')[1]}</span></div><span class="b" style="color:#6A4AC8">${me.inv[h]}병</span></div>`).join('')}</div>
      <div class="hint">수업을 들으면 노트에 새 레시피가 적혀요</div>
    </section>`);
  on('[data-add]', b => { slots.push(b.dataset.add); brewMsg = null; renderLab(); });
  on('[data-take]', b => { slots.splice(+b.dataset.take, 1); renderLab(); });
  $('#brew').onclick = () => {
    const key = slots.slice().sort().join(',');
    slots.forEach(k => me.inv[k]--);
    me.mana -= brewCost();
    const p = RECIPES[key];
    if (p){
      me.inv[p]++;
      const isNew = !me.found.includes(p);
      if (isNew) me.found.push(p);
      if (!me.hints.includes(p)) me.hints.push(p);
      brewMsg = `${ITEM[p]} 완성!${isNew ? ' 새 레시피를 도감에 적었어요.' : ''}`;
    } else if (me.house === 'ember' && myTime()){
      const back = slots[Math.floor(Math.random() * 3)]; me.inv[back]++;
      brewMsg = `보라색 연기만 피어올랐어요... 그래도 Emberkiln의 낮이라 ${ITEM[back]}을(를) 건졌어요.`;
    } else brewMsg = '보라색 연기만 피어올랐어요... 재료는 사라졌어요.';
    slots = []; save(); renderLab();
  };
}

// ===== 온실 =====
let seedPick = 'herb', greenMsg = '';
function renderGreen(){
  const ready = me.plots.filter(p => p.st === 4).length;
  frame('green', '약초 온실', ready ? `수확할 칸 ${ready}개` : '물 준 식물은 자고 나면 자라요', `
    <section class="sec">
      ${secH('심을 씨앗')}
      <div class="seg px" style="grid-template-columns:repeat(3,1fr)">${Object.entries(SEEDS).map(([k, n]) => `<button class="${seedPick === k ? 'on' : ''}" data-seed="${k}">${n}</button>`).join('')}</div>
    </section>
    <section class="sec">
      ${secH('화단', waterCost() ? '물 주기 마력 1' : '물 주기 무료')}
      <div class="grid" style="grid-template-columns:repeat(3,1fr)">
        ${me.plots.map((p, i) => {
          const icon = p.st === 0 ? 'seed' : p.st === 4 ? p.k : ['seed', 'seed', 'sprout', 'herb'][p.st];
          const label = p.st === 0 ? '심기' : p.st === 4 ? '수확!' : p.w ? '물 줬어요' : '물 주기';
          const bg = p.st === 4 ? '#E2FBEA' : p.w ? '#E4F1FF' : p.st === 0 ? 'var(--card)' : '#F6EBDB';
          return `<button class="cell" data-plot="${i}" style="min-height:100px;background:${bg};${p.st === 4 ? 'border-color:var(--mint2)' : ''}">
            ${ic(icon, p.st === 0 ? 'opacity:.3' : '')}<span class="s">${p.k ? SEEDS[p.k] : '빈 칸'}</span><span class="s ${p.st === 4 ? 'b' : 'sub'}" style="${p.st === 4 ? 'color:var(--mint2)' : ''}">${label}</span>
            <div style="width:60px;display:flex">${segs(p.st, 4, '#7BD88F')}</div></button>`;
        }).join('')}
      </div>
      ${hint(greenMsg, '빈 칸에 씨앗을 심고 물을 줘요. 기숙사에서 자고 나면 한 단계씩 자라요.')}
    </section>`);
  on('[data-seed]', b => { seedPick = b.dataset.seed; renderGreen(); });
  on('[data-plot]', b => {
    const p = me.plots[+b.dataset.plot];
    if (p.st === 0){ Object.assign(p, { k: seedPick, st: 1, w: false }); greenMsg = SEEDS[seedPick] + ' 씨앗을 심었어요.'; }
    else if (p.st === 4){ const got = p.k, n = 3 + (me.house === 'dew' && myTime() ? 1 : 0); me.inv[got] += n; Object.assign(p, { k: null, st: 0, w: false }); greenMsg = `${SEEDS[got]} 수확! ${ITEM[got]} +${n}${n > 3 ? ' (Dewmorn의 새벽 보너스)' : ''}`; }
    else if (p.w) greenMsg = '오늘은 이미 물을 줬어요. 자고 나면 자라요.';
    else if (me.mana < waterCost()) greenMsg = '마력이 부족해요. 기숙사에서 자고 오세요.';
    else { p.w = true; me.mana -= waterCost(); greenMsg = '물을 줬어요. 내일 아침이면 쑥 자라 있을 거예요.'; }
    save(); renderGreen();
  });
}

// ===== 사육장 =====

        <div class="s sub" style="display:flex;align-items:center;gap:4px">${ic(d.mat, 'transform:scale(.8)')}애정이 가득 차면 「${ITEM[d.mat]}」을 줘요</div>
      </div>
      <div class="grid" style="grid-template-columns:repeat(3,1fr)">

    </section>`);
  on('[data-cr]', b => { crSel = +b.dataset.cr; ranchMsg = ''; renderRanch(); });
  $('#feed').onclick = () => { const n = me.house === 'dusk' && myTime() ? 3 : 2; c.full = Math.min(5, c.full + n); ranchMsg = `${d.name}이(가) 맛있게 먹었어요. 배부름 +${n}`; save(); renderRanch(); };
  $('#pat').onclick = () => {

// ===== 기숙사 =====
let dormMsg = '';
const furnCell = (f, st, clickable) => `<${clickable ? 'button' : 'div'} class="cell ${st.on ? 'sel' : ''}" ${clickable ? `data-f="${f.id}"` : ''} style="min-height:84px;${!st.own ? 'background:var(--soft)' : ''}">${ic(f.icon, st.own ? '' : 'opacity:.5')}<span class="s">${f.name}</span>${clickable ? `<span class="s b" style="color:${!st.own ? 'var(--gold2)' : st.on ? 'var(--mint2)' : 'var(--sub)'}">${!st.own ? f.price + 'G' : st.on ? '놓음' : '보관 중'}</span>` : ''}</${clickable ? 'button' : 'div'}>`;
function renderDorm(){
  const cozy = cozyOf(me), H = HOUSES[me.house];
  const guest = Object.entries(myGuest).sort((a, b) => b[1].at - a[1].at);
  frame('dorm', `${H.name} ${roomNo(me.house, uid || me.nick)}호`, `아늑함 ${cozy} / 10`, `
    <section class="sec">
      <div class="sec-h"><h3>방 꾸미기</h3>${backBtn}</div>
      <div class="meter">${ic('heart', 'transform:scale(.8);margin:-4px')}${segs(cozy, 10, '#FF9DBA')}<span class="s b">${cozy}</span></div>
      <div class="grid" style="grid-template-columns:repeat(3,1fr)">${FURN.map(f => furnCell(f, me.furn[f.id] || {}, true)).join('')}</div>
      ${hint(dormMsg, '가구를 눌러 사거나 놓거나 치워요. 아늑할수록 자고 나서 마력이 더 차요.')}
      <button class="btn dark px" id="sleep">${ic('star')}잠자고 내일로</button>
    </section>
    ${solo ? '' : `<section class="sec">
      ${secH('내 방명록', '손님 1명당 내일 마력 +3')}
      ${guest.length ? `<div class="box px">${guest.map(([id, g]) => guestRow(id, g, true)).join('')}</div>` : '<div class="hint">아직 다녀간 친구가 없어요. 학생 명부에서 먼저 놀러 가 볼까요?</div>'}
    </section>`}`, { tint: H.col });
  on('[data-claim]', async b => {
    const g = myGuest[b.dataset.claim]; if (!g || !g.gift || g.claimed) return;
    await F.update(F.ref(db, `guest/${uid}/${b.dataset.claim}`), { claimed: true });
    me.inv[g.gift] = (me.inv[g.gift] || 0) + 1; save(); toast(`${g.nick}의 선물 ${ITEM[g.gift]}을(를) 받았어요!`);
  });
  on('[data-f]', b => {
    const f = FURN.find(x => x.id === b.dataset.f), st = me.furn[f.id] || (me.furn[f.id] = { own:0, on:0 });
    if (!st.own){
      if (me.coin < f.price){ dormMsg = '골드가 부족해요. 물약을 팔고 다시 와요.'; return renderDorm(); }
      me.coin -= f.price; st.own = 1; st.on = 1; dormMsg = `${f.name}을(를) 사서 방에 놓았어요! 아늑함 +${f.pts}`;
    } else { st.on = st.on ? 0 : 1; dormMsg = st.on ? `${f.name}을(를) 다시 놓았어요.` : `${f.name}을(를) 상자에 넣었어요.`; }
    save(); renderDorm();
  });
  $('#back').onclick = () => { sub = null; tab = 'home'; render(); };
  $('#sleep').onclick = () => sleep();
}
function sleep(){
  const since = me.lastSleepAt || 0;
  const guests = Math.min(3, new Set(Object.values(myGuest).filter(g => g.at > since).map(g => g.uid)).size);
  const cozy = cozyOf(me), gain = 20 + cozy * 3 + guests * 3;
  me.lastSleepAt = Date.now();
  me.day++;
  me.mana = Math.min(50 + cozy * 2 + guests * 3, me.mana + gain);
  me.plots.forEach(p => { if (p.st >= 1 && p.st < 4 && p.w) p.st++; p.w = false; });
  me.cr.forEach(c => { c.full = Math.max(0, c.full - 1); });
  me.orders = makeOrders(me.day);
  classInput = [];
  save();
  dormMsg = `푹 잤어요! 봄 학기 ${me.day}일 아침 · 마력 +${gain} (아늑함 +${cozy * 3}${guests ? `, 손님 ${guests}명 +${guests * 3}` : ''})`;
  renderDorm();
}

// ===== 친구 방 놀러 가기 =====
let visitUid = null, visitGuest = {}, visitOff = null, giftPick = null;
function guestRow(id, g, mine){
  const H = HOUSES[g.house];
  return `<div class="li" style="align-items:flex-start">${face(g.look, 34)}
    <div class="main"><span class="s"><b class="b" style="color:${H ? H.col : 'var(--ink)'}">${esc(g.nick)}</b> <span class="sub">${new Date(g.at).toLocaleDateString('ko-KR', { month:'numeric', day:'numeric' })}</span></span>
    ${g.text ? `<span style="word-break:break-all">${esc(g.text)}</span>` : ''}
    ${g.gift ? `<span class="d" style="display:flex;align-items:center;gap:2px">${ic(g.gift, 'transform:scale(.6);margin:-6px')}선물 · ${ITEM[g.gift]}${g.claimed ? ' (받음)' : ''}</span>` : ''}</div>
    ${mine && g.gift && !g.claimed ? `<button class="btn sm go" data-claim="${id}">받기</button>` : ''}</div>`;
}
function openVisit(id){
  if (solo || !playersList[id] || id === uid) return;
  visitUid = id; visitGuest = {}; giftPick = null; sub = 'visit';
  visitOff?.();
  visitOff = F.onValue(F.query(F.ref(db, 'guest/' + id), F.limitToLast(20)), s => { visitGuest = s.val() || {}; if (sub === 'visit') renderVisit(); });
  me.visited = me.visited || {};
  if (me.visited[id] !== todayKey()){
    me.visited[id] = todayKey(); me.mana += 5; save();
    toast(`${playersList[id].nick}의 방에 처음 놀러 왔어요. 마력 +5`);
  }
  renderVisit();
}
function leaveVisit(){ visitOff?.(); visitOff = null; visitUid = null; sub = null; tab = 'home'; render(); }
function renderVisit(){
  const p = playersList[visitUid];
  if (!p) return leaveVisit();
  const H = HOUSES[p.house] || HOUSES.dew, cozy = cozyOf({ furn: p.furn || {} });
  const placed = FURN.filter(f => p.furn?.[f.id]?.on);
  const guest = Object.entries(visitGuest).sort((a, b) => b[1].at - a[1].at);
  me.wrote = me.wrote || {};
  const wrote = me.wrote[visitUid] === todayKey();
  const giftable = [...POTIONS, ...MATS].filter(k => me.inv[k] > 0);
  frame('dorm', `${esc(p.nick)}의 방`, `${H.name} ${roomNo(p.house, visitUid)}호 · ${onlineList[visitUid] ? '접속 중' : '외출 중'}`, `
    <section class="sec">
      <div class="sec-h"><h3>${esc(p.nick)}의 방 구경</h3>${backBtn}</div>
      <div class="meter">${ic('heart', 'transform:scale(.8);margin:-4px')}${segs(cozy, 10, '#FF9DBA')}<span class="s b">${cozy}</span></div>
      ${placed.length ? `<div class="grid" style="grid-template-columns:repeat(4,1fr)">${placed.map(f => furnCell(f, { own: 1 }, false)).join('')}</div>` : '<div class="hint">아직 가구가 없는 휑한 방이에요</div>'}
    </section>
    <section class="sec">
      ${secH('방명록 남기기', wrote ? '오늘은 남겼어요' : '하루 한 번')}
      ${wrote ? '<div class="hint">내일 또 놀러 와서 남겨 주세요</div>' : `
      <div class="box px" style="padding:10px;display:flex;flex-direction:column;gap:8px">
        <input id="gtext" maxlength="40" placeholder="예: 방 진짜 아늑하다!" style="height:42px;border:2px solid var(--ink);padding:0 10px;background:#fff">
        <span class="s sub">선물도 놓고 갈래요? (안 골라도 돼요)</span>
        <div class="pal">${giftable.map(k => `<button class="cell ${giftPick === k ? 'sel' : ''}" style="width:48px;min-height:48px;padding:0" data-gift="${k}">${ic(k)}<span class="n">${me.inv[k]}</span></button>`).join('') || '<span class="s sub">가방이 비었어요</span>'}</div>
        <button class="btn sm go" id="gsend" style="min-height:40px">${giftPick ? ITEM[giftPick] + ' 선물과 함께 남기기' : '남기기'}</button>
      </div>`}
    </section>
    <section class="sec">
      ${secH('방명록', guest.length + '개')}
      ${guest.length ? `<div class="box px">${guest.map(([id, g]) => guestRow(id, g, false)).join('')}</div>` : '<div class="hint">첫 번째 손님이 되어 주세요!</div>'}
    </section>`, { tint: H.col });
  $('#back').onclick = leaveVisit;
  on('[data-gift]', b => { const t = $('#gtext')?.value || ''; giftPick = giftPick === b.dataset.gift ? null : b.dataset.gift; renderVisit(); $('#gtext').value = t; });
  const send = $('#gsend');
  if (send) send.onclick = async () => {
    const text = $('#gtext').value.trim().slice(0, 40);
    if (!text && !giftPick) return toast('한 줄이라도 남겨 주세요.');
    if (giftPick && me.inv[giftPick] < 1) return;
    send.disabled = true;
    const entry = { uid, nick: me.nick, look: me.look, house: me.house, text, at: Date.now() };
    if (giftPick) entry.gift = giftPick;
    try { await F.push(F.ref(db, 'guest/' + visitUid), entry); }
    catch(e){ send.disabled = false; return toast('방명록을 남기지 못했어요: ' + (e.code || e.message)); }
    if (giftPick) me.inv[giftPick]--;
    me.wrote[visitUid] = todayKey(); giftPick = null; save();
    toast('방명록을 남겼어요!'); renderVisit();
  };
}

// ===== 시장 (온라인 전용) =====
let sellPick = null;
function renderMarket(){
  if (solo){
    frame(null, '마법 시장', '친구들과 거래하는 곳', `<div class="hint on px">혼자 해 보기 모드에서는 시장이 열리지 않아요. 로그인하면 12명이 함께 거래할 수 있어요.</div>`);
    return;
  }
  const items = Object.entries(marketList);
  const mine = items.filter(([, l]) => l.uid === uid);
  const others = items.filter(([, l]) => l.uid !== uid && !l.buyer);
  const week = coop[coopWeek()] || {};
  const coopTotal = Object.values(week).reduce((a, b) => a + (+b || 0), 0);
  const sellable = [...POTIONS, ...MATS].filter(k => me.inv[k] > 0);
  frame(null, '마법 시장', `친구 가게 ${new Set(others.map(([, l]) => l.uid)).size}곳 영업 중`, `
    <section class="sec">
      ${secH('친구들이 올린 물건', others.length + '개')}
      ${others.length ? `<div class="box px">${others.map(([id, l]) => `<div class="li">${ic(l.item)}
        <div class="main"><span class="t">${ITEM[l.item]}${l.qty > 1 ? ' ×' + l.qty : ''}${l.moon ? ' <span class="tag" style="background:#3A2E78;color:#FFE58A">달빛</span>' : ''}</span><span class="d">${esc(l.nick)}의 가게</span></div>
        <button class="btn sm go" data-buy="${id}" ${me.coin >= l.price ? '' : 'disabled'}>${ic('coin', 'transform:scale(.7);margin:0 -6px')}${l.price}</button></div>`).join('')}</div>` : '<div class="hint">지금은 올라온 물건이 없어요</div>'}
    </section>
    <section class="sec">
      ${secH('내 가판대', `${mine.length} / 4`)}
      ${mine.length ? `<div class="box px">${mine.map(([id, l]) => `<div class="li">${ic(l.item)}<div class="main"><span class="t">${ITEM[l.item]} · ${l.price}G</span><span class="d">${l.buyer ? esc(l.buyerNick || '친구') + '님이 샀어요!' : '판매 중'}</span></div>
        ${l.buyer ? `<button class="btn sm go" data-collect="${id}">받기</button>` : `<button class="btn sm" data-cancel="${id}">내리기</button>`}</div>`).join('')}</div>` : ''}
      ${mine.length < 4 ? `<div class="box px" style="padding:10px;display:flex;flex-direction:column;gap:8px">
        <span class="s sub">팔 물건을 고르고 가격을 정해요</span>
        <div class="pal">${sellable.map(k => `<button class="cell ${sellPick === k ? 'sel' : ''}" style="width:48px;min-height:48px;padding:0" data-pick="${k}">${ic(k)}<span class="n">${me.inv[k]}</span></button>`).join('') || '<span class="s sub">팔 수 있는 물건이 없어요</span>'}</div>
        ${sellPick ? `<div style="display:flex;gap:6px;align-items:center"><span class="s" style="flex:1">${ITEM[sellPick]} 1개</span><input id="price" type="number" min="1" max="9999" value="${PAY[sellPick] || 20}" style="width:84px;height:36px;border:2px solid var(--ink);padding:0 6px;background:#fff"><span class="s">G</span><button class="btn sm go" id="list">올리기</button></div>` : ''}
      </div>` : ''}
    </section>
    <section class="sec">
      <div class="px" style="background:var(--ink2);color:#fff;padding:12px;display:flex;flex-direction:column;gap:10px">
        <div class="sec-h"><h3 style="color:var(--gold)">반 공동 의뢰</h3><span class="meta" style="color:#B8A8E8">반짝 물약 50병</span></div>
        <div style="height:12px;background:#3A2E68"><div style="width:${Math.min(100, coopTotal * 2)}%;height:100%;background:var(--gold)"></div></div>
        <div class="s" style="display:flex;justify-content:space-between;color:#B8A8E8"><span>${coopTotal} / 50 · ${Object.keys(week).length}명 참여</span><span>내가 낸 것 ${week[uid] || 0}</span></div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px">${HOUSE_KEYS.map(k => { const n = Object.entries(week).filter(([id]) => playersList[id]?.house === k).reduce((t, [, v]) => t + (+v || 0), 0); return `<div style="background:#2E2458;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;border-top:3px solid ${HOUSES[k].col}"><span class="s" style="color:${HOUSES[k].col}">${HOUSES[k].name}</span><span class="s" style="color:var(--gold);letter-spacing:-1px">${'★'.repeat(Math.min(5, Math.floor(n / 2))) || '·'}</span><span class="s" style="color:#B8A8E8">${n}병</span></div>`; }).join('')}</div>
        <span class="s" style="color:#B8A8E8">2병마다 기숙사 별자리에 별이 하나씩 떠요</span>
        <button class="btn sm go" id="donate" ${me.inv.p_purple > 0 ? '' : 'disabled'}>반짝 물약 1병 내기</button>
      </div>
    </section>`);
  on('[data-pick]', b => { sellPick = b.dataset.pick; renderMarket(); });
  const lb = $('#list');
  if (lb) lb.onclick = async () => {
    const price = Math.max(1, Math.min(9999, Math.floor(+$('#price').value || 0)));
    if (me.inv[sellPick] < 1) return;
    me.inv[sellPick]--; save();
    await F.push(F.ref(db, 'market'), { uid, nick: me.nick, look: me.look, item: sellPick, qty: 1, price, at: Date.now(), ...(me.house === 'moon' && myTime() ? { moon: true } : {}) });
    toast(`${ITEM[sellPick]}을(를) ${price}G에 올렸어요.`); sellPick = null;
  };
  on('[data-cancel]', async b => {
    const l = marketList[b.dataset.cancel]; if (!l || l.buyer) return;
    await F.remove(F.ref(db, 'market/' + b.dataset.cancel));
    me.inv[l.item] += l.qty; save(); toast('가판대에서 내렸어요.');
  });
  on('[data-collect]', async b => {
    const l = marketList[b.dataset.collect]; if (!l || !l.buyer) return;
    await F.remove(F.ref(db, 'market/' + b.dataset.collect));

  });
  on('[data-buy]', async b => {
    const id = b.dataset.buy, l = marketList[id];
    if (!l || me.coin < l.price) return;
    const res = await F.runTransaction(F.ref(db, 'market/' + id), cur => {
      if (!cur || cur.buyer) return;
      return { ...cur, buyer: uid, buyerNick: me.nick };
    });
    if (!res.committed) return toast('한발 늦었어요. 다른 친구가 먼저 샀어요.');
    me.coin -= l.price; me.inv[l.item] += l.qty; save();
    toast(`${ITEM[l.item]}을(를) 샀어요! -${l.price}G`);
  });
  $('#donate').onclick = async () => {
    if (me.inv.p_purple < 1) return;
    me.inv.p_purple--; save();
    await F.set(F.ref(db, `coop/${coopWeek()}/${uid}`), (week[uid] || 0) + 1);
    toast('반짝 물약을 냈어요. 고마워요!');
  };
}

const ID_RE = /^[a-zA-Z][a-zA-Z0-9_]{2,15}$/;
const idEmail = id => `${id.toLowerCase()}@magionacademy.app`;
const pwPad = pw => pw + '·magion';
const AUTH_MSG = {
  'auth/operation-not-allowed': 'Firebase 콘솔 > Authentication > 로그인 방법에서 "이메일/비밀번호"를 켜 주세요.',
  'auth/email-already-in-use': '이미 있는 아이디예요. 로그인하거나 다른 아이디를 골라 주세요.',
  'auth/invalid-credential': '아이디 또는 비밀번호가 맞지 않아요.', 'auth/wrong-password': '비밀번호가 맞지 않아요.', 'auth/user-not-found': '없는 아이디예요.',
  'auth/too-many-requests': '너무 여러 번 시도했어요. 잠시 뒤 다시 해 주세요.', 'auth/network-request-failed': '인터넷 연결을 확인해 주세요.',
};
const configured = !!(firebaseConfig.apiKey && firebaseConfig.databaseURL);
function cover(inner){ app.innerHTML = `<div class="cover"><div style="text-align:center;display:flex;flex-direction:column;gap:6px;margin:10px 0"><span class="b" style="font-size:33px;line-height:36px">별빛 아카데미</span><span class="s" style="color:#C8B8FF">마법학교 학생 생활 타이쿤</span></div>${inner}</div>`; }
function showLogin(mode = 'login'){
  const signup = mode === 'signup';
  let saved = ''; try { saved = localStorage.getItem('magion-id') || ''; } catch(e){}
  cover(`<div class="card px">
    ${configured ? `<div style="display:flex;gap:6px"><button class="btn sm" style="flex:1;${signup ? '' : 'background:var(--gold)'}" id="mLogin">로그인</button><button class="btn sm" style="flex:1;${signup ? 'background:var(--gold)' : ''}" id="mSignup">가입하기</button></div>

      <p class="err" id="err"></p>
      <button class="btn go" type="submit" id="lgo">${signup ? '가입하고 입학하기' : '등교하기'}</button>
    </form>` : `<span class="s">아직 Firebase가 연결되지 않았어요. public/firebase-config.js에 설정을 넣으면 친구들과 함께할 수 있어요.</span>`}
    <button class="btn" id="soloGo" type="button">혼자 해 보기 (이 기기에만 저장)</button>

  $('#mLogin').onclick = () => showLogin('login');

  $('#lf').onsubmit = async e => {

    if (!ID_RE.test(id)) return err.textContent = '아이디는 영어로 시작하고, 영어·숫자·_ 3~16 자여야 해요.';
    if (pw.length < 5) return err.textContent = '비밀번호는 5 자 이상이어야 해요.';
    if (signup && pw !== $('#lpw2').value) return err.textContent = '비밀번호 확인이 달라요.';

    } catch(ex){

}
// 기숙사 고르기 카드 (입학 원서와, 기숙사가 없는 예전 학생 둘 다 써요)

function showCreate(done, counts = {}){

      <span class="s">${esc(me.nick)}, 새 학기부터 기숙사가 4개로 나뉘었어요. 들어갈 곳을 골라 주세요.</span>

function startSolo(){

  showCreate(p => { me = p; save(); render(); });
}
async function boot(){
  if (!configured) return showLogin();
  cover('<div class="card px"><span class="s">학교로 가는 중...</span></div>');
  const [A, Au, D] = await Promise.all([import(FB + 'firebase-app.js'), import(FB + 'firebase-auth.js'), import(FB + 'firebase-database.js')]);
  F = { ...A, ...Au, ...D };
  const fapp = F.initializeApp(firebaseConfig);
  auth = F.getAuth(fapp); db = F.getDatabase(fapp);
  F.onAuthStateChanged(auth, async user => {
    if (!user) { uid = null; return showLogin(); }
    uid = user.uid;
    const snap = await F.get(F.ref(db, 'players/' + uid));
    const enter = () => {
      const oref = F.ref(db, 'online/' + uid);
      F.set(oref, { nick: me.nick, look: me.look, house: me.house, at: Date.now() });
      F.onDisconnect(oref).remove();
      F.onValue(F.ref(db, 'online'), s => { onlineList = s.val() || {}; if (tab === 'home' && !sub) render(); });
      F.onValue(F.ref(db, 'market'), s => { marketList = s.val() || {}; if (tab === 'market') render(); });
      F.onValue(F.ref(db, 'coop'), s => { coop = s.val() || {}; if (tab === 'market') render(); });
      F.onValue(F.ref(db, 'players'), s => { playersList = s.val() || {}; if (tab === 'home' && !sub) render(); });
      F.onValue(F.query(F.ref(db, 'guest/' + uid), F.limitToLast(20)), s => { myGuest = s.val() || {}; if (sub === 'dorm') render(); });
      render();
    };
    if (snap.exists()) { me = snap.val(); if (!me.house) showHousePick(await houseCounts(), enter); else enter(); }
    else showCreate(p => { me = p; save(); enter(); }, await houseCounts());
  });
}
boot();
</script>
</body>
</html>
