<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140D1E">
<title>호박달 마녀학교</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
@font-face{font-family:'G11B';src:url(fonts/Galmuri11-Bold.woff2) format('woff2');font-display:swap}
@font-face{font-family:'G9';src:url(fonts/Galmuri9.woff2) format('woff2');font-display:swap}
@font-face{font-family:'G7';src:url(fonts/Galmuri7.woff2) format('woff2');font-display:swap}
:root{--ink:#3A2860;--ink2:#22183F;--paper:#FAF1E2;--card:#FFFCF6;--sub:#9480B4;--line:#E8DCF0;--soft:#F3EAFB;--gold:#FFD866;--gold2:#D9A020;--mint:#8CE6B0;--mint2:#3FAF74;--pink:#FF8FAF;--bad:#C2385E}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1A1234;-webkit-font-smoothing:none;-webkit-tap-highlight-color:transparent}
body{font-family:'G9',monospace;font-size:16px;line-height:20px;color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;margin:0}
button:disabled{opacity:.4;cursor:default}
input{font-family:'G9',monospace;font-size:16px;color:var(--ink)}
#shell{position:relative;max-width:430px;height:100dvh;margin:0 auto;overflow:hidden;background:#140D1E}
#app{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;z-index:10}
/* 세계에 들어가면 게임 화면은 아래에서 올라오는 시트가 돼요 */
body.inworld #app{top:auto;height:80%;transform:translateY(105%);transition:transform .22s;box-shadow:0 0 0 4px var(--ink2)}
body.inworld #app.open{transform:none}
body:not(.inworld) .fab,body:not(.inworld) .hud{display:none}
.shead{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:10px 10px 10px 12px;background:var(--ink2)}
.shead .title{flex:1;max-width:none;padding:0;background:none}
.shead .stats{flex-direction:row;gap:4px}
.shead .stat{min-width:0;height:28px;background:rgba(255,255,255,.08)}
.sx{width:36px;height:36px;flex-shrink:0;border:0;background:var(--ink);color:var(--gold);font-family:'G11B',monospace;font-size:16px}
.shead + .scene{aspect-ratio:390/220}
.panel .ribbon{position:static;align-self:flex-start;flex-shrink:0}
/* 걸어 다니는 세계 */
#world{position:absolute;inset:0;overflow:hidden;touch-action:manipulation;font-family:'G7',monospace;color:#F2EAD8}
#world canvas{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
.hud{position:absolute;left:10px;top:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:3}
.hudr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.chip{background:rgba(20,13,30,.85);color:#F2EAD8;padding:6px 10px;font-family:'G7',monospace;font-size:14px;line-height:16px;box-shadow:0 0 0 2px #3A2860;white-space:nowrap}
.chip b{font-family:'G11B',monospace;font-size:15px;color:#FFD866;display:block}
.chip.ev{pointer-events:auto;border:0;background:#FFD866;color:#3A2860;font-family:'G11B',monospace;box-shadow:0 0 0 2px #22183F}
.ntag{position:absolute;transform:translate(-50%,-100%);font-size:12px;line-height:12px;padding:2px 4px;background:rgba(20,13,30,.75);white-space:nowrap;pointer-events:none;z-index:2}
.ntag.me{color:#FFD866}
.bubble{position:absolute;transform:translate(-50%,-100%);background:#FAF1E2;color:#3A2860;padding:8px 10px;font-size:14px;line-height:18px;box-shadow:0 0 0 3px #22183F;white-space:nowrap;text-align:center;z-index:4}
.bubble button{display:block;margin:6px auto 0;font-family:'G11B',monospace;font-size:14px;background:#8CE6B0;border:2px solid #22183F;padding:4px 10px;color:#1E3A2A}
#fade{position:absolute;inset:0;background:#0E0916;opacity:0;pointer-events:none;transition:opacity .35s;z-index:5;display:flex;align-items:center;justify-content:center;font-family:'G11B',monospace;font-size:18px;color:#FFD866}
.fab{position:absolute;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;z-index:6}
.fab button{width:58px;height:44px;background:rgba(20,13,30,.88);border:0;box-shadow:0 0 0 2px #3A2860;color:#FFD866;font-family:'G11B',monospace;font-size:14px}
.fab button.main{height:58px;background:#FFD866;color:#3A2860;box-shadow:0 0 0 2px #22183F}
#mapv{position:absolute;inset:0;background:rgba(14,9,22,.94);z-index:8;display:none;flex-direction:column;padding:14px 12px calc(14px + env(safe-area-inset-bottom));font-family:'G7',monospace;color:#F2EAD8}
#mapv.on{display:flex}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.mhead b{font-family:'G11B',monospace;font-size:17px;color:#FFD866}
.mhead button{background:#3A2860;border:0;color:#F2EAD8;font-family:'G11B',monospace;font-size:14px;padding:6px 12px}
#mwrap{flex:1;position:relative;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
#minner{position:relative;margin:auto}
#mcv{image-rendering:pixelated;flex-shrink:0}
.mlabel{position:absolute;transform:translate(-50%,-100%);font-size:12px;line-height:12px;padding:3px 5px;background:#FAF1E2;color:#3A2860;white-space:nowrap;pointer-events:none;box-shadow:0 0 0 2px #22183F}
.mlabel.me{background:#FFD866}
.mhint{text-align:center;font-size:14px;color:#C8B8FF;margin-top:8px}
.px{clip-path:polygon(0 3px,3px 3px,3px 0,calc(100% - 3px) 0,calc(100% - 3px) 3px,100% 3px,100% calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,3px calc(100% - 3px),0 calc(100% - 3px))}
.ic{display:inline-block;width:32px;height:32px;flex-shrink:0;background:url(art/icons.png?v=3) no-repeat;image-rendering:pixelated;vertical-align:middle}
.fc{width:60px;height:66px;flex-shrink:0;background:url(art/faces.png) no-repeat;image-rendering:pixelated}
.cr{width:120px;height:102px;background:url(art/creatures.png?v=11) no-repeat;image-rendering:pixelated}
.b{font-family:'G11B',monospace}.s{font-family:'G7',monospace;font-size:14px;line-height:18px}.sub{color:var(--sub)}

/* 장면과 상단 바 */
.scene{position:relative;flex-shrink:0;width:100%;aspect-ratio:390/330;overflow:hidden;background:#3A2E78}
.scene.flat{aspect-ratio:auto;height:96px;background:url(art/tile.png) repeat;background-size:64px 64px;image-rendering:pixelated}
.scene img{position:absolute;left:0;bottom:0;width:100%;image-rendering:pixelated}
.top{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;z-index:2}
.title{background:rgba(34,24,63,.88);color:#fff;padding:7px 10px 6px;display:flex;flex-direction:column;gap:3px;min-width:0;max-width:62%}
.title .b{font-size:16px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title .s{color:var(--gold);line-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.stat{background:rgba(34,24,63,.88);color:#fff;height:30px;padding:0 10px 0 0;display:flex;align-items:center;font-family:'G11B',monospace;font-size:14px;min-width:84px;justify-content:space-between}
.stat .ic{transform:scale(.85)}
.ribbon{position:absolute;left:10px;bottom:10px;z-index:2;display:flex;align-items:center;gap:4px;padding:0 10px 0 2px;height:34px;color:#fff;font-family:'G7',monospace;font-size:14px}
.ribbon .ic{transform:scale(.8)}

/* 본문 */
.panel{flex:1;overflow-y:auto;border-top:4px solid var(--ink2);padding:16px 16px 24px;display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:24px}
.sec-h h3{margin:0;font-family:'G11B',monospace;font-size:16px;line-height:18px;font-weight:normal}
.sec-h .meta{font-family:'G7',monospace;font-size:14px;color:var(--sub)}
.box{background:var(--card);border:3px solid var(--ink)}
.li{display:flex;align-items:center;gap:10px;padding:8px 10px;min-height:52px}
.li + .li{border-top:2px dashed var(--line)}
.li .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .d{font-family:'G7',monospace;font-size:14px;line-height:16px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li.done{opacity:.5}
.hint{font-family:'G7',monospace;font-size:14px;line-height:18px;color:var(--sub);text-align:center;padding:0 8px;min-height:18px}
.hint.on{color:var(--ink);background:var(--soft);padding:8px 10px;text-align:left}
.tag{font-family:'G7',monospace;font-size:14px;line-height:14px;padding:3px 6px;background:var(--soft);color:var(--ink);white-space:nowrap}

/* 버튼 */
.btn{min-height:46px;border:3px solid var(--ink);background:#fff;box-shadow:inset 0 -4px 0 var(--line);font-family:'G11B',monospace;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;white-space:nowrap}
.btn:active:not(:disabled){box-shadow:none;transform:translateY(2px)}
.btn.go{background:var(--mint);box-shadow:inset 0 -4px 0 var(--mint2);color:#1E3A2A}
.btn.gold{background:var(--gold);box-shadow:inset 0 -4px 0 var(--gold2)}
.btn.dark{background:var(--ink);color:var(--gold);border-color:var(--ink2);box-shadow:inset 0 -4px 0 var(--ink2)}
.btn.sm{min-height:34px;border-width:2px;font-size:14px;box-shadow:inset 0 -3px 0 var(--line);padding:0 10px}
.btn.sm.go{box-shadow:inset 0 -3px 0 var(--mint2)}
.btn.ghost{min-height:30px;border:0;box-shadow:none;background:transparent;color:var(--sub);font-family:'G7',monospace;font-size:14px;padding:0 4px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--card);border:3px solid var(--ink);box-shadow:inset 0 -4px 0 var(--line);text-align:left;min-height:60px}
.tile .main{display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .main .b{font-size:15px;line-height:16px}
.seg{display:grid;gap:0;border:3px solid var(--ink);background:var(--ink)}
.seg button{border:0;background:var(--card);min-height:38px;font-family:'G11B',monospace;font-size:14px;color:var(--sub)}
.seg button + button{border-left:3px solid var(--ink)}
.seg button.on{background:var(--gold);color:var(--ink)}

/* 칸 */
.grid{display:grid;gap:6px}
.cell{border:2px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;position:relative;min-height:64px}
button.cell:not(:disabled){border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--line)}
.cell.sel{border:3px solid #6A4AC8;background:#fff;box-shadow:none}
.cell .n{position:absolute;right:4px;top:2px;font-family:'G11B',monospace;font-size:13px;line-height:13px;color:#6A4AC8}
.cell .s{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.slot{border:3px dashed #CDBDE8;background:var(--soft);min-height:76px}
.slot.on{border-style:solid;border-color:#6A4AC8;background:#fff}
.bar{display:grid;gap:2px;background:var(--ink);padding:2px;flex:1}
.bar i{display:block;height:8px;background:#fff}
.meter{display:flex;align-items:center;gap:8px}
.meter .s{width:44px;flex-shrink:0}
.face{overflow:hidden;background:#E8DDF8;display:flex;justify-content:center;flex-shrink:0;position:relative}
.dot{position:absolute;right:1px;bottom:1px;width:8px;height:8px;border:2px solid #fff}
.pal{display:flex;gap:6px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:6px;height:34px;padding:0 8px 0 0;border:2px solid var(--line);background:#fff;font-family:'G7',monospace;font-size:14px}
button.who:not(:disabled){border-color:var(--ink)}

/* 행사 */
.dragon{transform:translate(-50%,-50%) scale(2.2);animation:stomp .6s steps(2) infinite}
.dragon.calm-d{animation:bob 1.6s steps(2) infinite;filter:saturate(1.2)}
@keyframes stomp{50%{transform:translate(-50%,-52%) scale(2.25) rotate(-3deg)}}
@keyframes bob{50%{transform:translate(-50%,-54%) scale(2.2)}}
.calm{position:absolute;left:62%;top:20%;font-family:'G11B',monospace;font-size:32px;color:#FF8FAF;animation:bob2 1.2s steps(2) infinite}
@keyframes bob2{50%{translate:0 -8px}}

/* 탭 */
.avwrap{display:flex;flex-direction:column;gap:12px}
.avstage{position:relative;height:236px;background:radial-gradient(circle at 50% 70%,#4A3A7A,#22183F);display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px}
.avstage canvas{width:138px;height:210px;image-rendering:pixelated}
.avstage .btn{position:absolute;right:8px;top:8px}
.avopts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.avo{border:2px solid var(--line);background:#F3EAFB;padding:4px 2px 2px;display:flex;flex-direction:column;align-items:center;gap:0;min-height:72px}
.avo img{width:44px;height:44px;image-rendering:pixelated;object-fit:contain;object-position:center bottom}
.avo .s{font-size:12px;line-height:14px;white-space:nowrap}
.avo.on{border:3px solid #6A4AC8;background:#fff}
.sw{width:30px;height:30px;border:2px solid var(--ink);padding:0}
.sw.on{box-shadow:0 0 0 3px #fff,0 0 0 5px #6A4AC8}
.tabs{flex-shrink:0;height:70px;background:var(--ink2);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-family:'G7',monospace;font-size:14px;color:#9C8CC8;position:relative}
.tabs button .ic{opacity:.55}
.tabs button.on{color:var(--gold)}
.tabs button.on .ic{opacity:1}
.tabs button.on::before{content:'';position:absolute;top:0;left:22%;right:22%;height:4px;background:var(--gold)}

/* 로그인·시작 */
.cover{flex:1;overflow-y:auto;background:url(art/tile.png) repeat;background-size:64px 64px;image-rendering:pixelated;padding:28px 18px;display:flex;flex-direction:column;gap:14px;color:#fff}
.card{background:var(--paper);color:var(--ink);border:4px solid var(--ink2);padding:16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field input{height:44px;border:3px solid var(--ink);background:#fff;padding:0 10px}
.err{color:var(--bad);font-family:'G7',monospace;font-size:14px;min-height:18px;margin:0}
.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink2);color:#fff;padding:9px 14px;font-family:'G7',monospace;font-size:14px;z-index:9;max-width:90%;text-align:center;box-shadow:0 0 0 3px var(--gold)}
</style>
</head>
<body>
<div id="shell">
  <div id="world"><canvas id="cv"></canvas>
    <div class="hud"><div class="chip"><b id="place">호박달 마녀학교</b><span id="sub">바닥을 눌러 걸어요</span></div>
      <div class="hudr"><div class="chip" id="clock"></div><div class="chip" id="wallet"></div><button class="chip ev" id="evChip" hidden></button></div></div>
    <div id="fade"></div>
  </div>
  <div class="fab"><button id="tToday" class="main">오늘</button><button id="tMap">지도</button><button id="tZoom">멀리</button><button id="tDay">밝게</button></div>
  <div id="mapv"><div class="mhead"><b>호박달 마녀학교 · 몬스터 마을 지도</b><button id="mClose">닫기</button></div><div id="mwrap"><div id="minner"><canvas id="mcv"></canvas></div></div><div class="mhint">가고 싶은 곳을 누르면 걸어가요</div></div>
  <div id="app"></div>
</div>
<script src="world.js"></script>
<script type="module">
import { firebaseConfig } from './firebase-config.js';
const FB = 'https://www.gstatic.com/firebasejs/10.12.2/';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app');

// ===== 데이터 =====
const ICONS = ['coin','mana','p_red','p_blue','p_green','p_purple','herb','mush','wool','uhair','scale','egg','heart','book','cauldron','clock','bag','owl','star','drop','seed','sprout','can','candle','bed','rune',
  'p_grow','p_vigor','p_fluff','p_dragon','p_dawn','p_sun','p_dusk','p_moon','mist','sun','pollen','stardust','whisker','slime','honey','silk','feather','milk','hegg'];
const ic = (k, extra='') => { const P = POTION_INFO[k], G = !ICONS.includes(k) && typeof SEED_INFO !== 'undefined' && SEED_INFO[k];
  if (G) return `<i class="ic" style="background-image:url(art/plants.png);background-position:${-32 * (G.ic % 10)}px ${-32 * Math.floor(G.ic / 10)}px;${extra}"></i>`;
  return P ? `<i class="ic" style="background-image:url(art/potions.png);background-position:${-32 * (P.ic % 10)}px ${-32 * Math.floor(P.ic / 10)}px;${extra}"></i>`
    : `<i class="ic" style="background-position:${-32 * ICONS.indexOf(k)}px 0;${extra}"></i>`; };
const ITEM = {
  herb:'약초', drop:'달빛 이슬', mush:'보라 버섯', mana:'마력석', wool:'양털', scale:'도마뱀 비늘', uhair:'토끼털', egg:'용 알 껍질',
  whisker:'고양이 수염', slime:'두꺼비 점액', honey:'벌꿀', silk:'거미줄 실', feather:'부엉이 깃털', milk:'염소젖', hegg:'달걀',
};
const SHORT = { herb:'약초', drop:'이슬', mush:'버섯', mana:'마력석', wool:'털', scale:'비늘', uhair:'토끼털', egg:'알 껍질', hegg:'달걀', slime:'점액', milk:'염소젖' };
// 씨앗 60종: 심으면 같은 id의 식물 재료가 나와요. know 지식이 이만큼 있어야 심을 수 있어요, price 씨앗 값 (자라는 시간은 아래 GROW_RANGE)
// 아이콘은 art/plants.png (10×6칸, 이 표의 순서대로). 약초·이슬·버섯·마력석은 원래 아이콘을 써요.
const SEED_LIST = [
  { id:'herb', mat:'약초', seed:'약초', tier:0, know:0, days:3, yield:3, price:0, col:'#E26F36' },
  { id:'drop', mat:'달빛 이슬', seed:'월광초', tier:0, know:0, days:3, yield:3, price:0, col:'#6FE0B6' },
  { id:'mush', mat:'보라 버섯', seed:'보라 버섯', tier:0, know:0, days:3, yield:3, price:0, col:'#BF16CE' },
  { id:'g_dandel', mat:'민들레 솜털', seed:'민들레', tier:0, know:0, days:1, yield:3, price:10, col:'#D1E198' },
  { id:'g_clover', mat:'네잎클로버', seed:'클로버', tier:0, know:0, days:1, yield:3, price:15, col:'#26609B' },
  { id:'g_mint', mat:'박하 잎', seed:'박하', tier:0, know:0, days:1, yield:3, price:15, col:'#E23659' },
  { id:'g_straw', mat:'딸기', seed:'딸기', tier:0, know:0, days:1, yield:3, price:5, col:'#6FE079' },
  { id:'g_carrot', mat:'당근', seed:'당근', tier:0, know:0, days:1, yield:3, price:5, col:'#5B16CE' },
  { id:'g_chamo', mat:'카모마일', seed:'카모마일', tier:0, know:0, days:1, yield:3, price:15, col:'#E1C898' },
  { id:'mana', mat:'마력석', seed:'마력 수정초', tier:1, know:10, days:2, yield:3, price:20, col:'#269B96' },
  { id:'g_lav', mat:'라벤더', seed:'라벤더', tier:1, know:10, days:2, yield:3, price:25, col:'#E236B7' },

// goal 라운드까지 성공하면 지식 +1, 그 뒤로는 한 라운드 성공할 때마다 지식 +1
const CLASS_MAX = 10;
const SUBJECTS = [
  { id:'rune',  name:'문양학',   icon:'rune',  goal:4, desc:'칠판 문양을 보고 순서대로 눌러요', rule:'4개부터 하나씩 늘어나요 · 7개까지 성공하면 지식 +1' },

  { id:'fly',   name:'비행학',   icon:'star',  goal:3, desc:'빗자루를 타고 묘비 사이를 날아요', rule:'화면을 누르면 떠올라요 · 묘비 5개가 한 라운드 · 3라운드 성공하면 지식 +1' },
  { id:'beast', name:'마법생물학', icon:'heart', goal:3, desc:'뒤집힌 동물 카드의 짝을 찾아요', rule:'시간 안에 짝을 다 찾아요 · 3라운드 성공하면 지식 +1' },
];
const SUBJ = Object.fromEntries(SUBJECTS.map(x => [x.id, x]));
const RUNES = ['star','drop','herb','scale'], RUNE_KO = { star:'별', drop:'물', herb:'잎', scale:'불' };
const classLeft = () => me.classDay === me.day ? Math.max(0, CLASS_MAX - (me.classCnt || 0)) : CLASS_MAX;
const knowToNext = () => KNOW_PER_HINT - ((me.know || 0) % KNOW_PER_HINT);
let lesson = null, lessonTimer = 0, lessonIv = 0, flyRaf = 0, flyKey = null;
document.addEventListener('keydown', e => { if (flyKey && sub === 'class') flyKey(e); });
function stopLesson(){ clearTimeout(lessonTimer); clearInterval(lessonIv); cancelAnimationFrame(flyRaf); flyKey = null; }
function endLesson(){ stopLesson(); lesson = null; }
function gainKnow(){
  me.know = (me.know || 0) + 1;
  let msg = `지식 +1 (지식 ${me.know})`;
  if (me.know % KNOW_PER_HINT === 0){
    const next = HINT_ORDER.find(p => !me.hints.includes(p));
    if (next){ me.hints.push(next); msg += ` · 새 레시피: ${HINTS[next]}`; }
    else { me.coin += 30; msg += ' · 모든 레시피를 알아요. 장학금 +30G'; }
  }
  save(); return msg;
}
function startSubject(id){
  if (classLeft() < 1) return;
  if (me.classDay !== me.day){ me.classDay = me.day; me.classCnt = 0; }
  me.classCnt++; save();
  stopLesson();
  lesson = { s: id, round: 1, earned: 0, phase: 'play', msg: '', log: [] };
  nextRound(true);
}
// 라운드 성공: goal 라운드부터 지식 +1
function roundWon(){
  const L = lesson, g = SUBJ[L.s].goal;
  if (L.round >= g){ L.earned++; L.msg = (L.round === g ? `${g}라운드 달성! ` : `${L.round}라운드 성공! `) + gainKnow(); }
  else L.msg = `${L.round}라운드 성공! ${g}라운드까지 ${g - L.round}번 남았어요`;
  L.round++; L.won = true;
}
function lessonOver(why){
  const L = lesson; if (!L || L.phase === 'over') return;
  stopLesson(); L.phase = 'over'; L.why = why; save();
  if (sub === 'class') renderClass();
}
function nextRound(first){
  const L = lesson; if (!L) return;
  L.won = false;
  if (L.s === 'rune'){

}

        <span class="s">${me.hints.includes(dexSel) || me.found.includes(dexSel) ? '레시피 · ' + recipeText(dexSel) : '수업을 듣거나, 재료를 섞어 보며 찾아봐요.'}</span>
        ${sel.use ? `<span class="s sub">마시면 · ${sel.use}</span>` : sel.desc ? `<span class="s sub">${sel.desc}</span>` : ''}
        ${sel.use ? `<button class="btn sm go" id="drink" ${me.inv[dexSel] ? '' : 'disabled'}>마시기 (${me.inv[dexSel]}병)</button>` : ''}
      </div>` : '<div class="hint">물약을 누르면 레시피와 쓰임새를 볼 수 있어요</div>'}
    </section>`);
  on('[data-add]', b => { slots.push(b.dataset.add); brewMsg = null; renderLab(); });
  on('[data-take]', b => { slots.splice(+b.dataset.take, 1); renderLab(); });
  on('[data-dex]', b => { dexSel = dexSel === b.dataset.dex ? null : b.dataset.dex; renderLab(); });
  $('#matAll').onclick = () => { matAll = !matAll; renderLab(); };
  on('[data-dexpage]', b => { dexPage = +b.dataset.dexpage; dexSel = null; renderLab(); });
  const dk = $('#drink'); if (dk) dk.onclick = () => { brewMsg = usePotion(dexSel); renderLab(); };
  $('#brew').onclick = () => {
    const key = slots.slice().sort().join(',');
    const p = RECIPES[key], T = p && POTION_INFO[p].time;
    if (T && houseNow() !== T){
      brewMsg = `솥이 잠잠해요... 이 조합은 ${HOUSES[T].name}의 시간(${hoursText(HOUSES[T])})에만 끓어요. 재료는 그대로 있어요.`;
      return renderLab();
    }
    slots.forEach(k => me.inv[k]--);
    me.mana -= brewCost();
    if (p){
      me.inv[p]++;
      const isNew = !me.found.includes(p);
      if (isNew) me.found.push(p);
      if (!me.hints.includes(p)) me.hints.push(p);
      brewMsg = `${ITEM[p]} 완성!${isNew ? ' 도감에 새로 적었어요.' : ''}`;
      dexSel = p; dexPage = Math.floor(POTIONS.indexOf(p) / DEX_PAGE);
    } else if (me.house === 'ember' && myTime()){
      const back = slots[Math.floor(Math.random() * 3)]; me.inv[back]++;
      brewMsg = `보라색 연기만 피어올랐어요... 그래도 Emberkiln의 낮이라 ${ITEM[back]}을(를) 건졌어요.`;
    } else brewMsg = '보라색 연기만 피어올랐어요... 재료는 사라졌어요.';
    slots = []; save(); renderLab();
  };
}

// ===== 온실 =====
// 화단 칸: k 심은 씨앗(없으면 빈 칸), at 심은 시각, w 물 줬는지 (물을 주면 25% 빨리 자라요)
const growMs = p => SEED_INFO[p.k].mins * 6e4 * (p.w ? .75 : 1);
const plotLeft = p => p.k ? Math.max(0, p.at + growMs(p) - Date.now()) : 0;
const plotReady = p => !!p.k && plotLeft(p) <= 0;
const plotFrac = p => p.k ? Math.min(1, 1 - plotLeft(p) / growMs(p)) : 0;
const timeText = ms => { const m = Math.ceil(ms / 6e4); return ms < 6e4 ? `${Math.ceil(ms / 1000)}초` : m < 60 ? `${m}분` : `${Math.floor(m / 60)}시간${m % 60 ? ` ${m % 60}분` : ''}`; };
const PLOT_MAX = 9, PLOT_PRICE = 300;
let seedPick = 'herb', greenMsg = '', seedTier = 0;
function renderGreen(){
  const ready = me.plots.filter(plotReady).length, know = me.know || 0;
  const tierKnow = SEED_TIERS[seedTier], list = SEED_LIST.filter(x => x.know === tierKnow);
  const P = SEED_INFO[seedPick] || SEED_INFO.herb;
  frame('green', '독초 온실', ready ? `수확할 칸 ${ready}개` : `심을 수 있는 씨앗 ${SEED_LIST.filter(x => x.know <= know).length} / ${SEED_LIST.length}종`, `
    <section class="sec">
      ${secH('화단', waterCost() ? '물 주기 마력 1' : '물 주기 무료')}
      <div class="grid" style="grid-template-columns:repeat(3,1fr)">
        ${me.plots.map((p, i) => {
          const G = p.k && SEED_INFO[p.k], rd = plotReady(p);
          const fr = plotFrac(p), icon = !p.k ? 'seed' : rd ? p.k : fr < .34 ? 'seed' : fr < .8 ? 'sprout' : p.k;
          const label = !p.k ? '심기' : rd ? '수확!' : `${timeText(plotLeft(p))} 남음`;
          const bg = rd ? '#E2FBEA' : p.w ? '#E4F1FF' : !p.k ? 'var(--card)' : '#F6EBDB';
          return `<button class="cell" data-plot="${i}" style="min-height:96px;background:${bg};${rd ? 'border-color:var(--mint2)' : ''}">
            ${ic(icon, !p.k ? 'opacity:.3' : !rd && icon === p.k ? 'opacity:.7' : '')}<span class="s">${G ? G.seed : '빈 칸'}</span><span class="s ${rd ? 'b' : 'sub'}" style="${rd ? 'color:var(--mint2)' : ''}" ${p.k && !rd ? `data-left="${i}"` : ''}>${label}</span>
            ${G ? `<div style="width:60px;display:flex">${segs(Math.round(fr * 10), 10, '#7BD88F')}</div>` : ''}${G && !rd && !p.w ? `<span class="s" style="font-size:11px;line-height:11px;color:#5A8AB0">물 주면 빨리 자라요</span>` : ''}</button>`;
        }).join('')}
      </div>
      ${me.plots.length < PLOT_MAX ? `<button class="btn ghost" id="morePlot" style="align-self:center">화단 한 칸 늘리기 · ${PLOT_PRICE}G (${me.plots.length} / ${PLOT_MAX})</button>` : ''}
      ${hint(greenMsg, '씨앗을 고르고 빈 칸을 눌러 심어요. 시간이 지나면 자라요 · 물을 주면 25% 빨리 자라요.')}
    </section>
    <section class="sec">
      ${secH('씨앗 고르기', `지식 ${know}`)}
      <div class="seg px" style="grid-template-columns:repeat(${SEED_TIERS.length},1fr)">${SEED_TIERS.map((k, i) => `<button class="${seedTier === i ? 'on' : ''}" data-stier="${i}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:13px;min-height:42px;${know < k ? 'opacity:.55' : ''}">${i + 1}단계<span class="s" style="font-size:11px">${k ? '지식' + k : '기본'}</span></button>`).join('')}</div>
      <div class="grid" style="grid-template-columns:repeat(4,1fr)">${list.map(x => { const lock = know < x.know; return `<button class="cell ${seedPick === x.id ? 'sel' : ''}" data-seed="${x.id}" ${lock ? 'disabled' : ''}>${ic(x.id, lock ? 'filter:grayscale(1);opacity:.4' : '')}<span class="s">${x.seed}</span><span class="s ${x.price ? '' : 'sub'}" style="${x.price ? 'color:var(--gold2)' : ''}">${lock ? '🔒' : x.price ? x.price + 'G' : '무료'}</span>${me.inv[x.id] ? `<span class="n">${me.inv[x.id]}</span>` : ''}</button>`; }).join('')}</div>
      <div class="box px" style="padding:10px 12px;display:flex;align-items:center;gap:10px">${ic(P.id)}
        <div style="flex:1;display:flex;flex-direction:column;gap:2px"><span class="b" style="font-size:15px">${P.seed} 씨앗</span><span class="s sub">${timeText(P.mins * 6e4)} 자라서 「${P.mat}」 ${P.yield}개 · 씨앗 값 ${P.price ? P.price + 'G' : '무료'}</span></div>
      </div>
    </section>`);
  on('[data-stier]', b => { seedTier = +b.dataset.stier; renderGreen(); });
  on('[data-seed]', b => { seedPick = b.dataset.seed; greenMsg = ''; renderGreen(); });
  const mp = $('#morePlot'); if (mp) mp.onclick = () => {
    if (me.coin < PLOT_PRICE){ greenMsg = '골드가 부족해요.'; return renderGreen(); }
    me.coin -= PLOT_PRICE; me.plots.push({ k: null }); greenMsg = '화단이 한 칸 늘었어요!'; save(); renderGreen();
  };
  on('[data-plot]', b => {
    const p = me.plots[+b.dataset.plot], G = SEED_INFO[seedPick];
    if (!p.k){
      if ((me.know || 0) < G.know) greenMsg = `지식 ${G.know}부터 심을 수 있어요.`;
      else if (me.coin < G.price) greenMsg = `씨앗 값 ${G.price}G가 부족해요.`;
      else { me.coin -= G.price; Object.assign(p, { k: seedPick, at: Date.now(), w: false }); greenMsg = `${G.seed} 씨앗을 심었어요. ${timeText(G.mins * 6e4)} 뒤에 수확해요.${G.price ? ` -${G.price}G` : ''}`; }
    }
    else if (plotReady(p)){ const g = SEED_INFO[p.k], n = g.yield + (me.house === 'dew' && myTime() ? 1 : 0); me.inv[p.k] += n; me.plots[me.plots.indexOf(p)] = { k: null }; greenMsg = `${g.seed} 수확! ${g.mat} +${n}${n > g.yield ? ' (Dewmorn의 새벽 보너스)' : ''}`; }
    else if (p.w) greenMsg = `이미 물을 줬어요. ${timeText(plotLeft(p))} 남았어요.`;
    else if (me.mana < waterCost()) greenMsg = '마력이 부족해요. 기숙사에서 자고 오세요.';
    else { p.w = true; me.mana -= waterCost(); greenMsg = `물을 줬어요. 쑥쑥! ${timeText(plotLeft(p))} 남았어요.`; }
    save(); renderGreen();
  });
  clearInterval(greenTick);
  greenTick = setInterval(() => {
    if (!sheetOn || tab !== 'green' || sub) return clearInterval(greenTick);
    if (me.plots.some((p, i) => p.k && plotReady(p) && app.querySelector(`[data-left="${i}"]`))){ const pn = app.querySelector('.panel'), y = pn?.scrollTop; renderGreen(); if (pn) app.querySelector('.panel').scrollTop = y; return; }
    app.querySelectorAll('[data-left]').forEach(el => { el.textContent = `${timeText(plotLeft(me.plots[+el.dataset.left]))} 남음`; });
  }, 1000);
}
let greenTick = 0;

// ===== 사육장 =====
// ===== 내 사육장 (사육장 건물의 내 우리) =====
let crSel = 0, ranchMsg = '', ranchTab = 'pen', partner = null, placing = null, ranchTick = 0;
const cdText = ms => ms <= 0 ? '지금' : timeText(ms);
function hatchToPen(i){
  const e = me.eggs[i]; if (!e || eggLeft(e) > 0) return;
  if (me.cr.length >= PEN_MAX){ placing = i; ranchMsg = `사육장이 꽉 찼어요 (${PEN_MAX}마리). 입양 보낼 아이를 한 마리 골라 주세요.`; return; }
  const c = newCreature(e.k, e.col); me.cr.push(c); me.eggs.splice(i, 1);
  ranchMsg = `${c.name}(${CREATURES[c.k].baby})이(가) 사육장에 들어왔어요!${c.col.rare ? ` 처음 보는 색 「${c.col.n}」이에요!` : ''}`;
  crSel = me.cr.length - 1; ranchTab = 'pen'; placing = null; save();
}
function adoptOut(i){
  const c = me.cr[i], d = CREATURES[c.k];
  me.cr.splice(i, 1); me.inv[d.mat] = (me.inv[d.mat] || 0) + 1; me.coin += 30;
  if (crSel >= me.cr.length) crSel = Math.max(0, me.cr.length - 1);
  return `${c.name}이(가) 새 가족을 찾아 떠났어요. 고맙다며 ${ITEM[d.mat]} +1 · 30G를 남겼어요.`;
}
function renderRanch(){

  const tabs = `<div class="seg" style="grid-template-columns:repeat(3,1fr)">${[['pen', `사육장 ${me.cr.length}/${PEN_MAX}`], ['hatch', `부화실 ${me.eggs.length}/${HATCH_MAX}${ready ? ' ●' : ''}`], ['shop', '알 가게']].map(([k, l]) => `<button data-rtab="${k}" class="${ranchTab === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;

  } else if (ranchTab === 'pen'){

    </div>
    ${c ? `<section class="sec">
      <div class="box px" style="padding:12px;display:flex;flex-direction:column;gap:8px">

        <div class="meter"><span class="s">애정</span>${segs(c.love, LOVE_MAX, '#FF8FAF')}<span class="s b">${c.love}</span></div>
        <span class="s" style="color:#C2385E">${T.n} · ${T.d}${tier < 4 ? ` <span class="sub">(다음 단계까지 ♥${(tier + 1) * 5 - c.love})</span>` : ''}</span>
        <div class="s sub" style="display:flex;align-items:center;gap:4px">${ic(d.mat, 'transform:scale(.8);margin:-6px')}<span>${!adult ? `어른까지 <b data-cd="${c.bornAt + d.grow * 6e4}">${cdText(c.bornAt + d.grow * 6e4 - now)}</b> · 어른이 되면 「${ITEM[d.mat]}」을 줘요` : !tier ? `애정 5부터 「${ITEM[d.mat]}」을 줘요` : prodLeft(c) > 0 ? `「${ITEM[d.mat]}」 생기기까지 <b data-cd="${c.prodAt + d.prod * 6e4}">${cdText(prodLeft(c))}</b>` : `「${ITEM[d.mat]}」이 생겼어요!`}</span></div>
      </div>
      <div class="grid" style="grid-template-columns:repeat(3,1fr)">
        <button class="btn gold" id="feed" ${fedLeft ? 'disabled' : ''}>${fedLeft ? `<span data-cd="${c.fedAt + FEED_CD}">${cdText(fedLeft)}</span>` : `${d.food} 주기`}</button>
        <button class="btn" id="pat" ${petLeft ? 'disabled' : ''}>${petLeft ? `<span data-cd="${c.petAt + PET_CD}">${cdText(petLeft)}</span>` : '쓰다듬기'}</button>

          <button class="btn sm go" id="breed" style="min-height:40px" ${partner !== null && me.eggs.length < HATCH_MAX && me.mana >= BREED_MANA ? '' : 'disabled'}>${me.eggs.length >= HATCH_MAX ? '부화실이 꽉 찼어요' : '짝꿍 맺고 알 받기'}</button>
          <div class="hint">알은 부화실로 가요 · 엄마·아빠 색을 닮거나, 섞여서 처음 보는 색이 나오기도 해요</div>`}
    </section>
    <button class="btn ghost" id="adopt" style="align-self:center">${esc(c.name)} 입양 보내기</button>` : ''}`;
  } else if (ranchTab === 'hatch'){

        const left = eggLeft(e); return `<div class="cell" style="min-height:120px;gap:4px;background:${CREATURES[e.k].bg}"><div style="height:52px;display:flex;align-items:center;justify-content:center;overflow:visible">${crSprite(e, .55, true)}</div>
          <span class="s">${CREATURES[e.k].kind}의 알</span>${left > 0 ? `<span class="s sub">깨어나기까지 <b data-cd="${e.at + CREATURES[e.k].hatch * 6e4}">${cdText(left)}</b></span>` : `<button class="btn sm go" data-hatch="${i}">깨어났어요! 사육장에 넣기</button>`}</div>`; }).join('')}</div>
      ${hint(ranchMsg, '알은 따뜻한 부화실에서 깨어나요. 깨어나면 사육장에 넣어 주세요.')}</section>`;
  } else {

  const redraw = () => { const pn = app.querySelector('.panel'), y = pn?.scrollTop; renderRanch(); if (pn) app.querySelector('.panel').scrollTop = y; };
  on('[data-rtab]', b => { ranchTab = b.dataset.rtab; ranchMsg = ''; placing = null; redraw(); });
  on('[data-cr]', b => { crSel = +b.dataset.cr; partner = null; ranchMsg = ''; redraw(); });
  on('[data-mate]', b => { partner = +b.dataset.mate; redraw(); });
  on('[data-hatch]', b => { hatchToPen(+b.dataset.hatch); redraw(); });
  on('[data-adopt]', b => {
    const x = me.cr[+b.dataset.adopt]; if (!confirm(`${x.name}을(를) 입양 보낼까요? 돌아오지 않아요.`)) return;
    const msg = adoptOut(+b.dataset.adopt), i = placing; placing = null; hatchToPen(i); ranchMsg = msg + ' ' + ranchMsg; save(); redraw();
  });
  on('[data-buyegg]', b => {
    const k = +b.dataset.buyegg, x = CREATURES[k];
    if (me.coin < x.egg || me.eggs.length >= HATCH_MAX) return;
    me.coin -= x.egg; me.eggs.push({ id: crId(), k, col: randColor(), at: Date.now() }); ranchMsg = `${x.kind}의 알을 샀어요! 부화실에서 ${timeText(x.hatch * 6e4)} 뒤에 깨어나요.`; save(); redraw();
  });
  const ac = $('#adoptCancel'); if (ac) ac.onclick = () => { placing = null; ranchMsg = ''; redraw(); };
  const ad = $('#adopt'); if (ad) ad.onclick = () => { if (!confirm(`${c.name}을(를) 입양 보낼까요? 돌아오지 않아요.`)) return; ranchMsg = adoptOut(crSel); save(); redraw(); };
  const fd = $('#feed'); if (fd) fd.onclick = () => {
    const n = 2 + (me.house === 'dusk' && myTime() ? 1 : 0); c.love = Math.min(LOVE_MAX, c.love + n); c.fedAt = Date.now();
    ranchMsg = `${c.name}이(가) ${d.food}을(를) 맛있게 먹었어요. 애정 +${n}`; save(); redraw();
  };
  const pt = $('#pat'); if (pt) pt.onclick = () => {
    const n = me.house === 'dusk' ? 2 : 1; c.love = Math.min(LOVE_MAX, c.love + n); c.petAt = Date.now();
    ranchMsg = `${c.name}이(가) 기분 좋아해요. 애정 +${n}`; save(); redraw();
  };
  const hv = $('#harvest'); if (hv) hv.onclick = () => {
    const T = LOVE_TIERS[loveTier(c)]; if (!T.mat || prodLeft(c) > 0 || !crAdult(c)) return;
    me.inv[d.mat] = (me.inv[d.mat] || 0) + T.mat; me.coin += T.coin; c.prodAt = Date.now();
    ranchMsg = `「${ITEM[d.mat]}」 ${T.mat}개${T.coin ? ` · ${T.coin}G` : ''}를 받았어요! (${T.n})`; save(); redraw();
  };
  const br = $('#breed'); if (br) br.onclick = () => {
    const m = me.cr[partner]; if (!m || me.eggs.length >= HATCH_MAX || me.mana < BREED_MANA) return;
    me.eggs.push(makeEgg(c, m)); me.mana -= BREED_MANA; c.bredAt = m.bredAt = Date.now();
    ranchMsg = `${c.name} ♥ ${m.name} · 알이 부화실로 갔어요! ${timeText(d.hatch * 6e4)} 뒤에 깨어나요.`; partner = null; save(); redraw();
  };
  // 남은 시간 표시를 1초마다, 무언가 끝나면 다시 그려요
  clearInterval(ranchTick);
  ranchTick = setInterval(() => {
    if (!sheetOn || tab !== 'ranch' || sub) return clearInterval(ranchTick);
    let done = false;
    app.querySelectorAll('[data-cd]').forEach(el => { const left = +el.dataset.cd - Date.now(); if (left <= 0) done = true; else el.textContent = timeText(left); });
    if (done) redraw();
  }, 1000);
}

// ===== 기숙사: 내 방 (가구 놓기) · 휴게실 (기숙사생이 함께 꾸미기) =====
let dormMsg = '', furnCat = '전체';
const myRoomId = () => HOUSE_DORM[me.house].replace('dorm_', 'myroom_');
const inMyRoom = () => World.where() === myRoomId();
function syncRoom(){ World.setFurniture((me.room || []).map(r => ({ id: r.id, k: FIDX[r.f], x: r.x, y: r.y }))); }
// 가구 놓기: 내 방이 아니면 먼저 내 방으로 가요
function placeFurn(fid){
  if (!(me.fbag[fid] > 0)) return;
  const go = () => World.place(FIDX[fid], (x, y) => {
    if (!(me.fbag[fid] > 0)) return;
    me.fbag[fid]--; me.room.push({ id: crId(), f: fid, x, y }); save(); syncRoom();
    toast(`${FURN_BY[fid].name}을(를) 놓았어요! 아늑함 ${cozyOf(me)}`);
  });
  closeSheet();
  if (inMyRoom()) go(); else World.teleport(myRoomId(), 'bed', go);
}
World.onFurn = id => {
  const r = me.room.find(x => x.id === id); if (!r) return null; const F_ = FURN_BY[r.f];
  return { text: `<b>${F_.name}</b><br>아늑함 +${F_.pts}`, btn: '가방에 넣기', fn: () => {
    me.room = me.room.filter(x => x.id !== id); me.fbag[r.f] = (me.fbag[r.f] || 0) + 1; save(); syncRoom(); World.cancelPlace();
    toast(`${F_.name}을(를) 가방에 넣었어요`);
  } };
};
World.onHouseDoor = h => h === me.house ? true : `<b>${HOUSES[h].name} 기숙사</b><br>이 기숙사 학생만 들어갈 수 있어요`;
function renderDorm(){
  const cozy = cozyOf(me), H = HOUSES[me.house];
  const guest = Object.entries(myGuest).sort((a, b) => b[1].at - a[1].at);
  const bag = Object.entries(me.fbag).filter(([, n]) => n > 0);
  const shop = FURN.filter(x => furnCat === '전체' || x.cat === furnCat);
  frame('dorm', `${H.name} ${roomNo(me.house, uid || me.nick)}호`, `아늑함 ${cozy} · 놓은 가구 ${me.room.length}개`, `
    <section class="sec">
      <div class="sec-h"><h3>내 방</h3>${backBtn}</div>
      <div class="meter">${ic('heart', 'transform:scale(.8);margin:-4px')}${segs(Math.min(cozy, COZY_MAX), COZY_MAX, '#FF9DBA')}<span class="s b">${cozy}</span></div>
      ${hint(dormMsg, `가구를 놓을수록 아늑해져요 · 자고 나면 마력이 아늑함 ×2만큼 더 차요 (${COZY_MAX}까지)`)}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        ${inMyRoom() ? '' : `<button class="btn px" id="goRoom">${ic('bed')}내 방으로</button>`}
        <button class="btn dark px" id="sleep" style="${inMyRoom() ? 'grid-column:1/-1' : ''}">${ic('star')}잠자고 내일로</button>
      </div>
    </section>
    <section class="sec">
      ${secH('가구 가방', bag.length ? '눌러서 방에 놓아요' : '')}
      ${bag.length ? `<div class="grid" style="grid-template-columns:repeat(4,1fr)">${bag.map(([fid, n]) => `<button class="cell" data-place="${fid}" style="min-height:84px">${furnPic(fid, 40)}<span class="s">${FURN_BY[fid].name}</span><span class="n">${n}</span></button>`).join('')}</div>`
        : '<div class="hint">가방이 비었어요. 아래 가게에서 사거나, 방에 놓은 가구를 눌러 가방에 넣을 수 있어요.</div>'}
    </section>
    <section class="sec">
      ${secH('가구 가게', `${FURN.length}종`)}
      <div class="seg" style="grid-template-columns:repeat(4,1fr);margin-bottom:8px">${FURN_CATS.map(c => `<button data-fcat="${c}" class="${furnCat === c ? 'on' : ''}">${c}</button>`).join('')}</div>
      <div class="grid" style="grid-template-columns:repeat(3,1fr)">${shop.map(x => `<button class="cell" data-buyf="${x.id}" ${me.coin >= x.price ? '' : 'disabled'} style="min-height:96px">${furnPic(x.id, 44)}<span class="s">${x.name}</span><span class="s b" style="color:var(--gold2)">${x.price}G · ♥${x.pts}</span></button>`).join('')}</div>
    </section>
    ${solo ? '' : `<section class="sec">
      ${secH('내 방명록', '손님 1명당 내일 마력 +3')}
      ${guest.length ? `<div class="box px">${guest.map(([id, g]) => guestRow(id, g, true)).join('')}</div>` : '<div class="hint">아직 다녀간 친구가 없어요. 시장에서 친구 이름을 누르면 그 친구 방에 놀러 갈 수 있어요.</div>'}
    </section>`}`, { tint: H.col });
  on('[data-claim]', async b => {
    const g = myGuest[b.dataset.claim]; if (!g || !g.gift || g.claimed) return;
    await F.update(F.ref(db, `guest/${uid}/${b.dataset.claim}`), { claimed: true });
    me.inv[g.gift] = (me.inv[g.gift] || 0) + 1; save(); toast(`${g.nick}의 선물 ${ITEM[g.gift]}을(를) 받았어요!`);
  });
  const redraw = () => { const pn = app.querySelector('.panel'), y = pn?.scrollTop; renderDorm(); if (pn) app.querySelector('.panel').scrollTop = y; };
  on('[data-fcat]', b => { furnCat = b.dataset.fcat; redraw(); });
  on('[data-buyf]', b => {
    const x = FURN_BY[b.dataset.buyf]; if (me.coin < x.price) return;
    me.coin -= x.price; me.fbag[x.id] = (me.fbag[x.id] || 0) + 1; save();
    dormMsg = `${x.name}을(를) 샀어요! 가구 가방에서 눌러 방에 놓아요.`; redraw();
  });
  on('[data-place]', b => placeFurn(b.dataset.place));
  $('#back').onclick = () => { closeSheet(); };
  $('#sleep').onclick = () => sleep();
  const gr = $('#goRoom'); if (gr) gr.onclick = () => goPlace(myRoomId(), 'bed', 'home', 'dorm');
  if (!solo) on('[data-visit]', b => openVisit(b.dataset.visit));
}
function sleep(){
  const since = me.lastSleepAt || 0;
  const guests = Math.min(3, new Set(Object.values(myGuest).filter(g => g.at > since).map(g => g.uid)).size);
  const cozy = Math.min(COZY_MAX, cozyOf(me)), hall = (commonStage(me.house) - 1) * 2, gain = 20 + cozy * 2 + guests * 3 + hall;
  me.lastSleepAt = Date.now();
  me.day++;
  me.mana = Math.min(50 + cozy * 2 + guests * 3 + hall, me.mana + gain);
  me.orders = makeOrders(me.day, me.hints, me.found);
  endLesson();
  save();
  dormMsg = `푹 잤어요! 봄 학기 ${me.day}일 아침 · 마력 +${gain} (아늑함 +${cozy * 2}${hall ? `, 휴게실 +${hall}` : ''}${guests ? `, 손님 ${guests}명 +${guests * 3}` : ''})`;
  renderDorm();
}

// ---- 휴게실: 같은 기숙사 학생들이 재료를 모아 6단계까지 꾸미고 넓혀요 ----
// 기숙사마다 분위기에 맞는 재료를 모아요 (단계 2~6). coin은 골드
const HALL_COST = {
  ember: [{ herb:10, p_red:3, coin:1000 }, { p_blue:5, p_green:5, coin:2500 }, { p_purple:4, scale:10, coin:5000 }, { p_vigor:5, p_grow:5, coin:8000 }, { p_dragon:2, egg:3, coin:15000 }],
  moon:  [{ mush:10, coin:2000 }, { silk:10, whisker:5, coin:4000 }, { hegg:15, feather:8, coin:7000 }, { p_moon:3, p_dusk:3, coin:11000 }, { egg:3, g_star:5, coin:20000 }],
  dusk:  [{ wool:10, herb:10, coin:800 }, { uhair:10, hegg:10, coin:2000 }, { milk:10, honey:10, coin:4000 }, { whisker:10, feather:10, slime:10, coin:7000 }, { wool:30, honey:20, egg:3, coin:12000 }],
  dew:   [{ herb:15, drop:10, coin:800 }, { g_mint:10, g_clover:10, coin:2000 }, { g_lily:8, g_lotus:8, coin:4000 }, { g_firefly:6, g_snow:6, coin:7000 }, { g_aurora:4, g_moonf:4, egg:2, coin:12000 }],
};
const HALL_NAMES = {
  ember: ['먼지 쌓인 창고', '불 붙은 벽난로', '물약 선반', '수정구와 빗자루', '불타는 가마', '전설의 실험실'],
  moon:  ['낡은 관이 있는 방', '붉은 커튼', '벨벳 살롱', '금화 상자', '달빛 피아노', '밤의 왕좌'],
  dusk:  ['장작 창고', '돌 벽난로', '숲 냄새 나는 방', '반려동물 방석', '큰 달 창문', '전설의 오두막'],
  dew:   ['쇠사슬 소리', '푸른 도깨비불', '첫 화분', '떠다니는 도깨비불', '안개 분수', '전설의 유리 정원'],
};
let halls = {};   // 온라인: houses/{기숙사} = { stage, pool, who: { uid: { nick, n } }, last: [...] }
const hallOf = h => solo ? (h === me.house ? me.common : { stage: 1, pool: {} }) : (halls[h] || { stage: 1, pool: {} });
const commonStage = h => Math.max(1, Math.min(6, hallOf(h).stage || 1));
const hallNeed = h => HALL_COST[h][commonStage(h) - 1] || null;
const hallLeft = (h, k) => { const need = hallNeed(h); return need ? Math.max(0, (need[k] || 0) - (hallOf(h).pool?.[k] || 0)) : 0; };
function syncHalls(){ HOUSE_KEYS.forEach(h => World.setStage(HOUSE_DORM[h], commonStage(h))); }
// 재료 넣기: 넣은 만큼 가방에서 빠지고, 다 모이면 바로 다음 단계가 돼요
async function donate(k, want){
  const h = me.house, have = k === 'coin' ? me.coin : (me.inv[k] || 0), n = Math.min(want, have, hallLeft(h, k));
  if (n <= 0) return;
  let gave = 0, up = 0;
  const apply = cur => {
    cur = cur || { stage: 1, pool: {} }; cur.pool = cur.pool || {}; const st = cur.stage || 1, need = HALL_COST[h][st - 1];
    if (!need) return undefined;
    gave = Math.min(n, Math.max(0, (need[k] || 0) - (cur.pool[k] || 0))); if (gave <= 0) return undefined;
    cur.pool[k] = (cur.pool[k] || 0) + gave;
    cur.who = cur.who || {}; const w = cur.who[uid || 'me'] || { nick: me.nick, n: 0 }; w.nick = me.nick; w.n += k === 'coin' ? Math.ceil(gave / 100) : gave; cur.who[uid || 'me'] = w;
    if (Object.entries(need).every(([kk, v]) => (cur.pool[kk] || 0) >= v)){ cur.stage = st + 1; cur.pool = {}; up = cur.stage; }
    return cur;
  };
  if (solo){ me.common = apply(me.common) || me.common; }
  else {
    const r = await F.runTransaction(F.ref(db, 'houses/' + h), apply).catch(e => { toast('넣지 못했어요: ' + (e.code || e.message)); return null; });
    if (!r || !r.committed) return;
  }
  if (!gave) return;
  if (k === 'coin') me.coin -= gave; else me.inv[k] -= gave;
  save(); syncHalls();
  toast(up ? `휴게실이 ${up}단계 「${HALL_NAMES[h][up - 1]}」가 됐어요!` : `${k === 'coin' ? gave + 'G' : ITEM[k] + ' ' + gave + '개'}를 넣었어요`);
  if (sub === 'common') renderCommon();
}
function renderCommon(){
  const h = me.house, H = HOUSES[h], st = commonStage(h), need = hallNeed(h), hall = hallOf(h);
  const who = Object.values(hall.who || {}).sort((a, b) => b.n - a.n).slice(0, 6);
  const row = (k, v) => {
    const got = hall.pool?.[k] || 0, have = k === 'coin' ? me.coin : (me.inv[k] || 0), left = Math.max(0, v - got), done = left === 0;
    const steps = k === 'coin' ? [[100, '+100G'], [1000, '+1000G']] : [[1, '+1'], [10, '+10']];
    return `<div class="li">${ic(k === 'coin' ? 'coin' : k)}<div class="main"><span class="t">${k === 'coin' ? '골드' : ITEM[k]} <span class="sub">${got.toLocaleString()} / ${v.toLocaleString()}</span></span>
      <div style="height:6px;background:var(--line);margin-top:3px"><div style="height:100%;width:${Math.min(100, got / v * 100)}%;background:${done ? 'var(--mint2,#5CCB8E)' : H.col}"></div></div>
      <span class="d">가진 것 ${have.toLocaleString()}</span></div>
      ${done ? '<span class="tag">다 모았어요</span>' : steps.map(([n, l]) => `<button class="btn sm ${have > 0 ? 'go' : ''}" data-don="${k},${n}" ${have > 0 ? '' : 'disabled'}>${l}</button>`).join('')}</div>`;
  };
  frame('dorm', `${H.name} 휴게실`, `${st}단계 · ${HALL_NAMES[h][st - 1]}`, `
    <section class="sec">
      <div class="sec-h"><h3>함께 꾸미는 휴게실</h3>${backBtn}</div>
      <div class="box px" style="padding:10px 12px;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center">
        ${HALL_NAMES[h].map((nm, i) => `<div style="display:flex;flex-direction:column;align-items:center;gap:2px"><span class="b" style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink2);background:${i < st ? H.col : 'var(--soft)'};color:${i < st ? '#fff' : 'var(--sub)'}">${i + 1}</span><span class="s" style="font-size:11px;line-height:1.2;color:${i === st - 1 ? 'var(--ink)' : 'var(--sub)'}">${nm}</span></div>`).join('')}
      </div>
      ${hint('', `${solo ? '혼자 모드에서는 혼자 모아요' : `${H.name} 학생들이 함께 재료를 모아요`} · 단계마다 방이 넓어지고, 자고 나면 마력 +2씩 더 (지금 +${(st - 1) * 2})`)}
    </section>
    ${need ? `<section class="sec">
      ${secH(`다음: ${st + 1}단계 「${HALL_NAMES[h][st]}」`, '다 모이면 바로 꾸며져요')}
      <div class="box px">${Object.entries(need).map(([k, v]) => row(k, v)).join('')}</div>
    </section>` : `<section class="sec"><div class="hint on px">전설의 휴게실을 완성했어요! 🎉</div></section>`}
    ${who.length ? `<section class="sec">${secH('많이 도와준 친구', '')}<div class="box px">${who.map((w, i) => `<div class="li"><span class="b" style="width:22px">${i + 1}</span><div class="main"><span class="t">${esc(w.nick)}</span></div><span class="tag">${w.n}</span></div>`).join('')}</div></section>` : ''}
    <button class="btn px" id="goRoom">${ic('bed')}내 방으로</button>`, { tint: H.col });
  on('[data-don]', b => { const [k, n] = b.dataset.don.split(','); donate(k, +n); });
  $('#back').onclick = closeSheet;
  $('#goRoom').onclick = () => goPlace(myRoomId(), 'bed', 'home', 'dorm');
}

// ===== 친구 방 놀러 가기 =====
let visitUid = null, visitGuest = {}, visitOff = null, giftPick = null, vMine = null, vTheirs = null;
function guestRow(id, g, mine){
  const H = HOUSES[g.house];
  return `<div class="li" style="align-items:flex-start">${face(g, 34)}
    <div class="main"><span class="s"><b class="b" ${g.uid !== uid ? `data-visit="${g.uid}" style="cursor:pointer;text-decoration:underline;color:${H ? H.col : 'var(--ink)'}"` : `style="color:${H ? H.col : 'var(--ink)'}"`}>${esc(g.nick)}</b> <span class="sub">${new Date(g.at).toLocaleDateString('ko-KR', { month:'numeric', day:'numeric' })}</span></span>
    ${g.text ? `<span style="word-break:break-all">${esc(g.text)}</span>` : ''}
    ${g.gift ? `<span class="d" style="display:flex;align-items:center;gap:2px">${ic(g.gift, 'transform:scale(.6);margin:-6px')}선물 · ${ITEM[g.gift]}${g.claimed ? ' (받음)' : ''}</span>` : ''}</div>
    ${mine && g.gift && !g.claimed ? `<button class="btn sm go" data-claim="${id}">받기</button>` : ''}</div>`;
}
function openVisit(id){
  if (solo || !playersList[id] || id === uid) return;
  visitUid = id; visitGuest = {}; giftPick = null; vMine = null; vTheirs = null; sub = 'visit';
  visitOff?.();
  visitOff = F.onValue(F.query(F.ref(db, 'guest/' + id), F.limitToLast(20)), s => { visitGuest = s.val() || {}; if (sub === 'visit') renderVisit(); });
  me.visited = me.visited || {};
  if (me.visited[id] !== todayKey()){
    me.visited[id] = todayKey(); me.mana += 5; save();
    toast(`${playersList[id].nick}의 방에 처음 놀러 왔어요. 마력 +5`);
  }
  renderVisit();
}
function leaveVisit(){ visitOff?.(); visitOff = null; visitUid = null; closeSheet(); }
// 친구 생물과 짝꿍 맺기: 친구마다 하루 한 번, 알은 나만 받아요 (친구 방명록에 소식이 남아요)
const friendCr = p => normalize({ cr: JSON.parse(JSON.stringify(p.cr || [])), inv: {} }).cr;
function breedSection(p){
  const theirs = friendCr(p).map((x, i) => [x, i]).filter(([x]) => crAdult(x));
  const pickT = vTheirs !== null && friendCr(p)[vTheirs];

// ===== 주간 쪽지시험: 일주일에 한 번, 10문제 =====
const EXAM_N = 10, EXAM_SEC = 20;
const examDone = () => me.exam?.week === coopWeek() && me.exam.done;
const examStarted = () => me.exam?.week === coopWeek();
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n, not = []) => shuffle(a.filter(x => !not.includes(x))).slice(0, n);
// 받침에 맞춰 조사 고르기: josa('물약', '을', '를') → '을'
const josa = (w, a, b, ro) => { const c = String(w).charCodeAt(String(w).length - 1); if (c < 0xAC00 || c > 0xD7A3) return b; const jong = (c - 0xAC00) % 28; return ro ? (jong === 0 || jong === 8 ? b : a) : jong ? a : b; };
const gradeOf = s => s >= 100 ? 'A+' : s >= 90 ? 'A' : s >= 80 ? 'B+' : s >= 70 ? 'B' : s >= 60 ? 'C' : 'D';
// 문제 만들기: 내가 레시피를 아는 물약 + 누구나 아는 학교 상식
function makeExam(){
  const known = POTIONS.filter(p => me.hints.includes(p) || me.found.includes(p));
  const Q = [];
  const q4 = (t, q, a, wrong) => Q.push({ t, q, a, choices: shuffle([a, ...wrong.slice(0, 3)]) });
  known.forEach(p => {
    q4('recipe', `「${recipeText(p)}」${josa(recipeText(p), '으로', '로', true)} 만드는 물약은?`, ITEM[p], pick(POTIONS, 3, [p]).map(x => ITEM[x]));
    q4('recipe', `「${ITEM[p]}」의 레시피는?`, recipeText(p), pick(POTIONS, 3, [p]).map(recipeText));
  });
  HOUSE_KEYS.forEach(k => {
    q4('house', `「${HOUSES[k].name}」 기숙사의 시간은?`, hoursText(HOUSES[k]), HOUSE_KEYS.filter(x => x !== k).map(x => hoursText(HOUSES[x])));
    q4('house', `「${HOUSES[k].perk}」 보너스를 받는 기숙사는?`, HOUSES[k].name, HOUSE_KEYS.filter(x => x !== k).map(x => HOUSES[x].name));
  });
  CREATURES.forEach((c, i) => q4('ranch', `사육장의 「${c.kind}」${josa(c.kind, '이', '가')} 주는 재료는?`, ITEM[c.mat], CREATURES.filter((_, j) => j !== i).map(x => ITEM[x.mat])));
  POTIONS.filter(p => POTION_INFO[p].time).forEach(p => q4('time', `「${ITEM[p]}」${josa(ITEM[p], '을', '를')} 끓일 수 있는 시간은?`, hoursText(HOUSES[POTION_INFO[p].time]), HOUSE_KEYS.filter(x => x !== POTION_INFO[p].time).map(x => hoursText(HOUSES[x]))));
  known.filter(p => POTION_INFO[p].use).forEach(p => q4('use', `「${POTION_INFO[p].use}」 효과가 있는 물약은?`, ITEM[p], pick(POTIONS, 3, [p]).map(x => ITEM[x])));
  // 레시피 문제는 최대 절반, 나머지는 섞어서
  const recipeQs = shuffle(Q.filter(x => x.t === 'recipe')).slice(0, EXAM_N / 2);
  const rest = shuffle(Q.filter(x => x.t !== 'recipe'));
  return shuffle([...recipeQs, ...rest].slice(0, EXAM_N));
}
let exam = null;   // { qs, i, right, picked, t0 }
function startExam(){
  if (examStarted()) return;
  me.exam = { week: coopWeek(), score: 0, done: false }; save();   // 도중에 나가도 한 번 본 걸로 쳐요

}
let examTick = 0;

  clearInterval(examTick);
  if (!exam){ return renderExamResult(); }

  on('[data-ans]', b => answer(+b.dataset.ans));

}
function answer(j){

  renderExam();

    exam.i++; exam.picked = null; exam.t0 = Date.now();
    if (exam.i >= exam.qs.length) finishExam(); else renderExam();
  }, 900);
}

// ===== 학교 행사: 정해진 시간에 다 같이 모이는 실시간 이벤트 =====
// days: 요일(0=일), 시각은 각자 기기 시계 기준. 끝난 뒤 60분 동안은 결과·보상을 볼 수 있어요.
const EVENTS = {
  dragon: { name:'드래곤의 방문', icon:'egg', days:[6,0], hour:20, min:0, dur:20,
            blurb:'화난 드래곤에게 다 같이 물약을 바쳐 달래요' },
};
const AFTER_MIN = 60;
const DRAGON_PTS = p => p === 'p_dragon' ? 6 : p === 'p_purple' ? 4 : POTION_INFO[p].time ? 3 : Math.max(1, Math.min(6, Math.round(POTION_INFO[p].pay / 60)));
const dragonGoal = () => solo ? 8 : 40;
// 미리보기: 주소 뒤에 ?event=dragon 을 붙이면 지금 바로 열려요 (기록은 test 칸에 따로 쌓여요)
const PREVIEW = (() => { const k = new URLSearchParams(location.search).get('event'); return EVENTS[k] ? { id: k, start: Date.now() } : null; })();
const ymd = d => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
function eventAt(now = Date.now()){
  if (PREVIEW){ const E = EVENTS[PREVIEW.id]; return { id: PREVIEW.id, E, start: PREVIEW.start, end: PREVIEW.start + E.dur * 60000, key: PREVIEW.id + '-test' }; }
  for (const [id, E] of Object.entries(EVENTS)){
    for (const back of [0, 1]){   // 자정 근처를 위해 어제 것도 봐요
      const d = new Date(now); d.setDate(d.getDate() - back); d.setHours(E.hour, E.min, 0, 0);
      if (!E.days.includes(d.getDay())) continue;
      const start = d.getTime(), end = start + E.dur * 60000;
      if (now >= start && now < end + AFTER_MIN * 60000) return { id, E, start, end, key: `${id}-${ymd(d)}` };
    }
  }
  return null;
}
function nextEvent(now = Date.now()){
  let best = null;
  for (const [id, E] of Object.entries(EVENTS)) for (let i = 0; i < 8; i++){
    const d = new Date(now); d.setDate(d.getDate() + i); d.setHours(E.hour, E.min, 0, 0);
    if (E.days.includes(d.getDay()) && d.getTime() > now){ if (!best || d.getTime() < best.start) best = { id, E, start: d.getTime() }; break; }
  }
  return best;
}
const untilText = ms => { const m = Math.max(0, Math.round(ms / 60000)); return m >= 60 ? `${Math.floor(m / 60)}시간 ${m % 60}분` : `${m}분`; };
const whenText = t => { const d = new Date(t), today = ymd(new Date()) === ymd(d); return `${today ? '오늘' : ['일','월','화','수','목','금','토'][d.getDay()] + '요일'} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; };

}

// ----- 행사 화면 -----
let evTimer = 0, evOff = null, evKey = null, evData = {}, evMsg = '', evPending = {};
function stopEvent(){ clearInterval(evTimer); evTimer = 0; evOff?.(); evOff = null; evKey = null; }
function leaveEvent(){ stopEvent(); closeSheet(); }
function watchEvent(ev){
  if (evKey === ev.key) return;
  stopEvent(); evKey = ev.key; evData = {}; evMsg = ''; evPending = {};
  if (solo){ try { evData = JSON.parse(localStorage.getItem('magion-ev-' + ev.key) || '{}'); } catch(e){} return; }
  evOff = F.onValue(F.ref(db, `events/${ev.id}/${ev.key}`), s => { evData = s.val() || {}; if (sub === 'event') paintEvent(); });
}
const soloSaveEv = () => { if (solo) try { localStorage.setItem('magion-ev-' + evKey, JSON.stringify(evData)); } catch(e){} };
function renderEvent(){
  const ev = eventAt();
  if (!ev){ toast('지금은 열린 행사가 없어요.'); return leaveEvent(); }
  watchEvent(ev);
  const overlay = `<div style="position:absolute;inset:0;background:rgba(20,10,50,.45);pointer-events:none"></div>
    <div class="cr dragon" style="position:absolute;left:50%;top:52%;background-position:-1320px 0"></div><div id="dragonFx" style="position:absolute;inset:0;z-index:1;pointer-events:none"></div>`;
  frame('island', ev.E.name, `<span id="evClock"></span>`, `
    <section class="sec">
      <div class="hint">${ev.E.blurb}</div>
      <div id="evBody" class="sec"></div>
    </section>
    <button class="btn ghost" id="back" style="align-self:center">닫기</button>`, { overlay });
  $('#back').onclick = leaveEvent;
  paintEvent();
  clearInterval(evTimer); evTimer = setInterval(() => { if (sub !== 'event') return stopEvent(); tickEvent(); }, 250);
}
function tickEvent(){
  const ev = eventAt(); if (!ev) return leaveEvent();
  const now = Date.now(), live = now < ev.end;
  const c = $('#evClock'); if (c) c.textContent = live ? `${Math.floor((ev.end - now) / 60000)}:${String(Math.floor((ev.end - now) / 1000) % 60).padStart(2, '0')} 남음` : '행사가 끝났어요';
  if (!live && $('#evBody')?.dataset.live === '1') paintEvent();
}
function paintEvent(){
  const ev = eventAt(), body = $('#evBody'); if (!ev || !body) return;
  const live = Date.now() < ev.end;
  const st = app.querySelectorAll('.stat'); if (st.length === 2){ st[0].innerHTML = ic('coin') + me.coin.toLocaleString(); st[1].innerHTML = ic('mana') + me.mana; }
  body.dataset.live = live ? '1' : '0';
  const me_ = solo ? 'me' : uid;
  const houseOf = id => id === me_ ? me.house : playersList[id]?.house;
  const nickOf = id => id === me_ ? me.nick : playersList[id]?.nick || '친구';
  const lookOf = id => id === me_ ? me : playersList[id];
  {
    const total = Object.values(evData).reduce((t, v) => t + (+v || 0), 0), goal = dragonGoal(), done = total >= goal;
    const mine = +evData[me_] || 0;
    me.evClaimed = me.evClaimed || {};
    const claimed = me.evClaimed[ev.key];
    const offer = POTIONS.filter(p => me.inv[p] > 0);
    const fx = $('#dragonFx'); if (fx) fx.innerHTML = done ? '<div class="calm">♥</div>' : '';
    const dr = app.querySelector('.dragon'); if (dr) dr.classList.toggle('calm-d', done);
    body.innerHTML = `
      <div class="box px" style="padding:10px 12px;display:flex;flex-direction:column;gap:8px">
        <div class="sec-h"><h3>${done ? '드래곤이 진정했어요!' : '드래곤의 기분'}</h3><span class="meta">${total} / ${goal}</span></div>
        <div style="height:14px;background:var(--ink);padding:2px"><div style="width:${Math.min(100, total / goal * 100)}%;height:100%;background:${done ? 'var(--mint)' : 'linear-gradient(90deg,#FF7A5A,#FFC24A)'}"></div></div>
        <span class="s sub">비싼 물약일수록 점수가 높아요 (1~6점) · 시간대 물약 3점 · 반짝 4점 · 용기의 물약 6점</span>
      </div>
      ${hint(evMsg, done ? '' : live ? '가방의 물약을 눌러 드래곤에게 바쳐요' : '시간 안에 달래지 못했어요. 다음 주말에 다시 와요.')}
      ${done ? (mine ? `<button class="btn go px" id="claim" ${claimed ? 'disabled' : ''}>${claimed ? '보상을 받았어요' : '보상 받기 · 용 알 껍질 ×2 + 150G'}</button>` : '<div class="hint">물약을 바친 학생만 보상을 받아요</div>')
        : live ? `<div class="pal">${offer.map(p => `<button class="cell" style="width:58px;min-height:58px" data-offer="${p}">${ic(p)}<span class="s">+${DRAGON_PTS(p)}</span><span class="n">${me.inv[p]}</span></button>`).join('') || '<span class="s sub">가방에 물약이 없어요. 연구실에서 끓여 오세요!</span>'}</div>` : ''}
      ${Object.keys(evData).length ? `<div class="box px">${Object.entries(evData).sort((a, b) => b[1] - a[1]).map(([u, n]) => `<div class="li">${face(lookOf(u), 30)}<div class="main"><span class="t">${esc(nickOf(u))}</span><span class="d">${HOUSES[houseOf(u)]?.name || ''}</span></div><span class="b">${n}점</span></div>`).join('')}</div>` : ''}`;
    body.querySelectorAll('[data-offer]').forEach(b => b.onclick = async () => {
      const p = b.dataset.offer; if (me.inv[p] < 1 || Date.now() >= ev.end) return;
      me.inv[p]--; save();
      const nv = (+evData[me_] || 0) + DRAGON_PTS(p);
      evMsg = `${ITEM[p]}을(를) 바쳤어요. +${DRAGON_PTS(p)}점`;
      if (solo){ evData[me_] = nv; soloSaveEv(); paintEvent(); }
      else await F.set(F.ref(db, `events/dragon/${ev.key}/${uid}`), nv).catch(e => toast('바치지 못했어요: ' + (e.code || e.message)));
    });
    const cl = $('#claim'); if (cl) cl.onclick = () => {
      if (me.evClaimed[ev.key]) return;
      me.evClaimed[ev.key] = 1; me.inv.egg += 2; me.coin += 150; save();
      toast('드래곤이 고맙다며 알 껍질을 두고 갔어요! +150G'); evMsg = ''; paintEvent();
    };
  }
}

// ===== 시장 (온라인 전용) =====
let sellPick = null;
function renderMarket(){
  if (solo){
    frame(null, '등불 시장', '친구들과 거래하는 곳', `<div class="hint on px">혼자 해 보기 모드에서는 시장이 열리지 않아요. 로그인하면 12명이 함께 거래할 수 있어요.</div>`);
    return;
  }
  const items = Object.entries(marketList);
  const mine = items.filter(([, l]) => l.uid === uid);
  const others = items.filter(([, l]) => l.uid !== uid && !l.buyer);
  const week = coop[coopWeek()] || {};
  const coopTotal = Object.values(week).reduce((a, b) => a + (+b || 0), 0);
  const sellable = [...POTIONS, ...MATS].filter(k => me.inv[k] > 0);
  frame(null, '등불 시장', `친구 가게 ${new Set(others.map(([, l]) => l.uid)).size}곳 영업 중`, `
    <section class="sec">
      ${secH('친구들이 올린 물건', others.length + '개')}
      ${others.length ? `<div class="box px">${others.map(([id, l]) => `<div class="li">${ic(l.item)}
        <div class="main"><span class="t">${ITEM[l.item]}${l.qty > 1 ? ' ×' + l.qty : ''}${l.moon ? ' <span class="tag" style="background:#3A2E78;color:#FFE58A">달빛</span>' : ''}</span><span class="d" data-visit="${l.uid}" style="cursor:pointer;text-decoration:underline">${esc(l.nick)}의 가게 · 방 구경</span></div>
        <button class="btn sm go" data-buy="${id}" ${me.coin >= l.price ? '' : 'disabled'}>${ic('coin', 'transform:scale(.7);margin:0 -6px')}${l.price}</button></div>`).join('')}</div>` : '<div class="hint">지금은 올라온 물건이 없어요</div>'}
    </section>
    <section class="sec">
      ${secH('내 가판대', `${mine.length} / 4`)}
      ${mine.length ? `<div class="box px">${mine.map(([id, l]) => `<div class="li">${ic(l.item)}<div class="main"><span class="t">${ITEM[l.item]} · ${l.price}G</span><span class="d">${l.buyer ? esc(l.buyerNick || '친구') + '님이 샀어요!' : '판매 중'}</span></div>
        ${l.buyer ? `<button class="btn sm go" data-collect="${id}">받기</button>` : `<button class="btn sm" data-cancel="${id}">내리기</button>`}</div>`).join('')}</div>` : ''}
      ${mine.length < 4 ? `<div class="box px" style="padding:10px;display:flex;flex-direction:column;gap:8px">
        <span class="s sub">팔 물건을 고르고 가격을 정해요</span>
        <div class="pal">${sellable.map(k => `<button class="cell ${sellPick === k ? 'sel' : ''}" style="width:48px;min-height:48px;padding:0" data-pick="${k}">${ic(k)}<span class="n">${me.inv[k]}</span></button>`).join('') || '<span class="s sub">팔 수 있는 물건이 없어요</span>'}</div>
        ${sellPick ? `<div style="display:flex;gap:6px;align-items:center"><span class="s" style="flex:1">${ITEM[sellPick]} 1개</span><input id="price" type="number" min="1" max="9999" value="${PAY[sellPick] || 20}" style="width:84px;height:36px;border:2px solid var(--ink);padding:0 6px;background:#fff"><span class="s">G</span><button class="btn sm go" id="list">올리기</button></div>` : ''}
      </div>` : ''}
    </section>
    <section class="sec">
      <div class="px" style="background:var(--ink2);color:#fff;padding:12px;display:flex;flex-direction:column;gap:10px">
        <div class="sec-h"><h3 style="color:var(--gold)">반 공동 의뢰</h3><span class="meta" style="color:#B8A8E8">반짝 물약 50병</span></div>
        <div style="height:12px;background:#3A2E68"><div style="width:${Math.min(100, coopTotal * 2)}%;height:100%;background:var(--gold)"></div></div>
        <div class="s" style="display:flex;justify-content:space-between;color:#B8A8E8"><span>${coopTotal} / 50 · ${Object.keys(week).length}명 참여</span><span>내가 낸 것 ${week[uid] || 0}</span></div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px">${HOUSE_KEYS.map(k => { const n = Object.entries(week).filter(([id]) => playersList[id]?.house === k).reduce((t, [, v]) => t + (+v || 0), 0); return `<div style="background:#2E2458;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;border-top:3px solid ${HOUSES[k].col}"><span class="s" style="color:${HOUSES[k].col}">${HOUSES[k].name}</span><span class="s" style="color:var(--gold);letter-spacing:-1px">${'★'.repeat(Math.min(5, Math.floor(n / 2))) || '·'}</span><span class="s" style="color:#B8A8E8">${n}병</span></div>`; }).join('')}</div>
        <span class="s" style="color:#B8A8E8">2병마다 기숙사 별자리에 별이 하나씩 떠요</span>
        <button class="btn sm go" id="donate" ${me.inv.p_purple > 0 ? '' : 'disabled'}>반짝 물약 1병 내기</button>
      </div>
    </section>`);
  on('[data-pick]', b => { sellPick = b.dataset.pick; renderMarket(); });
  on('[data-visit]', b => openVisit(b.dataset.visit));
  const lb = $('#list');
  if (lb) lb.onclick = async () => {
    const price = Math.max(1, Math.min(9999, Math.floor(+$('#price').value || 0)));
    if (me.inv[sellPick] < 1) return;
    me.inv[sellPick]--; save();
    await F.push(F.ref(db, 'market'), { uid, nick: me.nick, look: me.look, item: sellPick, qty: 1, price, at: Date.now(), ...(me.house === 'moon' && myTime() ? { moon: true } : {}) });
    toast(`${ITEM[sellPick]}을(를) ${price}G에 올렸어요.`); sellPick = null;
  };
  on('[data-cancel]', async b => {
    const l = marketList[b.dataset.cancel]; if (!l || l.buyer) return;
    await F.remove(F.ref(db, 'market/' + b.dataset.cancel));
    me.inv[l.item] += l.qty; save(); toast('가판대에서 내렸어요.');
  });
  on('[data-collect]', async b => {
    const l = marketList[b.dataset.collect]; if (!l || !l.buyer) return;
    await F.remove(F.ref(db, 'market/' + b.dataset.collect));
    me.coin += l.price; save(); toast(`판매 대금 ${l.price}G를 받았어요.`);
  });
  on('[data-buy]', async b => {
    const id = b.dataset.buy, l = marketList[id];
    if (!l || me.coin < l.price) return;
    const res = await F.runTransaction(F.ref(db, 'market/' + id), cur => {
      if (!cur || cur.buyer) return;
      return { ...cur, buyer: uid, buyerNick: me.nick };
    });
    if (!res.committed) return toast('한발 늦었어요. 다른 친구가 먼저 샀어요.');
    me.coin -= l.price; me.inv[l.item] += l.qty; save();
    toast(`${ITEM[l.item]}을(를) 샀어요! -${l.price}G`);
  });
  $('#donate').onclick = async () => {
    if (me.inv.p_purple < 1) return;
    me.inv.p_purple--; save();
    await F.set(F.ref(db, `coop/${coopWeek()}/${uid}`), (week[uid] || 0) + 1);
    toast('반짝 물약을 냈어요. 고마워요!');
  };
}

// ===== 시작: 로그인 · 캐릭터 만들기 =====
const ID_RE = /^[a-zA-Z][a-zA-Z0-9_]{2,15}$/;
const idEmail = id => `${id.toLowerCase()}@magionacademy.app`;
const pwPad = pw => pw + '·magion';
const AUTH_MSG = {
  'auth/operation-not-allowed': 'Firebase 콘솔 > Authentication > 로그인 방법에서 "이메일/비밀번호"를 켜 주세요.',
  'auth/email-already-in-use': '이미 있는 아이디예요. 로그인하거나 다른 아이디를 골라 주세요.',
  'auth/invalid-credential': '아이디 또는 비밀번호가 맞지 않아요.', 'auth/wrong-password': '비밀번호가 맞지 않아요.', 'auth/user-not-found': '없는 아이디예요.',
  'auth/too-many-requests': '너무 여러 번 시도했어요. 잠시 뒤 다시 해 주세요.', 'auth/network-request-failed': '인터넷 연결을 확인해 주세요.',
};
const configured = !!(firebaseConfig.apiKey && firebaseConfig.databaseURL);
function cover(inner){ document.body.classList.remove('inworld'); app.classList.remove('open'); sheetOn = false; app.innerHTML = `<div class="cover"><div style="text-align:center;display:flex;flex-direction:column;gap:6px;margin:10px 0"><span class="b" style="font-size:33px;line-height:36px">호박달 마녀학교</span><span class="s" style="color:#C8B8FF">늘 할로윈인 마녀학교 생활 타이쿤</span></div>${inner}</div>`; }
function showLogin(mode = 'login'){
  const signup = mode === 'signup';
  let saved = ''; try { saved = localStorage.getItem('magion-id') || ''; } catch(e){}
  cover(`<div class="card px">
    ${configured ? `<div style="display:flex;gap:6px"><button class="btn sm" style="flex:1;${signup ? '' : 'background:var(--gold)'}" id="mLogin">로그인</button><button class="btn sm" style="flex:1;${signup ? 'background:var(--gold)' : ''}" id="mSignup">가입하기</button></div>
    <form id="lf" style="display:flex;flex-direction:column;gap:10px">
      <label class="field"><span class="s">아이디</span><input id="lid" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="16" placeholder="영어 3~16 자" value="${esc(saved)}"></label>
      <label class="field"><span class="s">비밀번호</span><input id="lpw" type="password" autocomplete="${signup ? 'new-password' : 'current-password'}" maxlength="40" placeholder="5 자 이상"></label>
      ${signup ? '<label class="field"><span class="s">비밀번호 확인</span><input id="lpw2" type="password" autocomplete="new-password" maxlength="40"></label>' : ''}
      <p class="err" id="err"></p>
      <button class="btn go" type="submit" id="lgo">${signup ? '가입하고 입학하기' : '등교하기'}</button>
    </form>` : `<span class="s">아직 Firebase가 연결되지 않았어요. public/firebase-config.js에 설정을 넣으면 친구들과 함께할 수 있어요.</span>`}
    <button class="btn" id="soloGo" type="button">혼자 해 보기 (이 기기에만 저장)</button>
  </div>`);
  $('#soloGo').onclick = startSolo;
  if (!configured) return;
  $('#mLogin').onclick = () => showLogin('login');
  $('#mSignup').onclick = () => showLogin('signup');
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const id = $('#lid').value.trim(), pw = $('#lpw').value, err = $('#err');
    if (!ID_RE.test(id)) return err.textContent = '아이디는 영어로 시작하고, 영어·숫자·_ 3~16 자여야 해요.';
    if (pw.length < 5) return err.textContent = '비밀번호는 5 자 이상이어야 해요.';
    if (signup && pw !== $('#lpw2').value) return err.textContent = '비밀번호 확인이 달라요.';
    $('#lgo').disabled = true; err.textContent = '잠깐만요...';
    try {
      if (signup) await F.createUserWithEmailAndPassword(auth, idEmail(id), pwPad(pw));
      else await F.signInWithEmailAndPassword(auth, idEmail(id), pwPad(pw));
      try { localStorage.setItem('magion-id', id); } catch(e){}
    } catch(ex){
      $('#lgo').disabled = false;
      err.textContent = AUTH_MSG[ex.code] || `실패했어요. (${ex.code || ex.message})`;
    }
  };
}
// 기숙사 고르기 카드 (입학 원서와, 기숙사가 없는 예전 학생 둘 다 써요)
const houseCards = (pick, counts) => `<div style="display:flex;flex-direction:column;gap:6px">${HOUSE_KEYS.map(k => {
  const H = HOUSES[k], n = counts[k] || 0, full = n >= HOUSE_CAP;
  return `<button data-house="${k}" ${full ? 'disabled' : ''} style="text-align:left;padding:6px 8px;display:flex;gap:8px;align-items:center;background:${pick === k ? H.bg : '#fff'};border:3px solid ${pick === k ? H.col : 'var(--line)'}">${ic(H.icon)}
    <span style="flex:1;display:flex;flex-direction:column;gap:1px"><span class="b" style="font-size:15px;color:${H.col}">${H.name} <span class="s sub">${H.who} · ${hoursText(H)}</span></span>
    <span class="s">${H.perk}</span><span class="s sub">${H.timePerk}</span></span>
    <span class="s b" style="color:${full ? '#C2385E' : 'var(--sub)'}">${full ? '마감' : n + '/' + HOUSE_CAP}</span></button>`;
}).join('')}</div>`;
async function houseCounts(){
  const c = {};
  if (solo) return c;
  try { const snap = await F.get(F.ref(db, 'players')); Object.entries(snap.val() || {}).forEach(([id, p]) => { if (id !== uid && p?.house) c[p.house] = (c[p.house] || 0) + 1; }); } catch(e){}
  return c;
}
// ===== 캐릭터 꾸미기: 머리부터 발끝까지 =====
// [탭, 이름, [[제목, 부품(없으면 색만), 색 키, 팔레트]]]
const AV_TABS = [
  ['face', '얼굴', [['피부색', null, 'skinC', 'skin'], ['눈 모양', 'eyes', 'eyeC', 'eye'], ['입 모양', 'mouth', null, null]]],
  ['hair', '머리', [['머리 모양', 'hair', 'hairC', 'hair']]],
  ['uni', '교복', [['교복', 'uni', null, null], ['신발 색', null, 'shoeC', 'shoes']]],
];
let avTab = 'face', avView = 0, avTimer = 0;   // 미리보기 방향: 0 앞, 1 옆, 2 뒤
const AV_VIEWS = [[0, '앞모습'], [6, '옆모습'], [3, '뒷모습']];
const avThumb = (av, head) => { const A = World.Avatar; if (!A.loaded) return ''; const c = document.createElement('canvas'), b = A.headBox, [x, y, w, h] = head ? [b.x, b.y, b.s, b.s] : [0, 0, A.FW, A.FH]; c.width = w; c.height = h; c.getContext('2d').drawImage(A.compose(av), x, y, w, h, 0, 0, w, h); return c.toDataURL(); };
function avatarUI(av){
  const A = World.Avatar, M = A.meta, [, , rows] = AV_TABS.find(t => t[0] === avTab);
  const swatch = (pal, key) => `<div class="pal">${M.pal[pal].map((r, i) => `<button class="sw ${av[key] === i ? 'on' : ''}" data-avc="${key},${i}" style="background:${r[1]}" aria-label="색 ${i + 1}"></button>`).join('')}</div>`;
  return `
    <div class="avwrap">
      <div class="avstage px"><canvas id="avCv" width="${A.FW}" height="${A.FH}"></canvas><button class="btn sm" id="avTurn">↻ ${AV_VIEWS[(avView + 1) % AV_VIEWS.length][1]}</button></div>
      <div class="seg" style="grid-template-columns:repeat(${AV_TABS.length},1fr)">${AV_TABS.map(([k, l]) => `<button data-avt="${k}" class="${avTab === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      ${rows.map(([label, cat, key, pal]) => `<section class="sec">${secH(label, cat ? M.parts[cat][av[cat]].n : `${av[key] + 1} / ${M.pal[pal].length}`)}
          ${cat ? `<div class="avopts">${M.parts[cat].map((p, i) => `<button class="avo ${av[cat] === i ? 'on' : ''}" data-avp="${cat},${i}"><img src="${avThumb({ ...av, [cat]: i }, cat !== 'uni')}" alt=""><span class="s">${p.n}</span></button>`).join('')}</div>` : ''}
          ${key ? swatch(pal, key) : ''}</section>`).join('')}
      ${avTab === 'uni' ? `<div class="hint">교복 색은 기숙사 색이에요${av.house ? ` · ${HOUSES[av.house].name}` : ''}</div>` : ''}
      <button class="btn sm" id="avRand" style="align-self:center">🎲 아무거나</button>
    </div>`;
}
function bindAvatarUI(av, redraw){
  const A = World.Avatar, cv = $('#avCv'); if (!cv) return;
  clearInterval(avTimer); let t = 0;
  const paint = () => { if (!document.body.contains(cv)) return clearInterval(avTimer); const g = cv.getContext('2d'), fr = AV_VIEWS[avView][0] + [0, 1, 0, 2][t++ % 4]; g.clearRect(0, 0, A.FW, A.FH); g.drawImage(A.compose(av), fr * A.FW, 0, A.FW, A.FH, 0, 0, A.FW, A.FH); };
  paint(); avTimer = setInterval(paint, 220);
  on('[data-avt]', b => { avTab = b.dataset.avt; redraw(); });
  on('[data-avp]', b => { const [c, i] = b.dataset.avp.split(','); av[c] = +i; redraw(); });
  on('[data-avc]', b => { const [k, i] = b.dataset.avc.split(','); av[k] = +i; redraw(); });
  $('#avTurn').onclick = () => { avView = (avView + 1) % AV_VIEWS.length; redraw(); };
  $('#avRand').onclick = () => { Object.assign(av, A.random(), { house: av.house }); redraw(); };
}
// 시트: 나중에 다시 꾸미기
let avDraft = null;
function renderAvatar(){
  if (!avDraft) avDraft = { ...me.av, house: me.house };
  frame(null, '캐릭터 꾸미기', '머리부터 발끝까지 골라요', `
    ${avatarUI(avDraft)}
    <div style="display:flex;gap:8px"><button class="btn px" id="avCancel" style="flex:1">그만두기</button><button class="btn go px" id="avSave" style="flex:2">이 모습으로!</button></div>`);
  bindAvatarUI(avDraft, () => { const p = app.querySelector('.panel'), y = p.scrollTop; renderAvatar(); app.querySelector('.panel').scrollTop = y; });
  $('#avCancel').onclick = () => { avDraft = null; closeSheet(); };
  $('#avSave').onclick = () => {
    me.av = World.Avatar.fix(avDraft); delete me.av.house; avDraft = null; save(); World.setPlayer(me.nick, avOf(me));
    if (!solo) F.update(F.ref(db, 'online/' + uid), { av: me.av }).catch(() => {});
    toast('새 모습이 마음에 들어요!'); closeSheet();
  };
}
function showCreate(done, counts = {}){
  let look = Math.floor(Math.random() * 8), house = null, nick = '';
  const av = World.Avatar.fromLook(Math.floor(Math.random() * 1e6));
  const draw = () => {
    cover(`<div class="card px">
      <span class="b" style="font-size:20px">입학 원서</span>
      <label class="field"><span class="s">이름 (1~8 자)</span><input id="nick" maxlength="8" placeholder="예: 별이" value="${esc(nick)}"></label>
      <span class="s">내 캐릭터 만들기</span>
      ${World.Avatar.loaded ? avatarUI(av) : '<div class="hint">그림을 불러오는 중...</div>'}
      <span class="s">기숙사 고르기 · 언제 깨어 있는 사람인가요? (기숙사마다 ${HOUSE_CAP}명)</span>
      ${houseCards(house, counts)}
      <p class="err" id="err"></p>
      <button class="btn go" id="enroll">입학하기</button>
    </div>`);
    const keep = () => { nick = $('#nick').value; };
    if (!World.Avatar.loaded) World.Avatar.ready.then(() => { keep(); draw(); });
    else bindAvatarUI(av, () => { keep(); const y = app.querySelector('.cover').scrollTop; draw(); app.querySelector('.cover').scrollTop = y; });
    app.querySelectorAll('[data-house]').forEach(b => b.onclick = () => { keep(); house = b.dataset.house; av.house = house; draw(); });
    $('#enroll').onclick = () => {
      keep(); const n = nick.trim();
      if (n.length < 1 || n.length > 8) return $('#err').textContent = '이름을 1~8 자로 정해 주세요.';
      if (!house) return $('#err').textContent = '기숙사를 골라 주세요.';
      const fav = World.Avatar.fix(av); delete fav.house; done(freshPlayer(n, look, house, fav));
    };
  };
  draw();
}
function showHousePick(counts, done){
  let house = null;
  const draw = () => {
    cover(`<div class="card px">
      <span class="b" style="font-size:20px">기숙사 배정</span>
      <span class="s">${esc(me.nick)}, 새 학기부터 기숙사가 4개로 나뉘었어요. 들어갈 곳을 골라 주세요.</span>
      ${houseCards(house, counts)}
      <p class="err" id="err"></p>
      <button class="btn go" id="hgo">이 기숙사로 갈래요</button>
    </div>`);
    app.querySelectorAll('[data-house]').forEach(b => b.onclick = () => { house = b.dataset.house; draw(); });
    $('#hgo').onclick = () => { if (!house) return $('#err').textContent = '기숙사를 골라 주세요.'; me.house = house; save(); done(); };
  };
  draw();
}
function startSolo(){
  solo = true;
  let saved = null; try { saved = JSON.parse(localStorage.getItem('magion-solo') || 'null'); } catch(e){}
  if (saved) { me = normalize(saved); if (!me.house) return showHousePick({}, enterWorld); enterWorld(); return; }
  showCreate(p => { me = p; save(); enterWorld(); });
}
async function boot(){
  if (!configured) return showLogin();
  cover('<div class="card px"><span class="s">학교로 가는 중...</span></div>');
  const [A, Au, D] = await Promise.all([import(FB + 'firebase-app.js'), import(FB + 'firebase-auth.js'), import(FB + 'firebase-database.js')]);
  F = { ...A, ...Au, ...D };
  const fapp = F.initializeApp(firebaseConfig);
  auth = F.getAuth(fapp); db = F.getDatabase(fapp);
  F.onAuthStateChanged(auth, async user => {
    if (!user) { uid = null; return showLogin(); }
    uid = user.uid;
    const snap = await F.get(F.ref(db, 'players/' + uid));
    const enter = () => {
      const oref = F.ref(db, 'online/' + uid);
      F.set(oref, { nick: me.nick, look: me.look, av: me.av, house: me.house, at: Date.now() });
      F.onDisconnect(oref).remove();
      F.onValue(F.ref(db, 'online'), s => { onlineList = s.val() || {}; if (tab === 'home' && !sub) render(); });
      F.onValue(F.ref(db, 'market'), s => { marketList = s.val() || {}; if (tab === 'market') render(); });
      F.onValue(F.ref(db, 'coop'), s => { coop = s.val() || {}; if (tab === 'market') render(); });
      F.onValue(F.ref(db, 'players'), s => { playersList = s.val() || {}; syncPens(); if (tab === 'home' && !sub) render(); });
      F.onValue(F.query(F.ref(db, 'guest/' + uid), F.limitToLast(20)), s => { myGuest = s.val() || {}; if (sub === 'dorm') render(); });
      F.onValue(F.ref(db, 'houses'), s => { const old = commonStage(me.house); halls = s.val() || {}; syncHalls(); if (commonStage(me.house) > old) toast(`우리 휴게실이 ${commonStage(me.house)}단계가 됐어요!`); if (sub === 'common') render(); });
      enterWorld();
    };
    if (snap.exists()) { me = normalize(snap.val()); if (!me.house) showHousePick(await houseCounts(), enter); else enter(); }
    else showCreate(p => { me = p; save(); enter(); }, await houseCounts());
  });
}
boot();
</script>
