<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140D1E">
<link rel="preload" href="fonts/Pretendard-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Galmuri11-Bold.sub.woff2" as="font" type="font/woff2" crossorigin>
<title>호박달 마녀학교</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
/* 글꼴: 본문 Pretendard(서브셋·직접 호스팅), 제목·버튼·HUD만 픽셀 글꼴 Galmuri11 */
@font-face{font-family:'Pretendard';font-weight:400;font-display:swap;src:url(fonts/Pretendard-Regular.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:700;font-display:swap;src:url(fonts/Pretendard-Bold.woff2) format('woff2')}
@font-face{font-family:'G11';font-display:swap;src:url(fonts/Galmuri11.sub.woff2) format('woff2')}
@font-face{font-family:'G11B';font-display:swap;src:url(fonts/Galmuri11-Bold.sub.woff2) format('woff2')}
/* 디자인 토큰 (지시서 6장). 옛 이름(--ink 등)은 새 색으로 이어 붙였어요 */
:root{--bg:#140D1E;--panel:#211733;--panel2:#2B1F45;--line:#3A2A55;--line2:#4E3C72;--accent:#FF9A3C;--accent2:#C86A1E;--purple:#9B7BFF;--ok:#6FD08C;--ok2:#3E9A5E;--warn:#FF6B6B;--text:#F6F0FF;--sub:#BDB0D6;--gold:#FFD866;--gold2:#D9A020;--pink:#FF8FAF;
  --ink:var(--text);--ink2:#140D1E;--paper:var(--panel);--card:var(--panel2);--soft:#342852;--mint:var(--ok);--mint2:var(--ok2);--bad:var(--warn);
  --f-body:'Pretendard',system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;--f-px:'G11','Pretendard',monospace;--f-pxb:'G11B','Pretendard',monospace;
  --fs:15px;--fs-s:13px;--fs-h:16px;--fs-talk:17px;--r-btn:12px;--r-panel:16px;--r-cell:8px;--hud-h:56px;--bar-h:64px;--dur:.18s}
html.big{--fs:17px;--fs-s:15px;--fs-h:18px;--fs-talk:19px}
.jic{display:inline-block;width:1.5em;height:1.5em;vertical-align:middle;background:url(art/jobs.png?v=1) 0 0/1200% 100%;background-position:calc(var(--i)*100%/11) 0;image-rendering:pixelated}
.big .jic{width:34px;height:34px}.wstep{display:flex;align-items:center;justify-content:space-between;gap:2px;margin-top:12px}.wstep>div{position:relative;display:flex;flex-direction:column;align-items:center;flex:1;padding:4px 0;border:2px solid transparent;border-radius:10px;opacity:.55}.wstep>div.done{opacity:.85}.wstep>div.on{opacity:1;border-color:var(--gold);background:rgba(255,184,77,.14)}.wstep .wic{width:58px;height:58px}.wstep b{font-size:11px}.wstep small{font-size:10px;opacity:.8}.wstep i{position:absolute;top:-8px;font-style:normal;font-size:10px;font-weight:800;background:var(--gold);color:#2b1b3a;border-radius:6px;padding:0 5px}.wstep i.nx{background:#9fd0ff}.wstep em{font-style:normal;opacity:.5}
.wbg{background-image:url(art/weapons_big.png?v=2)!important}
.wic{display:inline-block;width:96px;height:96px;background:url(art/weapons_big.png?v=2) 0 0/500% 1200%;background-position:calc(var(--t)*100%/4) calc(var(--r)*100%/11);image-rendering:pixelated;flex:none}
.sic{display:inline-block;width:26px;height:26px;vertical-align:middle;background:url(art/skills.png?v=2) 0 0/1500% 1200%;background-position:calc(var(--c)*100%/14) calc(var(--r)*100%/11);image-rendering:pixelated}
.jgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.jcard{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:2px solid var(--line,#5a4a78);border-radius:10px;background:transparent;color:inherit;font:inherit;text-align:center}.jcard .jic{width:32px;height:32px}.jcard b{font-size:13px}.jcard span{font-size:10px;opacity:.75;line-height:1.25}.jcard.on{border-color:#ffb84d;background:rgba(255,184,77,.18)}
html.lowfx *,html.lowfx *::before,html.lowfx *::after{transition-duration:0s!important;animation-duration:0s!important}
@media (prefers-reduced-motion:reduce){:root{--dur:0s}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);-webkit-tap-highlight-color:transparent;overflow:hidden}
body{font-family:var(--f-body);font-size:var(--fs);line-height:1.5;color:var(--text);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button{font:inherit;color:inherit;cursor:pointer;margin:0;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
input{font-family:var(--f-body);font-size:var(--fs);color:var(--text)}
b,strong{font-weight:700}
h1,h2,h3{font-weight:normal}
/* 게임 셸: 상단 HUD · 게임 화면 · 하단 메뉴. 페이지 스크롤은 없어요 */
#shell{position:relative;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"hud" "stage" "bar";height:100dvh;max-width:430px;margin:0 auto;overflow:hidden;background:var(--bg);padding-top:env(safe-area-inset-top)}
#hud{grid-area:hud;min-width:0;height:var(--hud-h);display:flex;align-items:center;gap:6px;padding:0 8px;background:rgba(20,13,30,.94);border-bottom:1px solid var(--line);position:relative;z-index:12}
#stage{grid-area:stage;position:relative;min-height:0;overflow:hidden}
#bar{grid-area:bar;min-width:0;height:calc(var(--bar-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(20,13,30,.96);border-top:1px solid var(--line);position:relative;z-index:12}
#bar button{border:0;background:none;color:var(--sub);font-family:var(--f-pxb);font-size:var(--fs-s);line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:44px;padding:0;position:relative}
#bar button.on{color:var(--accent)}
#bar button:active{transform:scale(.94)}
#bar svg,.icbtn svg,#ctx svg{width:24px;height:24px;shape-rendering:crispEdges;fill:currentColor}
#bar .badge{position:absolute;top:8px;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
body:not(.inworld) #hud,body:not(.inworld) #bar{display:none}
@media (min-width:900px) and (min-height:560px){#shell{max-width:760px}}
/* 가로 모드(낮은 화면): 메뉴를 오른쪽 세로로 */
@media (orientation:landscape) and (max-height:520px){#shell{max-width:none;grid-template-columns:minmax(0,1fr) 72px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"hud hud" "stage bar"}
  #hud{height:48px}#bar{height:auto;grid-template-columns:1fr;grid-template-rows:repeat(5,1fr);border-top:0;border-left:1px solid var(--line);padding-bottom:0;padding-right:env(safe-area-inset-right)}}
/* 패널 겉: 세계 밖(로그인)에서는 화면 전체, 세계 안에서는 HUD와 메뉴 사이를 덮는 오버레이 */
#app{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
body.inworld #app{background:rgba(10,6,20,.55);align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity var(--dur)}
body.inworld #app.open{opacity:1;pointer-events:auto}
@media (min-width:900px) and (min-height:560px){body.inworld #app{padding:16px}body.inworld #app>.pnl{height:auto;max-height:100%;border-radius:var(--r-panel);border:1px solid var(--line2);box-shadow:0 20px 60px rgba(0,0,0,.5)}}
/* HUD 부품 */
.hudbtn{border:0;background:none;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 6px;border-radius:var(--r-btn);color:var(--text);text-align:left;min-width:0}
.hudbtn:active{background:rgba(255,255,255,.08)}
#hudMe .face{width:36px;height:36px;border-radius:50%;background:#3A2E5A;border:2px solid var(--line2)}
.hudname{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.hudname b{font-family:var(--f-pxb);font-size:var(--fs-s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px}
.hudname .s{color:var(--sub);font-size:var(--fs-s)}
#hudClock{flex:1;flex-direction:column;align-items:center;gap:0;line-height:1.2;justify-content:center;padding:0 2px}
#hudClock b{font-family:var(--f-pxb);font-size:var(--fs-s);color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#hudClock span{font-size:var(--fs-s);color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums}
#wallet{display:flex;align-items:center;gap:3px;height:36px;padding:0 8px;border-radius:18px;background:var(--panel2);border:1px solid var(--line2);font-family:var(--f-pxb);font-size:var(--fs-s);color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}
#wallet .ic{transform:scale(.6);margin:0 -8px 0 -10px}
#saveDot{width:8px;height:8px;border-radius:50%;background:var(--ok);margin-left:2px;transition:background .3s;flex-shrink:0}
#saveDot.busy{background:var(--gold)}#saveDot.off{background:var(--warn)}
.icbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:var(--panel2);color:var(--text);display:inline-flex;align-items:center;justify-content:center;padding:0;flex-shrink:0}
.icbtn:active{transform:scale(.94);background:var(--line)}
#sub{display:none}
/* 걸어 다니는 세계 */
#world{position:absolute;inset:0;overflow:hidden;touch-action:none;color:#F2EAD8}
#world canvas{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
/* 게임 화면 위 작은 칩(진행 중인 행사·초대·버프) */
.chips{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;z-index:3;pointer-events:none}
.chip{background:rgba(20,13,30,.85);color:var(--text);padding:6px 10px;border-radius:10px;font-family:var(--f-px);font-size:var(--fs-s);line-height:1.3;border:1px solid var(--line2);white-space:nowrap}
.chip b{font-family:var(--f-pxb);color:var(--gold);display:block}
.chip.ev{pointer-events:auto;border:0;background:var(--accent);color:#2A1506;font-family:var(--f-pxb);min-height:44px}
/* 상황 버튼(근처 대상이 있을 때만)과 구석 버튼 */
#ctx{position:absolute;right:12px;bottom:12px;z-index:6;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#ctx button{min-height:48px;padding:0 16px 0 12px;border-radius:24px;border:2px solid #2A1506;background:var(--accent);color:#2A1506;font-family:var(--f-pxb);font-size:var(--fs);display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 var(--accent2);animation:ctxin .18s}
#ctx button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent2)}
@keyframes ctxin{from{transform:translateY(8px);opacity:0}}
.corner{position:absolute;left:12px;bottom:12px;z-index:6;display:flex;gap:8px}
.corner .icbtn{background:rgba(20,13,30,.85);font-family:var(--f-pxb);font-size:var(--fs-s)}
#tDay{display:none}
.ntag{position:absolute;transform:translate(-50%,-100%);font-size:var(--fs-s);line-height:1.4;padding:2px 4px;background:rgba(20,13,30,.75);white-space:nowrap;pointer-events:none;z-index:2}
.ntag.me{color:#FFD866}
.ntag.peer{color:#9CF0FF;box-shadow:0 0 0 1px #4FB8D8}
.say{position:absolute;transform:translate(-50%,-100%);background:#FFFFFF;color:#22183F;padding:4px 7px;font-size:var(--fs-s);line-height:15px;box-shadow:0 0 0 2px #22183F;max-width:180px;white-space:normal;word-break:keep-all;overflow-wrap:anywhere;text-align:center;pointer-events:none;z-index:3;margin-top:-16px}
.say::after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-3px;border:3px solid transparent;border-top-color:#22183F}
.say.emo{background:none;box-shadow:none;padding:0;line-height:0}
.emi{display:inline-block;width:32px;height:32px;background:url(art/emo.png) 0 0/384px 32px no-repeat;image-rendering:pixelated;vertical-align:middle}
.say.emo .emi{width:48px;height:48px;background-size:576px 48px;background-position-x:calc(var(--i) * -48px)}
.say.emo::after{display:none}
.bubble .pm{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.bubble .pm button{margin:0;padding:5px 6px;font-size:var(--fs-s);white-space:nowrap}
.bubble .pm.emo{grid-template-columns:repeat(4,1fr)}
.bubble .pm.emo button{padding:2px;background:#FAF1E2;line-height:0}
#fishui{position:absolute;inset:0;z-index:7;display:none;align-items:flex-end;justify-content:center;padding:0 12px calc(16px + env(safe-area-inset-bottom));touch-action:manipulation}
#fishui.on{display:flex}
body:not(.inworld) #fishui{display:none}
.fpan{width:100%;max-width:360px;background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:var(--r-panel);padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.fpan b{font-family:var(--f-pxb);font-size:var(--fs);line-height:1.4;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px}
.fpan .s{font-family:var(--f-body);font-size:var(--fs-s);line-height:1.5;color:var(--sub)}
.fpan .bang{font-size:26px;line-height:30px;color:var(--accent)}
.fpan .frow{display:flex;gap:8px;width:100%}.fpan .frow .btn{flex:1}
.fbar{position:relative;width:100%;height:30px;margin:6px 0;background:var(--line);border:1px solid var(--line2);border-radius:8px}
.fbar .fz{position:absolute;top:0;bottom:0;background:var(--ok);border-radius:6px;opacity:.9}
.fbar .fn{position:absolute;top:-6px;bottom:-6px;width:6px;margin-left:-3px;background:var(--gold);border-radius:3px;box-shadow:0 0 0 2px var(--bg)}
.fpond{position:relative;width:100%;height:46px;margin:6px 0 2px;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:linear-gradient(#2E5A6A,#244A58);touch-action:none}
.fpond::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 11px,rgba(255,255,255,.05) 11px 12px)}
.fpond .fzone{position:absolute;top:0;bottom:0;background:rgba(110,230,140,.38);border-left:2px solid var(--ok);border-right:2px solid var(--ok);box-sizing:border-box;z-index:1}
.fpond .fzone.in{background:rgba(110,230,140,.62)}
.fpond .fbob{position:absolute;top:50%;width:14px;height:20px;margin:-10px 0 0 -7px;border-radius:7px 7px 6px 6px;background:linear-gradient(#E0303A 0 45%,#F2EAD8 45%);box-shadow:0 0 0 2px var(--bg),0 4px 0 rgba(0,0,0,.25);z-index:2}
.fmeter{width:100%;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.fmeter i{display:block;height:100%;width:0;background:var(--ok);border-radius:5px}
.fmeter.pat i{background:var(--gold)}.fmeter.pat.low i{background:#E05A5A}
.fctl .btn{flex:1;min-height:52px;touch-action:none;user-select:none;-webkit-user-select:none}
.plantpick{position:sticky;bottom:0;z-index:3;margin-top:8px;padding:10px;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-panel);box-shadow:0 -8px 18px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:8px}
.plantpick .pph{display:flex;align-items:center;justify-content:space-between;gap:8px}
.plantpick{padding:8px;gap:6px}.plantpick .ppg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:25vh;overflow:auto}
.plantpick .ppg .cell{min-height:74px;padding:4px 2px}.plantpick .ppg .cell.dim{opacity:.5}
.fstar{color:var(--gold);font-family:var(--f-body);font-size:var(--fs-s)}
.fgot{display:flex;align-items:center;gap:8px;text-align:left}
.fgot div{display:flex;flex-direction:column;gap:2px}
.fgot .new{color:var(--accent);font-family:var(--f-pxb);font-size:var(--fs-s)}
.fgrid{grid-template-columns:repeat(5,minmax(0,1fr))}
.fcell{min-height:92px;gap:1px;padding:14px 2px 6px;text-align:center}
.fcell .s{font-size:var(--fs-s);line-height:1.3;font-family:var(--f-body)}
.fcell .fno{position:absolute;left:4px;top:2px;font-family:var(--f-body);font-size:var(--fs-s);line-height:1.2;color:var(--text);opacity:.85;font-variant-numeric:tabular-nums}
.fcell.unk{opacity:.6}
.fcell .q{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-family:var(--f-pxb);font-size:24px;color:var(--sub)}
.fst{color:var(--gold);font-size:var(--fs-s);font-family:var(--f-body);line-height:1.4;letter-spacing:-1px}
#game{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;padding:12px;background:rgba(14,9,22,.55);font-family:var(--f-body)}
#game.on{display:flex}
body:not(.inworld) #game{display:none}
#game.hudonly{background:none;pointer-events:none;align-items:flex-start;padding-top:64px}
#game.hudonly .gquit{pointer-events:auto;position:absolute;right:10px;top:118px}
.ghud{background:rgba(20,13,30,.88);color:#F2EAD8;padding:6px 10px;box-shadow:0 0 0 2px #3A2860;display:flex;flex-direction:column;gap:4px;align-items:center;max-width:260px}
.ghud b{font-family:var(--f-pxb);font-size:var(--fs-s);color:#FFD866}
.gpan{width:100%;max-width:340px;background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:var(--r-panel);padding:12px;display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;max-height:100%;overflow:auto}
.gpan.wide{max-width:360px}
.gpan .gt{font-family:var(--f-pxb);font-size:var(--fs-s)}
.gpan canvas{width:100%;max-width:340px;image-rendering:pixelated;box-shadow:0 0 0 2px #22183F;touch-action:none}
.gpl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.gpp{border:2px solid #22183F;padding:2px 6px;background:#fff}
.gsb{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;font-size:var(--fs-s)}
.ghud .gsb span{filter:brightness(1.2)}
.grk{width:100%;display:flex;flex-direction:column;gap:2px}
.grk div{display:grid;grid-template-columns:24px 1fr auto;gap:6px;padding:3px 6px;background:#fff;text-align:left}
.grk div.me{background:#FFE9A8}
.gic{font-size:24px;line-height:32px;width:32px;text-align:center;flex-shrink:0}
.whg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:300px}
.whh{aspect-ratio:1;border:0;background:#3A2E4A;box-shadow:inset 0 -10px 0 #2A2236,0 0 0 2px #22183F;position:relative;overflow:hidden;touch-action:none}
.whh i{position:absolute;left:18%;right:18%;bottom:-70%;height:70%;transition:bottom .08s;background:#E8F0FF;box-shadow:0 0 0 2px #22183F;border-radius:40% 40% 10% 10%}
.whh[data-k="p"] i,.whh[data-k="g"] i,.whh[data-k="b"] i{bottom:12%}
.whh[data-k="g"] i{background:#FFD866}
.whh[data-k="b"] i{background:#4A3A5A;border-radius:10%}
.whh i::before,.whh i::after{content:'';position:absolute;left:26%;top:30%;width:13%;height:15%;background:#22183F}
.whh i::after{left:auto;right:26%}
.whh[data-k="b"] i::before,.whh[data-k="b"] i::after{background:#FF5A6A}
.whh.hit{background:#8CE6B0}
.whh.hitb{background:#C2385E}
.caord{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center}
.cast{border:3px solid;padding:3px;background:#fff;opacity:.85}
.cast.now{transform:scale(1.15);opacity:1;box-shadow:0 0 0 2px #22183F}
.cast.done{opacity:.35}
.caord .arr{color:var(--sub)}
.cain{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;width:100%}
.cain .cell{display:flex;flex-direction:column;align-items:center;padding:6px 2px}
.cain .s{font-size:var(--fs-s);font-family:var(--f-body);line-height:1.4}

.title{background:rgba(20,13,30,.85);color:var(--text);padding:7px 10px 6px;border-radius:10px;display:flex;flex-direction:column;gap:3px;min-width:0;max-width:62%}
.title .b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title .s{color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.stat{background:rgba(20,13,30,.85);color:var(--text);height:32px;padding:0 10px 0 0;border-radius:16px;display:flex;align-items:center;font-family:var(--f-pxb);font-size:var(--fs-s);min-width:84px;justify-content:space-between}
.stat .ic{transform:scale(.85)}
.ribbon{display:flex;align-items:center;gap:6px;padding:0 12px 0 4px;min-height:40px;border-radius:20px;color:var(--text);font-family:var(--f-px);font-size:var(--fs-s);align-self:flex-start;flex-shrink:0}
.ribbon .ic{transform:scale(.8)}
.panel .ribbon{position:static}

/* 본문 */
.panel>*{flex-shrink:0}
.panel{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 14px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:24px}
.sec-h h3{margin:0;font-family:var(--f-pxb);font-size:var(--fs-h);line-height:1.3;color:var(--text)}
.sec-h .meta{font-size:var(--fs-s);color:var(--sub)}
.box{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:56px}
.li + .li{border-top:1px solid var(--line)}
.li .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .d{font-size:var(--fs-s);line-height:1.4;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li.done{opacity:.5}
.hint{font-size:var(--fs-s);line-height:1.5;color:var(--sub);text-align:center;padding:0 8px;min-height:18px}
.hint.on{color:var(--text);background:var(--soft);border-radius:10px;padding:10px 12px;text-align:left}
.tag{font-size:var(--fs-s);line-height:1.3;padding:3px 8px;border-radius:6px;background:var(--soft);color:var(--text);white-space:nowrap}

/* 버튼 3종: 주요(.go/.gold 호박색 채움) · 보조(테두리) · 아이콘(.icbtn 원형 44px) */
.btn{min-height:46px;border:2px solid var(--line2);border-radius:var(--r-btn);background:var(--panel2);color:var(--text);font-family:var(--f-pxb);font-size:var(--fs);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;white-space:nowrap;transition:transform .08s,filter .08s;font-variant-numeric:tabular-nums}
.btn:active:not(:disabled){transform:translateY(1px) scale(.98);filter:brightness(1.12)}
.btn.go,.btn.gold{background:var(--accent);border-color:var(--accent);color:#2A1506}
.btn.dark{background:var(--panel2);color:var(--text)}
.btn.sm{min-height:44px;font-size:var(--fs-s);padding:0 12px}
.btn.ghost{min-height:44px;min-width:64px;border-color:transparent;background:transparent;color:var(--sub);font-family:var(--f-body);font-size:var(--fs-s);padding:0 8px}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;text-align:left;min-height:64px;color:var(--text)}
.tile:active{background:var(--line)}
.tile .main{display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .main .b{font-size:var(--fs);line-height:1.3}
.seg{display:grid;gap:4px;border:0;border-radius:12px;background:var(--panel2);padding:4px}
.seg button{border:0;border-radius:8px;background:transparent;min-height:44px;font-family:var(--f-pxb);font-size:var(--fs-s);color:var(--sub);padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button + button{border-left:0}
.seg button.on{background:var(--accent);color:#2A1506}
.seg.scroll{display:flex;overflow-x:auto;scrollbar-width:none}.seg.scroll button{flex:0 0 auto;min-width:72px}

/* 칸 */
.grid{display:grid;gap:6px}
.cell{border:1px solid var(--line2);border-radius:var(--r-cell);background:var(--panel2);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 2px;position:relative;min-height:64px}
button.cell:not(:disabled):active{background:var(--line)}
.cell.sel{border:2px solid var(--accent);background:var(--line);box-shadow:none}
.cell .n{position:absolute;right:4px;top:2px;font-family:var(--f-pxb);font-size:var(--fs-s);line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.cell .s{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cell .new{position:absolute;left:5px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.slot{border:2px dashed var(--line2);background:var(--soft);min-height:76px}
.slot.on{border-style:solid;border-color:var(--purple);background:var(--panel2)}
.bar{display:grid;gap:2px;background:var(--line);padding:2px;flex:1;border-radius:4px}
.bar i{display:block;height:8px;background:var(--panel2);border-radius:2px}
.meter{display:flex;align-items:center;gap:8px}
.meter .s{width:48px;flex-shrink:0}
.face{overflow:hidden;background:#3A2E5A;display:flex;justify-content:center;flex-shrink:0;position:relative;border-radius:50%}
.dot{position:absolute;right:1px;bottom:1px;width:8px;height:8px;border-radius:50%;border:2px solid var(--panel)}
.pal{display:flex;gap:6px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:6px;height:44px;padding:0 10px 0 2px;border:1px solid var(--line2);border-radius:22px;background:var(--panel2);color:var(--text);font-size:var(--fs-s)}
.pbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.pbar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .3s}

/* 행사 */
.dragon{transform:translate(-50%,-50%) scale(2.2);animation:stomp .6s steps(2) infinite}
.dragon.calm-d{animation:bob 1.6s steps(2) infinite;filter:saturate(1.2)}
@keyframes stomp{50%{transform:translate(-50%,-52%) scale(2.25) rotate(-3deg)}}
@keyframes bob{50%{transform:translate(-50%,-54%) scale(2.2)}}
.calm{position:absolute;left:62%;top:20%;font-family:var(--f-pxb);font-size:36px;color:#FF8FAF;animation:bob2 1.2s steps(2) infinite}
@keyframes bob2{50%{translate:0 -8px}}

/* 꾸미기 */
.avwrap{display:flex;flex-direction:column;gap:12px}
.avstage{position:relative;height:236px;border-radius:12px;background:radial-gradient(circle at 50% 70%,#4A3A7A,#22183F);display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px}
.avstage canvas{width:192px;height:192px;image-rendering:pixelated}
.avstage .btn{position:absolute;right:8px;top:8px}
.avopts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.avo{border:1px solid var(--line2);border-radius:var(--r-cell);background:var(--panel2);padding:4px 2px 2px;display:flex;flex-direction:column;align-items:center;gap:0;min-height:72px;color:var(--text)}
.avo img{width:44px;height:44px;image-rendering:pixelated;object-fit:contain;object-position:center bottom}
.avo .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.avo.on{border:2px solid var(--accent);background:var(--line)}
.sw{width:44px;height:44px;border:2px solid var(--line2);border-radius:50%;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--accent)}

/* 로그인·시작 */
.cover{flex:1;overflow-y:auto;background:url(art/tile.png) repeat;background-size:64px 64px;image-rendering:pixelated;padding:28px 18px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;color:#fff;justify-content:center}
.card{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:var(--r-panel);padding:18px;display:flex;flex-direction:column;gap:12px;max-width:420px;width:100%;margin:0 auto}
.field{display:flex;flex-direction:column;gap:4px}
.field input{height:48px;border:1px solid var(--line2);border-radius:var(--r-btn);background:var(--panel2);padding:0 12px}
.field input:focus{outline:2px solid var(--accent);outline-offset:0}
.err{color:var(--warn);font-size:var(--fs-s);min-height:18px;margin:0}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(20,13,30,.94);color:var(--text);padding:10px 16px;border-radius:12px;border:1px solid var(--accent);font-size:var(--fs-s);z-index:40;max-width:min(90%,420px);text-align:center;animation:toastin .18s;pointer-events:none}
@keyframes toastin{from{transform:translate(-50%,-8px);opacity:0}}
/* @css:bag */
.bag-tabs button{min-height:44px}
.bag-grid{grid-template-columns:repeat(5,minmax(0,1fr))}

.bag-dt{height:200px;flex-shrink:0;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.bag-dt .hd{display:flex;align-items:center;gap:8px;min-height:36px}
.bag-dt .hd .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}

.bag-dt .hd img{width:40px;height:40px;image-rendering:pixelated;object-fit:contain;flex-shrink:0}
.bag-dt .d{font-size:var(--fs-s);line-height:1.45;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
.bag-dt .d.u{color:var(--text)}
.bag-dt .d.on{color:var(--ok)}
.bag-dt .empty{flex:1;display:flex;align-items:center;justify-content:center}
.bag-dt .acts{display:flex;gap:6px;margin-top:auto}
.bag-dt .acts .btn{flex:1;padding:0 6px;min-width:0}
.bag-who{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0;flex-shrink:0}
.bag-who .who{flex:0 0 auto}
/* @css:profile */
.pfstage{height:224px;padding-bottom:6px}
.pfstage .pfturn{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--f-pxb);font-size:var(--fs)}
.pfstage #pfPrev{left:10px}.pfstage #pfNext{right:10px}
.pfstage .pfview{position:absolute;left:50%;top:10px;transform:translateX(-50%)}

.pftiles{grid-template-columns:repeat(3,1fr)}.pftiles .tile{padding:8px 10px;gap:6px}.pftiles .tile .main{gap:0}
.pfgrid{grid-template-columns:repeat(5,1fr)}
.pfgrid .cell.unk .ic{filter:brightness(0) opacity(.35)}
.pfpager{display:flex;align-items:center;gap:6px}.pfpager .icbtn{font-family:var(--f-pxb);font-size:var(--fs-s)}.pfpager .icbtn:disabled{opacity:.35}.pfgrid{gap:5px}
@media (min-width:900px) and (min-height:560px){.pfgrid{grid-template-columns:repeat(8,1fr)}}
/* @css:rel */
.rellist .relrow{width:100%;text-align:left;border:0;background:transparent;color:var(--text);font:inherit;min-height:54px;padding:5px 12px;gap:10px;cursor:pointer}
.rellist .relrow:active{background:var(--soft)}
.relface{width:40px;height:40px}.relface img,.relface .npcspr{width:100%!important;height:100%!important;image-rendering:pixelated}
.relrow .main{gap:3px}.relrow .t b{font-family:var(--f-pxb);font-weight:normal}.relrow .t .d{display:inline;margin-left:4px}
.rh{display:inline-flex;gap:2px;line-height:0}.rh i{width:13px;height:13px;display:inline-block;color:var(--line2)}.rh i.on{color:var(--accent)}
.rh svg{width:100%;height:100%;shape-rendering:crispEdges;fill:currentColor;display:block}.rh.big{gap:3px}.rh.big i{width:18px;height:18px}
.relchk{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:var(--fs-s);color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.relchk .on{color:var(--ok)}.tag.ev{background:var(--accent);color:#2A1506;font-family:var(--f-pxb)}
.relback{width:44px;height:44px;margin:-12px 6px -12px -8px;vertical-align:middle}.relback svg{width:20px;height:20px}
.relhead{display:flex;gap:14px;align-items:center}.relhead .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.relhead .nm{display:flex;align-items:baseline;gap:8px}.relhead .nm b{font-family:var(--f-pxb);font-weight:normal;font-size:var(--fs-h)}.relhead .d{font-size:var(--fs-s);color:var(--sub)}
.relbig{width:80px;height:80px;border:2px solid var(--line2)}.relbig img,.relbig .npcspr{width:100%!important;height:100%!important;image-rendering:pixelated}
.relgifts{padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.relg .lab{display:block;font-size:var(--fs-s);color:var(--sub);margin-bottom:6px}
.relg .grid{display:flex;flex-wrap:wrap;gap:6px}
.relgift{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:72px;min-height:64px;padding:4px 2px;border-radius:var(--r-cell);background:var(--panel);border:1px solid var(--line2);font-size:var(--fs-s);text-align:center}
.relgift .nm{font-size:var(--fs-s);line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.relgift.unk{color:var(--sub);border-style:dashed}.relgift.unk b{font-family:var(--f-pxb);font-size:22px;line-height:28px;font-weight:normal}
.relhint{line-height:1.5}.relbtns{display:flex;gap:8px}.relbtns .btn{flex:1;min-width:0;white-space:normal;line-height:1.3;padding:6px 10px}
/* @css:journal */
.jn-seg button{min-height:44px}
.jn-card{display:flex;flex-direction:column;gap:8px;padding:12px}
.jn-npc{display:flex;align-items:center;gap:10px}

.jn-steps{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.jn-steps .tag{min-width:30px;text-align:center}

.jn-steps .tag.now{background:var(--accent);color:#2A1506}
.jn-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}

.jn-hints{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-s);line-height:1.5;color:var(--text);padding:10px 12px;background:var(--soft);border-radius:10px}
.jn-foot{display:flex;align-items:center;gap:8px}.jn-foot .hint{flex:1;text-align:left;padding:0}

/* @css:menu */
.mtile .tic{flex:0 0 36px;width:36px;height:36px;border-radius:10px;background:var(--panel);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.mtile .tic svg{width:24px;height:24px;shape-rendering:crispEdges;fill:currentColor}

.sli.stack{flex-direction:column;align-items:stretch;gap:8px}.sli.stack .main{flex:0 0 auto}
.sseg{grid-auto-flow:column;grid-auto-columns:1fr;flex:0 0 auto;max-width:100%}.sseg button{min-height:44px;min-width:52px}
.hint.help{line-height:1.6}.hint.help b{color:var(--gold);font-weight:600}

.sv{color:var(--ok)}
/* @css:cook */
.pgnav{display:flex;align-items:center;justify-content:center;gap:10px}.pgnav .num{font-size:var(--fs-s);color:var(--sub);min-width:64px;text-align:center}.pgnav .btn{min-width:56px}
.cell.unk .ic{filter:brightness(0) opacity(.45)}.cell.unk .s{color:var(--sub)}
.cell.can{border-color:var(--ok2)}
.ckcard{display:flex;flex-direction:column;gap:8px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px}
.ckcard .ckh{display:flex;align-items:center;gap:8px;text-align:left}.ckcard .ckh .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.ckcard .ckh .t{font-family:var(--f-pxb);font-size:var(--fs-h);line-height:1.3}.ckcard .ckh .d{font-size:var(--fs-s);line-height:1.4;color:var(--sub)}
.ckneed{display:flex;flex-wrap:wrap;gap:6px}.ckneed span{display:inline-flex;align-items:center;gap:2px;min-height:32px;padding:0 10px 0 4px;border-radius:16px;background:var(--panel);border:1px solid var(--line2);font-size:var(--fs-s);line-height:1.3;font-variant-numeric:tabular-nums}.ckneed span.ok{border-color:var(--ok2);color:var(--ok)}.ckneed span.no{color:var(--sub)}.ckneed span.no .ic{opacity:.5}
.ckbuff{display:flex;flex-wrap:wrap;gap:6px}.ckbuff span{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:18px;background:var(--soft);border:1px solid var(--line2);font-size:var(--fs-s);font-family:var(--f-pxb);color:var(--gold)}
/* @css:clothes */

/* @css:room */

.crstrip{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}

.crname{position:absolute;left:0;right:0;bottom:0;font-size:var(--fs-s);line-height:16px;text-align:center;background:rgba(20,13,30,.78);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mkin{width:88px;height:44px;border:1px solid var(--line2);border-radius:var(--r-btn);background:var(--panel);color:var(--text);padding:0 10px;font-variant-numeric:tabular-nums}

.cauldron.over{box-shadow:0 0 0 3px var(--accent)}

.cpot{position:relative;width:120px;height:110px;display:flex;align-items:center;justify-content:center}

.cauldron.ready .bub{animation:bub 1.6s infinite}.cauldron.ready .b1{left:40px;animation-delay:0s}.cauldron.ready .b2{left:60px;animation-delay:.5s}.cauldron.ready .b3{left:78px;animation-delay:1s}

.cauldron.done .cpot{filter:drop-shadow(0 0 14px var(--gold))}

function fishReel(){

    T: f.junk ? 1.6 : 2 + g * .6,          // 초록 칸에 머물러야 하는 시간(초)
    jit: .1 + g * .065, jf: 1 + g * .3,       // 찌가 흔들리는 세기·빠르기
    yank: f.junk ? 0 : .08 + g * .035, yt: 1.2 + Math.random() * 1.5,   // 가끔 확 당겨요

    <div class="fmeter"><i class="fpg"></i></div><div class="fmeter pat"><i class="fpt"></i></div>
    <span class="s" id="fhits">찌를 초록 칸에 두고 버텨요 (◀ ▶ 버튼을 누르고 있어요)</span>
    <div class="frow fctl"><button class="btn" data-fdir="-1">◀ 왼쪽</button><button class="btn" data-fdir="1">오른쪽 ▶</button></div>`);
  const ui = fishUI(), z = ui.querySelector('.fzone'), bob = ui.querySelector('.fbob'), pg = ui.querySelector('.fpg'), pt = ui.querySelector('.fpt'), pm = ui.querySelector('.fmeter.pat'), tx = ui.querySelector('#fhits');

// 2. 불 맞추기: 꾹 누르면 올라가고 떼면 내려가요, 움직이는 초록 칸에 3초
function cookHeat(){
  const C = cooking; if (!C) return;
  C.heat = .2; C.hold = false; C.inz = 0; C.over = 0; C.t0 = performance.now(); C.zc = .55;
  cookShow(`${cookHead(C.d, 2)}<span>꾹 누르면 불이 세지고, 떼면 약해져요 · 초록 칸에 3초</span><div class="cktb"><i class="z"></i><i class="n"></i></div><div class="cktl"><span>미지근</span><span>딱 좋아요</span><span>넘쳐요!</span></div>
    <div class="ckpg"><i></i></div><span class="sub" id="ckhs"></span><button class="ckbt fire" id="ckfan">🪭 꾹 눌러 부채질</button>`);
  const fan = $('#ckfan'); fan.onpointerdown = e => { e.preventDefault(); C.hold = true; fan.classList.add('press'); }; const up = () => { if (cooking) { C.hold = false; fan.classList.remove('press'); } };
  fan.onpointerup = up; fan.onpointerleave = up; fan.onpointercancel = up;
  let last = performance.now();
  const loop = now => { if (!cooking || C.phase === 'stir') return; const dt = Math.min(.05, (now - last) / 1000), T = (now - C.t0) / 1000; last = now;
    C.heat = Math.max(0, Math.min(1, C.heat + (C.hold ? .55 : -.4) * dt)); C.zc = .55 + Math.sin(T * .9) * .18; const zw = .18, inz = Math.abs(C.heat - C.zc) < zw / 2;
    if (inz) C.inz += dt; if (C.heat > .97) C.over += dt;
    const z = cookUI().querySelector('.cktb .z'), n = cookUI().querySelector('.cktb .n'); if (z){ z.style.left = (C.zc - zw / 2) * 100 + '%'; z.style.width = zw * 100 + '%'; n.style.left = C.heat * 100 + '%'; cookUI().querySelector('.ckpg i').style.width = Math.min(100, C.inz / 3 * 100) + '%'; $('#ckhs').textContent = `${inz ? '딱 좋아요!' : C.heat > C.zc ? '너무 뜨거워요' : '조금 더 세게'} · ${Math.min(3, C.inz).toFixed(1)} / 3초 · ${Math.max(0, 12 - T).toFixed(0)}초 남음`; }

}
// 3. 휘휘 젓기: 동그라미 패드를 빙글빙글 5바퀴, 너무 빠르면 국물이 튀어요
function cookStir(){
  const C = cooking; if (!C) return;
  C.turn = 0; C.acc = 0; C.splash = 0; C.t0 = performance.now(); C.lastTurn = performance.now(); C.ang = null; C.spoon = 0;
  cookShow(`${cookHead(C.d, 3)}<span>동그라미를 따라 빙글빙글 돌려요 · 5바퀴</span><div class="ckpad" id="ckpad"><i id="ckdot"></i><b>여기를 빙글빙글</b></div><div class="ckpg"><i></i></div><span class="sub" id="ckss">0 / 5바퀴 · 일정한 속도가 최고!</span>`);
  const pad = $('#ckpad'), dot = $('#ckdot');
  const mv = e => { if (!cooking) return; const r = pad.getBoundingClientRect(), a = Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2));
    if (C.ang !== null){ let da = a - C.ang; if (da > Math.PI) da -= Math.PI * 2; if (da < -Math.PI) da += Math.PI * 2; C.acc += Math.abs(da); C.spoon += da; }
    C.ang = a; dot.style.left = (50 + Math.cos(a) * 40) + '%'; dot.style.top = (50 + Math.sin(a) * 40) + '%';
    if (C.acc >= Math.PI * 2){ C.acc -= Math.PI * 2; C.turn++; const dt = performance.now() - C.lastTurn; C.lastTurn = performance.now(); if (dt < 350){ C.splash++; toast('첨벙! 너무 빨라요'); }

      if (C.turn >= 5){ const T = (performance.now() - C.t0) / 1000; C.sc[2] = Math.max(1, 3 - C.splash - (T > 10 ? 1 : 0)); pad.onpointermove = null; setTimeout(cookDone, 300); } }

  if (np) uses.push(`물약 재료 ${np}종`); if (nd) uses.push(`요리 재료 ${nd}종`); if (gift) uses.push(gift);

    if (C.sheet === 'fish') return { desc: `${STARS(C.grade)} · ${C.cm[0]}~${C.cm[1]}cm · ${C.time ? TIME_NAME[C.time] + '에만' : '아무 때나'} 잡혀요 · 값 ${C.pay}G`, use: uses.join(' · ') || '요리 재료 · 선물용' };
    return { desc: `${STARS(C.grade)} · ${[...C.z].map(z => BAG_ZONE[z]).join('·')}에서 주워요 · 값 ${C.pay}G`, use: uses.join(' · ') || '물약·요리 재료' }; }
  const G = SEED_INFO[k]; if (G) return { desc: `온실에서 기르는 식물 재료 · ${G.tier + 1}등급 · ${timeText(G.mins * 6e4)} 자라요`, use: uses.join(' · ') || '물약 재료' };

}

// ===== 수업: 하루 10교시. 과목을 골라 라운드를 이어 가다가, 틀리면 그 교시가 끝나요 =====
// goal 라운드까지 성공하면 지식 +1, 그 뒤로는 한 라운드 성공할 때마다 지식 +1
const CLASS_MAX = 10;
const SUBJECTS = [
  { id:'rune',  name:'문양학',   icon:'rune',  goal:4, desc:'칠판 문양을 보고 순서대로 눌러요', rule:'4개부터 하나씩 늘어나요 · 7개까지 성공하면 지식 +1' },
  { id:'herb',  name:'약초학',   icon:'herb',  goal:3, desc:'약초 그림을 보고 이름을 맞혀요', rule:'3문제 맞히면 지식 +1 · 그 뒤론 그림이 조금씩만 보여요' },
  { id:'fly',   name:'비행학',   icon:'star',  goal:3, desc:'빗자루를 타고 묘비 사이를 날아요', rule:'화면을 누르면 떠올라요 · 묘비 5개가 한 라운드 · 3라운드 성공하면 지식 +1' },
  { id:'beast', name:'마법생물학', icon:'heart', goal:3, desc:'뒤집힌 동물 카드의 짝을 찾아요', rule:'시간 안에 짝을 다 찾아요 · 3라운드 성공하면 지식 +1' },
];
const SUBJ = Object.fromEntries(SUBJECTS.map(x => [x.id, x]));
const RUNES = ['star','drop','herb','scale'], RUNE_KO = { star:'별', drop:'물', herb:'잎', scale:'불' };
const classLeft = () => me.classDay === me.day ? Math.max(0, CLASS_MAX - (me.classCnt || 0)) : CLASS_MAX;
const knowToNext = () => KNOW_PER_HINT - ((me.know || 0) % KNOW_PER_HINT);
let lesson = null, lessonTimer = 0, lessonIv = 0, flyRaf = 0, flyKey = null;
document.addEventListener('keydown', e => { if (flyKey && sub === 'class') flyKey(e); });
function stopLesson(){ clearTimeout(lessonTimer); clearInterval(lessonIv); cancelAnimationFrame(flyRaf); flyKey = null; }
function endLesson(){ stopLesson(); lesson = null; }
function gainKnow(){
  me.know = (me.know || 0) + 1;
  let msg = `지식 +1 (지식 ${me.know})`;
  if (me.know % KNOW_PER_HINT === 0){
    const next = HINT_ORDER.find(p => !me.hints.includes(p));
    if (next){ me.hints.push(next); msg += ` · 새 레시피: ${HINTS[next]}`; }
    else { me.coin += 30; msg += ' · 모든 레시피를 알아요. 장학금 +30G'; }
  }
  save(); return msg;
}
function startSubject(id){
  if (classLeft() < 1) return;
  if (me.classDay !== me.day){ me.classDay = me.day; me.classCnt = 0; }
  me.classCnt++; save();
  stopLesson();
  lesson = { s: id, round: 1, earned: 0, phase: 'play', msg: '', log: [] };
  nextRound(true);
}
// 라운드 성공: goal 라운드부터 지식 +1
function roundWon(){
  const L = lesson, g = SUBJ[L.s].goal;
  if (L.round >= g){ L.earned++; L.msg = (L.round === g ? `${g}라운드 달성! ` : `${L.round}라운드 성공! `) + gainKnow(); }
  else L.msg = `${L.round}라운드 성공! ${g}라운드까지 ${g - L.round}번 남았어요`;
  L.round++; L.won = true;
}
function lessonOver(why){
  const L = lesson; if (!L || L.phase === 'over') return;
  stopLesson(); L.phase = 'over'; L.why = why; save();
  if (sub === 'class') renderClass();
}
function nextRound(first){
  const L = lesson; if (!L) return;
  L.won = false;
  if (L.s === 'rune'){
    const n = Math.min(10, 3 + L.round);
    L.seq = Array.from({ length: n }, () => RUNES[Math.floor(Math.random() * 4)]); L.input = []; L.step = 'show';
    lessonTimer = setTimeout(() => { if (lesson === L && L.step === 'show'){ L.step = 'input'; if (sub === 'class') renderClass(); } }, 1200 + n * 450);
  } else if (L.s === 'herb'){
    const pool = SEED_LIST, ans = pool[Math.floor(Math.random() * pool.length)];
    const same = pool.filter(x => x.id !== ans.id && (L.round <= 3 || x.tier === ans.tier));
    const others = shuffle(same.length >= 3 ? same : pool.filter(x => x.id !== ans.id)).slice(0, 3);
    L.ans = ans.id; L.opts = shuffle([ans, ...others]).map(x => x.id); L.pick = null;
    // 4라운드부터 일부만: 보이는 창이 점점 작아져요
    const w = L.round <= 3 ? 1 : Math.max(.26, .6 - (L.round - 4) * .06);
    const x = w >= 1 ? 0 : .12 + Math.random() * (.76 - w), y = w >= 1 ? 0 : .12 + Math.random() * (.76 - w);
    L.win = [x, y, w];
  } else if (L.s === 'beast'){
    const pairs = [3, 4, 6][L.round - 1] || 8;
    const secs = L.round <= 3 ? pairs * 7 : Math.max(18, 44 - (L.round - 4) * 4);
    const ks = shuffle(CREATURES.map((_, k) => k)).slice(0, pairs);
    L.cards = shuffle([...ks, ...ks]).map(k => ({ k, open: false, done: false })); L.flip = []; L.busy = false;
    L.end = Date.now() + secs * 1000; L.secs = secs;
    clearInterval(lessonIv);
    lessonIv = setInterval(() => {
      if (lesson !== L){ clearInterval(lessonIv); return; }
      const left = L.end - Date.now(), bar = $('#bTime');
      if (bar){ bar.style.width = Math.max(0, left / (L.secs * 1000) * 100) + '%'; $('#bLeft').textContent = Math.ceil(Math.max(0, left) / 1000) + '초'; }
      if (left <= 0) lessonOver('시간이 다 됐어요');
    }, 200);
  } else if (L.s === 'fly'){
    if (first) L.fly = null;   // 캔버스가 그려진 뒤 flyStart
  }
  renderClass();
}
function runeTap(k){
  const L = lesson; if (!L || L.step !== 'input') return;
  L.input.push(k);
  const i = L.input.length - 1;
  if (L.input[i] !== L.seq[i]){ L.step = 'fail'; renderClass(); return lessonOver('문양 순서가 틀렸어요'); }
  if (L.input.length === L.seq.length){
    L.step = 'ok'; roundWon(); renderClass();
    lessonTimer = setTimeout(() => { if (lesson === L) nextRound(); }, 1100);
    return;
  }
  renderClass();
}
function herbPick(id){
  const L = lesson; if (!L || L.pick) return;

    const dt = Math.min(.033, (now - last) / 1000); last = now; st.t += dt;

      nextCol -= dt;

      st.cols.forEach(c => { c.x -= speed() * dt; });

        if (!c.done && c.x + 26 < 70){
          c.done = true; st.passed++;

}

        <div class="sec-h"><h3>${me.found.includes(dexSel) || me.hints.includes(dexSel) ? ITEM[dexSel] : '아직 모르는 물약'}</h3>${sel.time ? houseTag(sel.time) : `<span class="meta">주문 ${sel.pay}G</span>`}</div>
        ${sel.time ? `<span class="s" style="color:${HOUSES[sel.time].col}">${HOUSES[sel.time].name}의 시간(${hoursText(HOUSES[sel.time])})에만 끓어요 · 주문 ${sel.pay}G</span>` : ''}
        <span class="s">${me.hints.includes(dexSel) || me.found.includes(dexSel) ? '레시피 · ' + recipeText(dexSel) : '수업을 듣거나, 재료를 섞어 보며 찾아봐요.'}</span>
        ${sel.use ? `<span class="s sub">마시면 · ${sel.use}</span>` : sel.desc ? `<span class="s sub">${sel.desc}</span>` : ''}
        <div class="frow" style="display:flex;gap:8px">${me.hints.includes(dexSel) ? `<button class="btn sm go" id="dexBrew">솥에 넣기</button>` : ''}${sel.use ? `<button class="btn sm" id="drink" ${me.inv[dexSel] ? '' : 'disabled'}>마시기 (${me.inv[dexSel] || 0}병)</button>` : ''}</div>
      </div>` : '<div class="hint">물약을 누르면 레시피와 쓰임새를 볼 수 있어요</div>'}
    </section>`;
  }
  frame('lab', '물약 교실', `물약 도감 ${n} / ${POTIONS.length}`, tabs + body);
  on('[data-labtab]', b => { labTab = b.dataset.labtab; renderLab(); });
  on('[data-add]', b => labAdd(b.dataset.add));
  on('[data-take]', b => { slots.splice(+b.dataset.take, 1); brewDone = null; renderLab(); });
  on('[data-dex]', b => { dexSel = dexSel === b.dataset.dex ? null : b.dataset.dex; renderLab(); });
  on('[data-recipe]', b => { labFill(b.dataset.recipe); brewDone = null; renderLab(); });
  on('[data-dexpage]', b => { dexPage = +b.dataset.dexpage; dexSel = null; renderLab(); });
  const ma = $('#matAll'); if (ma) ma.onclick = () => { matAll = !matAll; renderLab(); };
  const rp = $('#recipePick'); if (rp) rp.onclick = () => { recipeOpen = !recipeOpen; renderLab(); };
  const dk = $('#drink'); if (dk) dk.onclick = () => { brewMsg = usePotion(dexSel); toast(brewMsg); renderLab(); };
  const db_ = $('#dexBrew'); if (db_) db_.onclick = () => { labFill(dexSel); brewDone = null; labTab = 'brew'; renderLab(); };
  const bb = $('#brewBag'); if (bb) bb.onclick = () => { brewDone = null; renderLab(); };
  const ba = $('#brewAgain'); if (ba) ba.onclick = () => { const p = brewDone.p; brewDone = null; labFill(p); renderLab(); };
  // 끌어다 놓기: 재료 칸 → 솥 (마우스는 HTML 드래그, 손가락은 포인터로)
  const pot = $('#cauldron');
  if (pot){
    app.querySelectorAll('.mat[draggable="true"]').forEach(c => { c.ondragstart = e => { dragK = c.dataset.add; e.dataTransfer.setData('text', dragK); };
      c.onpointerdown = e => { if (e.pointerType === 'mouse') return; dragK = c.dataset.add; const g = document.createElement('div'); g.className = 'dragghost'; g.innerHTML = ic(dragK); document.body.appendChild(g); const mv = ev => { g.style.left = ev.clientX + 'px'; g.style.top = ev.clientY + 'px'; const r = pot.getBoundingClientRect(); pot.classList.toggle('over', ev.clientX > r.left && ev.clientX < r.right && ev.clientY > r.top && ev.clientY < r.bottom); };
        const up = ev => { document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); g.remove(); const r = pot.getBoundingClientRect(); const inside = ev.clientX > r.left && ev.clientX < r.right && ev.clientY > r.top && ev.clientY < r.bottom; pot.classList.remove('over'); if (inside) labAdd(dragK); dragK = null; };
        mv(e); document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up); }; });
    pot.ondragover = e => { e.preventDefault(); pot.classList.add('over'); }; pot.ondragleave = () => pot.classList.remove('over');
    pot.ondrop = e => { e.preventDefault(); pot.classList.remove('over'); const k = e.dataTransfer.getData('text') || dragK; if (k) labAdd(k); };
  }
  const br = $('#brew'); if (br) br.onclick = () => {
    const key = slots.slice().sort().join(',');
    const p = RECIPES[key], T = p && POTION_INFO[p].time;
    if (T && houseNow() !== T){
      brewMsg = `솥이 잠잠해요... 이 조합은 ${HOUSES[T].name}의 시간(${hoursText(HOUSES[T])})에만 끓어요. 재료는 그대로 있어요.`;
      return renderLab();
    }
    const used = slots.slice(); slots.forEach(k => me.inv[k]--);
    me.mana -= brewCost(); sfx('bubble');
    let msg;
    if (p){
      me.inv[p]++;
      const isNew = !me.found.includes(p);
      if (isNew) me.found.push(p);
      if (!me.hints.includes(p)) me.hints.push(p);
      msg = isNew ? '도감에 새로 적었어요!' : '완성!';
      dexSel = p; dexPage = Math.floor(POTIONS.indexOf(p) / DEX_PAGE); toast(`${ITEM[p]} 완성!`);
    } else if (me.house === 'ember' && myTime()){
      const back = slots[Math.floor(Math.random() * 3)]; me.inv[back]++;
      msg = `보라색 연기만 피어올랐어요... 그래도 Emberkiln의 낮이라 ${withJosa(ITEM[back], '을', '를')} 건졌어요.`;
    } else msg = '보라색 연기만 피어올랐어요... 재료는 사라졌어요.';
    const again = p && used.every(k => (me.inv[k] || 0) >= used.filter(x => x === k).length);
    brewDone = { p, msg, again }; brewMsg = null; slots = []; save(); hud(); renderLab();
  };
}

// ===== 온실 =====
// 화단 칸: k 심은 씨앗(없으면 빈 칸), at 심은 시각, w 물 줬는지 (물을 주면 25% 빨리 자라요)
const growMs = p => SEED_INFO[p.k].mins * 6e4 * (p.w ? .75 : 1) * (me.perk?.greenhouse_growth ? .85 : 1);   // 맨디 ♥10: 온실 성장 보너스
const plotLeft = p => p.k ? Math.max(0, p.at + growMs(p) - Date.now()) : 0;
const plotReady = p => !!p.k && plotLeft(p) <= 0;
const plotFrac = p => p.k ? Math.min(1, 1 - plotLeft(p) / growMs(p)) : 0;
const timeText = ms => { const m = Math.ceil(ms / 6e4); return ms < 6e4 ? `${Math.ceil(ms / 1000)}초` : m < 60 ? `${m}분` : `${Math.floor(m / 60)}시간${m % 60 ? ` ${m % 60}분` : ''}`; };
// 화단은 기본 2칸, 지식과 골드를 내면 한 칸씩 늘려 최대 10칸까지. 칸 수는 사람마다 따로예요.
const PLOT_MIN = 2, PLOT_MAX = 10;
const PLOT_COST = [[5, 150], [10, 300], [20, 500], [30, 800], [60, 1200], [100, 1800], [140, 2600], [180, 3600]];   // [필요 지식, 골드] · 3번째 칸부터
const plotNext = () => PLOT_COST[Math.max(0, (me.plots || []).length - PLOT_MIN)];
let seedPick = 'herb', greenMsg = '', seedTier = 0, plantFor = null;   // plantFor: 심을 칸 번호 (빈 칸을 누르면 하단에 씨앗이 떠요)
// 빈 칸을 누르면 하단에 뜨는 씨앗 고르기: 누르면 바로 심어요
function plantPicker(know){
  const open = SEED_TIERS.filter(k => k <= know); if (!open.includes(SEED_TIERS[seedTier])) seedTier = SEED_TIERS.indexOf(open[open.length - 1]);
  const list = SEED_LIST.filter(x => x.know === SEED_TIERS[seedTier]);
  return `<div class="plantpick px"><div class="pph"><b>${plantFor + 1}번 칸에 심을 씨앗</b><button class="btn sm" data-pclose="1">닫기</button></div>
    ${open.length > 1 ? `<div class="seg scroll">${open.map(k => `<button class="${SEED_TIERS[seedTier] === k ? 'on' : ''}" data-stier="${SEED_TIERS.indexOf(k)}">${k ? `지식 ${k}` : '기본'}</button>`).join('')}</div>` : ''}
    <div class="ppg">${list.map(x => { const no = me.coin < x.price; return `<button class="cell ${no ? 'dim' : ''}" data-plant="${x.id}">${ic(x.id)}<span class="s">${x.seed}</span><span class="s sub">${x.price ? x.price + 'G' : '무료'} · ${timeText(growMins[x.id] * 6e4)}</span></button>`; }).join('')}</div></div>`;
}
function renderGreen(){
  const ready = me.plots.filter(plotReady).length, know = me.know || 0;
  const tierKnow = SEED_TIERS[seedTier], list = SEED_LIST.filter(x => x.know === tierKnow);
  const P = SEED_INFO[seedPick] || SEED_INFO.herb;
  const tabs = [['plot', `화단${ready ? ` · 수확 ${ready}` : ''}`], ['seed', '씨앗 고르기']];
  let body = '';
  const picking = plantFor !== null && me.plots[plantFor] && !me.plots[plantFor].k;
  if (greenTab === 'plot'){
    body = `<section class="sec" style="${picking ? 'padding-bottom:22vh' : ''}">
      ${secH('화단', waterCost() ? '물 주기 마력 1' : '물 주기 무료')}
      <div class="grid" style="grid-template-columns:repeat(3,1fr)">
        ${me.plots.map((p, i) => {
          const G = p.k && SEED_INFO[p.k], rd = plotReady(p);
          const fr = plotFrac(p), icon = !p.k ? 'seed' : rd ? p.k : fr < .34 ? 'seed' : fr < .8 ? 'sprout' : p.k;
          const label = !p.k ? '심기' : rd ? '수확!' : `${timeText(plotLeft(p))} 남음`;
          return `<button class="cell ${!p.k ? 'slot' : ''} ${picking && plantFor === i ? 'sel' : ''}" data-plot="${i}" style="min-height:96px;${rd ? 'border:2px solid var(--ok);background:var(--soft)' : p.w ? 'background:var(--soft)' : ''}">
            ${ic(icon, !p.k ? 'opacity:.3' : !rd && icon === p.k ? 'opacity:.7' : '')}<span class="s">${G ? G.seed : '빈 칸'}${G && !rd && p.w ? ' 💧' : ''}</span><span class="s ${rd ? 'b' : 'sub'}" style="${rd ? 'color:var(--ok)' : ''}" ${p.k && !rd ? `data-left="${i}"` : ''}>${label}</span>
            ${G ? `<div style="width:60px;display:flex">${segs(Math.round(fr * 10), 10, 'var(--ok)')}</div>` : ''}</button>`;
        }).join('')}
              </div>
      ${me.plots.length < PLOT_MAX ? (([nk, ng]) => `<button class="btn ghost" id="morePlot" style="align-self:center;${know < nk ? 'opacity:.6' : ''}">${know < nk ? '🔒 ' : ''}화단 한 칸 늘리기 · 지식 ${nk} · ${ng}G (${me.plots.length} / ${PLOT_MAX})</button>`)(plotNext()) : '<div class="hint" style="text-align:center">화단을 10칸까지 다 늘렸어요!</div>'}
      ${hint(greenMsg, '빈 칸을 누르면 아래에 심을 씨앗이 떠요 · 자라는 칸을 누르면 물을 줘요 (25% 빨리 자라요) · 다 자라면 눌러서 수확해요')}
    </section>
    ${picking ? plantPicker(know) : ''}`;
  } else {

      ${secH('씨앗 고르기', `지식 ${know}`)}
      <div class="seg scroll">${SEED_TIERS.map((k, i) => `<button class="${seedTier === i ? 'on' : ''}" data-stier="${i}" style="${know < k ? 'opacity:.55' : ''}">${k ? `${know < k ? '🔒 ' : ''}지식 ${k}` : '기본'}</button>`).join('')}</div>
      <div class="grid" style="grid-template-columns:repeat(4,1fr)">${list.map(x => { const lock = know < x.know; return `<button class="cell ${seedPick === x.id ? 'sel' : ''}" data-seed="${x.id}" ${lock ? 'disabled' : ''}>${ic(x.id, lock ? 'filter:grayscale(1);opacity:.4' : '')}<span class="s">${x.seed}</span><span class="s num ${x.price ? '' : 'sub'}" style="${x.price ? 'color:var(--gold)' : ''}">${lock ? '🔒' : x.price ? x.price + 'G' : '무료'}</span>${me.inv[x.id] ? `<span class="n">${me.inv[x.id]}</span>` : ''}</button>`; }).join('')}</div>
      <div class="box px" style="padding:10px 12px;display:flex;align-items:center;gap:10px">${ic(P.id)}
        <div style="flex:1;display:flex;flex-direction:column;gap:2px;min-width:0"><span class="s b">${P.seed} 씨앗</span><span class="s sub">${timeText(P.mins * 6e4)} 자라서 「${P.mat}」 ${P.yield}개 · 씨앗 값 ${P.price ? P.price + 'G' : '무료'}</span></div>
        <button class="btn sm go" data-gtab="plot">심으러</button>
      </div>
      ${hint('', `지식이 오르면 새 씨앗이 열려요 · 심을 수 있는 씨앗 ${SEED_LIST.filter(x => x.know <= know).length} / ${SEED_LIST.length}종`)}
    </section>`;
  }
  frame('green', '독초 온실', ready ? `수확할 칸 ${ready}개` : `심을 수 있는 씨앗 ${SEED_LIST.filter(x => x.know <= know).length} / ${SEED_LIST.length}종`, segRow('gtab', greenTab, tabs) + body);
  on('[data-gtab]', b => { greenTab = b.dataset.gtab; renderGreen(); });
  on('[data-stier]', b => { seedTier = +b.dataset.stier; renderGreen(); });
  on('[data-seed]', b => { seedPick = b.dataset.seed; greenMsg = ''; renderGreen(); });
  const mp = $('#morePlot'); if (mp) mp.onclick = () => {
    const [nk, ng] = plotNext();
    if (me.plots.length >= PLOT_MAX) return;
    if ((me.know || 0) < nk){ greenMsg = `지식 ${nk}부터 늘릴 수 있어요.`; return renderGreen(); }
    if (me.coin < ng){ greenMsg = `골드 ${ng}G가 부족해요.`; return renderGreen(); }
    me.coin -= ng; me.plots.push({ k: null }); greenMsg = `화단이 한 칸 늘었어요! -${ng}G (${me.plots.length} / ${PLOT_MAX})`; save(); hud(); renderGreen();
  };
  on('[data-pclose]', () => { plantFor = null; renderGreen(); });
  on('[data-plant]', b => {
    const p = me.plots[plantFor], G = SEED_INFO[b.dataset.plant]; if (!p || p.k) return;
    if ((me.know || 0) < G.know) greenMsg = `지식 ${G.know}부터 심을 수 있어요.`;
    else if (me.coin < G.price) greenMsg = `씨앗 값 ${G.price}G가 부족해요.`;
    else { me.coin -= G.price; seedPick = G.id; Object.assign(p, { k: G.id, at: Date.now(), w: false }); greenMsg = `${G.seed} 씨앗을 심었어요. ${timeText(G.mins * 6e4)} 뒤에 수확해요.${G.price ? ` -${G.price}G` : ''}`; plantFor = null; save(); hud(); sfx('pop'); }
    renderGreen();
  });
  on('[data-plot]', b => {
    const i = +b.dataset.plot, p = me.plots[i];
    if (!p.k){ plantFor = plantFor === i ? null : i; greenMsg = ''; renderGreen(); setTimeout(() => document.querySelector('[data-plot].sel')?.scrollIntoView({ block: 'start', behavior: 'smooth' }), 30); return; }
    plantFor = null;
    if (plotReady(p)){ const g = SEED_INFO[p.k], n = g.yield + (me.house === 'dew' && myTime() ? 1 : 0); me.inv[p.k] += n; me.plots[me.plots.indexOf(p)] = { k: null }; greenMsg = `${g.seed} 수확! ${g.mat} +${n}${n > g.yield ? ' (Dewmorn의 새벽 보너스)' : ''}`; }

    else if (me.mana < waterCost()) greenMsg = '마력이 부족해요. 내 방 침대에서 쉬고 오세요.';

  clearInterval(greenTick);

    app.querySelectorAll('[data-left]').forEach(el => { el.textContent = `${timeText(plotLeft(me.plots[+el.dataset.left]))} 남음`; });
  }, 1000);
}
let greenTick = 0;
// ===== 채소 가게: 온실에서 키운 것을 사 줘요 (값은 시간대마다) =====
let vgMsg = '', vgPg = 0;
function renderVeg(){
  const have = SEED_LIST.map(x => x.id).filter(k => me.inv[k] > 0), PER = 5; vgPg = pgClamp(vgPg, have.length, PER);
  const total = have.reduce((t, k) => t + sellPay(k, cropBase(k)) * me.inv[k], 0);
  frame(null, '채소 가게', `온실 수확물을 사 줘요 · 지금은 ${TIME_NAME[houseNow()]}`, `<section class="sec">
    ${hint(vgMsg, '물건마다 잘 팔리는 시간대가 달라요 · ▲ 표시일 때 팔면 이득이에요')}
    ${have.length ? `<div class="box px">${pgSlice(have, vgPg, PER).map(k => `<div class="li">${ic(k)}<div class="main"><span class="t">${esc(ITEM[k])} ×${me.inv[k]}</span><span class="d">1개 ${sellPay(k, cropBase(k))}G · ${sellTag(k)}</span></div><button class="btn sm" data-vsell="${k}">1개</button><button class="btn sm go" data-vsall="${k}">다 팔기</button></div>`).join('')}</div>
      ${pgNav('vgpg', vgPg, have.length, PER)}
      <button class="btn gold" id="vgAll" style="width:100%">전부 팔기 · ${total.toLocaleString()}G</button>` : '<div class="hint">팔 게 없어요. 독초 온실에서 키워 오세요.</div>'}
  </section><div style="display:flex;gap:8px">${backBtn}</div>`);
  $('#back').onclick = closeSheet;
  on('[data-vgpg]', b => { vgPg = +b.dataset.vgpg; renderVeg(); });
  const sell = (k, n) => { n = Math.min(n, me.inv[k]); if (n <= 0) return 0; me.inv[k] -= n; const g = sellPay(k, cropBase(k)) * n; me.coin += g; return g; };
  on('[data-vsell]', b => { const g = sell(b.dataset.vsell, 1); vgMsg = `${ITEM[b.dataset.vsell]} 1개를 팔았어요. +${g}G`; save(); hud(); renderVeg(); });
  on('[data-vsall]', b => { const k = b.dataset.vsall, n = me.inv[k], g = sell(k, n); vgMsg = `${ITEM[k]} ${n}개를 팔았어요. +${g}G`; save(); hud(); renderVeg(); });
  $('#vgAll') && ($('#vgAll').onclick = () => { let g = 0, n = 0; have.forEach(k => { n += me.inv[k] || 0; g += sell(k, me.inv[k] || 0); }); vgMsg = `${n}개를 팔았어요. +${g.toLocaleString()}G`; save(); hud(); renderVeg(); });
}

// ===== 사육장 =====
// ===== 내 사육장 (사육장 건물의 내 우리) =====
let crSel = 0, ranchMsg = '', ranchTab = 'pen', partner = null, placing = null, ranchTick = 0;
const cdText = ms => ms <= 0 ? '지금' : timeText(ms);
function hatchToPen(i){
  const e = me.eggs[i]; if (!e || eggLeft(e) > 0) return;
  if (me.cr.length >= PEN_MAX){ placing = i; ranchMsg = `사육장이 꽉 찼어요 (${PEN_MAX}마리). 입양 보낼 아이를 한 마리 골라 주세요.`; return; }
  const c = newCreature(e.k, e.col); me.cr.push(c); me.eggs.splice(i, 1);
  ranchMsg = `${c.name}(${withJosa(CREATURES[c.k].baby, '이', '가')}) 사육장에 들어왔어요!${c.col.rare ? ` 처음 보는 색 「${c.col.n}」이에요!` : ''}`;
  crSel = me.cr.length - 1; ranchTab = 'pen'; placing = null; save();
}
function adoptOut(i){
  const c = me.cr[i], d = CREATURES[c.k];
  me.cr.splice(i, 1); me.inv[d.mat] = (me.inv[d.mat] || 0) + 1; me.coin += 30;
  if (crSel >= me.cr.length) crSel = Math.max(0, me.cr.length - 1);
  return `${withJosa(c.name, '이', '가')} 새 가족을 찾아 떠났어요. 고맙다며 ${ITEM[d.mat]} +1 · 30G를 남겼어요.`;
}
function renderRanch(){
  if (crSel >= me.cr.length) crSel = 0;
  const c = me.cr[crSel], d = c && CREATURES[c.k], now = Date.now();
  const ready = me.eggs.filter(e => eggLeft(e) <= 0).length;
  const tabs = segRow('rtab', ranchTab, [['pen', `사육장 ${me.cr.length}/${PEN_MAX}`], ['hatch', `부화실 ${me.eggs.length}/${HATCH_MAX}${ready ? ' ●' : ''}`], ['shop', '알 가게']]);
  const crCell = (x, attr, on_, size = .42) => `<button class="cell ${on_ ? 'sel' : ''}" ${attr} style="width:62px;height:66px;min-height:0;padding:0 0 14px;overflow:hidden;flex:0 0 62px">${crSprite(x, size)}<span class="crname">${esc(x.name)}</span></button>`;
  let body = '';

// 쉬기: 침대에서 30분 동안 쉬면 마력이 차요 (그동안은 아무것도 못 해요). 하루는 진짜 날짜로 넘어가요
const REST_MS = 30 * 6e4;
function rest(){
  if (me.rest) return showRest();
  const since = me.lastSleepAt || 0;
  const guests = Math.min(3, new Set(Object.values(myGuest).filter(g => g.at > since).map(g => g.uid)).size);
  const cozy = Math.min(COZY_MAX, cozyOf(me)), hall = (commonStage(me.house) - 1) * 2, gain = 20 + cozy * 2 + guests * 3 + hall;
  me.lastSleepAt = Date.now();
  me.rest = { at: Date.now(), until: Date.now() + REST_MS, gain, cap: 50 + cozy * 2 + guests * 3 + hall, why: `아늑함 +${cozy * 2}${hall ? `, 휴게실 +${hall}` : ''}${guests ? `, 손님 ${guests}명 +${guests * 3}` : ''}` };
  endLesson(); save(); closeSheet(); speak('💤 쉬는 중이에요');
  showRest();
}
function restEnd(early){
  const R = me.rest; if (!R) return;
  const k = early ? Math.max(0, Math.min(1, (Date.now() - R.at) / (R.until - R.at))) : 1, g = Math.floor(R.gain * k);
  const before = me.mana; me.mana = Math.max(me.mana, Math.min(R.cap, me.mana + g)); me.rest = null; save(); hud();
  clearInterval(restTimer); $('#rest').classList.remove('on'); $('#rest').innerHTML = '';
  toast(early ? `일찍 일어났어요. 마력 +${me.mana - before}` : `푹 쉬었어요! 마력 +${me.mana - before} (${R.why})`);
  if (!early) storyHook('rest');
}
let restTimer = 0;
function showRest(){
  const R = me.rest; if (!R) return;
  if (Date.now() >= R.until) return restEnd(false);
  const A = World.Avatar, fc = A.meta.parts.face.findIndex(p => p.id === 'face_closed'), av = { ...avOf(me), ...(fc >= 0 ? { face: fc } : {}) };
  $('#rest').innerHTML = `<div class="rbox px"><div class="rbed"><canvas id="rcv" width="96" height="56"></canvas><span class="zz">Z<b>z</b><b>z</b></span></div>
    <b class="gt">쉬고 있어요</b><span class="s" id="rleft"></span><span class="s sub">다 쉬면 마력 +${R.gain} (${R.why}) · 쉬는 동안은 아무것도 못 해요</span>
    <button class="btn sm" id="rwake">일찍 일어나기</button></div>`;
  $('#rest').classList.add('on');
  // 픽셀 침대: 뒤판 → 누운 캐릭터(왼쪽으로 90도) → 이불 (tools/iso/rest_art.py)
  const cv = $('#rcv'), g = cv.getContext('2d'), L = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = s; });
  Promise.all([L('art/rest_bed.png?v=1'), L('art/rest_quilt.png?v=1'), A.preload(['face'])]).then(([bed, quilt]) => {   // 눈 감은 얼굴을 먼저 불러와요
    g.imageSmoothingEnabled = false; g.clearRect(0, 0, 96, 56); g.drawImage(bed, 0, 0);
    if (A.loaded){ g.save(); g.translate(-6, 61); g.rotate(-Math.PI / 2); g.drawImage(A.compose(av), 0, 0, A.FW, A.FH, 0, 0, A.FW, A.FH); g.restore(); }
    g.drawImage(quilt, 0, 0);
  });
  $('#rwake').onclick = () => restEnd(true);
  const tick = () => { if (!me.rest) return; const left = me.rest.until - Date.now(); if (left <= 0) return restEnd(false); const m = Math.floor(left / 6e4), sc = Math.floor(left / 1000) % 60, got = Math.floor(me.rest.gain * (Date.now() - me.rest.at) / (me.rest.until - me.rest.at)); $('#rleft').textContent = `남은 시간 ${m}:${String(sc).padStart(2, '0')} · 지금 일어나면 마력 +${got}`; };
  clearInterval(restTimer); tick(); restTimer = setInterval(tick, 1000);
}
// 하루: 진짜 날짜가 바뀌면 학기 날짜가 하루 지나고 주문이 새로 와요
function dayTick(){
  if (!me) return;
  if (me.dayKey !== todayKey()){ if (me.dayKey){ me.day++; me.orders = makeOrders(me.day, me.hints, me.found); toast(`봄 학기 ${me.day}일 아침이에요! 새 주문이 왔어요`); } me.dayKey = todayKey(); save(); if (sheetOn) render(); }

// ---- 휴게실: 같은 기숙사 학생들이 재료를 모아 6단계까지 꾸미고 넓혀요 ----
// 기숙사마다 분위기에 맞는 재료를 모아요 (단계 2~6). coin은 골드
const HALL_COST = {
  ember: [{ herb:10, p_red:3, coin:1000 }, { p_blue:5, p_green:5, coin:2500 }, { p_purple:4, scale:10, coin:5000 }, { p_vigor:5, p_grow:5, coin:8000 }, { p_dragon:2, egg:3, coin:15000 }],
  moon:  [{ mush:10, coin:2000 }, { silk:10, whisker:5, coin:4000 }, { hegg:15, feather:8, coin:7000 }, { p_moon:3, p_dusk:3, coin:11000 }, { egg:3, g_star:5, coin:20000 }],
  dusk:  [{ wool:10, herb:10, coin:800 }, { uhair:10, hegg:10, coin:2000 }, { milk:10, honey:10, coin:4000 }, { whisker:10, feather:10, slime:10, coin:7000 }, { wool:30, honey:20, egg:3, coin:12000 }],
  dew:   [{ herb:15, drop:10, coin:800 }, { g_mint:10, g_clover:10, coin:2000 }, { g_lily:8, g_lotus:8, coin:4000 }, { g_firefly:6, g_snow:6, coin:7000 }, { g_aurora:4, g_moonf:4, egg:2, coin:12000 }],
};
const HALL_NAMES = {
  ember: ['먼지 쌓인 창고', '불 붙은 벽난로', '물약 선반', '수정구와 빗자루', '불타는 가마', '전설의 실험실'],
  moon:  ['낡은 관이 있는 방', '붉은 커튼', '벨벳 살롱', '금화 상자', '달빛 피아노', '밤의 왕좌'],
  dusk:  ['장작 창고', '돌 벽난로', '숲 냄새 나는 방', '반려동물 방석', '큰 달 창문', '전설의 오두막'],
  dew:   ['쇠사슬 소리', '푸른 도깨비불', '첫 화분', '떠다니는 도깨비불', '안개 분수', '전설의 유리 정원'],
};
let halls = {};   // 온라인: houses/{기숙사} = { stage, pool, who: { uid: { nick, n } }, last: [...] }
const hallOf = h => solo ? (h === me.house ? me.common : { stage: 1, pool: {} }) : (halls[h] || { stage: 1, pool: {} });
const commonStage = h => Math.max(1, Math.min(6, hallOf(h).stage || 1));
const hallNeed = h => HALL_COST[h][commonStage(h) - 1] || null;
const hallLeft = (h, k) => { const need = hallNeed(h); return need ? Math.max(0, (need[k] || 0) - (hallOf(h).pool?.[k] || 0)) : 0; };
function syncHalls(){ HOUSE_KEYS.forEach(h => World.setStage(HOUSE_DORM[h], commonStage(h))); }
// 재료 넣기: 넣은 만큼 가방에서 빠지고, 다 모이면 바로 다음 단계가 돼요
async function donate(k, want){
  const h = me.house, have = k === 'coin' ? me.coin : (me.inv[k] || 0), n = Math.min(want, have, hallLeft(h, k));
  if (n <= 0) return;
  let gave = 0, up = 0;
  const apply = cur => {
    cur = cur || { stage: 1, pool: {} }; cur.pool = cur.pool || {}; const st = cur.stage || 1, need = HALL_COST[h][st - 1];
    if (!need) return undefined;
    gave = Math.min(n, Math.max(0, (need[k] || 0) - (cur.pool[k] || 0))); if (gave <= 0) return undefined;
    cur.pool[k] = (cur.pool[k] || 0) + gave;
    cur.who = cur.who || {}; const w = cur.who[uid || 'me'] || { nick: me.nick, n: 0 }; w.nick = me.nick; w.n += k === 'coin' ? Math.ceil(gave / 100) : gave; cur.who[uid || 'me'] = w;
    if (Object.entries(need).every(([kk, v]) => (cur.pool[kk] || 0) >= v)){ cur.stage = st + 1; cur.pool = {}; up = cur.stage; }
    return cur;
  };
  if (solo){ me.common = apply(me.common) || me.common; }
  else {
    const r = await F.runTransaction(F.ref(db, 'houses/' + h), apply).catch(e => { toast('넣지 못했어요: ' + (e.code || e.message)); return null; });
    if (!r || !r.committed) return;
  }
  if (!gave) return;
  if (k === 'coin') me.coin -= gave; else me.inv[k] -= gave;
  save(); syncHalls();
  toast(up ? `휴게실이 ${up}단계 「${HALL_NAMES[h][up - 1]}」가 됐어요!` : `${k === 'coin' ? gave + 'G' : ITEM[k] + ' ' + gave + '개'}를 넣었어요`);
  if (sub === 'common') renderCommon();
}
function renderCommon(){
  const h = me.house, H = HOUSES[h], st = commonStage(h), need = hallNeed(h), hall = hallOf(h);
  const who = Object.values(hall.who || {}).sort((a, b) => b.n - a.n).slice(0, 6);
  const row = (k, v) => {
    const got = hall.pool?.[k] || 0, have = k === 'coin' ? me.coin : (me.inv[k] || 0), left = Math.max(0, v - got), done = left === 0;
    const steps = k === 'coin' ? [[100, '+100G'], [1000, '+1000G']] : [[1, '+1'], [10, '+10']];
    return `<div class="li">${ic(k === 'coin' ? 'coin' : k)}<div class="main"><span class="t">${k === 'coin' ? '골드' : ITEM[k]} <span class="sub num">${got.toLocaleString()} / ${v.toLocaleString()}</span></span>
      <div class="pbar" style="height:6px;margin-top:3px"><i style="width:${Math.min(100, got / v * 100)}%;background:${done ? 'var(--ok)' : H.col}"></i></div>
      <span class="d">가진 것 ${have.toLocaleString()}</span></div>
      ${done ? '<span class="tag">다 모았어요</span>' : steps.map(([n, l]) => `<button class="btn sm ${have > 0 ? 'go' : ''}" data-don="${k},${n}" ${have > 0 ? '' : 'disabled'}>${l}</button>`).join('')}</div>`;
  };
  const tabs = [['gather', need ? '재료 모으기' : '완성!'], ['stage', `단계 ${st} / 6`], ['who', `도와준 친구${who.length ? ' ' + who.length : ''}`]];
  let body = '';
  if (commonTab === 'gather'){
    body = need ? `<section class="sec">
      ${secH(`다음: ${st + 1}단계 「${HALL_NAMES[h][st]}」`, '다 모이면 바로 꾸며져요')}
      <div class="box px">${Object.entries(need).map(([k, v]) => row(k, v)).join('')}</div>
      ${hint('', solo ? '혼자 모드에서는 혼자 모아요' : `${H.name} 학생들이 함께 재료를 모아요 · 넣은 만큼 가방에서 빠져요`)}
    </section>` : `<section class="sec"><div class="hint on px">전설의 휴게실을 완성했어요! 🎉</div></section>`;
  } else if (commonTab === 'stage'){
    body = `<section class="sec">
      ${secH('휴게실 단계', `지금 ${st}단계 · ${HALL_NAMES[h][st - 1]}`)}
      <div class="box px" style="padding:10px 12px;display:grid;grid-template-columns:repeat(2,1fr);gap:6px 10px">
        ${HALL_NAMES[h].map((nm, i) => `<div style="display:flex;align-items:center;gap:8px;min-height:40px"><span class="b num" style="width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:8px;border:2px solid ${i < st ? H.col : 'var(--line2)'};background:${i === st - 1 ? H.col : 'var(--soft)'};color:${i === st - 1 ? '#2A1506' : i < st ? H.col : 'var(--sub)'}">${i + 1}</span><span class="s" style="line-height:1.3;color:${i === st - 1 ? 'var(--text)' : 'var(--sub)'}">${nm}</span></div>`).join('')}
      </div>
      ${hint('', `단계마다 방이 넓어지고, 쉬고 나면 마력 +2씩 더 (지금 +${(st - 1) * 2})`)}
    </section>`;
  } else {
    body = `<section class="sec">${secH('많이 도와준 친구', who.length ? '재료를 넣은 수' : '')}
      ${who.length ? `<div class="box px">${who.map((w, i) => `<div class="li"><span class="b num" style="width:22px">${i + 1}</span><div class="main"><span class="t">${esc(w.nick)}</span></div><span class="tag num">${w.n}</span></div>`).join('')}</div>` : '<div class="hint">아직 재료를 넣은 친구가 없어요. 첫 번째가 되어 보세요!</div>'}
    </section>`;
  }
  frame('dorm', `${H.name} 휴게실`, `${st}단계 · ${HALL_NAMES[h][st - 1]}`, segRow('ctab', commonTab, tabs) + body + `<button class="btn px" id="goRoom">${ic('bed')}내 방으로</button>`, { tint: H.col });

  on('[data-don]', b => { const [k, n] = b.dataset.don.split(','); donate(k, +n); });
  $('#goRoom').onclick = () => goPlace(myRoomId(), 'bed', 'home', 'dorm');

// 친구 생물과 짝꿍 맺기: 친구마다 하루 한 번, 알은 나만 받아요 (친구 방명록에 소식이 남아요)
const friendCr = p => normalize({ cr: JSON.parse(JSON.stringify(p.cr || [])), inv: {} }).cr;
function breedSection(p){
  const theirs = friendCr(p).map((x, i) => [x, i]).filter(([x]) => crAdult(x));
  const pickT = vTheirs !== null && friendCr(p)[vTheirs];
  const mine = me.cr.map((x, i) => [x, i]).filter(([x]) => crAdult(x) && x.love >= BREED_LOVE && (!pickT || x.k === pickT.k));
  me.bredWith = me.bredWith || {};
  const done = me.bredWith[visitUid] === todayKey(), full = me.eggs.length >= HATCH_MAX;
  const tile = (x, attr, on_) => `<button class="cell ${on_ ? 'sel' : ''}" ${attr} style="width:62px;height:66px;min-height:0;padding:0 0 14px;overflow:hidden;background:${CREATURES[x.k].bg}">${crSprite(x, .4)}<span class="s" style="position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.85);text-align:center;line-height:16px">${esc(x.name)}</span></button>`;
  return `<section class="sec">

    ${!theirs.length ? '<div class="hint">아직 어른 생물이 없어요</div>' : !mine.length ? `<div class="hint">${pickT ? `같은 종(${CREATURES[pickT.k].kind})이고 ` : ''}애정 ${BREED_LOVE} 이상인 내 어른 생물이 있어야 해요</div>${pickT ? '' : ''}` : done ? '' : `
    <span class="s sub">${esc(p.nick)}의 생물</span><div class="pal">${theirs.map(([x, i]) => tile(x, `data-vt="${i}"`, vTheirs === i)).join('')}</div>
    <span class="s sub">내 생물</span><div class="pal">${mine.map(([x, i]) => tile(x, `data-vm="${i}"`, vMine === i)).join('')}</div>
    <button class="btn sm go" id="vbreed" style="min-height:40px" ${vMine !== null && vTheirs !== null && !full && me.mana >= BREED_MANA ? '' : 'disabled'}>${full ? '내 부화실이 꽉 찼어요' : '짝꿍 맺고 알 받기'}</button>`}

// ===== 주간 쪽지시험: 일주일에 한 번, 10문제 =====
const EXAM_N = 10, EXAM_SEC = 20;
const examDone = () => me.exam?.week === coopWeek() && me.exam.done;
const examStarted = () => me.exam?.week === coopWeek();
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n, not = []) => shuffle(a.filter(x => !not.includes(x))).slice(0, n);
// 받침에 맞춰 조사 고르기: josa('물약', '을', '를') → '을'
const josa = (w, a, b, ro) => { const c = String(w).charCodeAt(String(w).length - 1); if (c < 0xAC00 || c > 0xD7A3) return b; const jong = (c - 0xAC00) % 28; return ro ? (jong === 0 || jong === 8 ? b : a) : jong ? a : b; };
const gradeOf = s => s >= 100 ? 'A+' : s >= 90 ? 'A' : s >= 80 ? 'B+' : s >= 70 ? 'B' : s >= 60 ? 'C' : 'D';
// 문제 만들기: 내가 레시피를 아는 물약 + 누구나 아는 학교 상식
function makeExam(){
  const known = POTIONS.filter(p => me.hints.includes(p) || me.found.includes(p));
  const Q = [];
  const q4 = (t, q, a, wrong) => Q.push({ t, q, a, choices: shuffle([a, ...wrong.slice(0, 3)]) });
  known.forEach(p => {
    q4('recipe', `「${recipeText(p)}」${josa(recipeText(p), '으로', '로', true)} 만드는 물약은?`, ITEM[p], pick(POTIONS, 3, [p]).map(x => ITEM[x]));
    q4('recipe', `「${ITEM[p]}」의 레시피는?`, recipeText(p), pick(POTIONS, 3, [p]).map(recipeText));
  });
  HOUSE_KEYS.forEach(k => {
    q4('house', `「${HOUSES[k].name}」 기숙사의 시간은?`, hoursText(HOUSES[k]), HOUSE_KEYS.filter(x => x !== k).map(x => hoursText(HOUSES[x])));
    q4('house', `「${HOUSES[k].perk}」 보너스를 받는 기숙사는?`, HOUSES[k].name, HOUSE_KEYS.filter(x => x !== k).map(x => HOUSES[x].name));
  });
  CREATURES.forEach((c, i) => q4('ranch', `사육장의 「${c.kind}」${josa(c.kind, '이', '가')} 주는 재료는?`, ITEM[c.mat], CREATURES.filter((_, j) => j !== i).map(x => ITEM[x.mat])));
  POTIONS.filter(p => POTION_INFO[p].time).forEach(p => q4('time', `「${ITEM[p]}」${josa(ITEM[p], '을', '를')} 끓일 수 있는 시간은?`, hoursText(HOUSES[POTION_INFO[p].time]), HOUSE_KEYS.filter(x => x !== POTION_INFO[p].time).map(x => hoursText(HOUSES[x]))));
  known.filter(p => POTION_INFO[p].use).forEach(p => q4('use', `「${POTION_INFO[p].use}」 효과가 있는 물약은?`, ITEM[p], pick(POTIONS, 3, [p]).map(x => ITEM[x])));
  // 레시피 문제는 최대 절반, 나머지는 섞어서
  const recipeQs = shuffle(Q.filter(x => x.t === 'recipe')).slice(0, EXAM_N / 2);
  const rest = shuffle(Q.filter(x => x.t !== 'recipe'));
  return shuffle([...recipeQs, ...rest].slice(0, EXAM_N));
}
let exam = null;   // { qs, i, right, picked, t0 }
function startExam(){
  if (examStarted()) return;
  me.exam = { week: coopWeek(), score: 0, done: false }; save();   // 도중에 나가도 한 번 본 걸로 쳐요

}
let examTick = 0;
function renderExam(){
  clearInterval(examTick);
  if (!exam){ return renderExamResult(); }

function answer(j){

  renderExam();

    exam.i++; exam.picked = null; exam.t0 = Date.now();

}

// ===== 학교 행사: 정해진 시간에 다 같이 모이는 실시간 이벤트 =====
// days: 요일(0=일), 시각은 각자 기기 시계 기준. 끝난 뒤 60분 동안은 결과·보상을 볼 수 있어요.
const EVENTS = {
  dragon: { name:'드래곤의 방문', icon:'egg', days:[6,0], hour:20, min:0, dur:20,
            blurb:'화난 드래곤에게 다 같이 물약을 바쳐 달래요' },
};
const AFTER_MIN = 60;
const DRAGON_PTS = p => p === 'p_dragon' ? 6 : p === 'p_purple' ? 4 : POTION_INFO[p].time ? 3 : Math.max(1, Math.min(6, Math.round(POTION_INFO[p].pay / 60)));
const dragonGoal = () => solo ? 8 : 40;
// 미리보기: 주소 뒤에 ?event=dragon 을 붙이면 지금 바로 열려요 (기록은 test 칸에 따로 쌓여요)
const PREVIEW = (() => { const k = new URLSearchParams(location.search).get('event'); return EVENTS[k] ? { id: k, start: Date.now() } : null; })();
const ymd = d => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
function eventAt(now = Date.now()){
  if (PREVIEW){ const E = EVENTS[PREVIEW.id]; return { id: PREVIEW.id, E, start: PREVIEW.start, end: PREVIEW.start + E.dur * 60000, key: PREVIEW.id + '-test' }; }
  for (const [id, E] of Object.entries(EVENTS)){
    for (const back of [0, 1]){   // 자정 근처를 위해 어제 것도 봐요
      const d = new Date(now); d.setDate(d.getDate() - back); d.setHours(E.hour, E.min, 0, 0);
      if (!E.days.includes(d.getDay())) continue;
      const start = d.getTime(), end = start + E.dur * 60000;
      if (now >= start && now < end + AFTER_MIN * 60000) return { id, E, start, end, key: `${id}-${ymd(d)}` };
    }
  }
  return null;
}
function nextEvent(now = Date.now()){
  let best = null;
  for (const [id, E] of Object.entries(EVENTS)) for (let i = 0; i < 8; i++){
    const d = new Date(now); d.setDate(d.getDate() + i); d.setHours(E.hour, E.min, 0, 0);
    if (E.days.includes(d.getDay()) && d.getTime() > now){ if (!best || d.getTime() < best.start) best = { id, E, start: d.getTime() }; break; }
  }
  return best;
}
const untilText = ms => { const m = Math.max(0, Math.round(ms / 60000)); return m >= 60 ? `${Math.floor(m / 60)}시간 ${m % 60}분` : `${m}분`; };
const whenText = t => { const d = new Date(t), today = ymd(new Date()) === ymd(d); return `${today ? '오늘' : ['일','월','화','수','목','금','토'][d.getDay()] + '요일'} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; };
