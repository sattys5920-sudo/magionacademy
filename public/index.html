/* 글꼴: 본문 Pretendard(서브셋·직접 호스팅), 제목·버튼·HUD만 픽셀 글꼴 Galmuri11 */
@font-face{font-family:'Pretendard';font-weight:400;font-display:swap;src:url(fonts/Pretendard-Regular.woff2) format('woff2')}

/* 디자인 토큰 (지시서 6장). 옛 이름(--ink 등)은 새 색으로 이어 붙였어요 */
:root{--bg:#140D1E;--panel:#211733;--panel2:#2B1F45;--line:#3A2A55;--line2:#4E3C72;--accent:#FF9A3C;--accent2:#C86A1E;--purple:#9B7BFF;--ok:#6FD08C;--ok2:#3E9A5E;--warn:#FF6B6B;--text:#F6F0FF;--sub:#BDB0D6;--gold:#FFD866;--gold2:#D9A020;--pink:#FF8FAF;
  --ink:var(--text);--ink2:#140D1E;--paper:var(--panel);--card:var(--panel2);--soft:#342852;--mint:var(--ok);--mint2:var(--ok2);--bad:var(--warn);
  --f-body:'Pretendard',system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;--f-px:'G11','Pretendard',monospace;--f-pxb:'G11B','Pretendard',monospace;
  --fs:15px;--fs-s:13px;--fs-h:16px;--fs-talk:17px;--r-btn:12px;--r-panel:16px;--r-cell:8px;--hud-h:56px;--bar-h:64px;--dur:.18s}
html.big{--fs:17px;--fs-s:15px;--fs-h:18px;--fs-talk:19px}
.jic{display:inline-block;width:1.5em;height:1.5em;vertical-align:middle;background:url(art/jobs.png?v=1) 0 0/1200% 100%;background-position:calc(var(--i)*100%/11) 0;image-rendering:pixelated}
@media (max-height:760px){#xcv,#xmcv{width:auto!important;max-width:100%;max-height:30vh;margin:0 auto}}
.big .jic{width:34px;height:34px}.wstep{display:flex;align-items:center;justify-content:space-between;gap:2px;margin-top:12px}.wstep>div{position:relative;display:flex;flex-direction:column;align-items:center;flex:1;padding:4px 0;border:2px solid transparent;border-radius:10px;opacity:.55}.wstep>div.done{opacity:.85}.wstep>div.on{opacity:1;border-color:var(--gold);background:rgba(255,184,77,.14)}.wstep .wic{width:58px;height:58px}.wstep b{font-size:11px}.wstep small{font-size:10px;opacity:.8}.wstep i{position:absolute;top:-8px;font-style:normal;font-size:10px;font-weight:800;background:var(--gold);color:#2b1b3a;border-radius:6px;padding:0 5px}.wstep i.nx{background:#9fd0ff}.wstep em{font-style:normal;opacity:.5}
.wbg{background-image:url(art/weapons_big.png?v=2)!important}
.wic{display:inline-block;width:96px;height:96px;background:url(art/weapons_big.png?v=2) 0 0/500% 1200%;background-position:calc(var(--t)*100%/4) calc(var(--r)*100%/11);image-rendering:pixelated;flex:none}
.sic{display:inline-block;width:26px;height:26px;vertical-align:middle;background:url(art/skills.png?v=2) 0 0/1500% 1200%;background-position:calc(var(--c)*100%/14) calc(var(--r)*100%/11);image-rendering:pixelated}
.jgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.jcard.off{opacity:.45;filter:grayscale(.7)}.jcard{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:2px solid var(--line,#5a4a78);border-radius:10px;background:transparent;color:inherit;font:inherit;text-align:center}.jcard .jic{width:32px;height:32px}.jcard b{font-size:13px}.jcard span{font-size:10px;opacity:.75;line-height:1.25}.jcard.on{border-color:#ffb84d;background:rgba(255,184,77,.18)}
html.lowfx *,html.lowfx *::before,html.lowfx *::after{transition-duration:0s!important;animation-duration:0s!important}
@media (prefers-reduced-motion:reduce){:root{--dur:0s}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);-webkit-tap-highlight-color:transparent;overflow:hidden}
body{font-family:var(--f-body);font-size:var(--fs);line-height:1.5;color:var(--text);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button{font:inherit;color:inherit;cursor:pointer;margin:0;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
input{font-family:var(--f-body);font-size:var(--fs);color:var(--text)}
b,strong{font-weight:700}
h1,h2,h3{font-weight:normal}
/* 게임 셸: 상단 HUD · 게임 화면 · 하단 메뉴. 페이지 스크롤은 없어요 */
#shell{position:relative;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"hud" "stage" "chat" "bar";height:var(--vvh,100dvh);transform:translateY(var(--vvt,0px));max-width:430px;margin:0 auto;overflow:hidden;background:var(--bg);padding-top:env(safe-area-inset-top)}
#hud{grid-area:hud;min-width:0;height:var(--hud-h);display:flex;align-items:center;gap:6px;padding:0 8px;background:rgba(20,13,30,.94);border-bottom:1px solid var(--line);position:relative;z-index:12}
#stage{grid-area:stage;position:relative;min-height:0;overflow:hidden}
#chat{grid-area:chat;position:relative;z-index:12;background:rgba(20,13,30,.96);border-top:1px solid var(--line);padding:6px 8px}
#chat form{display:flex;gap:6px}

body.kb #bar{display:none}
#bar{grid-area:bar;min-width:0;height:calc(var(--bar-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(20,13,30,.96);border-top:1px solid var(--line);position:relative;z-index:12}
#bar button{border:0;background:none;color:var(--sub);font-family:var(--f-pxb);font-size:var(--fs-s);line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:44px;padding:0;position:relative}
#bar button.on{color:var(--accent)}

#bar svg,.icbtn svg,#ctx svg{width:24px;height:24px;shape-rendering:crispEdges;fill:currentColor}
#bar .badge{position:absolute;top:8px;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}

@media (min-width:900px) and (min-height:560px){#shell{max-width:760px}}
/* 가로 모드(낮은 화면): 메뉴를 오른쪽 세로로 */
@media (orientation:landscape) and (max-height:520px){#shell{max-width:none;grid-template-columns:minmax(0,1fr) 72px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"hud hud" "stage bar" "chat bar"}
  #hud{height:48px}#bar{grid-row:2/4;height:auto;grid-template-columns:1fr;grid-template-rows:repeat(5,1fr);border-top:0;border-left:1px solid var(--line);padding-bottom:0;padding-right:env(safe-area-inset-right)}}

#app{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}

.hudbtn{border:0;background:none;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 6px;border-radius:var(--r-btn);color:var(--text);text-align:left;min-width:0}
.hudbtn:active{background:rgba(255,255,255,.08)}

.box .frow{display:flex;gap:8px;padding:8px 12px 12px}.box .frow .btn{flex:1}.box>.s.sub{padding:8px 12px 0}
.box{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;overflow:hidden}

.cauldron{position:relative;border-radius:var(--r-panel);background:radial-gradient(ellipse at 50% 80%,#3B2A5E,var(--panel2) 70%);border:1px solid var(--line2);min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:12px;gap:4px;transition:box-shadow .15s}
.cauldron.over{box-shadow:0 0 0 3px var(--accent)}
.cauldron.ready{box-shadow:0 0 0 2px var(--purple)}
.cslots{display:flex;gap:6px;margin-bottom:-6px;position:relative;z-index:2}
.cslot{width:48px;height:48px;border-radius:50%;border:2px dashed var(--line2);background:rgba(20,13,30,.5);display:flex;align-items:center;justify-content:center;color:var(--sub);font-family:var(--f-pxb);padding:0}
.cslot.on{border:2px solid var(--purple);background:var(--panel);cursor:pointer}
.cpot{position:relative;width:120px;height:110px;display:flex;align-items:center;justify-content:center}
.bub{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--purple);opacity:0}
.cauldron.ready .bub{animation:bub 1.6s infinite}.cauldron.ready .b1{left:40px;animation-delay:0s}.cauldron.ready .b2{left:60px;animation-delay:.5s}.cauldron.ready .b3{left:78px;animation-delay:1s}
@keyframes bub{0%{bottom:48px;opacity:0;transform:scale(.6)}30%{opacity:.9}100%{bottom:96px;opacity:0;transform:scale(1.3)}}
.cauldron.done .cpot{filter:drop-shadow(0 0 14px var(--gold))}
.result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,13,30,.55);border-radius:var(--r-panel);z-index:3;animation:toastin .2s}
.rcard{background:var(--panel);border:1px solid var(--accent);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:92%;text-align:center}
.rcard b{font-family:var(--f-pxb);font-size:var(--fs-h)}.rcard .frow{display:flex;gap:8px;margin-top:4px}
.matrow{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,1fr);grid-auto-columns:78px;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;scroll-snap-type:x proximity}
.matrow .cell{scroll-snap-align:start;min-height:72px;touch-action:none}
.dragghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-60%) scale(1.3);filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
.dexgrid{grid-template-columns:repeat(4,1fr)}.dexgrid .cell{min-height:76px}
.dno{position:absolute;left:5px;top:3px;font-size:var(--fs-s);line-height:1;color:var(--sub);font-variant-numeric:tabular-nums}
.cell.unk .ic{filter:brightness(0);opacity:.2}.cell.hint2 .ic{opacity:.5}
@media (min-width:900px){.labwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-areas:"main mats";align-items:start}.labmain{grid-area:main}.labmats{grid-area:mats}.matrow{grid-auto-flow:row;grid-template-rows:none;grid-template-columns:repeat(3,1fr);grid-auto-columns:auto;overflow:visible;max-height:420px;overflow-y:auto}.dexgrid{grid-template-columns:repeat(5,1fr)}}

.gpan .frow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.gpan .s{font-size:var(--fs-s);line-height:1.45}
.gpan canvas{box-shadow:0 0 0 1px var(--line2);border-radius:8px}
.gpp{border:2px solid var(--line2);border-radius:8px;padding:6px 10px;background:var(--panel2);color:var(--text);font-size:var(--fs-s);line-height:1.3}
.grk div{background:var(--panel2);border-radius:8px;padding:8px 10px;font-size:var(--fs-s);align-items:center;color:var(--text)}
.grk div.me{background:var(--soft);box-shadow:inset 0 0 0 2px var(--accent)}
.grk b{font-family:var(--f-pxb);color:var(--gold)}
.cast{background:var(--panel2);border-radius:8px}

.ghl button{border:2px solid var(--line2);border-radius:8px;background:var(--panel2);color:var(--text);min-height:44px;padding:0 10px;font-size:var(--fs-s)}
.ghl button.on{background:var(--soft);box-shadow:inset 0 0 0 2px var(--accent)}
.ghl b{color:var(--pink)}
.whh{border-radius:8px;box-shadow:inset 0 -10px 0 #2A2236,0 0 0 1px var(--line2)}
.whh.hit{background:var(--ok)}.whh.hitb{background:var(--warn)}
.ghud{border-radius:12px;box-shadow:0 0 0 1px var(--line2);color:var(--text)}

.gsb{font-size:var(--fs-s);line-height:1.4}
.cain .cell{min-height:64px}
#game.hudonly .gquit{top:calc(var(--hud-h) + 62px)}
/* @css:misc */
.today .tico{font-size:22px;width:32px;text-align:center;flex-shrink:0}
.zz{color:var(--purple)}
.rbox .s{line-height:1.45}

/* @css:main */
.adtbl.npc .adh{display:inline-flex;flex-direction:column;align-items:center;gap:3px;white-space:nowrap;color:#22183F}.adtbl.npc .adh .hv{font-weight:700}.adtbl.npc .adh .bt{display:flex;gap:4px}.adtbl.npc .adh button{width:30px;height:28px;padding:0;border-radius:7px;border:1px solid #7a6a9a;background:#f3eefc;color:#22183F;font-size:16px;font-weight:700;line-height:1;cursor:pointer}.adtbl.npc .adh .pend{color:#d9780a;margin-left:3px;font-weight:700}
.evbox .evport{display:none;position:absolute;left:6px;bottom:calc(100% - 10px);width:34vw;max-width:150px;aspect-ratio:var(--asp,128/171);background-size:500% 100%;background-repeat:no-repeat;image-rendering:pixelated;pointer-events:none;z-index:0;filter:drop-shadow(0 2px 0 rgba(0,0,0,.5))}
.evbox .evname,.evbox .evtext,.evbox .evch{position:relative;z-index:1}
.evin{display:flex;gap:6px;margin-top:8px}.evin input{flex:1;min-width:0;height:44px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2);color:var(--text);padding:0 12px;font-size:var(--fs)}
.npcf .mqport{display:block;border-radius:50%;background-size:500% auto;background-position:0 0;background-repeat:no-repeat;image-rendering:pixelated;background-color:var(--panel2)}
.mqic{display:inline-flex;align-items:center;justify-content:center;font-size:22px;background:none}
.mqskip{position:absolute;right:12px;top:12px;z-index:40}
.mqsky{display:flex;align-items:center;gap:10px;background:linear-gradient(#0B0716,#1B1230);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:8px}
.mqstars{position:relative;width:120px;height:52px;flex-shrink:0}.mqstars i{position:absolute;width:6px;height:6px;border-radius:50%;background:#5B4C7A;transform:translate(-50%,-50%)}.mqstars i.on{background:#FFF3C4;box-shadow:0 0 6px 2px rgba(255,236,170,.8)}
.mqstars i.lantern{width:8px;height:8px;background:#6B4A2A}.mqstars i.lantern.on{background:#FFB347;box-shadow:0 0 8px 3px rgba(255,170,60,.9)}
.mqsky .main{display:flex;flex-direction:column;min-width:0}.mqsky .t{font-family:var(--f-pxb);font-size:var(--fs-s)}.mqsky .d{font-size:var(--fs-s);color:var(--sub)}
.mqbar{display:flex;flex-direction:column;gap:8px;align-items:stretch}.mqtrack{position:relative;height:28px;border-radius:14px;background:var(--panel2);border:1px solid var(--line2);overflow:hidden}.mqtrack .zone{position:absolute;top:0;bottom:0;background:rgba(111,208,140,.45)}.mqtrack .pin{position:absolute;top:4px;width:6px;height:20px;margin-left:-3px;border-radius:3px;background:var(--accent)}
.mqstarbox{position:relative;height:260px;background:radial-gradient(circle at 50% 40%,#231A3A,#0B0716);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mqstar{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:0;background:transparent;color:#FFF3C4;font-family:var(--f-pxb);font-size:var(--fs-s)}
.mqstar::before{content:'';position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#C9BBE6;box-shadow:0 0 6px 1px rgba(201,187,230,.6)}
.mqstar.on::before{background:#FFF3C4;box-shadow:0 0 10px 3px rgba(255,236,170,.9)}.mqstar.next::before{animation:mqpulse 1s infinite}

.mqdstage{position:relative;flex:1;min-height:0;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:radial-gradient(circle at 50% 50%,rgba(255,180,80,.18),transparent 55%)}
.mqlamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:44px;filter:drop-shadow(0 0 12px rgba(255,170,60,.9))}.mqlamp.hit{animation:mqshake .3s}

.mqgust{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;border:0;border-radius:50%;background:rgba(40,28,60,.7);font-size:26px;padding:0;touch-action:manipulation}
.mqdhint{text-align:center;color:var(--sub)}
/* 확인 창 */

function makeOrders(day, hints, found){
  const pool = POTIONS.filter(p => POTION_INFO[p].time ? found.includes(p) : hints.includes(p));
  if (!pool.length) pool.push('p_red');
  const out = [];
  for (let i = 0; i < 3; i++){

    if (POTION_INFO[p].time && out.some(o => POTION_INFO[o.p].time)) p = pool.find(x => !POTION_INFO[x].time) || p;  // 시간대 물약 주문은 하루 하나까지

}
function starterDiff(p, force){   // force: 관리자(쓰고 남은 만큼만 빼요) · 아니면 하나도 안 쓴 경우에만
  const cr = (p.cr || []).slice(), inv = { ...(p.inv || {}) }, fb = { ...(p.fbag || {}) }; let n = 0;
  if (force){ const ids = starterCrIds(cr); for (let i = cr.length - 1; i >= 0; i--) if (ids.has(cr[i].id)){ cr.splice(i, 1); n++; } }   // 관리자: 키웠어도 시작 생물이면 거둬요
  else STARTER_K.forEach(k => { const i = cr.findIndex(c => crPristine(c) && c.k === k); if (i >= 0){ cr.splice(i, 1); n++; } });
  const invSame = Object.keys(inv).every(k => (+inv[k] || 0) === (STARTER_INV[k] || 0)), fbSame = Object.keys(fb).every(k => (+fb[k] || 0) === (STARTER_FB[k] || 0)) && !(p.room || []).length;

}

const ERR_SKIP = /ResizeObserver loop|^Script error\.?$|NotAllowedError|AbortError|play\(\) request|The play\(\)|interrupted by a (call to pause|new load)/i;
function errReport(kind, msg, stack){
  try {
    msg = String(msg || '').slice(0, 300); if (!msg || ERR_SKIP.test(msg) || errN >= 15 || errSeen.has(kind + msg)) return;
    errSeen.add(kind + msg); errN++;

    errQ.push({ k: kind, m: msg, s: String(stack || '').slice(0, 900), w: w.slice(0, 80), b: ERR_BUILD.slice(0, 7), ua: navigator.userAgent.slice(0, 160), at: Date.now() });
    errFlush();
  } catch(e){}
}
function errFlush(){
  if (!F || !db || !uid || solo || !errQ.length) return;
  while (errQ.length){ const e = errQ.shift(); F.push(F.ref(db, 'errs'), { ...e, u: uid, n: (me && me.nick) || '' }).catch(() => {}); }

function fbClean(o){

}

function storyAdd(c, k, amt, then){
  if (solo || !amt) return;
  const S = STORY[c - 1];
  F.runTransaction(F.ref(db, `story/ch/${c}`), cur => {
    cur = cur || { step: 0, prog: {} }; if ((cur.step || 0) !== k || cur.done) return;
    const st = S.steps[k]; cur.prog = cur.prog || {}; cur.prog[k] = cur.prog[k] || {};
    const tot = Object.values(cur.prog[k]).reduce((t, v) => t + (+v || 0), 0), add = Math.min(amt, st.goal - tot);
    if (add <= 0) return; if (st.t === 'talk' && cur.prog[k][uid]) return;
    cur.prog[k][uid] = (+cur.prog[k][uid] || 0) + add;
    if (tot + add >= st.goal){ cur.step = k + 1; if (cur.step >= S.steps.length) cur.done = true; }
    return cur;
  }).then(r => { if (then) then(r.committed); }).catch(() => then && then(false));
}

    if (N.st.g === 'coop' && coop && info.ok) storyAdd(N.c, N.k, 1, ok => ok && toast(`이야기 기여 +1 · ${N.st.title}`));
    if (N.st.g === info.g && !coop && info.score > 0) storyAdd(N.c, N.k, info.score, ok => ok && toast(`이야기 기여 +${info.score} · ${N.st.title}`)); }

}

          return `<button class="cell ${dexSel === p ? 'sel' : ''} ${got ? '' : known ? 'hint2' : 'unk'}" data-dex="${p}" style="${T && got ? `border-color:${HOUSES[T].col}` : ''}"><span class="dno">${POTIONS.indexOf(p) + 1}</span>${ic(p)}<span class="s ${got ? '' : 'sub'}">${got || known ? shortName(p) : '???'}</span>${me.inv[p] ? `<span class="n">${me.inv[p]}</span>` : ''}</button>`;
        }).join('')}
      </div>
      ${sel ? `<div class="box" style="padding:10px 12px;display:flex;flex-direction:column;gap:6px">
        <div class="sec-h"><h3>${me.found.includes(dexSel) || me.hints.includes(dexSel) ? ITEM[dexSel] : '아직 모르는 물약'}</h3>${sel.time ? houseTag(sel.time) : `<span class="meta">주문 ${sel.pay}G</span>`}</div>
        ${sel.time ? `<span class="s" style="color:${HOUSES[sel.time].col}">${HOUSES[sel.time].name}의 시간(${hoursText(HOUSES[sel.time])})에만 끓어요 · 주문 ${sel.pay}G</span>` : ''}
        <span class="s">${me.hints.includes(dexSel) || me.found.includes(dexSel) ? '레시피 · ' + recipeText(dexSel) : '수업을 듣거나, 재료를 섞어 보며 찾아봐요.'}</span>
        ${sel.use ? `<span class="s sub">마시면 · ${sel.use}</span>` : sel.desc ? `<span class="s sub">${sel.desc}</span>` : ''}
        <div class="frow" style="display:flex;gap:8px">${me.hints.includes(dexSel) ? `<button class="btn sm go" id="dexBrew">솥에 넣기</button>` : ''}${sel.use ? `<button class="btn sm" id="drink" ${me.inv[dexSel] ? '' : 'disabled'}>마시기 (${me.inv[dexSel] || 0}병)</button>` : ''}</div>
      </div>` : ''}
    </section>`;
  }
  frame('lab', '물약 교실', `물약 도감 ${n} / ${POTIONS.length}`, tabs + body);
  on('[data-labtab]', b => { labTab = b.dataset.labtab; renderLab(); });
  on('[data-add]', b => labAdd(b.dataset.add));
  on('[data-take]', b => { slots.splice(+b.dataset.take, 1); brewDone = null; renderLab(); });
  on('[data-dex]', b => { dexSel = dexSel === b.dataset.dex ? null : b.dataset.dex; renderLab(); });
  on('[data-recipe]', b => { labFill(b.dataset.recipe); brewDone = null; renderLab(); });
  on('[data-dexpage]', b => { dexPage = +b.dataset.dexpage; dexSel = null; renderLab(); });
  const ma = $('#matAll'); if (ma) ma.onclick = () => { matAll = !matAll; renderLab(); };
  const rp = $('#recipePick'); if (rp) rp.onclick = () => { recipeOpen = !recipeOpen; renderLab(); };
  const dk = $('#drink'); if (dk) dk.onclick = () => { brewMsg = usePotion(dexSel); toast(brewMsg); renderLab(); };
  const db_ = $('#dexBrew'); if (db_) db_.onclick = () => { labFill(dexSel); brewDone = null; labTab = 'brew'; renderLab(); };
  const bb = $('#brewBag'); if (bb) bb.onclick = () => { brewDone = null; renderLab(); };
  const ba = $('#brewAgain'); if (ba) ba.onclick = () => { const p = brewDone.p; brewDone = null; labFill(p); renderLab(); };
  // 끌어다 놓기: 재료 칸 → 솥 (마우스는 HTML 드래그, 손가락은 포인터로)
  const pot = $('#cauldron');
  if (pot){
    app.querySelectorAll('.mat[draggable="true"]').forEach(c => { c.ondragstart = e => { dragK = c.dataset.add; e.dataTransfer.setData('text', dragK); };
      c.onpointerdown = e => { if (e.pointerType === 'mouse') return; dragK = c.dataset.add; const g = document.createElement('div'); g.className = 'dragghost'; g.innerHTML = ic(dragK); document.body.appendChild(g); const mv = ev => { g.style.left = ev.clientX + 'px'; g.style.top = ev.clientY + 'px'; const r = pot.getBoundingClientRect(); pot.classList.toggle('over', ev.clientX > r.left && ev.clientX < r.right && ev.clientY > r.top && ev.clientY < r.bottom); };
        const up = ev => { document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); g.remove(); const r = pot.getBoundingClientRect(); const inside = ev.clientX > r.left && ev.clientX < r.right && ev.clientY > r.top && ev.clientY < r.bottom; pot.classList.remove('over'); if (inside) labAdd(dragK); dragK = null; };
        mv(e); document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up); }; });
    pot.ondragover = e => { e.preventDefault(); pot.classList.add('over'); }; pot.ondragleave = () => pot.classList.remove('over');
    pot.ondrop = e => { e.preventDefault(); pot.classList.remove('over'); const k = e.dataTransfer.getData('text') || dragK; if (k) labAdd(k); };
  }
  const br = $('#brew'); if (br) br.onclick = () => {
    const key = slots.slice().sort().join(',');
    const p = RECIPES[key], T = p && POTION_INFO[p].time;
    if (T && houseNow() !== T){
      brewMsg = `솥이 잠잠해요.... 이 조합은 ${HOUSES[T].name}의 시간(${hoursText(HOUSES[T])})에만 끓어요. 재료는 그대로 있어요.`;

    let msg;
    if (p){

      if (isNew) me.found.push(p);
      if (!me.hints.includes(p)) me.hints.push(p);
      msg = isNew ? '도감에 새로 적었어요!' : '완성!';
      dexSel = p; dexPage = Math.floor(POTIONS.indexOf(p) / DEX_PAGE); toast(`${ITEM[p]} 완성!`);
    } else if (me.house === 'ember' && myTime()){
      const back = slots[Math.floor(Math.random() * slots.length)]; me.inv[back]++;
      msg = `보라색 연기만 피어올랐어요.... 그래도 Emberkiln의 낮이라 ${withJosa(ITEM[back], '을', '를')} 건졌어요.`;
    } else msg = '보라색 연기만 피어올랐어요.... 재료는 사라졌어요.';
    const again = p && used.every(k => (me.inv[k] || 0) >= used.filter(x => x === k).length);
    brewDone = { p, msg, again }; brewMsg = null; slots = []; save(); hud(); renderLab();
  };
}

// ===== 온실 =====
// 화단 칸: k 심은 씨앗(없으면 빈 칸), at 심은 시각, w 물 줬는지 (물을 주면 25% 빨리 자라요)
const growMs = p => SEED_INFO[p.k].mins * 6e4 * (p.w ? .75 : 1) * (me.perk?.greenhouse_growth ? .85 : 1) / (1 + sgFx('crop_growth'));   // 맨디 ♥10: 온실 성장 보너스
const plotLeft = p => p.k ? Math.max(0, p.at + growMs(p) - Date.now()) : 0;
const plotReady = p => !!p.k && plotLeft(p) <= 0;
const plotFrac = p => p.k ? Math.min(1, 1 - plotLeft(p) / growMs(p)) : 0;
const timeText = ms => { const m = Math.ceil(ms / 6e4); return ms < 6e4 ? `${Math.ceil(ms / 1000)}초` : m < 60 ? `${m}분` : `${Math.floor(m / 60)}시간${m % 60 ? ` ${m % 60}분` : ''}`; };
// 화단은 기본 2칸, 지식과 골드를 내면 한 칸씩 늘려 최대 10칸까지. 칸 수는 사람마다 따로예요.
const PLOT_MIN = 2, PLOT_MAX = 10;
const PLOT_COST = [[5, 150], [10, 300], [20, 500], [30, 800], [60, 1200], [100, 1800], [140, 2600], [180, 3600]];   // [필요 지식, 골드] · 3번째 칸부터
const plotNext = () => PLOT_COST[Math.max(0, (me.plots || []).length - PLOT_MIN)];
let seedPick = 'herb', greenMsg = '', seedTier = 0, plantFor = null;   // plantFor: 심을 칸 번호 (빈 칸을 누르면 하단에 씨앗이 떠요)
// 빈 칸을 누르면 하단에 뜨는 씨앗 고르기: 누르면 바로 심어요
function plantPicker(know){
  const open = SEED_TIERS.filter(k => k <= know); if (!open.includes(SEED_TIERS[seedTier])) seedTier = SEED_TIERS.indexOf(open[open.length - 1]);
  const list = SEED_LIST.filter(x => x.know === SEED_TIERS[seedTier]);

    ${open.length > 1 ? `<div class="seg scroll">${open.map(k => `<button class="${SEED_TIERS[seedTier] === k ? 'on' : ''}" data-stier="${SEED_TIERS.indexOf(k)}">${k ? `지식 ${k}` : '기본'}</button>`).join('')}</div>` : ''}
    <div class="ppg">${list.map(x => { const no = me.coin < x.price && !(x.price && (me.sdt || 0) > 0); return `<button class="cell ${no ? 'dim' : ''}" data-plant="${x.id}">${ic(x.id)}<span class="s">${x.seed}</span><span class="s sub">${x.price ? ((me.sdt || 0) > 0 ? '쿠폰 ' + me.sdt + '장' : x.price + 'G') : '무료'} · ${timeText(growMins[x.id] * 6e4)}</span></button>`; }).join('')}</div></div>`;
}
function renderGreen(){
  const ready = me.plots.filter(plotReady).length, know = me.know || 0;
  const tierKnow = SEED_TIERS[seedTier], list = SEED_LIST.filter(x => x.know === tierKnow);
  const P = SEED_INFO[seedPick] || SEED_INFO.herb;
  const tabs = [['plot', `화단${ready ? ` · 수확 ${ready}` : ''}`], ['seed', '씨앗 고르기']];

  if (greenTab === 'plot'){
    body = `<section class="sec" style="${picking ? 'padding-bottom:22vh' : ''}">

      <div class="grid" style="grid-template-columns:repeat(3,1fr)">
        ${me.plots.map((p, i) => {
          const G = p.k && SEED_INFO[p.k], rd = plotReady(p);
          const fr = plotFrac(p), icon = !p.k ? 'seed' : rd ? p.k : fr < .34 ? 'seed' : fr < .8 ? 'sprout' : p.k;

          return `<button class="cell ${!p.k ? 'slot' : ''} ${picking && plantFor === i ? 'sel' : ''}" data-plot="${i}" style="min-height:96px;${rd ? 'border:2px solid var(--ok);background:var(--soft)' : p.w ? 'background:var(--soft)' : ''}">

            ${G ? `<div style="width:60px;display:flex">${segs(Math.round(fr * 10), 10, 'var(--ok)')}</div>` : ''}</button>`;
        }).join('')}
              </div>
      ${me.plots.length < PLOT_MAX ? (([nk, ng]) => `<button class="btn ghost" id="morePlot" style="align-self:center;${know < nk ? 'opacity:.6' : ''}">${know < nk ? '' : ''}화단 한 칸 늘리기 · 지식 ${nk} · ${ng}G (${me.plots.length} / ${PLOT_MAX})</button>`)(plotNext()) : '<div class="hint" style="text-align:center">화단을 10칸까지 다 늘렸어요!</div>'}

  frame('green', '독초 온실', ready ? `수확할 칸 ${ready}개` : `심을 수 있는 씨앗 ${SEED_LIST.filter(x => x.know <= know).length} / ${SEED_LIST.length}종`, segRow('gtab', greenTab, tabs) + body);
  on('[data-gtab]', b => { greenTab = b.dataset.gtab; renderGreen(); });

  const mp = $('#morePlot'); if (mp) mp.onclick = () => {
    const [nk, ng] = plotNext();

    if ((me.know || 0) < nk){ greenMsg = `지식 ${nk}부터 늘릴 수 있어요.`; return renderGreen(); }
    if (me.coin < ng){ greenMsg = `골드 ${ng}G가 부족해요.`; return renderGreen(); }
    me.coin -= ng; me.plots.push({ k: null }); greenMsg = `화단이 한 칸 늘었어요! -${ng}G (${me.plots.length} / ${PLOT_MAX})`; save(); hud(); renderGreen();
  };
  on('[data-pclose]', () => { plantFor = null; renderGreen(); });
  on('[data-plant]', b => {

    renderGreen();
  });
  on('[data-plot]', b => {
    const i = +b.dataset.plot, p = me.plots[i];
    if (!p.k){ plantFor = plantFor === i ? null : i; greenMsg = ''; renderGreen(); setTimeout(() => document.querySelector('[data-plot].sel')?.scrollIntoView({ block: 'start', behavior: 'smooth' }), 30); return; }
    plantFor = null;
    if (plotReady(p)){ tutHook('water'); const g = SEED_INFO[p.k], n = g.yield + (me.house === 'dew' && myTime() ? 1 : 0) + (dbuff('dforest') && Math.random() < .1 ? 1 : 0), n2 = sgMul(n, sgFx('gather_yield')); me.inv[p.k] += n2; me.plots[me.plots.indexOf(p)] = { k: null }; greenMsg = `${g.seed} 수확! ${g.mat} +${n2}${n2 > g.yield ? ' (Dewmorn의 새벽 보너스)' : ''}`; }

let greenTick = 0;
// ===== 채소 가게: 온실에서 키운 것을 사 줘요 (값은 시간대마다) =====
let vgMsg = '', vgPg = 0;

  const have = SEED_LIST.map(x => x.id).filter(k => me.inv[k] > 0), PER = 5; vgPg = pgClamp(vgPg, have.length, PER);
  const total = have.reduce((t, k) => t + sellPay(k, cropBase(k)) * me.inv[k], 0);
  frame(null, '채소 가게', `온실 수확물을 사 줘요 · 지금은 ${TIME_NAME[houseNow()]}`, `<section class="sec">

  $('#back').onclick = closeSheet;
  on('[data-vgpg]', b => { vgPg = +b.dataset.vgpg; renderVeg(); });

  on('[data-vsell]', b => { const g = sell(b.dataset.vsell, 1); vgMsg = `${ITEM[b.dataset.vsell]} 1개를 팔았어요. +${g}G`; save(); hud(); renderVeg(); });

}

const cdText = ms => ms <= 0 ? '지금' : timeText(ms);
function hatchToPen(i){
  const e = me.eggs[i]; if (!e || eggLeft(e) > 0) return;

// 쉬기: 침대에서 낮잠(30분) 또는 밤잠(5시간)을 자면 마력이 차요 (그동안은 아무것도 못 해요). 밤잠은 마력이 훨씬 많이 차요. 하루는 진짜 날짜로 넘어가요
const REST_NAP = 30 * 6e4, REST_NIGHT = 5 * 60 * 6e4;
function restPlan(){
  const since = me.lastSleepAt || 0, lv = xLv(xEx().exp).L;
  const guests = Math.min(3, new Set(Object.values(myGuest).filter(g => g.at > since).map(g => g.uid)).size);
  const cozy = Math.min(COZY_MAX, cozyOf(me)), hall = (commonStage(me.house) - 1) * 2, bonus = Math.floor(lv / 2), capLv = (lv - 1) * 2;   // 레벨이 오를수록 더 많이 차고 더 많이 담아요
  const gain = Math.round((20 + cozy * 2 + guests * 3 + hall + bonus) * (dbuff('dwater') ? 1.1 : 1)), cap = 50 + cozy * 2 + guests * 3 + hall + capLv;
  const why = `아늑함 +${cozy * 2}${hall ? `, 휴게실 +${hall}` : ''}${guests ? `, 손님 ${guests}명 +${guests * 3}` : ''}${bonus ? `, 레벨 +${bonus}` : ''}`;
  return { nap: { ms: REST_NAP, gain, cap, why, name: '낮잠' }, night: { ms: REST_NIGHT, gain: gain * 3, cap: cap + 50, why, name: '밤잠' } };
}
function restChoose(){
  const P = restPlan();
  return new Promise(res => {
    const c = $('#confirm'); c.innerHTML = `<div class="cfbox" role="alertdialog"><div class="msg">얼마나 쉴까요?</div>
      <button class="btn go" id="rcNap" style="text-align:left;display:flex;flex-direction:column;gap:2px;align-items:flex-start"><b>낮잠 · 30분</b><span class="s">마력 +${P.nap.gain} (최대 ${P.nap.cap}까지)</span></button>
      <button class="btn go" id="rcNight" style="text-align:left;display:flex;flex-direction:column;gap:2px;align-items:flex-start"><b>밤잠 · 5시간</b><span class="s">마력 +${P.night.gain} (최대 ${P.night.cap}까지)</span></button>
      <button class="btn" id="rcNo">그만둘래요</button></div>`;
    c.classList.add('on'); const done = v => { c.classList.remove('on'); c.innerHTML = ''; res(v); };
    $('#rcNap').onclick = () => done('nap'); $('#rcNight').onclick = () => done('night'); $('#rcNo').onclick = () => done(null); c.onclick = e => { if (e.target === c) done(null); };
  });
}
async function rest(){
  if (me.rest) return showRest();
  const kind = await restChoose(); if (!kind) return;
  const R = restPlan()[kind];
  me.lastSleepAt = Date.now();
  me.rest = { at: Date.now(), until: Date.now() + R.ms, gain: R.gain, cap: R.cap, why: R.why, kind };
  endLesson(); save(); closeSheet(); speak('쉬는 중이에요');
  showRest();
}
let restTimer = 0;
function showRest(){
  const R = me.rest; if (!R) return;
  if (Date.now() >= R.until) return restEnd(false);
  const A = World.Avatar, fc = A.meta.parts.face.findIndex(p => p.id === 'face_closed'), av = { ...avOf(me), ...(fc >= 0 ? { face: fc } : {}) };
  $('#rest').innerHTML = `<div class="rbox px"><div class="rbed"><canvas id="rcv" width="96" height="56"></canvas><span class="zz">Z<b>z</b><b>z</b></span></div>
    <b class="gt">${R.kind === 'night' ? '밤잠을 자고 있어요' : '낮잠을 자고 있어요'}</b><span class="s" id="rleft"></span><span class="s sub">다 쉬면 마력 +${R.gain} (${R.why}) · 쉬는 동안은 아무것도 못 해요</span>
    <button class="btn sm" id="rwake">일찍 일어나기</button></div>`;
  $('#rest').classList.add('on');
  // 픽셀 침대: 뒤판 → 누운 캐릭터(왼쪽으로 90도) → 이불 (tools/iso/rest_art.py)
  const cv = $('#rcv'), g = cv.getContext('2d'), L = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = s; });
  Promise.all([L('art/rest_bed.png?v=1'), L('art/rest_quilt.png?v=1'), A.preload(['face'])]).then(([bed, quilt]) => {   // 눈 감은 얼굴을 먼저 불러와요
    g.imageSmoothingEnabled = false; g.clearRect(0, 0, 96, 56); g.drawImage(bed, 0, 0);
    if (A.loaded){ g.save(); g.translate(-6, 61); g.rotate(-Math.PI / 2); g.drawImage(A.compose(av), 0, 0, A.FW, A.FH, 0, 0, A.FW, A.FH); g.restore(); }
    g.drawImage(quilt, 0, 0);
  });
  $('#rwake').onclick = () => restEnd(true);
  const tick = () => { if (!me.rest) return; const left = me.rest.until - Date.now(); if (left <= 0) return restEnd(false); const m = Math.floor(left / 6e4), sc = Math.floor(left / 1000) % 60, got = Math.floor(me.rest.gain * (Date.now() - me.rest.at) / (me.rest.until - me.rest.at)); $('#rleft').textContent = `남은 시간 ${m}:${String(sc).padStart(2, '0')} · 지금 일어나면 마력 +${got}`; };
  clearInterval(restTimer); tick(); restTimer = setInterval(tick, 1000);
}
// 하루: 진짜 날짜가 바뀌면 학기 날짜가 하루 지나고 주문이 새로 와요
function dayTick(){
  if (!me) return;
  if (me.dayKey !== todayKey()){ if (me.dayKey){ me.day++; me.orders = makeOrders(me.day, me.hints, me.found); toast(`봄 학기 ${me.day}일 아침이에요! 새 주문이 왔어요`); } me.dayKey = todayKey(); save(); if (sheetOn) render(); }
  if (typeof mqTick === 'function') mqTick();
}

// ---- 휴게실: 같은 기숙사 학생들이 재료를 모아 6단계까지 꾸미고 넓혀요 ----
// 기숙사마다 분위기에 맞는 재료를 모아요 (단계 2~6). coin은 골드
const HALL_COST = {
  ember: [{ herb:10, p_red:3, coin:1000 }, { p_blue:5, p_green:5, coin:2500 }, { p_purple:4, scale:10, coin:5000 }, { p_vigor:5, p_grow:5, coin:8000 }, { p_dragon:2, egg:3, coin:15000 }],
  moon:  [{ mush:10, coin:2000 }, { silk:10, whisker:5, coin:4000 }, { hegg:15, feather:8, coin:7000 }, { p_moon:3, p_dusk:3, coin:11000 }, { egg:3, g_star:5, coin:20000 }],
  dusk:  [{ wool:10, herb:10, coin:800 }, { uhair:10, hegg:10, coin:2000 }, { milk:10, honey:10, coin:4000 }, { whisker:10, feather:10, slime:10, coin:7000 }, { wool:30, honey:20, egg:3, coin:12000 }],
  dew:   [{ herb:15, drop:10, coin:800 }, { g_mint:10, g_clover:10, coin:2000 }, { g_lily:8, g_lotus:8, coin:4000 }, { g_firefly:6, g_snow:6, coin:7000 }, { g_aurora:4, g_moonf:4, egg:2, coin:12000 }],
};
const HALL_NAMES = {
  ember: ['먼지 쌓인 창고', '불 붙은 벽난로', '물약 선반', '수정구와 빗자루', '불타는 가마', '전설의 실험실'],
  moon:  ['낡은 관이 있는 방', '붉은 커튼', '벨벳 살롱', '금화 상자', '달빛 피아노', '밤의 왕좌'],
  dusk:  ['장작 창고', '돌 벽난로', '숲 냄새 나는 방', '반려동물 방석', '큰 달 창문', '전설의 오두막'],
  dew:   ['쇠사슬 소리', '푸른 도깨비불', '첫 화분', '떠다니는 도깨비불', '안개 분수', '전설의 유리 정원'],
};
let halls = {};   // 온라인: houses/{기숙사} = { stage, pool, who: { uid: { nick, n } }, last: [...] }
const hallOf = h => solo ? (h === me.house ? me.common : { stage: 1, pool: {} }) : (halls[h] || { stage: 1, pool: {} });
const commonStage = h => Math.max(1, Math.min(6, hallOf(h).stage || 1));
const hallNeed = h => HALL_COST[h][commonStage(h) - 1] || null;
const hallLeft = (h, k) => { const need = hallNeed(h); return need ? Math.max(0, (need[k] || 0) - (hallOf(h).pool?.[k] || 0)) : 0; };
function syncHalls(){ HOUSE_KEYS.forEach(h => World.setStage(HOUSE_DORM[h], commonStage(h))); }
// 재료 넣기: 넣은 만큼 가방에서 빠지고, 다 모이면 바로 다음 단계가 돼요
async function donate(k, want){
  const h = me.house, have = k === 'coin' ? me.coin : (me.inv[k] || 0), n = Math.min(want, have, hallLeft(h, k));
  if (n <= 0) return;
  let gave = 0, up = 0;
  const apply = cur => {
    cur = cur || { stage: 1, pool: {} }; cur.pool = cur.pool || {}; const st = cur.stage || 1, need = HALL_COST[h][st - 1];
    if (!need) return undefined;
    gave = Math.min(n, Math.max(0, (need[k] || 0) - (cur.pool[k] || 0))); if (gave <= 0) return undefined;
    cur.pool[k] = (cur.pool[k] || 0) + gave;
    cur.who = cur.who || {}; const w = cur.who[uid || 'me'] || { nick: me.nick, n: 0 }; w.nick = me.nick; w.n += k === 'coin' ? Math.ceil(gave / 100) : gave; cur.who[uid || 'me'] = w;
    if (Object.entries(need).every(([kk, v]) => (cur.pool[kk] || 0) >= v)){ cur.stage = st + 1; cur.pool = {}; up = cur.stage; }
    return cur;
  };
  if (solo){ me.common = apply(me.common) || me.common; }
  else {
    const r = await F.runTransaction(F.ref(db, 'houses/' + h), apply).catch(e => { toast('넣지 못했어요: ' + (e.code || e.message)); return null; });
    if (!r || !r.committed) return;
  }
  if (!gave) return;
  if (k === 'coin') me.coin -= gave; else me.inv[k] -= gave;
  save(); syncHalls();
  toast(up ? `휴게실이 ${up}단계 「${HALL_NAMES[h][up - 1]}」가 됐어요!` : `${k === 'coin' ? gave + 'G' : ITEM[k] + ' ' + gave + '개'}를 넣었어요`);
  if (sub === 'common') renderCommon();
}
function renderCommon(){
  const h = me.house, H = HOUSES[h], st = commonStage(h), need = hallNeed(h), hall = hallOf(h);
  const who = Object.values(hall.who || {}).sort((a, b) => b.n - a.n).slice(0, 6);
  const row = (k, v) => {
    const got = hall.pool?.[k] || 0, have = k === 'coin' ? me.coin : (me.inv[k] || 0), left = Math.max(0, v - got), done = left === 0;
    const steps = k === 'coin' ? [[100, '+100G'], [1000, '+1000G']] : [[1, '+1'], [10, '+10']];
    return `<div class="li">${ic(k === 'coin' ? 'coin' : k)}<div class="main"><span class="t">${k === 'coin' ? '골드' : ITEM[k]} <span class="sub num">${got.toLocaleString()} / ${v.toLocaleString()}</span></span>
      <div class="pbar" style="height:6px;margin-top:3px"><i style="width:${Math.min(100, got / v * 100)}%;background:${done ? 'var(--ok)' : H.col}"></i></div>
      <span class="d">가진 것 ${have.toLocaleString()}</span></div>
      ${done ? '<span class="tag">다 모았어요</span>' : steps.map(([n, l]) => `<button class="btn sm ${have > 0 ? 'go' : ''}" data-don="${k},${n}" ${have > 0 ? '' : 'disabled'}>${l}</button>`).join('')}</div>`;
  };
  const tabs = [['gather', need ? '재료 모으기' : '완성!'], ['stage', `단계 ${st} / 6`], ['who', `도와준 친구${who.length ? ' ' + who.length : ''}`]];
  let body = '';
  if (commonTab === 'gather'){
    body = need ? `<section class="sec">
      ${secH(`다음: ${st + 1}단계 「${HALL_NAMES[h][st]}」`, '')}
      <div class="box px">${Object.entries(need).map(([k, v]) => row(k, v)).join('')}</div>
      ${hint('', '')}
    </section>` : `<section class="sec"><div class="hint on px">전설의 휴게실을 완성했어요!</div></section>`;
  } else if (commonTab === 'stage'){
    body = `<section class="sec">
      ${secH('휴게실 단계', `지금 ${st}단계 · ${HALL_NAMES[h][st - 1]}`)}
      <div class="box px" style="padding:10px 12px;display:grid;grid-template-columns:repeat(2,1fr);gap:6px 10px">
        ${HALL_NAMES[h].map((nm, i) => `<div style="display:flex;align-items:center;gap:8px;min-height:40px"><span class="b num" style="width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:8px;border:2px solid ${i < st ? H.col : 'var(--line2)'};background:${i === st - 1 ? H.col : 'var(--soft)'};color:${i === st - 1 ? '#2A1506' : i < st ? H.col : 'var(--sub)'}">${i + 1}</span><span class="s" style="line-height:1.3;color:${i === st - 1 ? 'var(--text)' : 'var(--sub)'}">${nm}</span></div>`).join('')}
      </div>
      ${hint('', `쉬면 마력 +${(st - 1) * 2} 더`)}
    </section>`;
  } else {
    body = `<section class="sec">${secH('많이 도와준 친구', who.length ? '재료를 넣은 수' : '')}
      ${who.length ? `<div class="box px">${who.map((w, i) => `<div class="li"><span class="b num" style="width:22px">${i + 1}</span><div class="main"><span class="t">${esc(w.nick)}</span></div><span class="tag num">${w.n}</span></div>`).join('')}</div>` : '<div class="hint">아직 없어요</div>'}
    </section>`;
  }
  frame('dorm', `${H.name} 휴게실`, `${st}단계 · ${HALL_NAMES[h][st - 1]}`, segRow('ctab', commonTab, tabs) + body, { tint: H.col });
  on('[data-ctab]', b => { commonTab = b.dataset.ctab; renderCommon(); });
  on('[data-don]', b => { const [k, n] = b.dataset.don.split(','); donate(k, +n); });
}

// 친구 생물과 짝꿍 맺기: 친구마다 하루 한 번, 알은 나만 받아요 (친구 방명록에 소식이 남아요)
const friendCr = p => normalize({ cr: JSON.parse(JSON.stringify(p.cr || [])), inv: {} }).cr;
function breedSection(p){

function bindBreed(p){

// ===== 쪽지시험: 화·목·토(현실 시간) 오전 9시~오후 8시, 그날 한 번만 · 시작하면 나갈 수 없어요 · 다음 날(수·금·일) 게시판에 성적이 붙고 1~3등은 장학금 =====
const EXAM_N = 10, EXAM_SEC = 20, EXAM_DAYS = [2, 4, 6], EXAM_FROM = 9, EXAM_TO = 20, EXAM_TOP = [500, 400, 300], EXAM_START = new Date(2026, 9, 29);   // 첫 시험은 10월 29일(목)부터
const examDay = d => EXAM_DAYS.includes(d.getDay()) && d >= EXAM_START;
const ymd = d => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
const examOpenKey = (d = new Date()) => examDay(d) && d.getHours() >= EXAM_FROM && d.getHours() < EXAM_TO ? ymd(d) : null;   // 지금 볼 수 있으면 그날 열쇠
const examKey = () => ymd(new Date());
const examToday = () => examDay(new Date());
const examDone = () => examToday() && me.exam?.week === examKey() && me.exam.done;
const examStarted = () => examToday() && me.exam?.week === examKey();
const examDayName = ['일', '월', '화', '수', '목', '금', '토'];
function examBoardKey(){   // 가장 최근에 성적이 붙은 시험날 (시험 다음 날 0시부터)
  const d = new Date(); for (let k = 1; k <= 8; k++){ const x = new Date(d); x.setDate(x.getDate() - k); if (examDay(x)) return ymd(x); } return null; }
function examForfeit(){   // 시험 도중에 앱을 닫았으면 푼 데까지만 점수가 돼요
  if (!me || !me.exam || me.exam.done || exam) return; const e = me.exam; e.done = true; e.score = Math.max(0, Math.min(100, e.score || 0)); examFinalize(e.score, e.week); }
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n, not = []) => shuffle(a.filter(x => !not.includes(x))).slice(0, n);
// 받침에 맞춰 조사 고르기: josa('물약', '을', '를') → '을'
const josa = (w, a, b, ro) => { const c = String(w).charCodeAt(String(w).length - 1); if (c < 0xAC00 || c > 0xD7A3) return b; const jong = (c - 0xAC00) % 28; return ro ? (jong === 0 || jong === 8 ? b : a) : jong ? a : b; };
const gradeOf = s => s >= 100 ? 'A+' : s >= 90 ? 'A' : s >= 80 ? 'B+' : s >= 70 ? 'B' : s >= 60 ? 'C' : 'D';
// 문제 만들기: 내가 레시피를 아는 물약 + 누구나 아는 학교 상식
function makeExam(){
  const known = POTIONS.filter(p => me.hints.includes(p) || me.found.includes(p));
  const Q = [];
  const q4 = (t, q, a, wrong) => Q.push({ t, q, a, choices: shuffle([a, ...wrong.slice(0, 3)]) });
  known.forEach(p => {
    q4('recipe', `「${recipeText(p)}」${josa(recipeText(p), '으로', '로', true)} 만드는 물약은?`, ITEM[p], pick(POTIONS, 3, [p]).map(x => ITEM[x]));
    q4('recipe', `「${ITEM[p]}」의 레시피는?`, recipeText(p), pick(POTIONS, 3, [p]).map(recipeText));
  });
  HOUSE_KEYS.forEach(k => {
    q4('house', `「${HOUSES[k].name}」 기숙사의 시간은?`, hoursText(HOUSES[k]), HOUSE_KEYS.filter(x => x !== k).map(x => hoursText(HOUSES[x])));
    q4('house', `「${HOUSES[k].perk}」 보너스를 받는 기숙사는?`, HOUSES[k].name, HOUSE_KEYS.filter(x => x !== k).map(x => HOUSES[x].name));
  });
  CREATURES.forEach((c, i) => q4('ranch', `사육장의 「${c.kind}」${josa(c.kind, '이', '가')} 주는 재료는?`, ITEM[c.mat], CREATURES.filter((_, j) => j !== i).map(x => ITEM[x.mat])));
  POTIONS.filter(p => POTION_INFO[p].time).forEach(p => q4('time', `「${ITEM[p]}」${josa(ITEM[p], '을', '를')} 끓일 수 있는 시간은?`, hoursText(HOUSES[POTION_INFO[p].time]), HOUSE_KEYS.filter(x => x !== POTION_INFO[p].time).map(x => hoursText(HOUSES[x]))));
  known.filter(p => POTION_INFO[p].use).forEach(p => q4('use', `「${POTION_INFO[p].use}」 효과가 있는 물약은?`, ITEM[p], pick(POTIONS, 3, [p]).map(x => ITEM[x])));
  // 레시피 문제는 최대 절반, 나머지는 섞어서
  const recipeQs = shuffle(Q.filter(x => x.t === 'recipe')).slice(0, EXAM_N / 2);
  const rest = shuffle(Q.filter(x => x.t !== 'recipe'));
  return shuffle([...recipeQs, ...rest].slice(0, EXAM_N));
}
let exam = null;   // { qs, i, right, picked, t0 }
function startExam(){
  if (examStarted()) return; if (!examOpenKey()) return toast('시험 시간이 아니에요');
  me.exam = { week: examKey(), score: 0, done: false }; save();   // 도중에 나가도 한 번 본 걸로 쳐요
  exam = { qs: makeExam(), i: 0, right: 0, picked: null, t0: Date.now() };
  sub = 'exam'; render();
}
let examTick = 0;
function renderExam(){
  clearInterval(examTick);
  if (!exam){ return renderExamResult(); }
  const Qn = exam.qs[exam.i];
  frame('class', '쪽지시험', `${exam.i + 1} / ${exam.qs.length}번 문제`, `
    <section class="sec">
      <div class="sec-h"><h3>${exam.i + 1}번</h3><span class="meta" id="exLeft"></span></div>
      <div style="height:8px;background:var(--line)"><div id="exBar" style="height:100%;background:#6A4AC8;width:100%"></div></div>
      <div class="box px" style="padding:14px 12px;min-height:72px;display:flex;align-items:center"><span style="line-height:22px">${Qn.q}</span></div>
      <div style="display:flex;flex-direction:column;gap:6px">${Qn.choices.map((c, j) => {
        const shown = exam.picked !== null, isA = c === Qn.a, mine = exam.picked === j;
        return `<button class="btn" data-ans="${j}" ${shown ? 'disabled' : ''} style="justify-content:flex-start;text-align:left;white-space:normal;min-height:48px;padding:6px 12px;${shown && isA ? 'background:var(--mint);opacity:1' : shown && mine ? 'background:#FFD0DA;opacity:1' : ''}"><span class="b" style="color:var(--sub);width:20px;flex-shrink:0">${'ABCD'[j]}</span><span style="font-family:'G11',monospace">${c}</span></button>`;
      }).join('')}</div>
      <div class="hint">맞힌 문제 ${exam.right}개</div>
    </section>`);
  on('[data-ans]', b => answer(+b.dataset.ans));
  if (exam.picked === null){
    const tick = () => {
      const left = EXAM_SEC - (Date.now() - exam.t0) / 1000;
      const el = $('#exBar'); if (!el || sub !== 'exam') return clearInterval(examTick);
      el.style.width = Math.max(0, left / EXAM_SEC * 100) + '%'; $('#exLeft').textContent = Math.ceil(Math.max(0, left)) + '초';
      if (left <= 0) answer(-1);
    };
    tick(); examTick = setInterval(tick, 200);
  }
}
function answer(j){
  if (!exam || exam.picked !== null) return;
  clearInterval(examTick);
  exam.picked = j;
  if (j >= 0 && exam.qs[exam.i].choices[j] === exam.qs[exam.i].a) exam.right++;
  me.exam.score = exam.right * 10; save();
  renderExam();
  setTimeout(() => {
    if (sub !== 'exam' || !exam) return;
    exam.i++; exam.picked = null; exam.t0 = Date.now();
    if (exam.i >= exam.qs.length) finishExam(); else renderExam();
  }, 900);
}
function finishExam(){
  const s = Math.round(exam.right * 100 / exam.qs.length); exam = null; me.exam.done = true; me.exam.score = s; examFinalize(s, me.exam.week); renderExamResult();
}
function examFinalize(s, week){
  const r = [];
  if (s >= 60){ const g = Math.round(s * 2); me.coin += g; r.push(`장학금 ${g}G`); }
  if (s >= 80){ const k = ['uhair','scale','wool'][Math.floor(Math.random() * 3)]; me.inv[k] += 2; r.push(`${ITEM[k]} ×2`); }
  if (s >= 100){ me.inv.egg += 1; r.push('용 알 껍질 ×1'); }
  me.exam.reward = r.join(' · ') || ''; me.exam.at = Date.now();
  save(); hud();
  const n = new Date(), frac = .99 * (1 - (n.getHours() * 3600 + n.getMinutes() * 60 + n.getSeconds()) / 86400);   // 같은 점수면 먼저 낸 사람이 앞서요
  if (!solo && F && db) F.set(F.ref(db, `exam/${week}/${uid}`), s + frac).catch(() => {});
}

let tutCtx = null;
function tutPanel(lines, i){

  npcUI().innerHTML = `<div class="npcp px"><div class="npch"><div class="npcf">${headImg(tutAv())}</div><div><b>${esc(TUT.name)}</b><span class="s sub">${esc(TUT.title)}${tutOn() ? ` · 입문 ${me.tut.s + 1} / ${TUT.steps.length}` : ''}</span></div><button class="sx" data-nx="close">✕</button></div><div class="npct">${esc(lines[i])}</div><div class="frow"><button class="btn sm go" data-tut="${last ? 'end' : 'next'}">${last ? '알겠어요' : '다음'}</button></div></div>`;
  npcUI().classList.add('on'); tutCtx = { lines, i, after: tutCtx && tutCtx.after };
}
function tutTalk(){
  if (!tutOn()) return; const T = me.tut, st = TUT.steps[T.s], nx = TUT.steps[T.s + 1]; let lines, after = null;
  if (!T.g){ lines = [...(T.s === 0 ? TUT.intro : []), ...st.ask]; after = () => { T.g = 1; save(); syncNpcs(); }; }
  else if (!T.ok) lines = [st.again];
  else { lines = [...st.done, ...(nx ? nx.ask : [])];
    after = () => { me.coin += st.rew.coin; toast(`${st.rew.coin}G 받았어요`); if (nx){ T.s++; T.g = 1; T.ok = 0; } else T.end = 1; save(); hud(); syncNpcs(); }; }
  tutCtx = { after }; tutPanel(lines, 0);
}

        ${sellPick ? `<div style="display:flex;gap:6px;align-items:center"><span class="s" style="flex:1">${ITEM[sellPick]} 1개</span><input id="price" type="number" min="1" max="9999" value="${PAY[sellPick] || CATCH_INFO[sellPick]?.pay || DISH_INFO[sellPick]?.pay || 20}" class="mkin"><span class="s">G</span><button class="btn sm go" id="list">올리기</button></div>` : ''}

    on('[data-mqs]', b => { const i = +b.dataset.mqs; if (mqPzPick.includes(i)) return; if (i === order[mqPzPick.length]){ mqPzPick.push(i); sfx('sparkle'); if (mqPzPick.length >= n){ s.prog['puzzle:' + mqPz] = 1; save(); sfx('magic'); toast(o.doneText || '별자리가 이어졌어요!'); mqPzPick = []; mqCheck(); jnTab = 'story'; return openSheet('home', 'journal'); } } else { mqPzPick = []; sfx('gulp'); toast('그 별이 아니에요. 처음부터!'); } render(); });
    $('#mqpzreset').onclick = () => { mqPzPick = []; render(); };
  } else {
    const items = o.items || [], ans = o.answer || items.map((_, i) => i);
    frame(null, o.title || '순서 맞추기', o.sub || '차례대로 눌러요', `<div class="hint ${o.hintText ? 'on' : ''}">${esc(o.hintText || '맞는 순서로 하나씩 골라요')}</div>
      <div class="tiles">${items.map((t, i) => { const k = mqPzPick.indexOf(i); return `<button class="tile ${k >= 0 ? 'sel' : ''}" data-mqo="${i}" ${k >= 0 ? 'disabled' : ''}><span class="main"><span class="b">${k >= 0 ? k + 1 + '. ' : ''}${esc(t)}</span></span></button>`; }).join('')}</div>
      <div class="s" style="text-align:center">${mqPzPick.length} / ${items.length}</div><button class="btn" id="mqpzreset">처음부터</button>`);
    on('[data-mqo]', b => { const i = +b.dataset.mqo; if (i === ans[mqPzPick.length]){ mqPzPick.push(i); sfx('pop'); if (mqPzPick.length >= items.length){ s.prog['puzzle:' + mqPz] = 1; save(); sfx('magic'); toast(o.doneText || '순서를 맞췄어요!'); mqPzPick = []; mqCheck(); jnTab = 'story'; return openSheet('home', 'journal'); } } else { mqPzPick = []; sfx('gulp'); toast('순서가 달라요. 처음부터!'); } render(); });
    $('#mqpzreset').onclick = () => { mqPzPick = []; render(); };
  }
}
// ---- 지키기: 등불을 향해 오는 바람·그림자를 눌러 흩어요. 제한 시간을 버티면 성공 ----
function mqDefend(i){
  const o = mqObjs()[i]; if (!o || o.type !== 'defend') return; const s = mqState();
  if (o.place){ const p = NL.places[o.place]; const m = World.myPos && World.myPos(); if (p && (World.where() !== p.map || Math.hypot(m.x - p.x, m.y - p.y) > (p.r || 2) + 3)) return toast(`${fillVars(p.name)}에서 시작해요`); }
  const sec = o.sec || 30, ov = document.createElement('div'); ov.id = 'mqdef'; ov.className = 'px';
  ov.innerHTML = `<div class="mqdhud"><b>${esc(o.text || '등불 지키기')}</b><span class="num" id="mqdt">${sec}</span></div><div class="mqdmeter"><i id="mqdf" style="width:100%"></i></div><div class="mqdstage" id="mqds"><div class="mqlamp" id="mqlamp">🏮</div></div><div class="s mqdhint">${esc(o.hintText || '등불 쪽으로 오는 바람을 눌러서 흩어요')}</div>`;
  $('#stage').appendChild(ov); sfx('wind');
  let flame = 100, t0 = performance.now(), last = t0, spawnAt = 0, gusts = [], over = false;
  const stg = ov.querySelector('#mqds'), lamp = ov.querySelector('#mqlamp');
  const end = ok => { if (over) return; over = true; gusts.forEach(g => g.el.remove()); ov.remove(); if (ok){ s.prog['defend:' + i] = 1; save(); sfx('magic'); toast(o.doneText || '등불을 지켰어요!'); mqCheck(); } else { sfx('thunder'); toast('등불이 꺼졌어요.... 다시 해 봐요'); } };
  const tick = now => { if (over) return; const dt = (now - last) / 1000; last = now; const el = (now - t0) / 1000, left = Math.max(0, sec - el); ov.querySelector('#mqdt').textContent = Math.ceil(left);
    if (now > spawnAt){ spawnAt = now + Math.max(500, 1500 - el * 25); const g = document.createElement('button'); g.className = 'mqgust'; g.textContent = ['🌬️', '🌫️', '👻', '🍂'][Math.floor(Math.random() * 4)]; const ang = Math.random() * Math.PI * 2; const r = 1.1; g.ax = .5 + Math.cos(ang) * r; g.ay = .5 + Math.sin(ang) * r; g.sp = (.12 + Math.random() * .08) * (1 + el / sec); stg.appendChild(g); const G = { el: g, x: g.ax, y: g.ay }; gusts.push(G); g.onclick = e => { e.stopPropagation(); G.dead = true; g.remove(); sfx('pop'); }; g.onpointerdown = g.onclick; }
    gusts.forEach(G => { if (G.dead) return; const dx = .5 - G.x, dy = .5 - G.y, d = Math.hypot(dx, dy) || 1; G.x += dx / d * G.sp * dt; G.y += dy / d * G.sp * dt; G.el.style.left = G.x * 100 + '%'; G.el.style.top = G.y * 100 + '%'; if (d < .06){ G.dead = true; G.el.remove(); flame -= o.hitDamage || 18; lamp.classList.add('hit'); setTimeout(() => lamp.classList.remove('hit'), 300); sfx('gulp'); } });
    gusts = gusts.filter(G => !G.dead); ov.querySelector('#mqdf').style.width = Math.max(0, flame) + '%';
    if (flame <= 0) return end(false); if (left <= 0) return end(true); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
// ---- 상황 버튼: 솥·오븐 옆에서 「의뢰 제조」 ----
function mqCtxExtra(t){ const s = mqState(); if (!s.q || s.ph !== 'go' || !t || t.kind !== 'act') return ''; const nm = t.o && t.o.name; const pl = nm === 'cauldron' ? 'lab' : (nm === 'oven' || nm === 'stove') ? 'candy' : null; if (!pl) return ''; mqCraftPlace = pl; return mqRecipes().length ? `<button data-ctx="mqcraft">의뢰 제조</button>` : ''; }
// ---- 가방 「중요」 탭 항목 ----
function mqBagKeys(){ return Object.keys(MQ.items).filter(k => MQ.items[k].key && me.inv[k] > 0).map(k => ({ id: k, kind: 'inv', n: me.inv[k], name: ITEM[k], ico: mqIc(k) })); }
const mqIc = k => { const it = MQ.items[k]; return it && it.emoji ? `<i class="ic mqic">${it.emoji}</i>` : ic(k); };
// ---- 시험용 손잡이 ----
window.__mq = { state: () => mqState(), set: (q, st, ph) => { const s = mqState(); s.q = q; s.st = st || 1; s.ph = ph || 'pre'; s.prog = {}; save(); syncNpcs(); mqMarks(); }, done: q => { const s = mqState(); s.done[q] = me.day; save(); mqSky(); }, play: (q, n, k) => mqPlay(MQ.q[q], n, k), tick: () => mqTick(), check: () => mqCheck(), moon: m => { if (m) localStorage.setItem('magion-moon', m); else localStorage.removeItem('magion-moon'); }, MQ };
// ----- /메인 의뢰 -----
