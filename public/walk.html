  const ty = M.H <= VH ? (M.H - VH) / 2 - 10 : Math.max(-20, Math.min(M.H - VH + 20, my - 14 - VH / 2));
  if (camX === null){ camX = tx; camY = ty; } camX += (tx - camX) * Math.min(1, dt * 5); camY += (ty - camY) * Math.min(1, dt * 5);
  const ix = Math.round(camX), iy = Math.round(camY);
  out.fillStyle = M.indoor ? '#0C0715' : '#22301F'; out.fillRect(0, 0, VW, VH); out.drawImage(sc, ix, iy, VW, VH, 0, 0, VW, VH);
  const k = cv.clientWidth / VW;
  people.forEach((p, i) => { const [sx, sy] = P(p.x + .5, p.y + .5); tags[i].style.left = (sx - ix) * k + 'px'; tags[i].style.top = (sy - 25 - iy) * k + 'px'; });
  if (bubble){ const o = bubble.o; bubble.el.style.left = Math.max(90, Math.min(cv.clientWidth - 90, (o.x + o.sw / 2 - ix) * k)) + 'px'; bubble.el.style.top = Math.max(70, (o.y - 2 - iy) * k) + 'px'; }
  const d = new Date(); document.getElementById('clock').textContent = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')} · ${{ day: '낮', dusk: '노을', night: '밤' }[phase()]}`;
  requestAnimationFrame(frame);
}
document.getElementById('tDay').onclick = () => { const order = ['day', 'dusk', 'night']; forceNight = order[(order.indexOf(phase()) + 1) % 3]; };
document.getElementById('tWhere').onclick = () => { if (map !== 'campus') setMap('campus', [16, 12]); else { me.path = []; goto(me, 16, 11); } };
(async () => {
  resize();
  ST = await img('art/iso/students.png');
  for (const [id, m] of Object.entries(MAPS)){
    const [bg, obj] = await Promise.all([img(m.meta.bgSrc), img(m.meta.objSrc)]);
    m.bg = bg; m.obj = obj; m.sc = document.createElement('canvas'); m.sc.width = m.meta.W; m.sc.height = m.meta.H;
    const pc = document.createElement('canvas'); pc.width = obj.width; pc.height = obj.height; m.px = pc.getContext('2d', { willReadFrequently: true }); m.px.drawImage(obj, 0, 0);
  }
  setMap('campus', MAPS.campus.meta.start);
  requestAnimationFrame(frame);
})();
