:root{--bg:#140D1E;--panel:#211733;--panel2:#2B1F45;--line:#3A2A55;--line2:#4E3C72;--accent:#FF9A3C;--purple:#9B7BFF;--ok:#6FD08C;--warn:#FF6B6B;--text:#F6F0FF;--sub:#BDB0D6;--gold:#FFD866;--pink:#FF8FAF;--soft:#342852;
  --f-body:'Pretendard',system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;--f-px:'G11',var(--f-body);--f-pxb:'G11B',var(--f-body);
  --fs:15px;--fs-s:13px;--fs-h:16px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:var(--fs);line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
#app{max-width:560px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.shead{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 14px;border-bottom:1px solid var(--line)}
.shead .title{flex:1;min-width:0;display:flex;flex-direction:column}
.shead .title b{font-family:var(--f-pxb);font-size:var(--fs-h);font-weight:400}
.shead .title span{font-size:var(--fs-s);color:var(--sub)}
.shead .stat{height:32px;padding:0 12px;border-radius:16px;background:var(--panel2);border:1px solid var(--line2);display:flex;align-items:center;font-family:var(--f-pxb);font-size:var(--fs-s);color:var(--gold);white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:12px 14px 0;border-radius:12px;background:var(--panel2);padding:4px}
.tabs button{border:0;border-radius:8px;background:transparent;min-height:44px;font-family:var(--f-pxb);font-size:var(--fs-s);color:var(--sub);cursor:pointer;line-height:1.2}
.tabs button.on{background:var(--accent);color:#2A1506}
.body{padding:14px;display:flex;flex-direction:column;gap:16px}
#stagebox{background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
#cv{width:100%;max-width:280px;aspect-ratio:1/1;image-rendering:pixelated;background:radial-gradient(circle at 50% 45%,#3E2F5E 0,#2B1F45 70%);border-radius:10px}
#msg{text-align:center;min-height:44px}
#msg b{font-family:var(--f-pxb);font-weight:400;font-size:var(--fs-h);color:var(--gold);display:block}
#msg span{font-size:var(--fs-s);color:var(--sub)}
.slots{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.slot{width:40px;height:40px;border-radius:8px;border:1px dashed var(--line2);background:var(--panel);display:grid;place-items:center;padding:0;cursor:pointer}
.slot canvas{width:32px;height:32px;image-rendering:pixelated}
.slot.on{border:2px solid var(--accent)}
.panel{display:flex;flex-direction:column;gap:10px}
.step{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-family:var(--f-pxb);font-size:var(--fs-h)}
.step b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--accent);color:#2A1506;font-weight:400;font-size:var(--fs-s)}
.step span{font-family:var(--f-body);font-size:var(--fs-s);color:var(--sub)}
.lab{font-family:var(--f-pxb);font-size:var(--fs-s);color:var(--text);margin-top:4px}
.panel small{display:block;font-size:12px;color:var(--sub)}
.panel small.lack,.need li.lack{color:var(--warn)}
.seg{display:flex;flex-wrap:wrap;gap:4px;border-radius:12px;background:var(--panel2);padding:4px}
.seg button{flex:1 1 auto;min-width:56px;border:0;border-radius:8px;background:transparent;min-height:44px;font-family:var(--f-pxb);font-size:var(--fs-s);color:var(--sub);padding:4px 8px;cursor:pointer}
.seg button.on{background:var(--accent);color:#2A1506}
.seg.g4{display:grid;grid-template-columns:repeat(4,1fr)}.seg.g4 button{min-width:0}
.sw{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.sw button{aspect-ratio:1/1;min-height:30px;border-radius:6px;border:2px solid var(--line2);cursor:pointer;padding:0}
.sw button.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--gold)}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fl{border:1px solid var(--line2);border-radius:8px;background:var(--panel2);color:var(--text);display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;position:relative;min-height:84px;font:var(--fs-s) var(--f-body);cursor:pointer}
.fl canvas{width:32px;height:32px;image-rendering:pixelated}
.fl small{font-size:11px;color:var(--sub)}
.fl .n{position:absolute;right:4px;top:2px;font-family:var(--f-pxb);font-size:11px;color:var(--gold)}
.fl:disabled{opacity:.4}
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.chipb{border:1px solid var(--line2);border-radius:8px;background:var(--panel2);color:var(--text);text-align:left;display:flex;flex-direction:column;gap:2px;padding:8px 10px;font-family:var(--f-pxb);font-size:var(--fs-s);min-height:52px;cursor:pointer}
.chipb.on{border:2px solid var(--accent);background:var(--line)}
.next,.btn{min-height:46px;border:2px solid var(--line2);border-radius:12px;background:var(--panel2);color:var(--text);font-family:var(--f-pxb);font-size:var(--fs);cursor:pointer;margin-top:4px}
.next.big,.next{background:var(--accent);border-color:var(--accent);color:#2A1506}
.next:disabled{opacity:.45}
.ghost{border:0;background:none;color:var(--sub);min-height:44px;font:var(--fs-s) var(--f-body);cursor:pointer}
.need{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:6px}
.need li{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:baseline;padding:6px 8px;border-radius:8px}
.need li + li{border-top:1px solid var(--line)}
.need .w{font-size:12px;color:var(--sub)}
.need .num{font-family:var(--f-pxb);color:var(--gold);font-variant-numeric:tabular-nums}
.need li.lack .num{color:var(--warn)}
.ok{margin:0;font-family:var(--f-pxb);color:var(--ok)}
.npcs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.npc{border:1px solid var(--line2);border-radius:8px;background:var(--panel2);color:var(--text);font:12px var(--f-pxb);display:flex;flex-direction:column;align-items:center;padding:4px;min-height:76px;cursor:pointer}
.npc canvas{width:48px;height:48px;image-rendering:pixelated}

  if (pose === 'fiddle' && Math.floor(t * 2) % 2){ q.fillStyle = '#FFF'; q.font = '9px G11, sans-serif'; q.fillText('꼼지락', 92, 26); }
  if (pose === 'fiddle') for (let i = 0; i < 3; i++){ const p = (t * .8 + i / 3) % 1; q.fillStyle = ['#FF8FAF', '#FFD866', '#FFFFFF'][i]; q.fillRect(70 + Math.sin(i * 3 + t * 3) * 14, 50 - p * 30, 2, 2); }
  if (pose === 'jump'){ q.fillStyle = '#FFD866'; q.fillRect(92, 14 + jump, 3, 8); q.fillRect(92, 24 + jump, 3, 3); }
  
  if (pose === 'hide'){ const w = Math.round(Math.sin(t * 30)); q.fillStyle = '#6AAE5E'; q.fillRect(70 + w, 14, 2, 4); q.fillRect(76 - w, 13, 2, 4); }
  if (pose === 'offer' || pose === 'shy' || pose === 'give'){
    const bc = document.createElement('canvas'); bc.width = bc.height = 128; draw(bc.getContext('2d'), MANDI_ST());
    const s = pose === 'offer' ? Math.min(1, t * 2.2) : 1; q.drawImage(bc, 0, 0, 128, 128, 86 - 28 * s, 66 - 40 * s, 56 * s, 56 * s);
    if (pose === 'shy'){ for (let i = 0; i < 3; i++){ const p = (t * .7 + i / 3) % 1; q.fillStyle = '#FF8FAF'; const hx = 100 + i * 9, hy = 34 - p * 18; q.fillRect(hx, hy, 2, 2); q.fillRect(hx + 3, hy, 2, 2); q.fillRect(hx, hy + 1, 5, 2); q.fillRect(hx + 1, hy + 3, 3, 1); } }
  }
  if (pose === 'give'){ q.drawImage(NOTE_IMG, 0, 0, 32, 32, 40, 52, 32, 32); }
}
// 채집 · 낚시 흉내: 가끔 그 장소 쪽지가 나와요
function hunt(kind){
  const left = FL.filter(f => !KNOWN.has(f.id) && PAGE[f.id][0] === kind);
  const loot = kind === '채집' ? ['들꽃', '고사리', '도토리', '촉촉 이끼', '산딸기'] : ['붕어', '피라미', '빈 깡통', '미꾸라지', '해초'];
  if (left.length && Math.random() < .45){ const f = left[Math.floor(Math.random() * left.length)]; const first = !unlocked && KNOWN.size === 0; KNOWN.add(f.id); noteOpen = f.id; noteMsg = `<img src="${PAGE_IMG.src}" alt=""><span><b>꽃말 쪽지를 주웠어요</b><br>「${f.n}」 꽃말이 수첩에 적혔어요</span>`; if (first) noteMsg = noteMsg.replace('</span>', '<br><b>맨디에게 가 보자</b></span>'); }
  else { noteMsg = `${loot[Math.floor(Math.random() * loot.length)]}${kind === '채집' ? '을(를) 주웠어요' : '을(를) 낚았어요'}${left.length ? '. 쪽지는 없었어요' : `. ${kind} 쪽지는 다 모았어요`}`; }
  refresh();
}
function noteHTML(){
  const n = KNOWN.size, f = noteOpen && FB[noteOpen];
  return `${!unlocked && n ? `<div class="quest"><b>맨디에게 가 보자</b><span>꽃말을 하나 찾았어요. 약초 온실에서 맨디가 기다리고 있어요</span><button class="next" data-meet="1">약초 온실로 가기</button></div>` : ''}<div class="grp">${row(`맨디의 꽃말 수첩 <b>${n} / 21</b>`, `<span class="cost free">채집 ${FL.filter(x => PAGE[x.id][0] === '채집' && KNOWN.has(x.id)).length} / 14 · 낚시 ${FL.filter(x => PAGE[x.id][0] === '낚시' && KNOWN.has(x.id)).length} / 7</span>`)}
    <div class="bar"><i style="width:${n / 21 * 100}%"></i></div></div>
    <div class="hunt"><button class="btn" data-hunt="채집">풀숲 뒤지기 · 채집</button><button class="btn" data-hunt="낚시">낚싯대 던지기 · 낚시</button></div>
    ${noteMsg ? `<p class="toast">${noteMsg}</p>` : '<p class="hint">시안용 버튼이에요. 게임에서는 원래 하던 채집 · 낚시 그대로, 가끔 쪽지가 섞여 나와요.</p>'}
    ${f ? (k => `<div class="openbook"><img src="${OPEN_IMG.src}" alt=""><canvas width="32" height="32" data-ic="${f.id}" class="obflower"></canvas><b class="obname">${f.n}</b><em class="obword">${k ? `「${f.w}」` : '「???」'}</em><p class="obtext ${k ? '' : 'unk'}">${k ? PAGE[f.id][1] : `아직 쪽지를 못 찾았어요. ${PAGE[f.id][0]}하다 보면 나올지도 몰라요.......`}</p><small class="obfrom">${k ? PAGE[f.id][0] + ' 쪽지' : ''}</small></div>`)(KNOWN.has(f.id)) : ''}
    <div class="notegrid">${FL.map(x => { const k = KNOWN.has(x.id); return `<button class="pg ${k ? 'on' : ''} ${noteOpen === x.id ? 'sel' : ''}" data-pg="${x.id}"><canvas width="32" height="32" data-ic="${x.id}"></canvas><div><span>${x.n}</span><em class="${k ? 'k' : ''}">${k ? x.w : '???'}</em></div></button>`; }).join('')}</div>`;
}

function cineEnd(){ document.getElementById('cine').hidden = true; C = null; }
function dirTo(a, b){ const dx = b.x - a.x, dy = b.y - a.y, sx = (dx - dy) * 8, sy = (dx + dy) * 4; return Math.abs(sx) > Math.abs(sy) ? (sx > 0 ? 15 : 10) : (sy > 0 ? 0 : 5); }
async function walk(a, x, y, ms){ const x0 = a.x, y0 = a.y, t0 = performance.now(); a.dir = dirTo(a, { x, y }); a.walk = true;
  await new Promise(r => { const f = now => { const k = Math.min(1, (now - t0) / ms); a.x = x0 + (x - x0) * k; a.y = y0 + (y - y0) * k; a.step = (now - t0) / 130; if (k < 1) requestAnimationFrame(f); else r(); }; requestAnimationFrame(f); });
  a.walk = false; }
function bubble(a, text, ms = 1600){ C.bub = { a, text, until: performance.now() + ms }; return sleep(ms); }
function toast(t){ const el = document.getElementById('ctoast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2600); }
// 대화창: 게임의 식물 대화창 (초록 테두리 · 맨디 얼굴) · 한 글자씩 · 누르면 넘어가요
async function say(t, hold = 1400){
  const v = document.getElementById('blsay'), p = v.querySelector('p'), s = t.replace('{name}', `학생 ${stu + 1}`);
  const g = v.querySelector('canvas').getContext('2d'); g.imageSmoothingEnabled = false; g.fillStyle = '#1E2A20'; g.fillRect(0, 0, 32, 32); if (SHEET.complete) g.drawImage(SHEET, 21, 4 * 64 + 27, 28, 28, 2, 2, 28, 28);
  v.style.display = 'block'; p.textContent = ''; let skip = false; v.onclick = () => { skip = true; };
  for (let k = 1; k <= s.length && !skip; k++){ p.textContent = s.slice(0, k); await sleep(30); } p.textContent = s;
  await new Promise(r => { let done = false; const go = () => { if (done) return; done = true; r(); }; v.onclick = go; setTimeout(go, hold + s.length * 45); });
  v.style.display = 'none'; await sleep(120);
}
function popup(title, drawFn, col = '#FF8FAF'){ const v = document.getElementById('cpop'); v.querySelector('b').textContent = title; v.style.borderColor = col; const c = v.querySelector('canvas'), q = c.getContext('2d'); q.imageSmoothingEnabled = false; q.clearRect(0, 0, c.width, c.height); drawFn(q, c); v.classList.add('on'); }

function cineLoop(now){

  const focus = C.cam || C.A.me || { x: 12, y: 12 }, [fx, fy] = tp(C.m, focus.x, focus.y);
  const sh = C.shake > 0 ? (Math.random() * 4 - 2) : 0; C.shake = Math.max(0, C.shake - 16);
  const ox = Math.round(fx - CV.W / 2 + sh), oy = Math.round(fy - CV.H * .42);

  const list = [...C.props.map(p => ({ y: p.x + p.y + 1, f: () => { const [px, py] = W2(p.x, p.y), s = p.scale ?? 1; if (s <= 0) return; const w = 27 * Z * s, h = 29 * Z * s; q.drawImage(BENCH_IMG, 0, 0, 27, 29, px - 9 * Z - (w - 27 * Z) / 2, py - 15 * Z - (h - 29 * Z), w, h); if (p.flowers && FLIMG.complete) [['lily', -6], ['rose', 8], ['chamo', 20]].forEach(([id, dx]) => q.drawImage(FLIMG, FIDX[id] * 32, 0, 32, 32, px + dx * Z / 2 - 4 * Z, py - 19 * Z, 8 * Z, 8 * Z)); } })),
    ...Object.values(C.A).map(a => ({ y: a.x + a.y, f: () => drawActor(q, a, W2, t) }))];
  list.sort((A, B) => A.y - B.y).forEach(o => o.f());
  // 효과
  const M = C.A.mandi;
  if (M && C.petals){ const [px, py] = W2(M.x, M.y); for (let i = 0; i < 4; i++){ const p = (t * .9 + i / 4) % 1; q.fillStyle = ['#FF8FAF', '#FFD866', '#FFFFFF', '#9AD4F0'][i]; q.fillRect(px - 10 + Math.sin(i * 3 + t * 3) * 14, py - 44 - p * 30, 3, 3); } q.font = '12px G11, sans-serif'; q.fillStyle = '#FFF6C0'; if (Math.floor(t * 2.5) % 2) q.fillText('꼼지락꼼지락', px + 14, py - 62); }
  if (M && C.water){ const [px, py] = W2(M.x, M.y); for (let i = 0; i < 4; i++){ const p = (t * 1.6 + i / 4) % 1; q.fillStyle = '#A8E0FF'; q.fillRect(px - 2 + i * 3 - p * 4, py - 66 - 10 + p * 18, 2, 3); } }

  if (C.sparkle && C.dustAt){ const [px, py] = W2(C.dustAt.x, C.dustAt.y); for (let i = 0; i < 9; i++){ if ((Math.floor(t * 7) + i) % 3) continue; const x = px - 30 + (i * 17) % 60, y = py - 60 + (i * 11) % 40; q.fillStyle = '#FFF3C8'; q.fillRect(x, y - 2, 2, 6); q.fillRect(x - 2, y, 6, 2); } }

    q.fillStyle = '#22183F'; q.fillRect(bx - 2, by - 2, w + 4, 26); q.fillStyle = '#FFFFFF'; q.fillRect(bx, by, w, 22); q.fillStyle = '#22183F'; q.fillRect(Math.round(px) - 3, by + 24, 6, 2); q.fillRect(Math.round(px) - 1, by + 26, 2, 2); q.fillText(C.bub.text, bx + 8, by + 16); }
}
function drawActor(q, a, W2, t){

function meaning(){
  const ids = S.slots, uniq = [...new Set(ids)];
  if (!ids.length) return { head: '꽃을 골라 주세요', sub: `${S.size} 송이까지 들어가요` };
  const combo = COMBO.find(c => c.has.every(h => uniq.includes(h)));
  const cnt = {}; ids.forEach(i => cnt[i] = (cnt[i] || 0) + 1);
  const main = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
  const W_ = i => KNOWN.has(i) ? FB[i].w : '?', words = uniq.map(W_);
  if (combo && !combo.has.every(h => KNOWN.has(h))) return { head: words.map(w => `「${w}」`).slice(0, 3).join(' · '), sub: '모르는 꽃말이 있어요. 수첩을 채우면 숨은 뜻이 보여요', kind: combo.k };
  return { head: combo ? combo.t : `「${W_(main)}」${uniq.length > 1 ? ' 그리고 ' + words.filter(w => w !== W_(main)).slice(0, 2).map(w => `「${w}」`).join(' · ') : ''}`, sub: combo ? `특별한 조합 · ${uniq.map(i => FB[i].n).join(' + ')}` : `가장 많은 꽃 「${FB[main].n}」이 큰 목소리로 말해요`, kind: combo ? combo.k : null };
}

    const N = needs(), sh = short();
    html = S.made ? `<div class="grp">${row('누구에게 줄까요')}<div class="npcs">${NPCS.map(n => `<button class="npc" data-npc="${n.id}"><canvas width="64" height="64" data-row="${n.row}"></canvas>${n.n}</button>`).join('')}</div></div>`
      : `<div class="grp">${row('들어가는 재료', `<span class="cost ${sh.length ? 'lack' : 'free'}">${sh.length ? `${sh.length} 가지 모자라요` : '다 있어요'}</span>`)}
        <ul class="need">${Object.entries(N).map(([k, v]) => `<li class="${(INV[k] || 0) < v.n ? 'lack' : ''}"><span>${k}</span><b>${v.n}<i>/${INV[k] || 0}</i></b></li>`).join('')}</ul></div>`;
    html += `<div id="react"><canvas width="64" height="64" id="rcv"></canvas><div><b id="rn"></b><p id="rt"></p><div class="hearts" id="rh"></div></div></div>`;
    next = S.made ? null : ['make', !S.slots.length ? '꽃을 먼저 골라 주세요' : sh.length ? '재료가 모자라요' : '꽃다발 만들기', !S.slots.length || sh.length];
  }
  P.innerHTML = html;
  const mb = P.querySelector('#mbq'); if (mb) draw(mb.getContext('2d'), MANDI_ST());
  P.querySelectorAll('[data-ic]').forEach(c => { const q = c.getContext('2d'); q.imageSmoothingEnabled = false; q.drawImage(flowerIcon(FB[c.dataset.ic]), 0, 0); });
  const draw1 = () => P.querySelectorAll('[data-row]').forEach(c => { const q = c.getContext('2d'); q.imageSmoothingEnabled = false; q.clearRect(0, 0, 64, 64); q.drawImage(SHEET, 0, +c.dataset.row * 64, 64, 64, 0, 0, 64, 64); });
  if (SHEET.complete) draw1(); else SHEET.onload = draw1;
  const nb = document.getElementById('nextbtn'), rf = document.getElementById('refill');
  if (next){ nb.hidden = false; nb.textContent = next[1]; nb.disabled = !!next[2]; nb.dataset.go = next[0]; } else nb.hidden = true;
  rf.hidden = S.tab !== 'give';
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.t === S.tab));
  document.getElementById('stat').textContent = `목화솜 ${INV['목화솜'] || 0}`;
}
function give(id){
  const n = NPCS.find(x => x.id === id); if (!S.made) return;
  const m = meaning(), has = S.slots.includes(n.like), bad = S.slots.includes(n.hate);
  let line = m.kind === 'love' ? n.say.love : m.kind === 'prank' ? n.say.prank : has ? n.say.like : bad ? n.say.hate : n.say.base;
  const h = 20 + (has ? 40 : 0) - (bad ? 30 : 0) + (m.kind === 'love' || m.kind === 'cheer' || m.kind === 'sorry' ? 20 : 0) + (S.deco.size * 3) + (S.size === 7 ? 15 : S.size === 5 ? 8 : 0) + (S.wrap.pat !== 'plain' ? 5 : 0);
  if (S.card.trim()) line += ` ....카드도 있네. 「${S.card.trim()}」. 잘 간직할게.`;
  S.made = false; panel();
  const r = document.getElementById('react'); r.classList.add('on');
  document.getElementById('rn').textContent = n.n; document.getElementById('rt').textContent = line;
  document.getElementById('rh').textContent = `호감도 ${h >= 0 ? '+' : ''}${h}${has ? ' · 좋아하는 꽃' : ''}${bad ? ' · 싫어하는 꽃' : ''}`;
  const q = document.getElementById('rcv').getContext('2d'); q.imageSmoothingEnabled = false; q.clearRect(0, 0, 64, 64); q.drawImage(SHEET, 0, n.row * 64, 64, 64, 0, 0, 64, 64);
  r.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function refresh(){ renderSlots(); panel(); draw(); }
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return; const d = b.dataset, W = S.wrap;
  if (d.go){ if (d.go === 'make'){ if (short().length) return; Object.entries(needs()).forEach(([k, v]) => INV[k] -= v.n); S.made = true; return panel(); } S.tab = d.go; panel(); document.getElementById('app').scrollIntoView({ block: 'start' }); return; }
  if (d.t){ if (!unlocked && d.t !== 'note'){ noteMsg = '<span><b>아직 작업대가 없어요</b><br>꽃말을 하나 찾고 맨디에게 가 보세요</span>'; S.tab = 'note'; return panel(); } S.tab = d.t; panel(); return; }
  if (d.meet) return cineMeet();
  if (S.made && (d.base || d.pat || d.sn || d.pc0 || d.pc1 || d.size || d.f || d.rib || d.deco)) S.made = false;
  if (d.base){ W.base = d.base; return refresh(); }
  if (d.pat){ W.pat = d.pat; return refresh(); }
  if (d.sn){ W.n = +d.sn; return refresh(); }
  if (d.pc0){ W.cols[0] = d.pc0; return refresh(); }
  if (d.pc1){ W.cols[1] = d.pc1; return refresh(); }
  if (d.size){ S.size = +d.size; S.slots = S.slots.slice(0, S.size); return refresh(); }
  if (d.f){ const f = FB[d.f], have = INV['꽃 · ' + f.n] || 0; if (S.slots.filter(x => x === d.f).length >= have) return; if (S.slots.length >= S.size) S.slots.shift(); S.slots.push(d.f); return refresh(); }
  if (d.rib){ S.ribbon = d.rib; return refresh(); }
  if (d.deco){ S.deco.has(d.deco) ? S.deco.delete(d.deco) : S.deco.add(d.deco); return refresh(); }
  if (d.make){ if (short().length) return; Object.entries(needs()).forEach(([k, v]) => INV[k] -= v.n); S.made = true; return panel(); }
  if (d.refill){ INV = { ...INV0 }; S.made = false; return refresh(); }
  if (d.npc) return give(d.npc);
  if (d.hunt) return hunt(d.hunt);
  if (d.pg){ noteOpen = d.pg; return panel(); }
});
function renderAdm(){
  const el = document.getElementById('adm'), ic = id => `<canvas width="32" height="32" data-aic="${id}"></canvas>`;
  el.innerHTML = `<div class="admh"><b>관리자 · 맨디의 꽃다발 배정</b><span>학생마다 어떤 친구인지 골라 주면, 그 친구에게 맞는 꽃 세 송이와 맨디의 마음이 정해져요</span></div>
    <div class="arows">${ASSIGN.map((a, i) => `<div class="arow"><span class="an">학생 ${i + 1}</span><select data-as="${i}">${MANDI_B.map((b, k) => `<option value="${k}" ${k === a ? 'selected' : ''}>${b.n}</option>`).join('')}</select><span class="af">${MANDI_B[a].f.map(ic).join('')}</span></div>`).join('')}</div>
    <details class="aall"><summary>꽃다발 12 종 보기</summary>${MANDI_B.map(b => `<div class="atype"><div><b>${b.n}</b><small>${b.d}</small></div><span class="af">${b.f.map(ic).join('')}</span><p>${b.f.map(x => `${FB[x].n} (${FB[x].w})`).join(' · ')}<br>「${b.t}」</p></div>`).join('')}</details>`;
  el.querySelectorAll('[data-aic]').forEach(c => { const q = c.getContext('2d'); q.imageSmoothingEnabled = false; q.drawImage(flowerIcon(FB[c.dataset.aic]), 0, 0); });
  document.querySelectorAll('#stu option').forEach((o, i) => { o.textContent = `학생 ${i + 1} · ${MANDI_B[ASSIGN[i]].n}`; });
}
document.addEventListener('change', e => { const s_ = e.target.closest && e.target.closest('[data-as]'); if (!s_) return; ASSIGN[+s_.dataset.as] = +s_.value; renderAdm(); refresh(); });
const boot = () => { refresh(); renderAdm(); cineCraft(); };
document.getElementById('stu').addEventListener('change', e => { stu = +e.target.value; KNOWN.clear(); noteOpen = 'dandel'; noteMsg = ''; unlocked = false; refresh(); if (!C) cineCraft(); });

if (FLIMG.complete) boot(); else FLIMG.onload = boot;
setInterval(() => draw(), 160);
</script>
