<title>꽃말 꽃다발 공방</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
/* 꽃집 작업대: 위 꽃다발 미리 보기 · 아래 단계 탭(꽃 · 포장 · 장식 · 선물) · 휴대폰 한 손 조작 */
:root{
  --bg:#FBF3EE; --card:#FFFFFF; --ink:#3B2A33; --sub:#8A6F7C; --line:#EADBD9; --accent:#E2577E; --leaf:#5E9A62; --chip:#F6E7EA;
  --f-disp:'Gaegu','Gowun Dodum',system-ui,sans-serif; --f-body:'Gowun Dodum',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1F171C;--card:#2A2026;--ink:#F6E9EE;--sub:#BFA3B0;--line:#43343C;--accent:#FF7EA0;--leaf:#8CC890;--chip:#3A2C34;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1F171C;--card:#2A2026;--ink:#F6E9EE;--sub:#BFA3B0;--line:#43343C;--accent:#FF7EA0;--leaf:#8CC890;--chip:#3A2C34;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
#app{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--f-disp);font-size:28px;margin:0;line-height:1.1;text-wrap:balance}
.lede{margin:2px 0 0;color:var(--sub);font-size:14px}
#stagebox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
#cv{width:100%;max-width:320px;aspect-ratio:1/1;image-rendering:pixelated;background:linear-gradient(var(--chip),var(--card));border-radius:12px}
#msg{text-align:center;min-height:44px}
#msg b{font-family:var(--f-disp);font-size:20px;color:var(--accent);display:block}
#msg span{font-size:13px;color:var(--sub)}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.slot{width:40px;height:40px;border-radius:10px;border:2px dashed var(--line);background:var(--bg);display:grid;place-items:center;padding:0;cursor:pointer}
.slot canvas{width:32px;height:32px;image-rendering:pixelated}
.slot.on{border-style:solid;border-color:var(--accent)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--chip);padding:4px;border-radius:12px}
.tabs button{border:0;background:none;padding:10px 4px;border-radius:9px;font:700 15px var(--f-body);color:var(--sub);min-height:44px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.lab{font-size:13px;color:var(--sub);letter-spacing:.02em}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.chipb{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 12px;font:15px var(--f-body);min-height:40px;cursor:pointer}
.seg button.on,.chipb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fl{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font:13px var(--f-body);color:var(--ink);cursor:pointer;min-height:84px}
.fl canvas{width:36px;height:36px;image-rendering:pixelated}
.fl small{color:var(--sub);font-size:11px}
.fl .n{font-size:11px;color:var(--accent)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:40px;height:40px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw button.on{box-shadow:0 0 0 3px var(--accent)}
.npcs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.npc{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:4px;font:12px var(--f-body);color:var(--ink);display:flex;flex-direction:column;align-items:center;cursor:pointer;min-height:76px}
.npc canvas{width:48px;height:48px;image-rendering:pixelated}
#react{display:none;gap:10px;align-items:flex-start;background:var(--chip);border-radius:12px;padding:10px}
#react.on{display:flex}
#react canvas{width:64px;height:64px;image-rendering:pixelated;flex:none;background:var(--card);border-radius:10px}
#react b{display:block;margin-bottom:2px}
#react p{margin:0;line-height:1.55;min-width:0}
#react .hearts{color:var(--accent);font-size:13px;margin-top:4px}
input#card{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font:15px var(--f-body)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:13px;color:var(--sub);margin:0}
</style>

<div id="app">
  <header><h1>꽃말 꽃다발 공방</h1><p class="lede">꽃을 고르면 꽃말이 모여 메시지가 돼요. 포장하고 장식해서 선물해 봐요.</p></header>
  <section id="stagebox">
    <canvas id="cv" width="160" height="160" aria-label="꽃다발 미리 보기"></canvas>
    <div id="msg"></div>
    <div class="slots" id="slots"></div>
  </section>
  <nav class="tabs" id="tabs"><button data-t="flower" class="on">꽃</button><button data-t="wrap">포장</button><button data-t="deco">장식</button><button data-t="give">선물</button></nav>
  <section class="panel" id="panel"></section>
</div>

  q.fillStyle = patternFill(q, paper, S.pattern); q.beginPath(); q.moveTo(cx, 140); q.lineTo(cx - spread - 10, topY + 30); q.lineTo(cx - 6, topY + 40); q.lineTo(cx + spread + 10, topY + 30); q.closePath(); q.fill();
  q.strokeStyle = 'rgba(59,42,51,.35)'; q.lineWidth = 1; q.beginPath(); q.moveTo(cx - spread - 10, topY + 30); q.lineTo(cx, 140); q.lineTo(cx + spread + 10, topY + 30); q.stroke();
  if (S.deco.has('pearl')) for (let i = 0; i <= 8; i++){ const t = i / 8, x = cx - spread - 10 + t * (spread * 2 + 20), y = topY + 30 + (t < .5 ? t * 20 : (1 - t) * 20) - 1; px(q, x - 1, y - 1, 3, 3, '#FFFFFF'); px(q, x, y, 1, 1, '#E8D8E0'); }
  // 리본
  const by = 116; q.fillStyle = rib; q.beginPath(); q.ellipse(cx - 9, by, 9, 5, -.3, 0, 7); q.fill(); q.beginPath(); q.ellipse(cx + 9, by, 9, 5, .3, 0, 7); q.fill();
  px(q, cx - 4, by - 4, 8, 8, rib); q.fillStyle = 'rgba(0,0,0,.18)'; q.fillRect(cx - 4, by + 2, 8, 2);
  q.fillStyle = rib; q.beginPath(); q.moveTo(cx - 3, by + 3); q.lineTo(cx - 12, by + 24); q.lineTo(cx - 7, by + 22); q.lineTo(cx - 2, by + 6); q.fill(); q.beginPath(); q.moveTo(cx + 3, by + 3); q.lineTo(cx + 12, by + 24); q.lineTo(cx + 7, by + 22); q.lineTo(cx + 2, by + 6); q.fill();
  if (rib === '#FFFFFF'){ q.strokeStyle = 'rgba(59,42,51,.3)'; q.strokeRect(cx - 4, by - 4, 8, 8); }
  if (S.deco.has('bfly')){ const t = Date.now() / 300, x = cx + spread + 4, y = topY + 4 + Math.sin(t) * 2, w = 3 + Math.abs(Math.sin(t * 2)) * 2; px(q, x - w, y - 2, w, 4, '#FFB13B'); px(q, x + 1, y - 2, w, 4, '#FFB13B'); px(q, x, y - 3, 1, 6, '#3B2A33'); }
  if (S.deco.has('card')){ q.fillStyle = '#FFFDF6'; q.save(); q.translate(cx + 22, 124); q.rotate(.18); q.fillRect(0, 0, 26, 18); q.strokeStyle = 'rgba(59,42,51,.4)'; q.strokeRect(0, 0, 26, 18); q.fillStyle = '#E2577E'; q.fillRect(11, 6, 2, 2); q.fillRect(14, 6, 2, 2); q.fillRect(11, 8, 5, 2); q.fillRect(12, 10, 3, 1); q.restore(); q.strokeStyle = 'rgba(59,42,51,.4)'; q.beginPath(); q.moveTo(cx + 2, by + 2); q.lineTo(cx + 24, 125); q.stroke(); }
  if (S.deco.has('glitter')){ const t = Date.now() / 200; for (let i = 0; i < 9; i++){ if ((Math.floor(t) + i) % 3) continue; const x = cx + Math.sin(i * 5.1) * (spread + 16), y = topY - 10 + (i * 13 % 60); px(q, x, y - 1, 1, 3, '#FFE08A'); px(q, x - 1, y, 3, 1, '#FFE08A'); } }
}
function meaning(){
  const ids = S.slots, uniq = [...new Set(ids)];
  if (!ids.length) return { head: '꽃을 골라 주세요', sub: `${S.size} 송이까지 들어가요` };
  const combo = COMBO.find(c => c.has.every(h => uniq.includes(h)));
  const cnt = {}; ids.forEach(i => cnt[i] = (cnt[i] || 0) + 1);
  const main = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0];
  const words = uniq.map(i => FB[i].w);
  return { head: combo ? combo.t : `「${FB[main].w}」${uniq.length > 1 ? ' 그리고 ' + words.filter(w => w !== FB[main].w).slice(0, 2).map(w => `「${w}」`).join(' · ') : ''}`, sub: combo ? `특별한 조합 · ${uniq.map(i => FB[i].n).join(' + ')}` : `가장 많은 꽃 「${FB[main].n}」이 큰 목소리로 말해요`, kind: combo ? combo.k : null };
}
function renderSlots(){
  const el = document.getElementById('slots'); el.innerHTML = '';
  for (let i = 0; i < S.size; i++){
    const b = document.createElement('button'); b.className = 'slot' + (S.slots[i] ? ' on' : ''); b.setAttribute('aria-label', S.slots[i] ? `${FB[S.slots[i]].n} 빼기` : '빈 자리');
    if (S.slots[i]){ const c = document.createElement('canvas'); c.width = c.height = 24; const q = c.getContext('2d'); q.imageSmoothingEnabled = false; q.drawImage(flowerIcon(FB[S.slots[i]]), 0, 0); b.appendChild(c); b.onclick = () => { S.slots.splice(i, 1); refresh(); }; }
    el.appendChild(b);
  }
  const m = meaning(); document.getElementById('msg').innerHTML = `<b>${m.head}</b><span>${m.sub}</span>`;
}
function panel(){
  const P = document.getElementById('panel'); const cnt = id => S.slots.filter(x => x === id).length;
  if (S.tab === 'flower'){
    P.innerHTML = `<div class="lab">꽃다발 크기</div><div class="seg">${SIZES.map(([n, l]) => `<button data-size="${n}" class="${S.size === n ? 'on' : ''}">${l} · ${n} 송이</button>`).join('')}</div>
      <div class="lab">꽃 고르기 · 누르면 한 송이씩 들어가요 (같은 꽃 여러 송이도 돼요)</div>
      <div class="fgrid">${FL.map(f => `<button class="fl" data-f="${f.id}"><canvas width="24" height="24" data-ic="${f.id}"></canvas>${f.n}<small>${f.w}</small>${cnt(f.id) ? `<span class="n">× ${cnt(f.id)}</span>` : `<small>${f.from}</small>`}</button>`).join('')}</div>`;
    P.querySelectorAll('[data-ic]').forEach(c => { const q = c.getContext('2d'); q.imageSmoothingEnabled = false; q.drawImage(flowerIcon(FB[c.dataset.ic]), 0, 0); });
  } else if (S.tab === 'wrap'){
    P.innerHTML = `<div class="lab">포장지 색</div><div class="sw">${PAPER.map(([c, l], i) => `<button data-paper="${i}" class="${S.paper === i ? 'on' : ''}" style="background:${c}" aria-label="${l}" title="${l}"></button>`).join('')}</div>
      <div class="lab">포장지 무늬</div><div class="seg">${PATTERN.map(([k, l]) => `<button data-pat="${k}" class="${S.pattern === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      <div class="lab">리본 색</div><div class="sw">${RIBBON.map(([c, l], i) => `<button data-rib="${i}" class="${S.ribbon === i ? 'on' : ''}" style="background:${c}" aria-label="${l}" title="${l}"></button>`).join('')}</div>`;
  } else if (S.tab === 'deco'){
    P.innerHTML = `<div class="lab">장식 · 여러 개 골라도 돼요</div><div class="seg">${DECO.map(([k, l]) => `<button data-deco="${k}" class="${S.deco.has(k) ? 'on' : ''}">${l}</button>`).join('')}</div>
      ${S.deco.has('card') ? `<label class="lab" for="card">카드에 쓸 말 (20 자)</label><input id="card" maxlength="20" placeholder="예: 늘 고마워" value="${S.card.replace(/"/g, '&quot;')}">` : '<p class="hint">「메시지 카드」를 고르면 카드에 직접 한 줄을 쓸 수 있어요.</p>'}`;
    const ci = P.querySelector('#card'); if (ci) ci.oninput = () => { S.card = ci.value; };
  } else {
    P.innerHTML = `<div class="lab">누구에게 줄까요</div><div class="npcs">${NPCS.map(n => `<button class="npc" data-npc="${n.id}"><canvas width="64" height="64" data-row="${n.row}"></canvas>${n.n}</button>`).join('')}</div>
      <div id="react"><canvas width="64" height="64" id="rcv"></canvas><div><b id="rn"></b><p id="rt"></p><div class="hearts" id="rh"></div></div></div>
      <p class="hint">NPC마다 좋아하는 꽃과 싫어하는 꽃이 있어요. 고백 · 장난 같은 특별한 조합에는 따로 반응해요.</p>`;
    const draw1 = () => P.querySelectorAll('[data-row]').forEach(c => { const q = c.getContext('2d'); q.imageSmoothingEnabled = false; q.clearRect(0, 0, 64, 64); q.drawImage(SHEET, 0, +c.dataset.row * 64, 64, 64, 0, 0, 64, 64); });
    if (SHEET.complete) draw1(); else SHEET.onload = draw1;
  }
}
function give(id){
  const n = NPCS.find(x => x.id === id); if (!S.slots.length) return;
  const m = meaning(), has = S.slots.includes(n.like), bad = S.slots.includes(n.hate);
  let line = m.kind === 'love' ? n.say.love : m.kind === 'prank' ? n.say.prank : has ? n.say.like : bad ? n.say.hate : n.say.base;
  let h = 20 + (has ? 40 : 0) - (bad ? 30 : 0) + (m.kind === 'love' || m.kind === 'cheer' || m.kind === 'sorry' ? 20 : 0) + (S.deco.size * 3) + (S.size === 7 ? 15 : S.size === 5 ? 8 : 0);
  if (S.card.trim()) line += ` ....카드도 있네. 「${S.card.trim()}」. 잘 간직할게.`;
  const r = document.getElementById('react'); r.classList.add('on');
  document.getElementById('rn').textContent = n.n; document.getElementById('rt').textContent = line;
  document.getElementById('rh').textContent = `호감도 ${h >= 0 ? '+' : ''}${h}${has ? ' · 좋아하는 꽃' : ''}${bad ? ' · 싫어하는 꽃' : ''}`;
  const q = document.getElementById('rcv').getContext('2d'); q.imageSmoothingEnabled = false; q.clearRect(0, 0, 64, 64); q.drawImage(SHEET, 0, n.row * 64, 64, 64, 0, 0, 64, 64);
  r.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function refresh(){ renderSlots(); panel(); draw(); }
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const d = b.dataset;
  if (d.t){ S.tab = d.t; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b)); return panel(); }
  if (d.size){ S.size = +d.size; S.slots = S.slots.slice(0, S.size); return refresh(); }
  if (d.f){ if (S.slots.length >= S.size) S.slots.shift(); S.slots.push(d.f); return refresh(); }
  if (d.paper){ S.paper = +d.paper; return refresh(); }
  if (d.pat){ S.pattern = d.pat; return refresh(); }
  if (d.rib){ S.ribbon = +d.rib; return refresh(); }
  if (d.deco){ S.deco.has(d.deco) ? S.deco.delete(d.deco) : S.deco.add(d.deco); return refresh(); }
  if (d.npc) return give(d.npc);
});
refresh();
setInterval(draw, 120);
</script>
