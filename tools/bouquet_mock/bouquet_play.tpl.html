<title>꽃말 꽃다발 공방</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
/* 꽃집 작업대: 위 꽃다발 미리 보기 · 아래 단계 탭(꽃 · 포장 · 장식 · 선물) · 휴대폰 한 손 조작 */
:root{
  --bg:#FBF3EE; --card:#FFFFFF; --ink:#3B2A33; --sub:#8A6F7C; --line:#EADBD9; --accent:#E2577E; --leaf:#5E9A62; --chip:#F6E7EA;
  --f-disp:'Gaegu','Gowun Dodum',system-ui,sans-serif; --f-body:'Gowun Dodum',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1F171C;--card:#2A2026;--ink:#F6E9EE;--sub:#BFA3B0;--line:#43343C;--accent:#FF7EA0;--leaf:#8CC890;--chip:#3A2C34;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1F171C;--card:#2A2026;--ink:#F6E9EE;--sub:#BFA3B0;--line:#43343C;--accent:#FF7EA0;--leaf:#8CC890;--chip:#3A2C34;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
#app{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--f-disp);font-size:28px;margin:0;line-height:1.1;text-wrap:balance}
.lede{margin:2px 0 0;color:var(--sub);font-size:14px}
#stagebox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
#cv{width:100%;max-width:320px;aspect-ratio:1/1;image-rendering:pixelated;background:linear-gradient(var(--chip),var(--card));border-radius:12px}
#msg{text-align:center;min-height:44px}
#msg b{font-family:var(--f-disp);font-size:20px;color:var(--accent);display:block}
#msg span{font-size:13px;color:var(--sub)}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.slot{width:40px;height:40px;border-radius:10px;border:2px dashed var(--line);background:var(--bg);display:grid;place-items:center;padding:0;cursor:pointer}
.slot canvas{width:32px;height:32px;image-rendering:pixelated}
.slot.on{border-style:solid;border-color:var(--accent)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--chip);padding:4px;border-radius:12px}
.tabs button{border:0;background:none;padding:10px 4px;border-radius:9px;font:700 15px var(--f-body);color:var(--sub);min-height:44px;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.lab{font-size:13px;color:var(--sub);letter-spacing:.02em}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button,.chipb{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 12px;font:15px var(--f-body);min-height:40px;cursor:pointer}
.seg button.on,.chipb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fl{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font:13px var(--f-body);color:var(--ink);cursor:pointer;min-height:84px}
.fl canvas{width:36px;height:36px;image-rendering:pixelated}
.fl small{color:var(--sub);font-size:11px}
.fl .n{font-size:11px;color:var(--accent)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:40px;height:40px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw button.on{box-shadow:0 0 0 3px var(--accent)}
.npcs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.npc{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:4px;font:12px var(--f-body);color:var(--ink);display:flex;flex-direction:column;align-items:center;cursor:pointer;min-height:76px}
.npc canvas{width:48px;height:48px;image-rendering:pixelated}
#react{display:none;gap:10px;align-items:flex-start;background:var(--chip);border-radius:12px;padding:10px}
#react.on{display:flex}
#react canvas{width:64px;height:64px;image-rendering:pixelated;flex:none;background:var(--card);border-radius:10px}
#react b{display:block;margin-bottom:2px}
#react p{margin:0;line-height:1.55;min-width:0}
#react .hearts{color:var(--accent);font-size:13px;margin-top:4px}
.step{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font:700 17px var(--f-body)}
.step b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:14px}
.step span{font:400 13px var(--f-body);color:var(--sub)}
.panel small{display:block;font-size:12px;color:var(--sub)}
.panel small.lack,.need li.lack{color:#D9443B}
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.dgrid .chipb{border-radius:12px;text-align:left;display:flex;flex-direction:column;gap:2px;padding:8px 10px}
.dgrid .chipb.on small{color:#fff}
.fl:disabled{opacity:.4}
.next{border:0;background:var(--ink);color:var(--bg);border-radius:12px;min-height:46px;font:700 15px var(--f-body);cursor:pointer}
.next.big{background:var(--accent);color:#fff}
.next:disabled{opacity:.45}
.ghost{border:1px dashed var(--line);background:none;color:var(--sub);border-radius:10px;min-height:40px;font:13px var(--f-body);cursor:pointer}
.need{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.need li{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:baseline;padding:6px 8px;background:var(--bg);border-radius:8px}
.need .w{font-size:12px;color:var(--sub)}
.need .num{font-variant-numeric:tabular-nums}
.ok{margin:0;font-weight:700;color:var(--leaf)}
.tabs button{font-size:14px}
input#card{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font:15px var(--f-body)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:13px;color:var(--sub);margin:0}
</style>

<div id="app">
  <header><h1>꽃말 꽃다발 공방</h1><p class="lede">포장지를 물들이고 무늬를 찍은 다음, 꽃을 골라 꽃말 메시지를 엮어요. 재료는 가방에서 빠져나가요.</p></header>
  <section id="stagebox">
    <canvas id="cv" width="128" height="128" aria-label="꽃다발 미리 보기"></canvas>
    <div id="msg"></div>
    <div class="slots" id="slots"></div>
  </section>
  <nav class="tabs" id="tabs"><button data-t="wrap" class="on">1 포장지</button><button data-t="flower">2 꽃</button><button data-t="deco">3 리본 · 장식</button><button data-t="give">4 완성</button></nav>
  <section class="panel" id="panel"></section>
</div>

<script>
const SHEET = new Image(); SHEET.src = 'data:image/webp;base64,__SHEET__';
// 꽃 21 종: 모양(shape) · 색 · 꽃말 · 어디서 나는지
const FL = [
  { id: 'dandel', n: '민들레', from: '온실 0', w: '감사', shape: 'puff', c: ['#FFFFFF', '#F2F2F2'] },
  { id: 'chamo', n: '카모마일', from: '온실 0', w: '힘내', shape: 'daisy', c: ['#FFFFFF', '#FFD23F'] },
  { id: 'clover', n: '네잎클로버', from: '온실 0', w: '행운', shape: 'clover', c: ['#5EBA5E', '#3E8E46'] },
  { id: 'lav', n: '라벤더', from: '온실 1', w: '기대', shape: 'spike', c: ['#A98BE0', '#7F63C4'] },
  { id: 'rose', n: '들장미', from: '온실 1', w: '사랑', shape: 'rose', c: ['#F25C7A', '#C83A5C'] },
  { id: 'lily', n: '은방울꽃', from: '온실 3 · 채집', w: '다시 찾아온 행복', shape: 'bells', c: ['#FFFFFF', '#DDE8DD'] },
  { id: 'tulip', n: '튤립', from: '온실 3', w: '고백', shape: 'tulip', c: ['#FF7A9C', '#E84E78'] },
  { id: 'morning', n: '나팔꽃', from: '온실 3', w: '기쁜 소식', shape: 'trumpet', c: ['#5B8DEF', '#E8F0FF'] },
  { id: 'lotus', n: '연꽃', from: '온실 3', w: '순수한 마음', shape: 'lotus', c: ['#FFC4D6', '#FF96B6'] },
  { id: 'firefly', n: '반딧불꽃', from: '온실 4', w: '길잡이', shape: 'glow', c: ['#FFF27A', '#C8E86A'] },
  { id: 'snow', n: '눈송이 꽃', from: '온실 4', w: '첫 만남', shape: 'crystal', c: ['#CFEFFF', '#8FD3F4'] },
  { id: 'eve', n: '달맞이꽃', from: '온실 4 · 채집', w: '기다림', shape: 'cup4', c: ['#FFE45C', '#F2B833'] },
  { id: 'bell', n: '노래하는 종꽃', from: '온실 4', w: '축하해', shape: 'bigbell', c: ['#9FD5FF', '#5AA8E8'] },
  { id: 'dream', n: '꿈꽃', from: '온실 5', w: '보고 싶어', shape: 'star5', c: ['#C79BFF', '#8E5BE0'] },

  { id: 'time', n: '시간의 꽃', from: '온실 6', w: '영원히', shape: 'clock', c: ['#E85CE8', '#FFE08A'] },
  { id: 'soul', n: '영혼 연꽃', from: '온실 6', w: '잘 가', shape: 'lotus', c: ['#EAF7C8', '#C8E098'] },
  { id: 'daisy', n: '들꽃', from: '채집', w: '소박한 마음', shape: 'daisy', c: ['#FFB8D8', '#FFE070'] },
  { id: 'clover3', n: '세잎클로버', from: '채집', w: '평범한 행복', shape: 'clover3', c: ['#7CC87C', '#4E9E52'] },
  { id: 'ghost', n: '유령 꽃', from: '채집', w: '비밀', shape: 'ghost', c: ['#EEF0FF', '#A8B0E0'] },
  { id: 'skull', n: '해골 꽃', from: '채집', w: '장난이야', shape: 'skull', c: ['#F4F0E4', '#3B2A33'] }
];
const FB = Object.fromEntries(FL.map(f => [f.id, f]));
// 특별한 조합 (꽃 종류가 다 들어 있으면)
const COMBO = [
  { has: ['tulip', 'rose'], t: '좋아해요. 진심으로.', k: 'love' },
  { has: ['tulip', 'time'], t: '평생 좋아할게요.', k: 'love' },
  { has: ['lily', 'dandel'], t: '그때는 미안했어. 다시 웃자.', k: 'sorry' },
  { has: ['soul', 'dream'], t: '떠나도 잊지 않을게.', k: 'bye' },
  { has: ['skull', 'ghost'], t: '깜짝이야. 사실 장난 편지였지롱.', k: 'prank' },
  { has: ['bell', 'morning'], t: '좋은 소식 축하해. 정말로.', k: 'cheer' },
  { has: ['chamo', 'clover'], t: '힘든 날도 운이 따를 거야.', k: 'cheer' },
  { has: ['snow', 'eve'], t: '처음 만난 날부터 기다렸어.', k: 'love' },
  { has: ['skull', 'rose'], t: '좋아.... 하는 척 장난이야. 아니, 진짜인가.', k: 'prank' },
  { has: ['firefly', 'dream'], t: '보고 싶으면 이 빛을 따라와.', k: 'miss' }
];
const SIZES = [[3, '작은 꽃다발'], [5, '보통 꽃다발'], [7, '큰 꽃다발']];
// 색 10 가지 = 뜨개질 털실 색 · 염색 재료도 같아요 (하양은 염색 없음)
const COL = [
  { id: 'white', n: '하양', hex: '#F6F1EA', dye: null },
  { id: 'red', n: '빨강', hex: '#D9443B', dye: '산딸기' },
  { id: 'pink', n: '분홍', hex: '#F4A6BE', dye: '꽃사과' },
  { id: 'orange', n: '주황', hex: '#EE8A3A', dye: '빨간 단풍잎' },
  { id: 'yellow', n: '노랑', hex: '#F2CC4A', dye: '노란 은행잎' },
  { id: 'green', n: '초록', hex: '#6AAE5E', dye: '촉촉 이끼' },
  { id: 'sky', n: '하늘', hex: '#9AD4F0', dye: '은방울꽃' },
  { id: 'blue', n: '파랑', hex: '#4E7FD9', dye: '블루베리' },
  { id: 'purple', n: '보라', hex: '#9B6AD0', dye: '달맞이꽃' },
  { id: 'brown', n: '갈색', hex: '#9A6A44', dye: '도토리' }
];
const CB = Object.fromEntries(COL.map(c => [c.id, c]));
// 무늬: 몇 가지 색이 더 필요한지 · 무늬 도장 재료
const PATTERN = [
  { id: 'plain', n: '무지', extra: 0, stamp: null },
  { id: 'stripe', n: '줄무늬', extra: 1, stamp: null, multi: true },
  { id: 'check', n: '체크', extra: 1, stamp: null },
  { id: 'dot', n: '물방울', extra: 1, stamp: '이슬' },
  { id: 'star', n: '별', extra: 1, stamp: '반짝 돌' },
  { id: 'heart', n: '하트', extra: 1, stamp: '들장미 꽃잎' },
  { id: 'flower', n: '꽃', extra: 1, stamp: '들꽃' }
];
const PB = Object.fromEntries(PATTERN.map(p => [p.id, p]));
const DECO = [['baby', '안개꽃', [['들꽃', 2]]], ['leaf', '잎사귀', [['고사리', 1]]], ['pearl', '진주', [['조개 화석', 1]]], ['glitter', '반짝이', [['별가루 병', 1]]], ['bfly', '나비 장식', [['나비 날개', 1]]], ['card', '메시지 카드', [['목화솜', 1]]]];
// 시안용 가방 (실제 게임에서는 내 가방 그대로)
const INV0 = { '목화솜': 4, '산딸기': 3, '꽃사과': 2, '빨간 단풍잎': 1, '노란 은행잎': 2, '촉촉 이끼': 2, '은방울꽃': 3, '블루베리': 2, '달맞이꽃': 2, '도토리': 1, '이슬': 2, '반짝 돌': 1, '들장미 꽃잎': 2, '들꽃': 4, '고사리': 2, '조개 화석': 0, '별가루 병': 1, '나비 날개': 1,
  '털실 · 하양': 2, '털실 · 빨강': 1, '털실 · 분홍': 2, '털실 · 노랑': 1, '털실 · 파랑': 1, '털실 · 보라': 0 };
FL.forEach(f => { INV0['꽃 · ' + f.n] = ['aurora', 'time', 'soul'].includes(f.id) ? 1 : 3; });
let INV = { ...INV0 };
// 서브 NPC: 시트의 줄 번호 · 좋아하는 꽃 · 싫어하는 꽃 · 반응
const NPCS = [
  { id: 'nabi', n: '나비', row: 0, like: 'daisy', hate: 'lav', say: { like: '들꽃이다냥. 이 위에서 뒹굴어도 되냥.......', hate: '라벤더 냄새.... 코가 간질간질하다냥. 에취.', love: '이, 이런 걸 왜 나한테 주냥. ....꼬리가 멋대로 흔들린다냥.', prank: '해골이다냥. 무섭지 않다냥. ....조금 무섭다냥.', base: '꽃이다냥. 고맙다냥. 먹는 건 아니지냥.' } },
  { id: 'batri', n: '배트리', row: 1, like: 'eve', hate: 'firefly', say: { like: '달맞이꽃. 밤에 피는 꽃이잖아. 나랑 같은 시간에 일하는 꽃이야.......', hate: '으악, 반짝반짝 눈부셔. 박쥐는 빛이 싫어.......', love: '이거.... 내가 배달하는 거 아니고, 나한테 온 거야. 처음이라 봉투가 없어서 어색하네.', prank: '하하, 장난 편지는 내가 전문이거든.', base: '꽃 배달은 해 봤어도 받는 건 처음이야. 고마워.' } },
  { id: 'kappa', n: '캇파', row: 2, like: 'lotus', hate: 'skull', say: { like: '연꽃이다. 연못에 띄워 두겠다. ....매일 보러 갈 거다.', hate: '....해골. 낚시터에서 이런 걸 건져 올리면 그날은 끝이다.', love: '접시 물이 끓는다. 이건 꽃 때문이다. 다른 이유는 없다.......', prank: '....놀라지 않았다. 물이 조금 쏟아졌을 뿐이다.', base: '고맙다. 물에 꽂아 두겠다.' } },
  { id: 'aula', n: '아울라', row: 3, like: 'lav', hate: 'bell', say: { like: '라벤더.... 도서관에 두면 다들 조용해질 거예요. 꽃말이 침묵이거든요.......', hate: '쉿.... 이 종꽃, 계속 노래해요. 도서관에서는 곤란해요.......', love: '책 속에서만 읽던 고백 꽃말이에요. 실제로 받으니.... 깃털이 다 서요.......', prank: '해골 꽃말은 「장난」.... 정확해요. 점수를 드릴게요.', base: '꽃말 사전을 펴 봐야겠어요. 고마워요.' } },

    P.querySelectorAll('[data-ic]').forEach(c => { const q = c.getContext('2d'); q.imageSmoothingEnabled = false; q.drawImage(flowerIcon(FB[c.dataset.ic]), 0, 0); });
  } else if (S.tab === 'deco'){
    P.innerHTML = `<div class="step"><b>3</b>리본과 장식 <span>리본은 털실 1 뭉치로 묶어요</span></div>
      <div class="lab">리본 색 · ${CB[S.ribbon].n}</div>${swatches('rib', S.ribbon)}${costTag('털실 · ' + CB[S.ribbon].n)}
      <div class="lab">장식 · 여러 개 골라도 돼요</div>
      <div class="dgrid">${DECO.map(([k, l, cost]) => `<button class="chipb ${S.deco.has(k) ? 'on' : ''}" data-deco="${k}">${l}${cost.map(([m, n]) => costTag(m, n)).join('')}</button>`).join('')}</div>
      ${S.deco.has('card') ? `<label class="lab" for="card">카드에 쓸 말 (20 자)</label><input id="card" maxlength="20" placeholder="예: 늘 고마워" value="${S.card.replace(/"/g, '&quot;')}">` : ''}
      <button class="next" data-t="give">다음 · 완성하기</button>`;
    const ci = P.querySelector('#card'); if (ci) ci.oninput = () => { S.card = ci.value; };
  } else {
    const N = needs(), sh = short();
    P.innerHTML = `<div class="step"><b>4</b>완성하고 선물하기</div>
      <div class="lab">들어가는 재료</div>
      <ul class="need">${Object.entries(N).map(([k, v]) => `<li class="${(INV[k] || 0) < v.n ? 'lack' : ''}"><span>${k}</span><span class="w">${v.why.join(' · ')}</span><span class="num">${v.n} / ${INV[k] || 0}</span></li>`).join('')}</ul>
      ${S.made ? `<p class="ok">꽃다발 완성. 누구에게 줄까요</p><div class="npcs">${NPCS.map(n => `<button class="npc" data-npc="${n.id}"><canvas width="64" height="64" data-row="${n.row}"></canvas>${n.n}</button>`).join('')}</div>`
        : `<button class="next big" data-make="1" ${sh.length || !S.slots.length ? 'disabled' : ''}>${!S.slots.length ? '꽃을 먼저 골라 주세요' : sh.length ? `재료가 모자라요 · ${sh.map(([k]) => k).slice(0, 2).join(', ')}${sh.length > 2 ? ' 외' : ''}` : '꽃다발 만들기'}</button>`}
      <div id="react"><canvas width="64" height="64" id="rcv"></canvas><div><b id="rn"></b><p id="rt"></p><div class="hearts" id="rh"></div></div></div>
      <button class="ghost" data-refill="1">시안용 · 가방 재료 다시 채우기</button>`;
    const draw1 = () => P.querySelectorAll('[data-row]').forEach(c => { const q = c.getContext('2d'); q.imageSmoothingEnabled = false; q.clearRect(0, 0, 64, 64); q.drawImage(SHEET, 0, +c.dataset.row * 64, 64, 64, 0, 0, 64, 64); });
    if (SHEET.complete) draw1(); else SHEET.onload = draw1;
  }
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.t === S.tab));
}
function give(id){
  const n = NPCS.find(x => x.id === id); if (!S.made) return;
  const m = meaning(), has = S.slots.includes(n.like), bad = S.slots.includes(n.hate);
  let line = m.kind === 'love' ? n.say.love : m.kind === 'prank' ? n.say.prank : has ? n.say.like : bad ? n.say.hate : n.say.base;
  const h = 20 + (has ? 40 : 0) - (bad ? 30 : 0) + (m.kind === 'love' || m.kind === 'cheer' || m.kind === 'sorry' ? 20 : 0) + (S.deco.size * 3) + (S.size === 7 ? 15 : S.size === 5 ? 8 : 0) + (S.wrap.pat !== 'plain' ? 5 : 0);
  if (S.card.trim()) line += ` ....카드도 있네. 「${S.card.trim()}」. 잘 간직할게.`;
  S.made = false; panel();
  const r = document.getElementById('react'); r.classList.add('on');
  document.getElementById('rn').textContent = n.n; document.getElementById('rt').textContent = line;
  document.getElementById('rh').textContent = `호감도 ${h >= 0 ? '+' : ''}${h}${has ? ' · 좋아하는 꽃' : ''}${bad ? ' · 싫어하는 꽃' : ''}`;
  const q = document.getElementById('rcv').getContext('2d'); q.imageSmoothingEnabled = false; q.clearRect(0, 0, 64, 64); q.drawImage(SHEET, 0, n.row * 64, 64, 64, 0, 0, 64, 64);
  r.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function refresh(){ renderSlots(); panel(); draw(); }
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return; const d = b.dataset, W = S.wrap;
  if (d.t){ S.tab = d.t; panel(); document.getElementById('app').scrollIntoView({ block: 'start' }); return; }
  if (S.made && (d.base || d.pat || d.sn || d.pc0 || d.pc1 || d.size || d.f || d.rib || d.deco)) S.made = false;
  if (d.base){ W.base = d.base; return refresh(); }
  if (d.pat){ W.pat = d.pat; return refresh(); }
  if (d.sn){ W.n = +d.sn; return refresh(); }
  if (d.pc0){ W.cols[0] = d.pc0; return refresh(); }
  if (d.pc1){ W.cols[1] = d.pc1; return refresh(); }
  if (d.size){ S.size = +d.size; S.slots = S.slots.slice(0, S.size); return refresh(); }
  if (d.f){ const f = FB[d.f], have = INV['꽃 · ' + f.n] || 0; if (S.slots.filter(x => x === d.f).length >= have) return; if (S.slots.length >= S.size) S.slots.shift(); S.slots.push(d.f); return refresh(); }
  if (d.rib){ S.ribbon = d.rib; return refresh(); }
  if (d.deco){ S.deco.has(d.deco) ? S.deco.delete(d.deco) : S.deco.add(d.deco); return refresh(); }
  if (d.make){ if (short().length) return; Object.entries(needs()).forEach(([k, v]) => INV[k] -= v.n); S.made = true; return panel(); }
  if (d.refill){ INV = { ...INV0 }; S.made = false; return refresh(); }
  if (d.npc) return give(d.npc);
});
if (FLIMG.complete) refresh(); else FLIMG.onload = refresh;
setInterval(draw, 160);
</script>
