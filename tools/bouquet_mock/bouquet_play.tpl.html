    if (S.slots[i]){ const c = document.createElement('canvas'); c.width = c.height = 32; const q = c.getContext('2d'); q.imageSmoothingEnabled = false; q.drawImage(flowerIcon(FB[S.slots[i]]), 0, 0); b.appendChild(c); b.onclick = () => { S.slots.splice(i, 1); refresh(); }; }
    el.appendChild(b);
  }
  const m = meaning(); document.getElementById('msg').innerHTML = `<b>${m.head}</b><span>${m.sub}</span>`;
}
// 필요한 재료: 포장지 · 염색 · 무늬 도장 · 꽃 · 리본(털실) · 장식
function needs(){
  const W = S.wrap, P = PB[W.pat], out = {}, add = (k, n, why) => { if (!k || !n) return; (out[k] ||= { n: 0, why: [] }).n += n; if (!out[k].why.includes(why)) out[k].why.push(why); };
  add('목화솜', 1, '포장지');
  add(CB[W.base].dye, 1, '바탕 색');
  W.cols.slice(0, P.extra ? (P.multi ? W.n - 1 : 1) : 0).forEach(c => add(CB[c].dye, 1, '무늬 색'));
  add(P.stamp, 1, '무늬 도장');
  S.slots.forEach(id => add('꽃 · ' + FB[id].n, 1, '꽃'));
  add('털실 · ' + CB[S.ribbon].n, 1, '리본');
  DECO.forEach(([k, l, cost]) => { if (S.deco.has(k)) cost.forEach(([m, n]) => add(m, n, l)); });
  return out;
}
const short = () => Object.entries(needs()).filter(([k, v]) => (INV[k] || 0) < v.n);
const costTag = (k, n = 1) => k ? `<span class="cost ${(INV[k] || 0) < n ? 'lack' : ''}">${k} ${n}<i>${INV[k] || 0}</i></span>` : '<span class="cost free">재료 없음</span>';
const row = (label, cost) => `<div class="row"><span class="lab">${label}</span>${cost || ''}</div>`;
const swatches = (attr, cur) => `<div class="sw">${COL.map(c => `<button data-${attr}="${c.id}" class="${cur === c.id ? 'on' : ''}" style="background:${c.hex}" aria-label="${c.n}" title="${c.n}"></button>`).join('')}</div>`;
function panel(){
  const P = document.getElementById('panel'), W = S.wrap, PT = PB[W.pat], cnt = id => S.slots.filter(x => x === id).length;
  let html = '', next = null;
  if (S.tab === 'note'){ html = noteHTML(); next = ['wrap', '꽃다발 만들러 가기']; }
  else if (S.tab === 'wrap'){
    const extraN = PT.extra ? (PT.multi ? W.n - 1 : 1) : 0;
    html = `<div class="grp">${row(`바탕 색 <b>${CB[W.base].n}</b>`, costTag(CB[W.base].dye))}${swatches('base', W.base)}</div>
      <div class="grp">${row('무늬', PT.stamp ? costTag(PT.stamp) : '')}<div class="seg g4">${PATTERN.map(p => `<button data-pat="${p.id}" class="${W.pat === p.id ? 'on' : ''}">${p.n}</button>`).join('')}</div>
      ${PT.multi ? `<div class="seg g2">${[2, 3].map(k => `<button data-sn="${k}" class="${W.n === k ? 'on' : ''}">${k} 색 줄무늬</button>`).join('')}</div>` : ''}</div>
      ${[...Array(extraN)].map((_, i) => `<div class="grp">${row(`${PT.multi ? `줄 색 ${i + 1}` : '무늬 색'} <b>${CB[W.cols[i]].n}</b>`, costTag(CB[W.cols[i]].dye))}${swatches('pc' + i, W.cols[i])}</div>`).join('')}`;
    next = ['flower', '다음 · 꽃 고르기'];
  } else if (S.tab === 'flower'){
    html = `<div class="seg g3">${SIZES.map(([n, l]) => `<button data-size="${n}" class="${S.size === n ? 'on' : ''}">${l.replace(' 꽃다발', '')} ${n} 송이</button>`).join('')}</div>
      <div class="fgrid">${FL.map(f => { const have = INV['꽃 · ' + f.n] || 0, used = cnt(f.id); return `<button class="fl ${used ? 'on' : ''}" data-f="${f.id}" ${have - used <= 0 && !used ? 'disabled' : ''} title="${KNOWN.has(f.id) ? f.w : '꽃말 모름'}"><canvas width="32" height="32" data-ic="${f.id}"></canvas><span>${f.n}</span><i>${used ? used + '/' : ''}${have}</i></button>`; }).join('')}</div>`;
    next = ['deco', '다음 · 리본과 장식'];
  } else if (S.tab === 'deco'){
    html = `<div class="grp">${row(`리본 <b>${CB[S.ribbon].n}</b>`, costTag('털실 · ' + CB[S.ribbon].n))}${swatches('rib', S.ribbon)}</div>
      <div class="grp">${row('장식', '<span class="cost free">여러 개 고를 수 있어요</span>')}<div class="dgrid">${DECO.map(([k, l, cost]) => `<button class="chipb ${S.deco.has(k) ? 'on' : ''}" data-deco="${k}"><span>${l}</span>${cost.map(([m, n]) => costTag(m, n)).join('')}</button>`).join('')}</div></div>
      ${S.deco.has('card') ? `<div class="grp">${row('카드에 쓸 말')}<input id="card" maxlength="20" placeholder="20 자까지" value="${S.card.replace(/"/g, '&quot;')}"></div>` : ''}`;
    next = ['give', '다음 · 완성하기'];
  } else {
    const N = needs(), sh = short();
    html = S.made ? `<div class="grp">${row('누구에게 줄까요')}<div class="npcs">${NPCS.map(n => `<button class="npc" data-npc="${n.id}"><canvas width="64" height="64" data-row="${n.row}"></canvas>${n.n}</button>`).join('')}</div></div>`
      : `<div class="grp">${row('들어가는 재료', `<span class="cost ${sh.length ? 'lack' : 'free'}">${sh.length ? `${sh.length} 가지 모자라요` : '다 있어요'}</span>`)}
        <ul class="need">${Object.entries(N).map(([k, v]) => `<li class="${(INV[k] || 0) < v.n ? 'lack' : ''}"><span>${k}</span><b>${v.n}<i>/${INV[k] || 0}</i></b></li>`).join('')}</ul></div>`;
    html += `<div id="react"><canvas width="64" height="64" id="rcv"></canvas><div><b id="rn"></b><p id="rt"></p><div class="hearts" id="rh"></div></div></div>`;
    next = S.made ? null : ['make', !S.slots.length ? '꽃을 먼저 골라 주세요' : sh.length ? '재료가 모자라요' : '꽃다발 만들기', !S.slots.length || sh.length];
  }
  P.innerHTML = html;
  const mb = P.querySelector('#mbq'); if (mb) draw(mb.getContext('2d'), MANDI_ST());
  P.querySelectorAll('[data-ic]').forEach(c => { const q = c.getContext('2d'); q.imageSmoothingEnabled = false; q.drawImage(flowerIcon(FB[c.dataset.ic]), 0, 0); });
  const draw1 = () => P.querySelectorAll('[data-row]').forEach(c => { const q = c.getContext('2d'); q.imageSmoothingEnabled = false; q.clearRect(0, 0, 64, 64); q.drawImage(SHEET, 0, +c.dataset.row * 64, 64, 64, 0, 0, 64, 64); });
  if (SHEET.complete) draw1(); else SHEET.onload = draw1;
  const nb = document.getElementById('nextbtn'), rf = document.getElementById('refill');
  if (next){ nb.hidden = false; nb.textContent = next[1]; nb.disabled = !!next[2]; nb.dataset.go = next[0]; } else nb.hidden = true;
  rf.hidden = S.tab !== 'give';
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x.dataset.t === S.tab));
  document.getElementById('stat').textContent = `목화솜 ${INV['목화솜'] || 0}`;
}
function give(id){
  const n = NPCS.find(x => x.id === id); if (!S.made) return;
  const m = meaning(), has = S.slots.includes(n.like), bad = S.slots.includes(n.hate);
  let line = m.kind === 'love' ? n.say.love : m.kind === 'prank' ? n.say.prank : has ? n.say.like : bad ? n.say.hate : n.say.base;
  const h = 20 + (has ? 40 : 0) - (bad ? 30 : 0) + (m.kind === 'love' || m.kind === 'cheer' || m.kind === 'sorry' ? 20 : 0) + (S.deco.size * 3) + (S.size === 7 ? 15 : S.size === 5 ? 8 : 0) + (S.wrap.pat !== 'plain' ? 5 : 0);
  if (S.card.trim()) line += ` ....카드도 있네. 「${S.card.trim()}」. 잘 간직할게.`;
  S.made = false; panel();
  const r = document.getElementById('react'); r.classList.add('on');
  document.getElementById('rn').textContent = n.n; document.getElementById('rt').textContent = line;
  document.getElementById('rh').textContent = `호감도 ${h >= 0 ? '+' : ''}${h}${has ? ' · 좋아하는 꽃' : ''}${bad ? ' · 싫어하는 꽃' : ''}`;
  const q = document.getElementById('rcv').getContext('2d'); q.imageSmoothingEnabled = false; q.clearRect(0, 0, 64, 64); q.drawImage(SHEET, 0, n.row * 64, 64, 64, 0, 0, 64, 64);
  r.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function refresh(){ renderSlots(); panel(); draw(); }
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return; const d = b.dataset, W = S.wrap;
  if (d.go){ if (d.go === 'make'){ if (short().length) return; Object.entries(needs()).forEach(([k, v]) => INV[k] -= v.n); S.made = true; return panel(); } S.tab = d.go; panel(); document.getElementById('app').scrollIntoView({ block: 'start' }); return; }
  if (d.t){ S.tab = d.t; panel(); return; }
  if (S.made && (d.base || d.pat || d.sn || d.pc0 || d.pc1 || d.size || d.f || d.rib || d.deco)) S.made = false;
  if (d.base){ W.base = d.base; return refresh(); }
  if (d.pat){ W.pat = d.pat; return refresh(); }
  if (d.sn){ W.n = +d.sn; return refresh(); }
  if (d.pc0){ W.cols[0] = d.pc0; return refresh(); }
  if (d.pc1){ W.cols[1] = d.pc1; return refresh(); }
  if (d.size){ S.size = +d.size; S.slots = S.slots.slice(0, S.size); return refresh(); }
  if (d.f){ const f = FB[d.f], have = INV['꽃 · ' + f.n] || 0; if (S.slots.filter(x => x === d.f).length >= have) return; if (S.slots.length >= S.size) S.slots.shift(); S.slots.push(d.f); return refresh(); }
  if (d.rib){ S.ribbon = d.rib; return refresh(); }
  if (d.deco){ S.deco.has(d.deco) ? S.deco.delete(d.deco) : S.deco.add(d.deco); return refresh(); }
  if (d.make){ if (short().length) return; Object.entries(needs()).forEach(([k, v]) => INV[k] -= v.n); S.made = true; return panel(); }
  if (d.refill){ INV = { ...INV0 }; S.made = false; return refresh(); }
  if (d.npc) return give(d.npc);
  if (d.hunt) return hunt(d.hunt);
  if (d.pg){ noteOpen = d.pg; return panel(); }
});
const boot = () => { refresh(); intro(); };
document.getElementById('stu').addEventListener('change', e => { stu = +e.target.value; KNOWN.clear(); noteOpen = null; noteMsg = ''; introI = -1; intro(); refresh(); });
(function loop(now){ drawScene(now); requestAnimationFrame(loop); })(performance.now());
if (FLIMG.complete) boot(); else FLIMG.onload = boot;
document.getElementById('intro').addEventListener('click', intro);
setInterval(() => draw(), 160);
</script>
