<title>마들렌의 쿠키 상자</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:'G11';font-display:swap;src:url(data:font/woff2;base64,__G11__) format('woff2')}
@font-face{font-family:'G11B';font-display:swap;src:url(data:font/woff2;base64,__G11B__) format('woff2')}
:root{--bg:#140D1E;--panel:#211733;--panel2:#2B1F45;--line:#3A2A55;--line2:#4E3C72;--accent:#FF9A3C;--ok:#6FD08C;--warn:#FF6B6B;--text:#F6F0FF;--sub:#BDB0D6;--gold:#FFD866;--pink:#FF8FAF;
  --f-body:system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;--f-px:'G11',var(--f-body);--f-pxb:'G11B',var(--f-body);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
canvas{image-rendering:pixelated}
#app{max-width:560px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.shead{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 14px;border-bottom:1px solid var(--line)}
.shead b{flex:1;font-family:var(--f-pxb);font-weight:400;font-size:16px}
.shead button{min-height:36px;border-radius:18px;border:1px solid var(--line2);background:var(--panel2);color:var(--gold);font:12px var(--f-pxb);padding:0 12px;cursor:pointer}
.pick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);padding:10px 14px 0}
.pick select{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font:13px var(--f-pxb);padding:0 8px}
.tabs{display:flex;gap:4px;padding:10px 14px 0}
.tabs button{flex:1;min-height:40px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2);color:var(--sub);font:13px var(--f-pxb);cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#2A1506}
.tabs button i{font-style:normal;font-size:11px;margin-left:3px;color:inherit;opacity:.8}
.body{padding:14px;display:flex;flex-direction:column;gap:12px}
.lab{font-family:var(--f-pxb);font-size:13px;color:var(--sub)}
.hint{font-size:13px;color:var(--sub);margin:0}
.btn{min-height:44px;border:2px solid var(--line2);border-radius:12px;background:var(--panel2);color:var(--text);font-family:var(--f-pxb);font-size:14px;cursor:pointer;padding:0 14px}
.btn.go{background:var(--accent);border-color:var(--accent);color:#2A1506}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inv{display:flex;flex-wrap:wrap;gap:4px}.inv span{display:flex;align-items:center;gap:2px;padding:2px 8px 2px 2px;border-radius:10px;background:var(--panel2);font:12px var(--f-pxb);color:var(--sub)}.inv span b{font-weight:400;color:var(--text)}
.ic{display:inline-block;width:32px;height:32px;background-image:url(data:image/png;base64,__ICONS__);background-repeat:no-repeat;image-rendering:pixelated;flex:none}
.ic.s{width:24px;height:24px;background-size:192px 24px}
.steps{display:flex;gap:4px}.steps span{flex:1;text-align:center;font:11px var(--f-pxb);padding:4px 0;border-radius:8px;background:var(--panel2);color:var(--sub)}.steps span.on{background:#4A3418;color:var(--gold)}.steps span.done{color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.grid.g4{grid-template-columns:repeat(4,1fr)}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:2px solid var(--line2);border-radius:12px;background:var(--panel2);color:var(--text);font:13px var(--f-pxb);cursor:pointer;min-height:44px}
.opt small{font:11px var(--f-px);color:var(--sub)}
.opt canvas{width:48px;height:48px}
.opt.rec::after{content:'레시피';position:absolute;top:-8px;right:-4px;font:10px var(--f-pxb);background:var(--pink);color:#3A1020;padding:1px 6px;border-radius:8px}
.opt:disabled{opacity:.35;cursor:default}
.opt .need{display:flex;gap:0}
.oven{position:relative;border-radius:14px;overflow:hidden;background:#2A1410;border:2px solid #5A2E1E}
.oven canvas{display:block;width:100%;aspect-ratio:2/1}
.gauge{position:relative;height:22px;border-radius:11px;overflow:hidden;display:flex;border:2px solid #120A18}
.gauge i{display:block;height:100%}
.gauge .nd{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:#FFF;box-shadow:0 0 0 2px #120A18}
.glab{display:flex;justify-content:space-between;font:11px var(--f-pxb);color:var(--sub)}
.res{font:15px var(--f-pxb);text-align:center;min-height:22px}
.deco{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.deco canvas.big{width:240px;height:240px;max-width:100%;border-radius:12px;background:#F6E6D2;touch-action:none;cursor:crosshair}
.tools{flex:1;min-width:150px;display:flex;flex-direction:column;gap:8px}
.sw{display:flex;flex-wrap:wrap;gap:6px}.sw button{width:36px;height:36px;border-radius:10px;border:2px solid var(--line2);cursor:pointer;padding:0;font:11px var(--f-pxb);color:#2A1506}
.sw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.tb{display:flex;flex-wrap:wrap;gap:6px}.tb button{min-height:36px;border-radius:10px;border:2px solid var(--line2);background:var(--panel2);color:var(--text);font:12px var(--f-pxb);cursor:pointer;padding:0 10px}.tb button.on{border-color:var(--accent);color:var(--gold)}
.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ck{position:relative;display:flex;flex-direction:column;align-items:center;padding:6px 2px 4px;border:2px solid var(--line2);border-radius:12px;background:var(--panel2);cursor:pointer;color:var(--text);font:11px var(--f-pxb)}
.ck canvas{width:48px;height:48px}.ck.in{border-color:var(--accent)}.ck em{font-style:normal;font-size:10px;color:var(--sub)}
.ck .tag{position:absolute;top:-8px;left:50%;transform:translateX(-50%);white-space:nowrap;font:10px var(--f-pxb);background:var(--pink);color:#3A1020;padding:0 6px;border-radius:8px}
.boxed{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.boxed canvas{width:240px;height:192px;max-width:100%;border-radius:12px;background:#1A1226}
.boxes{display:flex;flex-wrap:wrap;gap:8px}.boxes button{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--line2);border-radius:12px;background:var(--panel2);color:var(--text);font:11px var(--f-pxb);padding:6px;cursor:pointer}.boxes button.on{border-color:var(--accent)}.boxes canvas{width:96px;height:77px}
.npcs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.npcs button{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2);color:var(--text);font:11px var(--f-pxb);padding:6px 2px;cursor:pointer}.npcs canvas{width:40px;height:40px;border-radius:8px;background:#1E2A44}
.npcs button i{font-style:normal;color:var(--pink);font-size:10px;min-height:14px}
.say{display:flex;gap:10px;align-items:flex-start;background:rgba(20,13,34,.96);border:2px solid #9AC8F0;border-radius:12px;padding:10px}
.say canvas{width:48px;height:48px;flex:none;background:#1E2A44;border-radius:8px}
.say b{display:block;font:13px var(--f-pxb);color:#BFE0FF}
.say p{margin:0;font:14px/1.6 var(--f-px);color:#F1E9FF}
.rcard{position:relative;display:flex;gap:12px;align-items:center;padding:14px;border-radius:12px;background:#FFF6E8;color:#4A2E1E;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.rcard::before{content:'';position:absolute;inset:6px;border:2px dashed #E8C8A0;border-radius:8px;pointer-events:none}
.rcard canvas{width:72px;height:72px;flex:none}
.rcard b{display:block;font:15px var(--f-pxb);color:#A8482E}.rcard p{margin:2px 0 0;font:14px/1.6 var(--f-px)}.rcard small{display:block;font:12px var(--f-pxb);color:#8A6A4E;margin-top:4px}
.hints{display:flex;flex-direction:column;gap:6px}.hints div{display:grid;grid-template-columns:40px 1fr;gap:4px 10px;padding:8px 10px;border-radius:10px;background:var(--panel2);align-items:center}
.hints canvas{width:40px;height:40px;border-radius:8px;background:#1E2A44;grid-row:span 2}
.hints p{margin:0;font:13px/1.5 var(--f-px);color:var(--sub)}.hints .bd{display:flex;gap:4px;align-items:center;font:12px var(--f-pxb)}
.hints .bd span{padding:1px 8px;border-radius:8px;background:var(--panel);color:var(--sub)}.hints .bd span.got{background:#2E4A3A;color:#C8F0B0}
.adm{max-width:560px;margin:16px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.admh b{display:block;font-family:var(--f-pxb);font-weight:400;font-size:16px;color:var(--gold)}.admh span{font-size:13px;color:var(--sub)}
.arows{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.arow{display:grid;grid-template-columns:52px 1fr;gap:4px;align-items:center;padding:4px 6px;border-radius:8px;background:var(--panel2)}.arow .an{font:12px var(--f-pxb)}
.arow select{min-height:36px;min-width:0;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--text);font:12px var(--f-pxb);padding:0 4px}
#cine{position:fixed;inset:0;z-index:50;background:#140E1E;display:flex;flex-direction:column;align-items:center;padding-top:env(safe-area-inset-top,0px)}#cine[hidden]{display:none}
.cwrap{position:relative;width:100%;max-width:560px;flex:1;overflow:hidden}#ccv{width:100%;height:100%;display:block}
.cvig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(255,200,150,0) 0,rgba(20,10,20,.5) 78%)}
.cnm{position:absolute;left:12px;top:10px;z-index:2;font:13px var(--f-pxb);color:var(--gold);background:rgba(20,13,30,.85);border:1px solid var(--line2);padding:4px 10px;border-radius:10px}
.cskip{position:absolute;right:12px;top:10px;z-index:2;font:12px var(--f-pxb);color:var(--sub);background:rgba(20,13,30,.85);border:1px solid var(--line2);padding:4px 10px;border-radius:10px;cursor:pointer;min-height:32px}
.toastc{position:absolute;left:50%;top:48px;transform:translateX(-50%);background:rgba(20,13,30,.94);color:var(--text);padding:10px 16px;border-radius:12px;border:1px solid var(--accent);font-size:13px;max-width:90%;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;z-index:3}.toastc.on{opacity:1}
#blsay{position:fixed;left:10px;right:10px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;display:none}#blsay .bx{position:relative;max-width:560px;margin:0 auto;display:flex;gap:10px;background:rgba(20,13,34,.96);border:2px solid #9AC8F0;border-radius:14px;padding:12px;cursor:pointer}
#blsay .fc{width:60px;height:60px;flex:none;border-radius:10px;background:#1E2A44;overflow:hidden}#blsay .fc canvas{width:60px;height:60px}#blsay b{display:block;font:14px var(--f-pxb);color:#BFE0FF;margin-bottom:3px}#blsay p{margin:0;font:15px/22px var(--f-px);color:#F1E9FF;min-height:44px}
#fam{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(10,6,16,.7);padding:16px}#fam[hidden]{display:none}
#fam .in{width:100%;max-width:340px;animation:pop .35s ease-out;cursor:pointer}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
#gtoast{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:80;background:rgba(20,13,30,.96);color:var(--text);padding:10px 16px;border-radius:12px;border:1px solid var(--pink);font:13px var(--f-pxb);opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%;text-align:center}#gtoast.on{opacity:1}
button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>

<div id="app">
  <div class="shead"><b>마들렌의 쿠키 상자</b><button id="replay">처음 연출 보기</button></div>
  <div class="pick"><label for="stu">시안 · 나는</label><select id="stu"></select><button class="btn" id="refill" style="min-height:40px;font-size:12px">재료 채우기</button></div>
  <div class="tabs" id="tabs"></div>
  <div class="body" id="body"></div>
</div>
<section class="adm" id="adm"></section>

<div id="cine" hidden><div class="cwrap"><div class="cnm">과자 교실</div><button class="cskip" id="cskip">넘기기</button><canvas id="ccv" width="360" height="270"></canvas><div class="cvig"></div><div class="toastc" id="ctoast"></div></div></div>
<div id="blsay"><div class="bx"><div class="fc"><canvas width="32" height="32"></canvas></div><div><b>마들렌</b><p></p></div></div></div>
<div id="fam" hidden><div class="in" id="famin"></div></div>
<div id="gtoast"></div>

<script>
const SHEET = new Image(); SHEET.src = 'data:image/webp;base64,__SHEET__';
const CANDY = Object.assign(new Image(), { src: 'data:image/png;base64,__CANDY__' });
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

// ===== 재료 (게임 아이템 그대로) · 아이콘 줄: 달걀 · 염소젖 · 벌꿀 · 밀 이삭 · 딸기 · 박하 잎 · 블루베리 · 호박씨
const ITEM = { hegg: ['달걀', 0], milk: ['염소젖', 1], honey: ['벌꿀', 2], g_wheat: ['밀 이삭', 3], g_straw: ['딸기', 4], g_mint: ['박하 잎', 5], g_blueb: ['블루베리', 6], g2_pseed: ['호박씨', 7] };
const ic = (k, sm) => `<i class="ic${sm ? ' s' : ''}" style="background-position:${-ITEM[k][1] * (sm ? 24 : 32)}px 0" title="${ITEM[k][0]}"></i>`;
const BASE = ['g_wheat', 'hegg'];
const FL = [
  { id: 'butter', n: '버터', it: 'milk', c: '#F0CC86' },
  { id: 'straw', n: '딸기', it: 'g_straw', c: '#F4A8B0' },
  { id: 'mint', n: '박하', it: 'g_mint', c: '#AEDCB4' },
  { id: 'honey', n: '꿀', it: 'honey', c: '#EEB056' },
  { id: 'pseed', n: '호박씨', it: 'g2_pseed', c: '#DCAE72' },
  { id: 'blueb', n: '블루베리', it: 'g_blueb', c: '#B4A4D8' },
];
const SH = [['heart', '하트'], ['star', '별'], ['circle', '동그라미'], ['cat', '고양이'], ['bat', '박쥐'], ['pumpkin', '호박'], ['moon', '달'], ['ghost', '유령']];
const ICE = [['하양', '#FFF8F0'], ['분홍', '#FF9EC0'], ['민트', '#9FE8C8'], ['노랑', '#FFE27A'], ['하늘', '#9FD0FF'], ['초코', '#6A3A24']];
const TOP = [['spr', '스프링클'], ['chip', '초코 칩'], ['pearl', '설탕 진주']];
const BOXC = ['#F4A0B8', '#9FD0FF', '#B8E6A8', '#FFE08A', '#C8A8F0', '#F6F0E8'];
const RIB = ['#E8455A', '#FFFFFF', '#FFD24A', '#6A9FE8', '#7A4A2E'];
const PAT = [['none', '민무늬'], ['dot', '물방울'], ['stripe', '줄무늬'], ['heart', '하트']];

// ===== NPC · 좋아하는 맛과 모양 · 마들렌 단골 수첩 힌트 · 반응 (최고 / 좋음 / 보통 / 탐)
const NPC = [
  { id: 'nabi', n: '나비', row: 0, f: 'butter', s: 'cat', hint: '우유 냄새 나는 건 뭐든 좋아해요. 그리고 자기 닮은 모양이면.... 모른 척하면서 제일 먼저 집어요.',
    r: ['고양이 모양에 버터 냄새.... 이건 반칙이다냥. 귀는 아껴 두고 꼬리부터 먹을 거다냥.', '버터 냄새가 난다냥. ....하나만 먹을 거다냥. 아마도.', '쿠키다냥. 생선은 아니지만.... 받아 두겠다냥.', '까맣다냥. 숯인 줄 알았다냥. ....그래도 다 먹었다냥.'] },
  { id: 'batri', n: '배트리', row: 1, f: 'straw', s: 'bat', hint: '새콤한 빨간 열매를 좋아해요. 모양은.... 거울 보면 나오는 그거요.',
    r: ['박쥐 모양이다. 딸기 맛이고. 이거 나 주려고 구운 거 맞지? 날개 한쪽은 아껴 둘래.', '딸기 냄새 좋다. 배달 가방 맨 위에 넣어 둘게. 안 부서지게.', '고마워. 배달하다 배고플 때 먹을게.', '어.... 밤하늘 색이네. 나는 밤을 좋아하니까 괜찮아.'] },
  { id: 'kappa', n: '캇파', row: 2, f: 'mint', s: 'circle', hint: '시원한 풀 향을 좋아해요. 모양은 머리 위에 있는 그거랑 닮은 거요.',
    r: ['동그랗고 시원하다. ....접시 같군. 머리 위에 올려 두고 싶지만, 먹겠다.', '박하 향이 난다. 연못 바람 같다. 나쁘지 않다.', '쿠키군. 오이는 아니지만.... 고맙다.', '탔다. ....물에 적시면 괜찮을지도 모른다. 아니, 아니겠군.'] },
  { id: 'aula', n: '아울라', row: 3, f: 'blueb', s: 'moon', hint: '밤에 깨어 있는 사람이라 밤하늘 닮은 걸 좋아해요. 보라색 열매 맛이요.',
    r: ['달 모양 블루베리 쿠키.... 밤에 책 읽을 때 하나씩 꺼내 먹을게요. 서른 밤은 버틸 것 같아요.', '블루베리 향이네요. 책갈피 옆에 두고 아껴 먹을게요.', '고마워요. 부스러기가 책에 떨어지지 않게 조심할게요.', '....조금 탔네요. 괜찮아요. 오래된 책 냄새랑 비슷해서 오히려 좋아요.'] },
  { id: 'mandi', n: '맨디', row: 4, f: 'honey', s: 'heart', hint: '꽃에서 온 달콤한 거면 다 좋아해요. 모양은.... 말 못 하는 마음 같은 거요.',

const face = (cv, row) => { const q = cv.getContext('2d'); q.imageSmoothingEnabled = false; q.clearRect(0, 0, cv.width, cv.height); if (SHEET.complete) q.drawImage(SHEET, 16, row * 64 + 10, 32, 32, 0, 0, cv.width, cv.height); };

// ===== 오븐 미니게임
let OV = null;
function ovenDraw(b){
  const c = $('#ovcv'); if (!c) return; const q = c.getContext('2d'); q.imageSmoothingEnabled = false;
  q.fillStyle = '#2A1410'; q.fillRect(0, 0, 240, 120);
  const glow = OV && OV.on ? .5 + Math.sin(performance.now() / 120) * .1 : .15;
  const g = q.createLinearGradient(0, 120, 0, 0); g.addColorStop(0, `rgba(255,120,40,${glow})`); g.addColorStop(1, 'rgba(255,120,40,0)'); q.fillStyle = g; q.fillRect(0, 0, 240, 120);
  q.fillStyle = '#5A3A2E'; q.fillRect(20, 88, 200, 6); q.fillStyle = '#3A241C'; for (let x = 24; x < 220; x += 12) q.fillRect(x, 88, 2, 6);
  const ck = { f: ST.cur.f, s: ST.cur.s, b };
  drawCookie(q, ck, 34, 18, 3); drawCookie(q, ck, 134, 18, 3);
  if (b >= 86){ q.fillStyle = `rgba(80,70,70,${Math.min(.5, (b - 86) / 20)})`; for (let i = 0; i < 6; i++){ const t = performance.now() / 600 + i; q.beginPath(); q.arc(70 + i * 22 + Math.sin(t) * 6, 30 - (t * 20 % 30), 7, 0, 7); q.fill(); } }
  q.strokeStyle = '#1A0C08'; q.lineWidth = 6; q.strokeRect(3, 3, 234, 114);
  q.fillStyle = 'rgba(255,255,255,.08)'; q.fillRect(10, 8, 60, 4);
}
function ovenStart(){
  if (OV) return; OV = { on: true, b: 0, t: performance.now() }; $('#ovbtn').textContent = '꺼내기'; $('#ovres').textContent = '';
  const f = now => { if (!OV || !OV.on) return; const dt = (now - OV.t) / 1000; OV.t = now; OV.b = Math.min(100, OV.b + dt * (11 + OV.b * .22)); if ($('#nd')) $('#nd').style.left = OV.b + '%'; ovenDraw(OV.b); if (OV.b >= 100){ ovenStop(); return; } requestAnimationFrame(f); };
  requestAnimationFrame(f);
}
function ovenStop(){
  const b = Math.round(OV.b); OV.on = false; ST.cur.b = b; ovenDraw(b); const g = grade(b);
  $('#ovres').innerHTML = `<span style="color:${g === 'perfect' ? 'var(--ok)' : g === 'burnt' ? 'var(--warn)' : 'var(--gold)'}">${{ raw: '아직 말랑해요....', gold: '노릇노릇!', perfect: '완벽하게 구워졌어요!', burnt: '앗, 탔어요.......' }[g]}</span>`;
  $('#ovbtn').textContent = '꾸미러 가기'; $('#ovbtn').dataset.next = '1'; OV = null;
}

// ===== 꾸미기
function decoDraw(){ const c = $('#dcv'), q = c.getContext('2d'); q.fillStyle = '#F6E6D2'; q.fillRect(0, 0, 240, 240); q.fillStyle = '#EED8BE'; for (let y = 0; y < 240; y += 20) for (let x = (y / 20) % 2 * 20; x < 240; x += 40) q.fillRect(x, y, 20, 20); drawCookie(q, ST.cur, 0, 0, 10); }
function decoAt(e){
  const c = $('#dcv'), r = c.getBoundingClientRect(), x = Math.floor((e.clientX - r.left) / r.width * N), y = Math.floor((e.clientY - r.top) / r.height * N); if (x < 0 || y < 0 || x >= N || y >= N) return;
  const { m, d } = mask(ST.cur.s), k = y * N + x, t = ST.tool || 'ice0'; if (!m[k] || d[k] === 1) return;
  if (t.startsWith('ice')) ST.cur.ice[k] = +t.slice(3) + 1; else if (t === 'erase') ST.cur.ice[k] = 0;
  else if (e.type === 'pointerdown'){ if (ST.cur.top.length < 30) ST.cur.top.push({ k: t, x: Math.min(x, N - 2), y: Math.min(y, N - 2), c: ['#FF6B8A', '#6FD0FF', '#FFE27A', '#9FE8A8', '#C8A8F0'][ST.cur.top.length % 5], v: ST.cur.top.length % 2 }); }
  decoDraw();
}

// ===== 상자 그림
function drawBox(q, B, closed){
  q.clearRect(0, 0, 120, 96); q.imageSmoothingEnabled = false;
  const col = hex(BOXC[B.c]), dk = rgb(mix(col, [40, 20, 30], .35)), lt = rgb(mix(col, [255, 255, 255], .35)), OL = '#2A1A2E';
  const pat = (x, y, w, h) => { const P = PAT[B.p][0]; q.save(); q.beginPath(); q.rect(x, y, w, h); q.clip(); q.fillStyle = lt;
    if (P === 'dot') for (let yy = y + 2; yy < y + h; yy += 8) for (let xx = x + 2 + ((yy - y) / 8 % 2) * 4; xx < x + w; xx += 8) q.fillRect(xx, yy, 2, 2);
    if (P === 'stripe') for (let xx = x - h; xx < x + w; xx += 8){ q.beginPath(); q.moveTo(xx, y + h); q.lineTo(xx + h, y); q.lineTo(xx + h + 3, y); q.lineTo(xx + 3, y + h); q.fill(); }
    if (P === 'heart') for (let yy = y + 3; yy < y + h; yy += 10) for (let xx = x + 3 + ((yy - y) / 10 % 2) * 5; xx < x + w; xx += 10){ q.fillRect(xx, yy, 2, 2); q.fillRect(xx + 3, yy, 2, 2); q.fillRect(xx, yy + 1, 5, 2); q.fillRect(xx + 1, yy + 3, 3, 1); q.fillRect(xx + 2, yy + 4, 1, 1); }
    q.restore(); };
  if (!closed){
    q.fillStyle = OL; q.fillRect(4, 6, 112, 86); q.fillStyle = rgb(col); q.fillRect(6, 8, 108, 82); pat(6, 8, 108, 82);
    q.fillStyle = dk; q.fillRect(12, 14, 96, 70); q.fillStyle = '#FFF6EC'; q.fillRect(14, 16, 92, 66);
    q.fillStyle = '#F2E2D0'; for (let i = 0; i < 92; i += 6) q.fillRect(14 + i, 16, 3, 66);
    [[22, 20], [62, 20], [22, 52], [62, 52]].forEach(([x, y], i) => { const ck = B.cks[i]; if (ck) drawCookie(q, ck, x + 4, y + 2, 1.25); else { q.fillStyle = 'rgba(0,0,0,.06)'; q.fillRect(x + 6, y + 4, 28, 26); } });
    return;
  }
  q.fillStyle = 'rgba(0,0,0,.25)'; q.fillRect(10, 86, 100, 6);
  q.fillStyle = OL; q.fillRect(8, 20, 104, 68); q.fillStyle = rgb(col); q.fillRect(10, 22, 100, 64); pat(10, 22, 100, 64);
  q.fillStyle = dk; q.fillRect(10, 30, 100, 2);
  const rb = RIB[B.r], rbd = rgb(mix(hex(rb), [40, 20, 30], .3));
  q.fillStyle = rb; q.fillRect(54, 22, 12, 64); q.fillRect(10, 48, 100, 10); q.fillStyle = rbd; q.fillRect(54, 56, 12, 2); q.fillRect(64, 22, 2, 64);
  q.fillStyle = OL; q.beginPath(); q.moveTo(60, 50); q.lineTo(34, 30); q.lineTo(32, 56); q.closePath(); q.fill(); q.beginPath(); q.moveTo(60, 50); q.lineTo(86, 30); q.lineTo(88, 56); q.closePath(); q.fill();
  q.fillStyle = rb; q.beginPath(); q.moveTo(58, 50); q.lineTo(36, 34); q.lineTo(35, 53); q.closePath(); q.fill(); q.beginPath(); q.moveTo(62, 50); q.lineTo(84, 34); q.lineTo(85, 53); q.closePath(); q.fill();
  q.fillStyle = OL; q.fillRect(53, 45, 14, 12); q.fillStyle = rb; q.fillRect(55, 47, 10, 8); q.fillStyle = rbd; q.fillRect(55, 53, 10, 2);
  q.fillStyle = rb; q.fillRect(50, 56, 6, 16); q.fillRect(64, 56, 6, 16);
}

// ===== 선물
function giftTo(id){
  const n = NPC.find(x => x.id === id), B = ST.boxes[ST.gsel]; if (!B) return;
  const sc = B.cks.map(c => ({ c, burnt: grade(c.b) === 'burnt', m: (c.f === n.f ? 1 : 0) + (c.s === n.s ? 1 : 0) }));
  const ok = sc.filter(x => !x.burnt), best = ok.sort((a, b) => b.m - a.m)[0];
  let tier, h;
  if (!best){ tier = 3; h = 1; } else { tier = best.m === 2 ? 0 : best.m === 1 ? 1 : 2; h = [3, 2, 1][tier] + (best.m && grade(best.c.b) === 'perfect' ? 1 : 0); }
  const g = ST.found[id] || (ST.found[id] = {}); B.cks.forEach(c => { if (grade(c.b) !== 'burnt'){ if (c.f === n.f) g.f = 1; if (c.s === n.s) g.s = 1; } });
  let t = n.r[tier]; if (tier < 3 && B.cks.some(c => c.ice && c.ice.some(v => v))) t += ' ' + (id === 'otumo' ? '그림도 감지. 저장.' : id === 'nabi' ? '....그림도 그렸냐냥.' : id === 'kappa' ? '그림도 있군.' : id === 'jipsin' ? '그림도 있다.' : '그림까지 그려 줬네.');
  ST.heart[id] = (ST.heart[id] || 0) + h; ST.boxes.splice(ST.gsel, 1); ST.gsel = -1; ST.said = { id, t };
  gtoast(`${n.n.replace(' 선생님', '')} 호감 ♥ +${h}${tier === 0 ? ' · 최고의 선물' : ''}`);
  render(); const s = document.querySelector('.say'); if (s) s.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function gtoast(t){ const el = $('#gtoast'); el.textContent = t; el.classList.add('on'); clearTimeout(gtoast.t); gtoast.t = setTimeout(() => el.classList.remove('on'), 2200); }

// ===== 입력
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const D = b.dataset;
  if (D.tab){ ST.tab = D.tab; render(); return; }
  if (D.fl){ BASE.forEach(k => ST.inv[k]--); ST.inv[FL.find(f => f.id === D.fl).it]--; ST.cur = { f: D.fl, s: null, b: 0, ice: new Uint8Array(N * N), top: [] }; ST.step = 1; render(); return; }
  if (D.sh){ ST.cur.s = D.sh; ST.step = 2; render(); return; }
  if (b.id === 'ovbtn'){ if (D.next){ ST.step = 3; ST.tool = 'ice' + (myRec().f === ST.cur.f && myRec().s === ST.cur.s ? myRec().ice : 0); render(); } else if (OV) ovenStop(); else ovenStart(); return; }
  if (D.ice){ ST.tool = D.ice === 'x' ? 'erase' : 'ice' + D.ice; document.querySelectorAll('[data-ice],[data-top]').forEach(x => x.classList.toggle('on', x === b)); return; }
  if (D.top){ ST.tool = D.top; document.querySelectorAll('[data-ice],[data-top]').forEach(x => x.classList.toggle('on', x === b)); return; }
  if (D.undo){ ST.cur.top.pop(); decoDraw(); return; }
  if (D.clr){ ST.cur.ice.fill(0); ST.cur.top = []; decoDraw(); return; }
  if (b.id === 'decodone'){ const R = myRec(), rec = R.f === ST.cur.f && R.s === ST.cur.s && grade(ST.cur.b) !== 'burnt';
    for (let i = 0; i < 2; i++) ST.tray.push({ ...ST.cur, ice: ST.cur.ice.slice(), top: ST.cur.top.slice(), id: uid++, rec });
    ST.step = 0; ST.cur = null; gtoast('쿠키 2 개가 쟁반에 올라갔어요'); render();
    if (rec && !ST.madeRec){ ST.madeRec = true; madSay(['바로 그거예요. ....생각했던 것보다 훨씬 예쁘네요.', '이제 마음껏 구워요. 주고 싶은 사람이 생기면, 상자째로요.']); }
    return; }
  if (D.ck){ const id = +D.ck, S = ST.box.sel; if (S.includes(id)) S.splice(S.indexOf(id), 1); else if (S.length < 4) S.push(id); else gtoast('상자에는 4 개까지 들어가요'); render(); return; }
  if (D.bc){ ST.box.c = +D.bc; render(); return; }
  if (D.rb){ ST.box.r = +D.rb; render(); return; }
  if (D.pt){ ST.box.p = +D.pt; render(); return; }
  if (b.id === 'pack'){ const cks = ST.box.sel.map(id => ST.tray.find(x => x.id === id)); ST.tray = ST.tray.filter(x => !ST.box.sel.includes(x.id)); ST.boxes.push({ cks, c: ST.box.c, r: ST.box.r, p: ST.box.p }); ST.box.sel = []; gtoast('리본을 묶었어요. 쿠키 상자 완성'); ST.gsel = ST.boxes.length - 1; ST.tab = 'gift'; ST.said = null; render(); return; }
  if (D.gb){ ST.gsel = +D.gb; ST.said = null; render(); return; }
  if (D.npc){ giftTo(D.npc); return; }
  if (b.id === 'refill'){ refill(); gtoast('재료를 채웠어요 (시안 전용)'); render(); return; }
  if (b.id === 'replay'){ playIntro(); return; }
});

async function say(row, name, t, hold = 1400){
  const v = $('#blsay'), p = v.querySelector('p'); v.querySelector('b').textContent = name; face(v.querySelector('canvas'), row);
  v.style.display = 'block'; p.textContent = ''; let skip = false; v.onclick = () => { skip = true; };
  for (let k = 1; k <= t.length && !skip; k++){ p.textContent = t.slice(0, k); await sleep(28); } p.textContent = t;
  await new Promise(r => { let done = false; const go = () => { if (done) return; done = true; r(); }; v.onclick = go; setTimeout(go, hold + t.length * 45); });
  v.style.display = 'none'; await sleep(100);
}
