<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:G;src:url(../Galmuri11-Bold.ttf)}@font-face{font-family:G9;src:url(../Galmuri9.ttf)}
body{margin:0;background:#111;font-family:G;color:#F1E9FF}
.ph{width:390px;height:844px;position:relative;overflow:hidden;background:#0C0715}
canvas{position:absolute;left:0;top:0;width:390px;height:844px;image-rendering:pixelated}
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:18px 16px 0}
.pill{background:rgba(20,12,36,.72);border:2px solid rgba(255,255,255,.18);border-radius:18px;padding:6px 12px;font-size:14px;display:flex;align-items:center;gap:6px}
.t{position:absolute;left:0;right:0;text-align:center}
.big{font-size:22px;color:#FFE9A0;text-shadow:0 2px 0 #2A1E3A}
.sub{font-size:13px;opacity:.85}
.btns{position:absolute;bottom:34px;left:16px;right:16px;display:flex;gap:12px}
.btns b{flex:1;min-height:64px;border-radius:20px;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:24px}
.ok{display:inline-block;padding:12px 30px;border-radius:24px;background:#FFD866;color:#2A1E3A;border:2px solid #2A1E3A;box-shadow:0 3px 0 #B8862E;font-size:16px}
.book{position:absolute;left:16px;right:16px;top:118px;bottom:24px;background:#F6EAD2;border-radius:14px;border:3px solid #6A4A34;box-shadow:0 5px 0 #3E2A1E;color:#4A3424;padding:14px 12px}
.book h3{margin:0 0 10px;text-align:center;font-size:18px;color:#7A48C8}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pg{height:112px;border-radius:10px;background:#EADBBE;border:2px dashed #C8B08A;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;gap:4px;position:relative}
.pg.on{background:#fff;border:2px solid #C8A0FF}.pg canvas{position:static;width:72px;height:54px;border-radius:6px}
.pg i{font-style:normal;font-size:11px;color:#9A7A5A}
.fur{margin-top:12px;font-size:13px;text-align:center}
.fur span{display:inline-flex;align-items:center;gap:4px;background:#fff;border-radius:10px;padding:4px 8px;margin:3px;border:2px solid #E2D2B4}
.fur canvas{position:static;width:24px;height:24px}
</style>
<style>.pg b.n{font-size:12px}.pg .cnt{font-size:11px;color:#9A7A5A}.lock{font-size:22px;color:#C8B08A}</style></head><body><div id="out"></div>
<script>const D={};</script><script src="lib.js"></script><script src="old3.js"></script><script src="d9.js"></script>
<script>
function mk(id,html){const d=document.createElement('div');d.className='ph';d.id=id;const c=document.createElement('canvas');c.width=W;c.height=H;d.appendChild(c);d.insertAdjacentHTML('beforeend',html||'');document.getElementById('out').appendChild(d);return c.getContext('2d');}
const DREAMS=[['jump','구름 위 폴짝','좌우를 눌러 구름을 밟고 올라가요',1],['candy','과자 나라','바구니로 과자를 받아요 · 브로콜리는 피해요',1],['sea','거꾸로 바다','누르면 헤엄쳐 올라가요 · 산호를 피해요',0],
['stars','별똥별 줍기','병을 움직여 별똥별을 담아요 · 먹구름은 피해요',1],['sheep','양 세기','양이 울타리를 넘을 때 맞춰 눌러요',0],['tiny','작아진 나','굴러오는 연필과 떨어지는 지우개를 피해요',1],
['train','별빛 기차','좌우로 밀어 선로를 바꿔요',1],['rainbow','무지개 미끄럼틀','누르면 점프! 끊긴 틈을 뛰어넘어요',0],['bubble','비눗방울 톡톡','방울을 눌러 터뜨려요 · 검은 방울은 안 돼요',0],
['toys','장난감 상자','같은 장난감 카드 두 장을 찾아요',0],['mochi','달토끼 떡방아','박자에 맞춰 눌러 떡을 쳐요',0],['bed','날아라 침대','누르면 날아올라요 · 굴뚝과 고드름을 피해요',0]];
DREAMS.forEach(([k,n,tip,lr],i)=>{const g=mk('d'+(i+1),`<div class="hud"><span class="pill">${n}</span><span class="pill">⌛ ${20+i%3*5}</span></div><div class="hud" style="top:52px"><span class="pill" style="font-size:13px">꿈 조각 <b style="color:#D8B4FF">${5+i}</b></span></div>
<div class="t" style="bottom:${lr?116:60}px"><span class="pill" style="display:inline-flex;font-size:13px">${tip}</span></div>${lr?'<div class="btns"><b>◀</b><b>▶</b></div>':''}`);D[k](g);});
// 일기장
function journal(id,seen,title,sub){const g=mk(id,`<div class="t big" style="top:38px">${title}</div><div class="t sub" style="top:70px">${sub}</div><div class="book"><h3>꿈 일기장 <span style="font-size:13px;color:#9A7A5A">${Object.keys(seen).length} / 12</span></h3><div class="grid"></div></div>`);
 grad(g,[40,28,80],[90,60,140]);for(let i=0;i<30;i++)P(g,[[(i*31)%W,(i*17)%40]],'#FFF8C8');
 const gr=document.querySelector('#'+id+' .grid');DREAMS.forEach(([k,n],i)=>{const d=document.createElement('div');d.className='pg'+(seen[k]?' on':'');
  if(seen[k]){const c=document.createElement('canvas');c.width=130;c.height=97;const q=c.getContext('2d');q.save();q.translate(0,-80);D[k](q);q.restore();c.style.cssText='position:static;width:72px;height:54px;border-radius:6px';d.appendChild(c);d.insertAdjacentHTML('beforeend',`<b class="n">${n}</b><span class="cnt">${seen[k]}번 꿈</span>`);}
  else d.insertAdjacentHTML('beforeend','<span class="lock">???</span>');gr.appendChild(d);});}
journal('j0',{},'꿈 일기장','아직 꿈을 꾸지 않았어요');
journal('j1',{sheep:3,candy:1,bed:2,stars:1},'꿈에서 깼어요!','「양 세기」를 또 꿨어요 · 꿈 조각 +9');
</script></body></html>
