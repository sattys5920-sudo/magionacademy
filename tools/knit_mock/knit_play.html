<title>레오의 뜨개 교실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap">
<style>
/* 한 화면 게임: 위 = 바늘과 천 확대 그림, 아래 = 손가락으로 긋는 칸. 사육장 밤 · 벽난로 빛 (게임과 같은 어두운 화풍 하나로) */
:root{
  --night:#1A1226; --panel:#251A36; --pad:#160F22; --line:#3A2E58;
  --ink:#F1E9FF; --sub:#B8A8D8; --yarn:#FFB8A8; --gold:#FFE9A0; --ok:#9AE07A; --bad:#FF8A8A;
  --f-disp:'Do Hyeon','Gowun Dodum',system-ui,sans-serif; --f-body:'Gowun Dodum',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box;overscroll-behavior:none}
.wrap{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
h1{font-family:var(--f-disp);font-weight:400;font-size:24px;margin:0;color:var(--yarn);letter-spacing:.5px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.top small{color:var(--sub);font-size:13px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px}
canvas{display:block;width:100%;image-rendering:pixelated;border-radius:8px}
#view{aspect-ratio:192/128;background:#2A1E3A}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
#step{font-family:var(--f-disp);font-size:20px;color:var(--gold)}
#judge{font-family:var(--f-disp);font-size:20px;min-width:70px;text-align:right}
#tip{font-size:14px;color:var(--sub);line-height:1.5;margin-top:4px;min-height:42px}
#pad{aspect-ratio:192/90;background:var(--pad);touch-action:none;cursor:crosshair;border:2px dashed var(--line)}
.prog{height:8px;border-radius:4px;background:var(--pad);overflow:hidden}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FF8A8A,var(--gold));transition:width .3s}
.stats{display:flex;gap:12px;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:400}
#start,#result{position:fixed;inset:0;background:rgba(10,6,20,.82);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.dlg{background:var(--panel);border:2px solid var(--yarn);border-radius:16px;padding:16px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center}
.dlg h2{font-family:var(--f-disp);font-weight:400;font-size:22px;margin:0;color:var(--yarn)}
.dlg p{margin:0;font-size:14px;line-height:1.6;color:var(--sub)}
.sw{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.sw button{width:40px;height:40px;border-radius:20px;border:3px solid transparent;cursor:pointer}
.sw button[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 2px var(--night) inset}
.sw label{font-size:13px;color:var(--sub);width:100%}
.go{font-family:var(--f-disp);font-size:18px;padding:10px 18px;border-radius:12px;border:0;background:var(--yarn);color:#3A1A14;cursor:pointer}
.go.alt{background:var(--line);color:var(--ink)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.leo{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--pad);border-radius:12px;padding:10px;font-size:14px;line-height:1.55}
.leo b{color:#FFD8A8;font-family:var(--f-disp);font-weight:400}
#scarf{width:96px;height:auto;margin:0 auto;aspect-ratio:auto}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>

<div class="wrap">
  <div class="top"><h1>레오의 뜨개 교실</h1><small>줄무늬 목도리 · 8 코 6 줄</small></div>
  <div class="card">
    <canvas id="view" width="192" height="128" aria-label="바늘과 천"></canvas>
    <div class="bar"><span id="step">코 잡기</span><span id="judge"></span></div>
    <div id="tip">아래 칸을 톡 눌러서 바늘에 고리를 하나씩 잡아요</div>
  </div>
  <canvas id="pad" width="192" height="90" aria-label="손가락으로 긋는 칸"></canvas>
  <div class="prog"><i id="pg"></i></div>
  <div class="stats"><span>완벽 <b id="s2">0</b></span><span>좋아요 <b id="s1">0</b></span><span>삐끗 <b id="s0">0</b></span><span>다시 <b id="sr">0</b></span></div>
</div>

<div id="start"><div class="dlg">
  <h2>겨울 뜨개질</h2>
  <div class="leo"><canvas id="leoFace" width="16" height="16" style="width:44px;height:44px;flex:none"></canvas><div><b>레오</b><br>....뜨개질, 해 볼래. 가르쳐 주는 거 아니다. 그냥 같이 하는 거야.</div></div>
  <div class="sw" id="swA"><label>첫째 색</label></div>
  <div class="sw" id="swB"><label>둘째 색 (줄무늬)</label></div>
  <p>아래 칸에서 점선을 따라 손가락(마우스)으로 그어요. 한 코는 찔러 넣기 → 실 감기 → 빼내기 → 넘기기. 손에 익으면 쓱 한 번에 한 코.</p>
  <button class="go" id="goBtn">뜨기 시작</button>
</div></div>
<div id="result" hidden><div class="dlg">
  <h2 id="rTitle">완성!</h2>
  <canvas id="scarf" width="40" height="120"></canvas>
  <p id="rText"></p>
  <div class="leo"><canvas width="16" height="16" class="leoF" style="width:44px;height:44px;flex:none"></canvas><div><b>레오</b><br><span id="rLeo"></span></div></div>
  <div style="display:flex;gap:8px;justify-content:center"><button class="go" id="again">다시 뜨기</button><button class="go alt" id="other">색 바꾸기</button></div>
</div></div>

<script>
(() => {
const YC = { 빨강: '#E0505A', 하양: '#F4F0E8', 파랑: '#5A8AE0', 노랑: '#F0C850', 초록: '#6AB85A' };
const NC = 8, ROWS = 6, TIE = [2, 4], LEARN = 3;
const $ = id => document.getElementById(id), V = $('view'), P = $('pad'), g = V.getContext('2d'), pg = P.getContext('2d');
let colA = '빨강', colB = '하양';
// 소리 (첫 터치 뒤부터)
let AC = null; const ac = () => { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch(e){} return AC; };
function tone(f, d, type = 'triangle', v = .06, at = 0){ const C = ac(); if (!C) return; const t = C.currentTime + at, o = C.createOscillator(), gn = C.createGain(); o.type = type; o.frequency.value = f; gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(gn); gn.connect(C.destination); o.start(t); o.stop(t + d); }

// ---------- 그림 ----------
const R = (c, x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x, y, w, h); };
const COLX = c => 48 + c * 13;
const dk = c => { const n = parseInt(c.slice(1), 16), f = .62; return `rgb(${(n >> 16 & 255) * f | 0},${(n >> 8 & 255) * f | 0},${(n & 255) * f | 0})`; };

  for (let i = 0; i < 5; i++){ R(g, x - 6 + i + o, y + i, 4, 2, col); R(g, x + 3 - i + o, y + i + o, 4, 2, col); R(g, x - 6 + i + o, y + i + 1, 1, 1, D); R(g, x + 6 - i + o, y + i + 1, 1, 1, D); R(g, x - 3 + i, y + i, 1, 1, 'rgba(255,255,255,.2)'); } R(g, x, y + 5, 1, 1, D); }

  R(g, x - 3, y - 5, 1, 9, col); R(g, x + 3, y - 5, 1, 9, col); R(g, x - 2, y + 3, 5, 2, col); R(g, x - 2, y + 4, 5, 1, dk(col)); R(g, x - 3, y - 5, 1, 2, 'rgba(255,255,255,.4)'); g.globalAlpha = 1; }
function needle(x0, y0, x1, y1){ [[5, '#1a1024'], [3, '#D8C8A0']].forEach(([w, c]) => { g.strokeStyle = c; g.lineWidth = w; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }); g.strokeStyle = '#F4ECD8'; g.lineWidth = 1; g.beginPath(); g.moveTo(x0, y0 - 1); g.lineTo(x1, y1 - 1); g.stroke(); R(g, x0 - 4, y0 - 4, 8, 8, '#1a1024'); R(g, x0 - 3, y0 - 3, 6, 6, '#B8804A'); }

function reset(){ K = { rows: [], j: 0, cast: 0, casting: 1, cur: YC[colA], tipDX: 0, tipDY: 0, wrap: null, newLoop: 0, drop: null, flip: 1, bind: -1, fringe: 0 }; score = [0, 0, 0, 0]; phase = 'cast'; sub = 0; fast = false; busy = false; rowQ = []; ui(); }

function draw(t){ g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, 192, 128); R(g, 0, 0, 192, 128, '#2A1E3A'); g.imageSmoothingEnabled = false;
  g.setTransform(K.flip, 0, 0, 1, 96 * (1 - K.flip), 0);

  if (K.bind >= 0) for (let c = 0; c < Math.min(NC, K.bind); c++){ R(g, COLX(c) - 6, 33, 13, 4, '#1a1024'); R(g, COLX(c) - 5, 34, 11, 2, K.cur); }
  const tipL = K.j > 0 ? COLX(K.j - 1) + 8 : 30, tipR = (K.j < NC ? COLX(K.j) - 7 : COLX(NC - 1) + 14) + K.tipDX;
  if (K.bind < NC){ const n0 = Math.max(0, K.bind), n1 = K.casting ? K.cast : K.j; for (let c = n0; c < n1; c++) if (!(K.drop && K.drop.c === c)) lpBack(COLX(c), 30, K.cur); needle(4, 34, K.bind >= 0 || K.casting ? COLX(NC - 1) + 8 : tipL, 29); for (let c = n0; c < n1; c++) if (!(K.drop && K.drop.c === c)) lp(COLX(c), 30, K.cur); }
  if (K.bind < 0 && !K.casting){ for (let c = K.j; c < NC; c++) lpBack(COLX(c), 25, K.cur); needle(188, 22, tipR, 27 + K.tipDY); for (let c = K.j; c < NC; c++) lp(COLX(c), 25, K.cur); }

  if (K.drop) lp(COLX(K.drop.c), 30 + K.drop.p * 6, K.cur, 1 - K.drop.p * .7);
  const wx = K.wrap != null ? tipR + 2 + Math.cos(K.wrap) * 5 : tipR + 6, wy = K.wrap != null ? 27 + K.tipDY + Math.sin(K.wrap) * 5 : 30;
  g.setTransform(1, 0, 0, 1, 0, 0); const sx = 96 + (wx - 96) * K.flip;
  g.strokeStyle = K.cur; g.lineWidth = 2; g.beginPath(); g.moveTo(sx, wy); g.quadraticCurveTo(170, 70 + Math.sin(t * 2) * 3, 176, 106); g.stroke(); ball(g, 178, 112, 10, K.cur); }
// ---------- 동작과 길잡이 ----------
const G = { tap: { n: '톡 · 코 잡기', tip: '아래 칸을 톡 눌러서 바늘에 고리를 하나씩 잡아요', path: [[96, 45]] },
  stab: { n: '↖ 찔러 넣기', tip: '오른쪽 아래에서 왼쪽 위로 그어서 오른쪽 바늘을 첫 고리에 찔러 넣어요', path: [[160, 70], [70, 22]], dir: [-.9, -.45] },
  wrap: { n: '⟳ 실 감기', tip: '동그랗게 한 바퀴 그어서 실을 바늘에 감아요', circle: 1 },
  pull: { n: '↘ 빼내기', tip: '왼쪽 위에서 오른쪽 아래로 그어서 감은 실을 고리 사이로 빼내요', path: [[70, 22], [160, 70]], dir: [.9, .45] },
  slip: { n: '→ 넘기기', tip: '왼쪽에서 오른쪽으로 쭉 그어서 헌 고리를 넘겨요', path: [[30, 45], [165, 45]], dir: [1, 0] },
  swipe: { n: '쓱 · 한 코', tip: '손에 익었어요. 왼쪽에서 오른쪽으로 쓱 한 번이면 한 코', path: [[30, 55], [80, 30], [115, 60], [165, 38]], dir: [1, 0], wide: 1 },
  flip: { n: '← 뒤집기', tip: '한 줄 끝! 오른쪽에서 왼쪽으로 그어서 바늘을 뒤집어 쥐어요', path: [[165, 45], [30, 45]], dir: [-1, 0] },
  tie: { n: '톡 · 실 바꾸기', tip: '줄무늬 차례예요. 톡 눌러서 새 색 실을 묶어요', path: [[96, 45]] },
  bind: { n: '→ 코 막음', tip: '앞 고리를 뒤 고리에 씌워서 빼요. 왼쪽에서 오른쪽으로', path: [[30, 45], [165, 45]], dir: [1, 0] },
  fringe: { n: '↓ 술 달기', tip: '위에서 아래로 그어서 목도리 끝에 실 술을 매달아요', path: [[96, 12], [96, 78]], dir: [0, 1] } };
const want = () => phase === 'cast' ? 'tap' : phase === 'knit' ? (fast ? 'swipe' : ['stab', 'wrap', 'pull', 'slip'][sub]) : phase;
let trail = [], ghostT = 0, lastAct = performance.now();
function padDraw(now){ pg.clearRect(0, 0, 192, 90); const w = G[want()]; if (!w) return; pg.strokeStyle = 'rgba(255,233,160,.45)'; pg.lineWidth = 2; pg.setLineDash([4, 4]); pg.beginPath();
  if (w.circle){ pg.arc(96, 45, 26, 0, 7); } else w.path.forEach(([x, y], i) => i ? pg.lineTo(x, y) : pg.moveTo(x, y)); pg.stroke(); pg.setLineDash([]);
  if (!w.circle && w.path.length > 1){ const [a, b] = w.path.slice(-2), an = Math.atan2(b[1] - a[1], b[0] - a[0]); pg.fillStyle = 'rgba(255,233,160,.6)'; pg.beginPath(); pg.moveTo(b[0], b[1]); pg.lineTo(b[0] - 9 * Math.cos(an - .5), b[1] - 9 * Math.sin(an - .5)); pg.lineTo(b[0] - 9 * Math.cos(an + .5), b[1] - 9 * Math.sin(an + .5)); pg.fill(); }

  if (!trail.length && now - lastAct > 1800){ const p = ((now - lastAct - 1800) / 1400) % 1; let fx, fy; if (w.circle){ fx = 96 + Math.cos(p * 6.28 - 1.57) * 26; fy = 45 + Math.sin(p * 6.28 - 1.57) * 26; } else { const n = w.path.length - 1, s = n ? Math.min(n - 1e-6, p * n) : 0, i = Math.floor(s), f = s - i; [fx, fy] = n ? [w.path[i][0] + (w.path[i + 1][0] - w.path[i][0]) * f, w.path[i][1] + (w.path[i + 1][1] - w.path[i][1]) * f] : w.path[0]; }
    pg.fillStyle = 'rgba(255,255,255,.25)'; pg.beginPath(); pg.arc(fx, fy, 9, 0, 7); pg.fill(); pg.fillStyle = 'rgba(255,255,255,.7)'; pg.beginPath(); pg.arc(fx, fy, 4, 0, 7); pg.fill(); }

// 그은 모양 알아보기: 결과 2 완벽 · 1 좋아요 · 0 삐끗(그래도 떠져요) · -1 다시
function judge(k, pts, ms){ const w = G[k]; const a = pts[0], b = pts[pts.length - 1], dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);

  if (w.circle){ let turn = 0; for (let i = 2; i < pts.length; i++){ const a1 = Math.atan2(pts[i - 1][1] - pts[i - 2][1], pts[i - 1][0] - pts[i - 2][0]), a2 = Math.atan2(pts[i][1] - pts[i - 1][1], pts[i][0] - pts[i - 1][0]); let d = a2 - a1; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; turn += d; }
    const deg = Math.abs(turn) * 180 / Math.PI; return path < 60 ? -1 : deg >= 320 ? 2 : deg >= 230 ? 1 : deg >= 160 ? 0 : -1; }
  if (len < (w.wide ? 50 : 35)) return -1;
  const [ex, ey] = w.dir, el = Math.hypot(ex, ey), cos = (dx * ex + dy * ey) / (len * el), ang = Math.acos(Math.max(-1, Math.min(1, cos))) * 180 / Math.PI;
  if (ang > 70) return -1; const tol = w.wide ? 1.4 : 1; return ang < 22 * tol ? 2 : ang < 42 * tol ? 1 : 0; }
// 동작이 맞으면 그림이 움직여요 (짧은 tween)
const tween = (ms, fn) => new Promise(res => { const t0 = performance.now(); const f = now => { const p = Math.min(1, (now - t0) / ms); fn(p); if (p < 1) requestAnimationFrame(f); else res(); }; requestAnimationFrame(f); });
async function act(k, q){ busy = true; const c = K.j - 1, reach = () => -(COLX(K.j) - 7 - COLX(c));

  else if (k === 'wrap'){ await tween(320, p => { K.wrap = -1.57 + p * 6.28; }); K.wrap = null; K.newLoop = .4; sub = 2; }
