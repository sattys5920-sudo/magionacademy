<title>배트리의 쏟아진 편지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Hi+Melody&family=Poor+Story&family=Nanum+Brush+Script&family=Gowun+Batang:wght@400;700&family=Gamja+Flower&family=Single+Day&family=Nanum+Pen+Script&family=Yeon+Sung&family=East+Sea+Dokdo&family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
/* 게임 안 화면(밤 보라): 위 봉투 꾸러미 · 편지를 누르면 편지지가 열리고 아래에서 「누가 썼을까」 */
@font-face{font-family:'G11';font-display:swap;src:url(data:font/woff2;base64,__G11__) format('woff2')}
@font-face{font-family:'G11B';font-display:swap;src:url(data:font/woff2;base64,__G11B__) format('woff2')}
:root{--bg:#140D1E;--panel:#211733;--panel2:#2B1F45;--line:#3A2A55;--line2:#4E3C72;--accent:#FF9A3C;--ok:#6FD08C;--warn:#FF6B6B;--text:#F6F0FF;--sub:#BDB0D6;--gold:#FFD866;--pink:#FF8FAF;
  --f-body:system-ui,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;--f-px:'G11',var(--f-body);--f-pxb:'G11B',var(--f-body);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
#app{max-width:560px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.shead{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 14px;border-bottom:1px solid var(--line)}
.shead b{flex:1;font-family:var(--f-pxb);font-weight:400;font-size:16px}
.stat{height:32px;padding:0 12px;border-radius:16px;background:var(--panel2);border:1px solid var(--line2);display:flex;align-items:center;font-family:var(--f-pxb);font-size:13px;color:var(--gold);white-space:nowrap}
.body{padding:14px;display:flex;flex-direction:column;gap:14px}
.pick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
.pick select{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font:13px var(--f-pxb);padding:0 8px}
.lab{font-family:var(--f-pxb);font-size:13px;color:var(--sub)}
.envs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.env{position:relative;border:0;padding:0;border-radius:10px;cursor:pointer;background:none;text-align:left}
.env canvas{width:100%;aspect-ratio:160/100;image-rendering:pixelated;display:block;border-radius:8px}
.env .to{position:absolute;left:10%;top:66%;font:13px var(--f-pxb);color:#5A4636}
.env .tag{position:absolute;right:8px;top:6px;font:11px var(--f-pxb);padding:2px 8px;border-radius:8px;background:rgba(20,13,30,.85);color:var(--gold)}
.env.done .tag{color:var(--ok)}
.hint{font-size:13px;color:var(--sub);margin:0}
.btn{min-height:44px;border:2px solid var(--line2);border-radius:12px;background:var(--panel2);color:var(--text);font-family:var(--f-pxb);font-size:14px;cursor:pointer;padding:0 14px}
.btn.go{background:var(--accent);border-color:var(--accent);color:#2A1506}
/* 편지 창 */
#lv{position:fixed;inset:0;z-index:40;background:rgba(10,6,16,.86);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
#lv[hidden]{display:none}
.lwrap{width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px}
.lhd{display:flex;justify-content:space-between;align-items:center}
.lhd b{font-family:var(--f-pxb);font-weight:400;color:var(--gold)}
.lhd button{width:40px;height:40px;border-radius:20px;border:0;background:rgba(255,255,255,.1);color:var(--text);font-size:16px;cursor:pointer}
.paper{position:relative;border-radius:6px;padding:34px 26px 30px;min-height:320px;box-shadow:0 8px 0 rgba(0,0,0,.35)}
.paper .tx{position:relative;z-index:1;white-space:pre-line;color:var(--ink,#3B2A33)}
.paper canvas.dc{position:absolute;image-rendering:pixelated;z-index:2;pointer-events:none}
.paper .stamp{position:absolute;right:16px;bottom:14px;z-index:3;transform:rotate(-12deg);font:16px var(--f-pxb);color:#D9443B;border:3px solid #D9443B;border-radius:8px;padding:2px 10px;opacity:.9;background:rgba(255,255,255,.4)}
.guess{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.guess .q{font-family:var(--f-pxb);font-size:14px}
.faces{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.faces button{border:1px solid var(--line2);border-radius:8px;background:var(--panel2);color:var(--text);padding:2px;display:flex;flex-direction:column;align-items:center;font:10px var(--f-pxb);cursor:pointer;min-height:58px}
.faces button canvas{width:36px;height:36px;image-rendering:pixelated}
.faces button.no{opacity:.35}
.faces button.yes{border:2px solid var(--ok)}
.say{display:flex;gap:10px;align-items:flex-start;background:rgba(20,13,34,.96);border:2px solid #9AC8F0;border-radius:12px;padding:10px}
.say canvas{width:48px;height:48px;image-rendering:pixelated;flex:none;background:#1E2A44;border-radius:8px}
.say b{display:block;font:13px var(--f-pxb);color:#BFE0FF}
.say p{margin:0;font:14px/1.6 var(--f-px);color:#F1E9FF}
.say.ok{border-color:var(--ok)}.say.ok b{color:#C8F0B0}
.sec{display:flex;flex-direction:column;gap:8px}
.envs.one{display:block;max-width:260px}
.env .cv{display:block}
.hint.ok{color:var(--ok)}
.pick select#day{flex:0 0 96px}
.kept{display:flex;flex-direction:column;gap:6px}.kept button{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2);color:var(--text);font:13px var(--f-pxb);cursor:pointer;text-align:left}.kept i{width:28px;height:20px;border-radius:3px;border:2px solid;flex:none}.kept span{flex:1}.kept em{font-style:normal;font-size:11px;color:var(--sub)}
.rep{display:flex;flex-direction:column;gap:6px}.rep button{min-height:44px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2);color:var(--text);font:14px var(--f-px);text-align:left;padding:8px 12px;cursor:pointer}.rep button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>

<div id="app">
  <div class="shead"><b>배트리의 쏟아진 편지</b><span class="stat" id="stat"></span></div>
  <div class="body">
    <div class="pick"><label for="stu">시안 · 나는</label><select id="stu"></select><select id="day" aria-label="날짜"></select></div>
    <div class="say" id="intro"><canvas width="32" height="32" id="ifc"></canvas><div><b>배트리</b><p id="itx"></p></div></div>
    <section class="sec"><div class="lab">오늘 주운 편지 · 다른 친구 앞으로 온 편지예요</div><div id="found"></div></section>
    <section class="sec"><div class="lab">내 방 바닥</div><div id="room"></div></section>
    <section class="sec"><div class="lab">편지함 · 간직한 편지</div><div id="box"></div></section>
  </div>
</div>
<div id="lv" hidden><div class="lwrap">
  <div class="lhd"><b id="lttl"></b><button id="lx" aria-label="닫기">✕</button></div>
  <div class="paper" id="paper"></div>
  <div class="guess" id="reply"></div>
</div></div>

<script>
const SHEET = new Image(); SHEET.src = 'data:image/webp;base64,__SHEET__';
const NPC = [
  { id: 'nabi', n: '나비', row: 0, font: "'Hi Melody'", size: 25, paper: '#FFF4E4', ink: '#5A3A2A', line: '#F2D8B8',
    t: '{name}에게\n\n오늘도 매점 앞을 지나갔지냥.\n일부러 기다린 건 아니다냥.\n....그냥 햇볕이 좋아서 앉아 있었을 뿐이다냥.\n\n다음에 생선 남으면.... 나눠 줘도 된다냥.\n무릎도 빌려줄 수 있다냥.',
    deco: [['paw', 22, 18], ['paw', 46, 40], ['paw', 300, 280], ['bone', 290, 30], ['hair', 200, 300]], hint: '이 편지.... 생선 냄새가 나. 구석에 털도 한 가닥 붙어 있고.', ok: '....들켰다냥. 아무한테도 말하지 마라냥. 특히 배트리한테는.' },
  { id: 'batri', n: '배트리', row: 1, font: "'Poor Story'", size: 21, paper: '#F2EAF8', ink: '#3A2A55', line: '#D8C8EA',
    t: '{name}!\n\n급해서 짧게 쓸게.\n배달하다 보면 하루에 편지를 백 통도 넘게 만지는데,\n내 이름으로 쓰는 건 처음이야.\n너한테 쓰고 싶었어.\n\n답장은.... 안 해도 돼.\n아니, 하면 내가 제일 먼저 배달할게.',
    deco: [['wing', 8, 8], ['wing2', 300, 8], ['seal', 280, 270], ['stamp', 290, 60]], hint: '이 봉랍 도장.... 어디서 봤더라. 아, 내 가방에 있는 거랑 똑같네. 어?', ok: '으악, 들켰다. 내가 쓴 편지를 내가 흘리다니. ....그래도 잘 도착해서 다행이야.' },
  { id: 'kappa', n: '캇파', row: 2, font: "'Nanum Brush Script'", size: 27, paper: '#EEF6EE', ink: '#1E3A2A', line: '#CFE6D2',
    t: '{name}에게\n\n연못에 비친 달을 보다가\n네 생각이 났다.\n\n같이 낚시하던 날,\n물고기는 한 마리도 못 잡았지만.... 나쁘지 않았다.\n\n다음엔 오이를 두 개 가져가겠다.\n하나는 네 것이다.',
    deco: [['drop', 30, 30], ['drop', 270, 120], ['drop', 60, 250], ['cucumber', 280, 270], ['wet', 160, 20]], hint: '종이가 축축하네. 물에 한 번 빠졌다 나온 것 같아. 연못 근처에서 쓴 건가.', ok: '....젖은 편지를 알아보다니. 다음 낚시 때 오이는 세 개 가져가겠다.' },
  { id: 'aula', n: '아울라', row: 3, font: "'Gowun Batang'", size: 17, paper: '#FBF6E8', ink: '#2A2440', line: '#E8DCC0',
    t: '{name} 님께\n\n도서관 서가 사이에서\n당신이 책을 고르는 모습을 몇 번 보았어요.\n고른 책들이 늘 좋았어요.\n\n다음에 추천하고 싶은 책이 있어요.\n\n※ 조용히 오셔야 해요. 도서관이니까요.',
    deco: [['feather', 290, 20], ['ink', 40, 280], ['corner', 0, 0]], hint: '글씨가 엄청 반듯해. 각주까지 달려 있어. 책을 많이 읽는 사람 같은데.......', ok: '쉿.... 정답이에요. 각주에서 들킬 줄 알았어요. 책은 준비해 둘게요.......' },
  { id: 'mandi', n: '맨디', row: 4, font: "'Gamja Flower'", size: 22, paper: '#F2F6E4', ink: '#3A4A22', line: '#DCE6C4',
    t: '{name}....\n\n안녕하세요. 히익, 편지 쓰는 거 처음이라\n글씨가 삐뚤어요.\n\n화분 옆을 지나가실 때마다\n잎이 저절로 흔들려요.\n그건.... 바람 때문이 아니에요.......',
    deco: [['soil', 40, 26], ['soil', 270, 260], ['sprout', 290, 30], ['petal', 50, 270], ['petal', 240, 40]], hint: '흙 묻은 손자국이 있어. 꽃잎도 눌려 있고.......', ok: '히익.... 들켰어요. 흙 자국 때문이죠. 다음엔 손 씻고 쓸게요.......' },
  { id: 'jipsin', n: '스트로', row: 5, font: "'Single Day'", size: 24, paper: '#FFF2C8', ink: '#6A3A1A', line: '#F2D898',
    t: '{name}!\n\n나 밭에서 매일 서 있잖아.\n근데 네가 지나가면 심심하지 않아.\n까마귀들도 너 좋대.\n\n해 그림 그렸어.\n너 줄게!',
    deco: [['sun', 270, 30], ['crow', 40, 260], ['straw', 0, 150], ['straw2', 300, 200]], hint: '지푸라기가 끼어 있어. 크레용으로 해를 그렸네. 밭에 있는 누구인 것 같아.', ok: '헤헤, 맞혔다! 해 그림 마음에 들었어? 까마귀들한테도 자랑할래.' },
  { id: 'sera', n: '세라 선생님', row: 6, font: "'Nanum Pen Script'", size: 25, paper: '#F4FAFF', ink: '#1E3A5A', line: '#D2E6F4',
    t: '{name}에게\n\n요즘 무리하지는 않니?\n양호실 창밖으로 네가 뛰어다니는 걸 보면\n마음이 놓이면서도 조금 걱정돼.\n\n다치면 꼭 오렴.\n아프지 않아도 차 한 잔 하러 와도 좋아.',
    deco: [['bandage', 280, 26], ['bandage', 30, 270], ['cross', 40, 30]], hint: '약 냄새가 살짝 나. 반창고가 붙어 있고. 아픈 사람을 잘 돌보는 누구겠지.', ok: '어머, 금방 알았구나. 선생님이 편지 쓴 건 비밀로 해 주렴. 차는 준비해 둘게.' },
  { id: 'madeleine', n: '마들렌', row: 7, font: "'Yeon Sung'", size: 22, paper: '#FFF0F2', ink: '#6A2A3A', line: '#F6D2DA',
    t: '{name}에게!\n\n오늘 새로 구운 쿠키가 제일 맛있게 나왔어.\n첫 번째로 생각난 사람이 너였어.\n그래서 이 편지에 냄새를 조금 묻혀 봤어.\n\n가게에 들르면\n한 개 숨겨 둔 거 줄게.',
    deco: [['flour', 30, 20], ['cookie', 280, 26], ['cookie', 300, 270], ['ribbon', 150, 2]], hint: '달콤한 냄새가 나! 밀가루 손자국도 있고. 빵 굽는 누구 아닐까.', ok: '냄새로 들켰구나. 숨겨 둔 쿠키, 오늘 꼭 가져가.' },
  { id: 'stella', n: '스텔라', row: 8, font: "'East Sea Dokdo'", size: 30, paper: '#1E1A3A', ink: '#E8DCFF', line: '#3A3260',
    t: '{name}에게\n\n어젯밤 별이 당신 이름을 세 번 불렀어요.\n무슨 뜻인지는.... 아직 비밀이에요.\n\n길을 잃은 밤에는\n북쪽의 밝은 별을 보세요.\n제가 거기 앉혀 둔 별이에요.......',
    deco: [['stars', 20, 20], ['moon', 290, 24], ['spark', 260, 260], ['spark', 50, 270]], hint: '반짝이 가루가 자꾸 떨어져. 별자리 점선까지 그려져 있어.......', ok: '별이 그러던데요.... 당신이 맞힐 거라고. 맞았네요.......' },
  { id: 'leo', n: '레오', row: 9, font: "'Do Hyeon'", size: 21, paper: '#F2EEE2', ink: '#2A2A22', line: '#DCD4BC',
    t: '{name}.\n\n편지 같은 거 잘 못 쓴다.\n\n생물들이 너를 좋아한다.\n나도.... 싫지 않다.\n그게 다다.\n\n사육장에 오면 양털 좀 털어 가.',

  { id: 'otumo', n: '오투모', row: 10, font: "'G11'", size: 15, paper: '#E8F2FA', ink: '#1E3A5A', line: '#C8DCEC',
    t: '수신: {name}\n\n삐빅. 편지 형식 학습 중입니다.\n\n오늘의 기록.\n{name} 개체를 만나면 냉각 팬이 빨라집니다.\n원인 분석 중.\n\n결과가 나오면 다시 송신하겠습니다.',
