<title>호박달 하트 이야기 대본</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Do+Hyeon&display=swap">
<style>
/* 대본집: 왼쪽 목차, 오른쪽 NPC별 이벤트. 대사는 화자 이름 + 본문, 지문은 기울임 없이 흐린 색, 선택지는 호감도 색 */
:root{
  --bg:#F2F0F7; --paper:#FFFFFF; --ink:#241E33; --sub:#6B6283; --line:#DDD7EA;
  --pump:#C9561E; --night:#3B2F66; --up:#2E8B57; --down:#C23B52; --keep:#7A7290; --chip:#ECE7F7; --hl:#FFF0A6;
  --f-head:'Do Hyeon',system-ui,sans-serif; --f-body:'Gowun Batang',serif; --f-ui:'Gowun Dodum',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15121E;--paper:#1E1A2A;--ink:#ECE7F7;--sub:#A49CBD;--line:#332C47;--pump:#F08A4B;--night:#B8A8F0;--up:#6FD39A;--down:#F27A8E;--keep:#A49CBD;--chip:#2A2440;--hl:#5A4A12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15121E;--paper:#1E1A2A;--ink:#ECE7F7;--sub:#A49CBD;--line:#332C47;--pump:#F08A4B;--night:#B8A8F0;--up:#6FD39A;--down:#F27A8E;--keep:#A49CBD;--chip:#2A2440;--hl:#5A4A12;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px;align-items:start}
.top{max-width:1100px;margin:0 auto 24px}
h1{font-family:var(--f-head);font-weight:400;font-size:34px;line-height:1.2;margin:0;color:var(--night);text-wrap:balance}
.lede{font-family:var(--f-ui);color:var(--sub);margin:6px 0 0}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);font-family:var(--f-ui);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.toc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.toc a{color:var(--ink);text-decoration:none;display:inline-block;padding:3px 0}.toc a:hover,.toc a:focus-visible{color:var(--pump)}
.cnt{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.npc{display:flex;flex-direction:column;gap:20px;margin-bottom:56px;min-width:0}
.nh{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--night);padding-bottom:6px}
.nh h2{font-family:var(--f-head);font-weight:400;font-size:30px;margin:0;color:var(--night)}
.nt{font-family:var(--f-ui);color:var(--sub)}
.evtoc{display:flex;flex-wrap:wrap;gap:6px;font-family:var(--f-ui);font-size:14px}
.evtoc a{background:var(--chip);color:var(--ink);text-decoration:none;padding:3px 10px;border-radius:99px}
.ev{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 22px;min-width:0}
.ev>header{display:flex;align-items:baseline;gap:10px}
.hk{font-family:var(--f-head);color:var(--pump);font-size:22px}
.ev h3{font-family:var(--f-head);font-weight:400;font-size:24px;margin:0}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 20px;margin:10px 0 16px;font-family:var(--f-ui);font-size:14px}
.meta div{display:flex;gap:8px;min-width:0}.meta dt{color:var(--sub);flex-shrink:0}.meta dd{margin:0;min-width:0;word-break:keep-all}
.script{display:flex;flex-direction:column;gap:6px;max-width:68ch}
.ln{margin:0;display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:10px}
.who{font-family:var(--f-ui);font-weight:700;color:var(--night);text-align:right;word-break:keep-all}
.ln.me .who{color:var(--pump)}
.tx{word-break:keep-all}
.nar{margin:2px 0 2px calc(7.5em + 10px);color:var(--sub);word-break:keep-all}
.v{font-weight:700;color:var(--pump)}
.lab{font-family:var(--f-ui);font-size:12px;color:var(--sub);letter-spacing:.04em;margin-top:8px;border-top:1px dashed var(--line);padding-top:4px}
.sys{font-family:var(--f-ui);font-size:13px;color:var(--sub);margin-left:calc(7.5em + 10px)}
.sys.br{color:var(--night)}
.scene{font-family:var(--f-ui);font-size:14px;color:var(--night);background:var(--chip);border-radius:6px;padding:4px 10px;margin:8px 0 4px calc(7.5em + 10px);width:fit-content;max-width:100%}
.ch{margin:8px 0 8px calc(7.5em + 10px);border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--bg)}
.chh{font-family:var(--f-ui);font-size:12px;color:var(--sub);letter-spacing:.06em}
.ch ol{margin:4px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px}
.ch li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.aff{font-family:var(--f-ui);font-size:12px;font-weight:700;padding:0 6px;border-radius:4px;font-variant-numeric:tabular-nums;min-width:2.6em;text-align:center}
.aff.up{color:var(--up);border:1px solid var(--up)}.aff.down{color:var(--down);border:1px solid var(--down)}.aff.keep{color:var(--keep);border:1px solid var(--keep)}
.otx{word-break:keep-all}.nx{font-family:var(--f-ui);font-size:12px;color:var(--sub)}
code{font-family:ui-monospace,monospace;font-size:12px;background:var(--chip);padding:0 4px;border-radius:3px}
.cold{margin-top:16px;border-top:2px dotted var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px;max-width:68ch}
.ch2{font-family:var(--f-ui);font-size:13px;color:var(--down)}
.wip{font-family:var(--f-ui);color:var(--sub)}
.chg{background:var(--hl);border-radius:3px;box-shadow:0 0 0 3px var(--hl)}
.ch li.chg{box-shadow:0 0 0 4px var(--hl)}
.fl{font-family:var(--f-ui);font-size:13px;font-weight:700;color:var(--pump);margin-left:calc(7.5em + 10px)}
.ch li .fl{margin-left:0;flex-basis:100%}
.fix{max-width:1100px;margin:0 auto 40px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.fix h2{font-family:var(--f-head);font-weight:400;font-size:28px;margin:0;color:var(--night)}
.fixwrap{overflow-x:auto;margin-top:10px}
.fix table{border-collapse:collapse;font-family:var(--f-ui);font-size:13px;line-height:1.55;min-width:900px}
.fix th{text-align:left;color:var(--sub);font-weight:400;border-bottom:2px solid var(--line);padding:4px 8px;white-space:nowrap}
.fix td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top;word-break:keep-all}
.fix .fn{color:var(--sub);font-variant-numeric:tabular-nums}.fix .fb{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--down);min-width:14em}.fix .fa{min-width:14em}.fix .fw,.fix .fnote{color:var(--sub);font-size:12px}
.fix a{color:var(--pump)}
@media (max-width:760px){.wrap{grid-template-columns:minmax(0,1fr)}.toc{position:static}.toc ul{flex-direction:row;flex-wrap:wrap;gap:4px 14px}
  .ln{grid-template-columns:minmax(0,1fr);gap:0}.who{text-align:left}.nar,.sys,.scene,.ch{margin-left:0}.ev{padding:16px}}
</style>
<div class="top"><h1>호박달 하트 이야기 대본</h1><p class="lede">서브 NPC 10명의 ♥1~♥10 하트 이벤트 대사·지문·선택지 전문 · %%SUM%% · 분기는 모든 갈래를 다 실었어요. <b class="v">주황 글자</b>는 바뀔 수 있는 이름이에요. 미리 보기 주인공 이름은 「민준」이고, 이름 뒤 조사는 받침에 맞춰 자동으로 바뀌어요.</p></div>
