<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>누비 선물</title><style>
@font-face{font-family:G11;src:url(../../public/fonts/Galmuri11.full.woff2)}@font-face{font-family:G11B;src:url(../../public/fonts/Galmuri11-Bold.full.woff2)}
body{margin:0;background:#140D1E;color:#F6F0FF;font-family:G11,monospace;padding:20px;width:1180px;display:grid;grid-template-columns:560px 580px;gap:20px}
.box{background:#211733;border:1px solid #4E3C72;border-radius:16px;padding:14px}
h3{margin:0 0 10px;font:16px G11B,monospace;color:#FFD866}
.g{display:grid;grid-template-columns:80px repeat(6,72px);gap:6px;align-items:center}
.g .h{font-size:12px;color:#BDB0D6;text-align:center}.g .l{font-size:12px;color:#BDB0D6}
.ic{width:64px;height:64px;background:url(../../public/art/nubi_gifts.png) 0 0/384px 256px;image-rendering:pixelated;margin:auto;background-color:#2B1F45;border-radius:8px}
.nb{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center;font-size:12px;color:#BDB0D6}
.nb i{display:block;width:80px;height:80px;margin:0 auto 4px;background:url(../../public/art/nubi_gifts.png) 0 0/480px 320px;image-rendering:pixelated;background-color:#2B1F45;border-radius:8px}
.room{width:552px;height:420px;background:url(scene_warm_gifts.png) -285px -170px/888px 774px no-repeat;image-rendering:pixelated;border-radius:10px}
</style></head><body>
<div class="box"><h3>선물 6 종 · 넣은 실 색대로</h3><div class="g" id="g"></div></div>
<div class="box" style="grid-row:span 2"><h3>선물이 놓인 따뜻한 양호실</h3><div class="room"></div></div>
<div class="box"><h3>선물을 단 누비 · 내 방 누비 인형 (6 종 다 줬을 때)</h3><div class="nb" id="nb"></div></div>
<script>
const N=['작은 목도리','새 단추','조각 담요','꽃 브로치','털실 공','작은 베개'], R=['친구 셋 색','친구 둘 색','누비 회색'];
const g=document.getElementById('g'); g.innerHTML='<div></div>'+N.map(n=>`<div class="h">${n}</div>`).join('');
R.forEach((r,ri)=>{ g.innerHTML+=`<div class="l">${r}</div>`+N.map((_,ci)=>`<i class="ic" style="background-position:${-ci*64}px ${-ri*64}px"></i>`).join(''); });
const L=['목도리','단추','브로치','털실 공','선물 넷','누비 인형 가구'];
document.getElementById('nb').innerHTML=L.map((l,i)=>`<div><i style="background-position:${-i*80}px -240px"></i>${l}</div>`).join('');
</script></body></html>
