<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>누비 선반</title><style>
@font-face{font-family:G11;src:url(../../public/fonts/Galmuri11.full.woff2)}@font-face{font-family:G11B;src:url(../../public/fonts/Galmuri11-Bold.full.woff2)}@font-face{font-family:Pretendard;src:url(../../public/fonts/Pretendard-Regular.woff2)}
:root{--panel:#211733;--panel2:#2B1F45;--line2:#4E3C72;--gold:#FFD866;--sub:#BDB0D6}
body{margin:0;background:#0b0712;color:#F6F0FF;font-family:Pretendard,sans-serif;padding:18px;display:flex;gap:18px;width:max-content}
.ph{position:relative;width:360px;height:640px;background:#140D1E;border-radius:18px;overflow:hidden}
.cap{font:12px G11,monospace;color:#8a7aa8;text-align:center;padding:6px}
.sheet{position:absolute;inset:30px 0 0 0;background:var(--panel)}
.sh-h{padding:14px 16px;border-bottom:1px solid var(--line2);font:17px G11B,monospace;display:flex;justify-content:space-between}.sh-h span{color:var(--gold);font-size:13px}
.det{display:flex;gap:12px;align-items:center;margin:12px 16px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:10px}
.big{width:128px;height:128px;background:url(../../public/art/nubi_gifts.png) 0 0/768px 512px;image-rendering:pixelated;background-color:#140D1E;border-radius:10px;flex:none}
.det b{font:15px G11B,monospace}.det p{margin:6px 0 0;font-size:13px;color:var(--sub);line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 16px}
.c{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:4px 2px 5px;text-align:center;font-size:11px;color:var(--sub)}
.c.on{border-color:#FF9A3C;box-shadow:0 0 0 1px #FF9A3C inset}
.c i{display:block;width:64px;height:64px;margin:0 auto 2px;background:url(../../public/art/nubi_gifts.png) 0 0/384px 256px;image-rendering:pixelated}
.zoom{width:480px;height:440px;background:url(scene_warm_gifts.png) -520px -160px/1184px 1032px;image-rendering:pixelated;border-radius:18px;margin-top:30px}
</style></head><body>
<div class="ph"><div class="cap">누비 선반을 누르면</div><div class="sheet">
<div class="sh-h">누비 선반<span>12 / 24</span></div>
<div class="det"><i class="big" style="background-position:0 0"></i><div><b>작은 목도리</b><p>하린 · 도윤 · 서아 실<br>만든 사람: 하린</p></div></div>
<div class="grid" id="g"></div></div></div>
<div><div class="cap">양호실 침대 주변 (크게)</div><div class="zoom"></div></div>
<script>
const L=[[0,0,'하린'],[1,1,'도윤'],[3,0,'서아'],[4,1,'지호'],[2,1,'민준'],[5,2,'유나'],[0,1,'하준'],[3,2,'소율'],[1,0,'예린'],[4,0,'시우'],[2,2,'채원'],[5,0,'은우']];
document.getElementById('g').innerHTML=L.map(([c,r,n],i)=>`<div class="c${i?'':' on'}"><i style="background-position:${-c*64}px ${-r*64}px"></i>${n}</div>`).join('');
</script></body></html>
