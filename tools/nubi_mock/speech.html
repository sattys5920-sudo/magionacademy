<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:G;src:url(../../public/fonts/Galmuri11.full.woff2)}
@font-face{font-family:GB;src:url(../../public/fonts/Galmuri11-Bold.full.woff2)}
body{margin:0;background:#2a2038;font-family:G;padding:24px;width:640px}
.row{display:flex;gap:14px;align-items:flex-start;margin-bottom:18px}
.pf{width:64px;height:64px;border:3px solid #e8a048;border-radius:10px;background:#2a2038 url(../../public/art/nubi_s.png) no-repeat;background-size:768px 64px;image-rendering:pixelated;flex:none}
.cloth{position:relative;background:#efe6d2;border-radius:6px;padding:14px 18px;box-shadow:0 0 0 3px #b8a888;outline:2px dashed #8a7c58;outline-offset:-8px}
.st{font-family:GB;font-size:22px;letter-spacing:2px;line-height:1.5;color:transparent;
 background:repeating-linear-gradient(135deg,#3e5670 0 5px,transparent 5px 6.5px);-webkit-background-clip:text;background-clip:text}
.st.big{font-size:30px;transform:rotate(-2deg);display:inline-block;background:repeating-linear-gradient(135deg,#a03040 0 6px,transparent 6px 8px);-webkit-background-clip:text;background-clip:text}
.fix{color:#8a7c58;font-size:12px;margin-top:4px}
.voice{background:#fff;border-radius:10px;padding:14px 18px;font-size:18px;color:#2a2038;line-height:1.5}
.lab{color:#cbbd98;font-size:13px;margin:0 0 6px 82px}
.glow{background:#120c1c;border-radius:6px;padding:18px;font-family:GB;font-size:20px;letter-spacing:2px;color:transparent;background-image:repeating-linear-gradient(135deg,#ffe9a8 0 5px,transparent 5px 6.5px);-webkit-background-clip:text;background-clip:text;text-shadow:0 0 0 transparent}
.dark{background:#120c1c;border-radius:8px;padding:6px 10px;filter:drop-shadow(0 0 6px #ffd86a)}
</style></head><body>
<div class="lab">1~9 일째 · 수놓은 글씨</div>
<div class="row"><i class="pf" style="background-position:-8px -8px"></i><div class="cloth"><div class="st">....무서워. 하지 마.<br>누비. 아무것도. 안 해.......</div></div></div>
<div class="row"><i class="pf" style="background-position:-8px -8px"></i><div class="cloth"><div class="st">그래도. <s style="text-decoration-color:#a03040">고마어</s> 고마워.</div></div></div>
<div class="row"><i class="pf" style="background-position:-264px -8px"></i><div class="cloth"><div class="st big">건드리지 마! 핀!</div></div></div>
<div class="lab">5 일째 밤</div>
<div class="row"><i class="pf" style="background-position:-136px -8px"></i><div class="dark"><div class="glow">괜찮아. 괜찮아. 하린.<br>괜찮아. 괜찮아. 도윤.</div></div></div>
<div class="lab">마지막 날 · 처음 목소리</div>
<div class="row"><i class="pf" style="background-position:-520px -8px"></i><div class="voice">....아. 아, 아. 누비. ....누비 목소리, 이랬구나.</div></div>
</body></html>
