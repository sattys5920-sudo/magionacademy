<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:'Pretendard';font-weight:400;src:url(../../public/fonts/Pretendard-Regular.woff2) format('woff2')}
@font-face{font-family:'Pretendard';font-weight:700;src:url(../../public/fonts/Pretendard-Bold.woff2) format('woff2')}
html,body{margin:0;background:#000;overflow:hidden;font-family:Pretendard,sans-serif}
#stage{position:relative;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%}
#say{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:10px;padding:10px;background:rgba(36,27,63,.94);border:2px solid #5A4A8A;border-radius:12px;color:#F1E9FF;box-sizing:border-box}
#say img{width:56px;height:56px;border-radius:8px;background:#2D2250;object-fit:cover;flex:none;image-rendering:pixelated}
#say b{display:block;font-size:13px;color:#FFD98A;margin-bottom:3px}
#say p{margin:0;font-size:14.5px;line-height:1.45}
#cnt{position:absolute;left:0;right:0;top:94px;text-align:center;font-size:13px;color:#BFD0FF}
#names{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#names span{font-size:12px;padding:5px 9px;border-radius:999px;background:rgba(10,14,40,.7);color:#9FB0E0;border:1px solid #3A4686;min-height:18px}
#names span.on{color:#1A1A3A;background:#FFF1C1;border-color:#FFF1C1}
#names span.st{color:#FFD98A;border-color:#FFD98A}
</style>
<div id="stage"><canvas id="cv"></canvas><div id="say"><img src="../../public/art/portraits/stella.png"><div><b>스텔라</b><p id="tx"></p></div></div><div id="cnt"></div><div id="names"></div></div>
<script src="sky.js"></script>
<script>
const Q = JSON.parse(decodeURIComponent(location.hash.slice(1) || '{}')), W = Q.W || 390, H = Q.H || 844, DPR = Q.dpr || 2;
const NM = ['민준', '서연', '하준', '지우', '도윤', '수아', '예준', '하은', '시우', '지민', '건우', '채원'];
const st = document.getElementById('stage'); st.style.width = W + 'px'; st.style.height = H + 'px';
const cv = document.getElementById('cv'); cv.width = W * DPR; cv.height = H * DPR; const g = cv.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0);
(async () => {
  const D = Q.data || await (await fetch('../../public/data/events/stargazing/constellations.json')).json(), C = D.constellations.find(c => c.id === Q.c);
  const nP = Q.people ?? 9, own = {}; C.stars.forEach((s, i) => { own[s.id] = i < nP ? NM[(i + (Q.shift || 0)) % 12] : '스텔라'; });
  const lit = C.stars.slice(0, Q.lit ?? 12).map(s => s.id);
  document.getElementById('tx').textContent = Q.text || '';
  document.getElementById('cnt').textContent = Q.count || '';
  document.getElementById('names').innerHTML = C.stars.map(s => `<span class="${lit.includes(s.id) ? 'on' : ''} ${own[s.id] === '스텔라' ? 'st' : ''}">${own[s.id]}</span>`).join('');
  document.getElementById('names').style.display = Q.noNames ? 'none' : '';
  const S = { lit, own, drawn: Q.drawn || 0, outline: Q.outline || 0, title: Q.title || 0, t: Q.t || 1.3, names: Q.tags !== false, hot: Q.hot || [] };
  SKY.draw(g, W, H, C, S); window.__ready = 1;
})();
</script>
